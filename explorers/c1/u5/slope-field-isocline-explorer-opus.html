eqSel.value=S.eq;
eqSel.addEventListener("change",()=>{ S.eq=eqSel.value; S.curves=[]; S.eulN=0; buildJumps(); update(); });

function buildJumps(){
  const box=$("mJump"); box.innerHTML="";
  (EQ().mJumps||[]).forEach(([lab,v])=>{ const b=document.createElement("button"); b.innerHTML=lab; b.dataset.mv=v; box.appendChild(b); });
}
$("mJump").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; S.m=+b.dataset.mv; $("mS").value=S.m; update(); });

$("cField").addEventListener("change",()=>{S.showField=$("cField").checked; update();});
$("cDark").addEventListener("change",()=>{S.dark=$("cDark").checked; update();});
$("densS").addEventListener("input",()=>{S.dens=+$("densS").value; S.grow=null; update();});
["px","py"].forEach(k=>$(k+"S").addEventListener("input",()=>{S[k]=+$(k+"S").value; update();}));
$("mS").addEventListener("input",()=>{S.m=+$("mS").value; update();});
$("cLadder").addEventListener("change",()=>{S.ladder=$("cLadder").checked; update();});
$("x0S").addEventListener("input",()=>{S.x0=+$("x0S").value; S.eulN=0; update();});
$("y0S").addEventListener("input",()=>{S.y0=+$("y0S").value; S.eulN=0; update();});
$("cBack").addEventListener("change",()=>{S.back=$("cBack").checked; update();});
$("hS").addEventListener("input",()=>{S.h=+$("hS").value; S.eulN=0; update();});
$("cExact").addEventListener("change",()=>{S.exact=$("cExact").checked; update();});
$("stepBtn").addEventListener("click",()=>{S.eulN=Math.min(S.eulN+1,eulerRows().length); update();});
$("resetBtn").addEventListener("click",()=>{S.eulN=0; update();});
let runT=null;
$("runBtn").addEventListener("click",()=>{ if(runT){clearInterval(runT);runT=null;return;} S.eulN=0;
  const total=eulerRows().length, per=Math.max(1,Math.ceil(total/45));
  runT=setInterval(()=>{ if(S.eulN>=total){clearInterval(runT);runT=null;}
    else {S.eulN=Math.min(total,S.eulN+per);update();} },110); });
$("cPhase").addEventListener("change",()=>{S.phase=$("cPhase").checked; update();});
$("cAxis").addEventListener("change",()=>{S.axisMark=$("cAxis").checked; update();});
function clearAll(){ S.curves=[]; S.p2=new Set(); update(); }
$("clearBtn").addEventListener("click",clearAll);
$("clearBtn2").addEventListener("click",clearAll);
const BANDS={hi:[1.4,1.8,2.4,3.2,1.6,2.0], mid:[0.05,0.1,0.2,0.35,0.5,0.7], lo:[-0.05,-0.1,-0.2,-0.4,-0.7,-1.0]};
const XS=[-3,-2,-1,0,1,2];
const hasSrc=src=>S.curves.some(c=>c.src===src);
const dropSrc=src=>{S.curves=S.curves.filter(c=>c.src!==src);};
function addBand(src){ XS.forEach((x,i)=>S.curves.push({x,y:BANDS[src][i%BANDS[src].length],src})); }
$("bandPills").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  const bnd=b.dataset.b;
  if(bnd==="all"){
    const on=["hi","mid","lo"].every(hasSrc);
    ["hi","mid","lo"].forEach(k=>{ dropSrc(k); if(!on) addBand(k); });
  } else if(bnd==="quiz"){
    if(hasSrc("quiz")) dropSrc("quiz");
    else [[0,0.5],[0,-1],[0,2]].forEach(([x,y])=>S.curves.push({x,y,src:"quiz"}));
  } else {
    if(hasSrc(bnd)) dropSrc(bnd); else addBand(bnd);
  }
  update(); });
const P2SET={
  one:[{x:1,y:1}],
  rays:[0.25,0.5,1,2,4,-0.5,-1,-2].map(C=>({x:1,y:C})),
  origin:[0.25,0.5,1,2,4,-0.5,-1,-2].map(C=>({x:1,y:C})).concat([0.25,1,2,-1].map(C=>({x:-1,y:-C}))),
  nosol:[{x:1,y:1},{x:1,y:3},{x:1,y:0.3}]};
$("p2Pills").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  const k=b.dataset.p;
  if(S.p2.has(k)){ S.p2.delete(k); dropSrc(k); }
  else { S.p2.add(k); P2SET[k].forEach(c=>S.curves.push({x:c.x,y:c.y,src:k})); }
  update(); });
$("growBtn").addEventListener("click",()=>{ if(S.grow!==null){S.grow=null;update();return;}
  S.grow=0; const total=S.dens*S.dens;
  const t=setInterval(()=>{ S.grow+=Math.max(1,Math.round(total/90)); if(S.grow>=total){clearInterval(t);S.grow=null;} update(); },40); });

document.querySelectorAll('nav [role="tab"]').forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll('nav [role="tab"]').forEach(x=>x.setAttribute("aria-selected",x===t?"true":"false"));
  S.tab=t.dataset.tab; S.grow=null;
  if(S.tab==="p1"){ S.eq="log"; S.dark=true; $("cDark").checked=true; if(!S.curves.length) S.curves=[{x:0,y:0.5,src:"quiz"},{x:0,y:-1,src:"quiz"},{x:0,y:2,src:"quiz"}]; }
  if(S.tab==="p2"){ S.eq="yx"; S.dark=true; $("cDark").checked=true; S.p2=new Set(["one"]); S.curves=[{x:1,y:1,src:"one"}]; }
  if(S.tab==="sol"||S.tab==="fit"||S.tab==="iso"||S.tab==="field"){ S.curves=[]; }
  eqSel.value=S.eq; buildJumps(); update();
}));

// canvas clicking
let cvDrag=false;
function cvSet(e){ const r=cv.getBoundingClientRect(); const x=Math.max(XMIN,Math.min(XMAX,ux(e.clientX-r.left))), y=Math.max(YMIN,Math.min(YMAX,uy(e.clientY-r.top)));
  if(S.tab==="field"){ S.px=Math.round(x*20)/20; S.py=Math.round(y*20)/20; $("pxS").value=S.px; $("pyS").value=S.py; }
  else if(S.tab==="iso"){ const m=F(x,y); if(isFinite(m)){ S.m=Math.max(-3,Math.min(3,Math.round(m*100)/100)); $("mS").value=S.m; } }
  else if(S.tab==="sol"||S.tab==="fit"){ S.x0=Math.round(x*20)/20; S.y0=Math.round(y*20)/20; $("x0S").value=S.x0; $("y0S").value=S.y0; S.eulN=0; }
  update(); }
function hitCurve(px,py){
  let best=-1, bd=11;
  S.curves.forEach((c,i)=>{
    const pts=integrate(c.x,c.y,1).concat(integrate(c.x,c.y,-1));
    for(let k=0;k<pts.length;k+=3){
      const d=Math.hypot(sx(pts[k][0])-px, sy(pts[k][1])-py);
      if(d<bd){ bd=d; best=i; }
    }
  });
  return best;
}
cv.addEventListener("pointerdown",e=>{ if(S.tab==="p1"||S.tab==="p2"){ const r=cv.getBoundingClientRect();
    const cxp=e.clientX-r.left, cyp=e.clientY-r.top;
    const hit=hitCurve(cxp,cyp);
    if(hit>=0){ const src=S.curves[hit].src; S.curves.splice(hit,1);
      if(src&&!S.curves.some(c=>c.src===src)) S.p2.delete(src); update(); return; }
    const x=ux(cxp), y=uy(cyp);
    if(x>XMIN&&x<XMAX&&y>YMIN&&y<YMAX&&!(EQ().singular==="x0"&&Math.abs(x)<0.05)) S.curves.push({x,y,src:"click"});
    update(); return; }
  cvDrag=true; cv.setPointerCapture(e.pointerId); cvSet(e); });
cv.addEventListener("pointermove",e=>{ if(cvDrag) cvSet(e); });
cv.addEventListener("pointerup",()=>cvDrag=false); cv.addEventListener("pointercancel",()=>cvDrag=false);

/* ================= update ================= */
function update(){
  document.querySelectorAll("[data-tabs]").forEach(el=>{ el.hidden=!el.dataset.tabs.split(" ").includes(S.tab); });
  eqSel.disabled = (S.tab==="p1"||S.tab==="p2");
  $("densO").textContent=S.dens+"×"+S.dens;
  $("pxO").textContent=fs(S.px,2); $("pyO").textContent=fs(S.py,2);
  $("mO").textContent="m = "+fs(S.m,2);
  $("x0O").textContent=fs(S.x0,2); $("y0O").textContent=fs(S.y0,2);
  $("hO").textContent="h = "+f2(S.h,2);
  $("clickHint").textContent={field:"← or click/drag the plot to move the probe",
    iso:"← or click the plot to jump m to the slope there",
    sol:"← or click the plot to move the starting point",
    fit:"← or click the plot to move the starting point",
    p1:"← click empty space to plant a curve · click a curve to delete it · buttons toggle on/off",
    p2:"← click empty space to plant a ray · click a ray to delete it · buttons toggle on/off"}[S.tab];
  document.querySelectorAll("#bandPills button").forEach(b=>{ const k=b.dataset.b;
    b.classList.toggle("on", k==="all" ? ["hi","mid","lo"].every(hasSrc) : S.curves.some(c=>c.src===k)); });
  document.querySelectorAll("#p2Pills button").forEach(b=>b.classList.toggle("on",S.p2.has(b.dataset.p)));
  document.querySelectorAll("#mJump button").forEach(b=>b.classList.toggle("on",Math.abs(S.m-(+b.dataset.mv))<1e-9));
  figTitle();
  $("calc").innerHTML=calcHTML();
  $("notes").innerHTML=notesHTML();
  if(!panel.hidden) $("helpBody").innerHTML=helpHTML();
  draw();
}
new ResizeObserver(resize).observe(cv.parentElement);
buildJumps(); resize(); update();
})();
</script>

<script>
/* Phone-width safety net, inlined into every explorer by build.py.
   On narrow screens, anything wider than the page (a long equation, a table,
   a fixed-width figure) is shrunk to fit or given its own sideways scroll, so
   the page itself never scrolls horizontally. Does nothing on wide screens. */
(function () {
  var LIMIT = 820, MEDIA = { CANVAS: 1, IMG: 1, VIDEO: 1, svg: 1, IFRAME: 1 };

  function scrollsItself(el) {
    for (var p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      var o = getComputedStyle(p).overflowX;
      if (o === 'auto' || o === 'scroll') return true;
    }
    return false;
  }

  function fix(el, vw, depth) {
    var cs = getComputedStyle(el);
    if (cs.position === 'fixed' || depth > 14) return;
    if (MEDIA[el.tagName]) {
      el.style.maxWidth = '100%';
      if (el.tagName !== 'IFRAME' && !el.style.height) el.style.height = 'auto';
      return;
    }
    if (el.tagName === 'TABLE' || cs.display === 'table') {
      el.style.display = 'block'; el.style.maxWidth = '100%'; el.style.overflowX = 'auto';
      return;
    }
    if (cs.display === 'inline') el.style.display = 'inline-block';
    el.style.minWidth = '0'; el.style.maxWidth = '100%'; el.style.boxSizing = 'border-box';
    var edge = Math.min(el.getBoundingClientRect().right, vw) + 1;
    function tooWide() {
      return [].filter.call(el.children, function (c) {
        var r = c.getBoundingClientRect();
        return r.width && r.right > edge && !c.ownerSVGElement;
      });
    }
    var wide = tooWide();
    if (wide.length && cs.display.indexOf('flex') >= 0 && cs.flexDirection.indexOf('row') === 0 && cs.flexWrap === 'nowrap') {
      el.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
      wide = tooWide();
    }
    if (wide.length && cs.whiteSpace !== 'nowrap') {
      wide.forEach(function (c) { fix(c, vw, depth + 1); });
    }
    if (el.scrollWidth > el.clientWidth + 1) {
      el.style.overflowX = 'auto';
      if (el.style.display === 'inline-block') el.style.verticalAlign = 'bottom';
    }
  }

  function run() {
    var root = document.documentElement, vw = root.clientWidth;
    if (vw > LIMIT || !document.body) return;
    for (var pass = 0; pass < 4 && root.scrollWidth > vw + 1; pass++) {
      var all = document.body.getElementsByTagName('*');
      for (var i = 0; i < all.length; i++) {
        var el = all[i], r = el.getBoundingClientRect();
        if (!r.width || r.right <= vw + 1 || el.ownerSVGElement) continue;
        var p = el.parentElement;
        if (p !== document.body && p.getBoundingClientRect().right > vw + 1) continue; // start at the outermost offender
        if (scrollsItself(el)) continue;
        var ps = getComputedStyle(p);
        if (ps.display.indexOf('flex') >= 0 && ps.flexDirection.indexOf('row') === 0 && ps.flexWrap === 'nowrap') {
          p.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
          if (el.getBoundingClientRect().right <= vw + 1) continue;
        }
        fix(el, vw, 0);
      }
    }
  }

  var timer;
  function soon() { clearTimeout(timer); run(); timer = setTimeout(function () { run(); timer = setTimeout(run, 700); }, 300); }
  window.addEventListener('load', soon);
  window.addEventListener('resize', soon);
  ['click', 'change', 'toggle'].forEach(function (ev) {
    document.addEventListener(ev, function () { setTimeout(soon, 30); }, true);
  });
  if (document.readyState !== 'loading') soon(); else document.addEventListener('DOMContentLoaded', soon);
})();
</script>
