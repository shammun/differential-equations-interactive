<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Saddle Eigenline Explorer</title>
<style>
/* Layout: one-screen app on laptops (viz + controls left, live-calc panel right); stacked on phones. Floating explanation overlay over the viz. */
:root{
  --bg:#eef3fb; --card:#ffffff; --fg:#1d2433; --muted:#5b6578; --line:#d6deec;
  --shadow:0 6px 22px rgba(104,86,201,.14);
  --orange:#e8832a; --teal:#1a9c8d; --purple:#6b5bd2; --purpleSoft:#ebe7fb;
  --grid:#dbe3f2; --axis:#8e9ab3; --curve:#9bb0d4;
  --font:"Source Sans 3",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121829; --card:#1b2238; --fg:#e8ecf5; --muted:#a3adc4; --line:#2e3852;
  --shadow:0 6px 22px rgba(0,0,0,.35); --purpleSoft:#2a2550; --grid:#242d45; --axis:#7784a3; --curve:#4c5d85; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121829; --card:#1b2238; --fg:#e8ecf5; --muted:#a3adc4; --line:#2e3852;
  --shadow:0 6px 22px rgba(0,0,0,.35); --purpleSoft:#2a2550; --grid:#242d45; --axis:#7784a3; --curve:#4c5d85; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px 16px}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:600}
header .sys{font-family:var(--mono);font-size:13px;color:var(--muted)}
header .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

#left{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;position:relative}
#vizwrap{position:relative;min-height:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
canvas{display:block;width:100%;height:100%}
#legend{position:absolute;left:10px;top:8px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;pointer-events:none}
#legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}

#controls{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ctl label b{font-family:var(--mono);color:var(--fg);font-weight:500}
.ctl input[type=range]{width:100%;accent-color:var(--purple)}
.toggles{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.toggles label{display:flex;align-items:center;gap:5px}

#live{min-height:0;overflow:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
#live h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.row{display:grid;grid-template-columns:1fr;gap:2px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .k{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.row .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;word-break:break-word}
.row .v b{font-weight:600}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--purpleSoft);font-size:13.5px}
.note b{color:var(--purple)}
.tx{color:var(--orange)} .ty{color:var(--teal)}

#explain{position:absolute;inset:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#explain .bar,#explainSolo .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.bar .spacer{flex:1}
.body{overflow:auto;padding:14px 18px;font-size:15px;max-width:74ch}
.body h3{margin:0 0 8px;font-size:18px;text-wrap:balance}
.body p{margin:0 0 10px}
.body table{border-collapse:collapse;font-family:var(--mono);font-size:13px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.body td,.body th{border:1px solid var(--line);padding:4px 9px;text-align:right}
.body th{color:var(--muted);font-weight:500}
.key{padding:10px 12px;border-left:4px solid var(--orange);background:var(--purpleSoft);border-radius:8px;margin:10px 0}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}

body.solo #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
body.solo #left,body.solo #live,body.solo #explainBtn{display:none}
body.solo #explainSolo{display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-height:0}
#explainSolo{display:none}

@media (max-width:900px){
  html,body{height:auto}
  #app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto auto}
  #vizwrap{aspect-ratio:1/1;max-width:100%}
  #controls{grid-template-columns:1fr 1fr}
  #explain{position:fixed;inset:8px;z-index:50}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

<div id="app">
<header>
  <h1>Saddle Eigenline Explorer</h1>
  <span class="sys">deer–wolf at (3,0): Ẋ = −3X − 3Y, Ẏ = 4Y &nbsp;·&nbsp; X = x − 3, Y = y</span>
  <span class="spacer"></span>
  <button class="btn primary" id="explainBtn">Explain, step by step</button>
</header>

<div id="left">
  <div id="vizwrap">
    <canvas id="cv"></canvas>
    <div id="legend">
      <span style="--c:var(--orange)">Y = 0, the λ = −3 eigenline (inward)</span>
      <span style="--c:var(--teal)">Y = −(7/3)X, the λ = 4 eigenline (outward)</span>
      <span style="--c:var(--purple)">chosen solution</span>
      <span style="--c:var(--curve)">other solutions</span>
    </div>
    <div id="explain" hidden></div>
  </div>
  <div id="controls">
    <div class="ctl"><label>time t <b id="tv">0.00</b></label><input type="range" id="t" min="-1.5" max="1" step="0.005" value="0"></div>
    <div class="ctl"><label>start X₀ <b id="x0v">2.0</b></label><input type="range" id="x0" min="-4" max="4" step="0.1" value="2"></div>
    <div class="ctl"><label>start Y₀ <b id="y0v">1.0</b></label><input type="range" id="y0" min="-4" max="4" step="0.1" value="1"></div>
    <div class="ctl"><label>zoom (window half-width) <b id="Lv">4.00</b></label><input type="range" id="L" min="-1.5" max="2" step="0.01" value="1.386"></div>
    <div class="toggles">
      <label><input type="checkbox" id="showField" checked> direction field</label>
      <label><input type="checkbox" id="showFamily" checked> other solutions</label>
      <label><input type="checkbox" id="showComp" checked> the two eigen-components</label>
      <label><input type="checkbox" id="showVel" checked> velocity arrow</label>
      <button class="btn" id="play" type="button">▶ Play t</button>
    </div>
  </div>
</div>

<div id="live">
  <h2>Live calculation</h2>
  <div id="liveRows"></div>
  <div class="note" id="liveNote"></div>
</div>

<div id="explainSolo"></div>
</div>

<script>
const S={t:0,x0:2,y0:1,L:4,field:true,family:true,comp:true,vel:true};
const $=id=>document.getElementById(id);
const solo=location.hash==='#explain';
const chan=('BroadcastChannel' in window)?new BroadcastChannel('saddle-eigenline-explorer'):null;
let step=0;

// ---------- math: A = [[-3,-3],[0,4]], v1=(1,0) λ=-3, v2=(3,-7) λ=4 ----------
const A=[[-3,-3],[0,4]];
const f=(X,Y)=>[A[0][0]*X+A[0][1]*Y, A[1][0]*X+A[1][1]*Y];
function coeffs(X0,Y0){ const c2=-Y0/7; const c1=X0-3*c2; return [c1,c2]; }
function sol(X0,Y0,t){ const [c1,c2]=coeffs(X0,Y0); const e1=c1*Math.exp(-3*t), e2=c2*Math.exp(4*t); return [e1+3*e2, -7*e2, e1, e2]; }
const fmt=(v,d=4)=>{ if(!isFinite(v))return '—'; const a=Math.abs(v); if(a!==0&&(a<1e-3||a>=1e4)) return v.toExponential(2); return v.toFixed(d); };

// ---------- canvas ----------
const cv=$('cv'); const ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){ const r=cv.getBoundingClientRect(); dpr=window.devicePixelRatio||1; W=r.width;H=r.height; cv.width=W*dpr;cv.height=H*dpr; draw(); }
new ResizeObserver(resize).observe($('vizwrap'));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function scale(){ return Math.min(W,H)/2/S.L; }
function map(x,y){ const s=scale(); return [W/2+x*s, H/2-y*s]; }
function inBox(x,y){ const m=Math.min(W,H); return Math.abs(x)<=S.L*W/m*1.02 && Math.abs(y)<=S.L*H/m*1.02; }
function arrowHead(px,py,ang,size,color){ ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-size,size*0.5);ctx.lineTo(-size,-size*0.5);ctx.closePath();ctx.fill();ctx.restore(); }
function arrow(x1,y1,x2,y2,color,width,head){ const [a,b]=map(x1,y1),[c,d]=map(x2,y2); ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke(); if(head&&Math.hypot(c-a,d-b)>4) arrowHead(c,d,Math.atan2(d-b,c-a),head,color); }
function drawOrbit(X0,Y0,color,width,withArrow){
  const pts=[]; let seg=[];
  for(let t=-3;t<=3;t+=0.004){ const [x,y]=sol(X0,Y0,t); if(inBox(x,y)) seg.push(map(x,y)); else if(seg.length){pts.push(seg);seg=[];} }
  if(seg.length) pts.push(seg);
  ctx.strokeStyle=color;ctx.lineWidth=width;
  for(const s of pts){ ctx.beginPath(); s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    if(withArrow&&s.length>30){ const k=Math.floor(s.length/2); const [a,b]=s[k],[c,d]=s[k+1]; arrowHead(c,d,Math.atan2(d-b,c-a),7,color); } }
}
function niceStep(L){ const raw=L/3; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function draw(){
  if(!W) return;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const cOr=css('--orange'),cTe=css('--teal'),cPu=css('--purple'),cCu=css('--curve'),cGr=css('--grid'),cAx=css('--axis'),cFg=css('--fg'),cMu=css('--muted');
  const m0=Math.min(W,H), Lx=S.L*W/m0, Ly=S.L*H/m0;
  ctx.strokeStyle=cGr;ctx.lineWidth=1; const g=niceStep(S.L);
  for(let v=-Math.ceil(Math.max(Lx,Ly)/g)*g; v<=Math.max(Lx,Ly)+1e-9; v+=g){ const [px,py]=map(v,v); ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke(); ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke(); }
  if(S.field){ const n=16; for(let i=0;i<n;i++)for(let j=0;j<n;j++){ const x=-Lx+(i+0.5)*2*Lx/n, y=-Ly+(j+0.5)*2*Ly/n; const [u,v]=f(x,y); const m=Math.hypot(u,v); if(m<1e-12)continue; const len=m0/n*0.42; const [px,py]=map(x,y); const dx=u/m*len,dy=-v/m*len; ctx.strokeStyle=cAx;ctx.globalAlpha=.5;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(px-dx/2,py-dy/2);ctx.lineTo(px+dx/2,py+dy/2);ctx.stroke(); arrowHead(px+dx/2,py+dy/2,Math.atan2(dy,dx),4,cAx); ctx.globalAlpha=1; } }
  if(S.family){ const fr=[0.12,0.3,0.5,0.7,0.9]; for(const s of fr){ for(const sg of [1,-1]){ drawOrbit(sg*Lx, s*Ly*sg, cCu,1.4,true); drawOrbit(sg*Lx,-s*Ly*sg,cCu,1.4,true); drawOrbit(s*Lx*sg, sg*Ly, cCu,1.4,true); drawOrbit(-s*Lx*sg, sg*Ly, cCu,1.4,true);} } }
  // eigenlines (both are orbits)
  const [ox,oy]=map(0,0);
  arrow(-Lx,0,-g*0.6,0,cOr,2.5,8); arrow(Lx,0,g*0.6,0,cOr,2.5,8); // inward along X-axis
  ctx.strokeStyle=cOr;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(...map(-g*0.7,0));ctx.lineTo(...map(g*0.7,0));ctx.stroke();
  const yl=Ly, xl=-3*yl/7; // line Y=-7/3 X : point (xl, yl)
  arrow(0,0,xl,yl,cTe,2.5,0); arrow(0,0,-xl,-yl,cTe,2.5,0);
  { const k=0.85; arrow(k*xl*0.98,k*yl*0.98,k*xl,k*yl,cTe,2.5,9); arrow(-k*xl*0.98,-k*yl*0.98,-k*xl,-k*yl,cTe,2.5,9); }
  // Y axis (not an eigenline) faint
  ctx.strokeStyle=cAx;ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=cMu;ctx.font='12px '+css('--mono');
  ctx.fillText('X', W-14, oy-6); ctx.fillText('Y', ox+6, 40); ctx.fillText(Lx.toPrecision(2), W-44, oy+14); ctx.fillText(Ly.toPrecision(2), ox+6, 54);
  ctx.fillStyle=cTe; const [lx,ly]=map(-xl*0.6,-yl*0.6); ctx.fillText('Y = −(7/3)X', lx+10, ly+4);
  ctx.fillStyle=cOr; ctx.fillText('Y = 0', W-80, oy+28);
  // chosen solution
  if(S.x0!==0||S.y0!==0){
    drawOrbit(S.x0,S.y0,cPu,3,false);
    const [x,y,e1,e2]=sol(S.x0,S.y0,S.t); const [px,py]=map(x,y);
    if(S.comp){ // component 1 along v1 from origin, component 2 along v2 from its tip
      arrow(0,0,e1,0,cOr,3,9); arrow(e1,0,e1+3*e2,-7*e2,cTe,3,9);
      ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.strokeStyle=cMu;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
    }
    if(S.vel){ const [u,v]=f(x,y); const m=Math.hypot(u,v); if(m>1e-9){ const len=m0*0.11; const dx=u/m*len,dy=-v/m*len; ctx.strokeStyle=cPu;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+dx,py+dy);ctx.stroke(); arrowHead(px+dx,py+dy,Math.atan2(dy,dx),8,cPu);} }
    ctx.fillStyle=cPu;ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill(); ctx.strokeStyle=css('--card');ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=cFg;ctx.font='12px '+css('--mono'); ctx.fillText('('+fmt(x,3)+', '+fmt(y,3)+')', px+10, py-10);
    // start marker
    const [sx,sy]=map(S.x0,S.y0); ctx.strokeStyle=cPu;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.stroke();
  }
}

// ---------- live panel ----------
function live(){
  const t=S.t; const [c1,c2]=coeffs(S.x0,S.y0); const [x,y,e1,e2]=sol(S.x0,S.y0,t); const [u,v]=f(x,y);
  const rows=[
    ['start (X₀, Y₀) = c₁·(1,0) + c₂·(3,−7)', `Y₀ = −7c₂ → c₂ = ${fmt(S.y0,1)}/(−7) = <b>${fmt(c2)}</b><br>X₀ = c₁ + 3c₂ → c₁ = ${fmt(S.x0,1)} − 3×(${fmt(c2)}) = <b>${fmt(c1)}</b>`],
    ['t', fmt(t,2)],
    ['<span class="tx">component on Y = 0 (λ = −3)</span>', `c₁·exp(−3t) = ${fmt(c1)} × ${fmt(Math.exp(-3*t))} = <b class="tx">${fmt(e1)}</b><br>vector = ${fmt(e1)}·(1,0) = (<span class="tx">${fmt(e1)}</span>, 0)`],
    ['<span class="ty">component on Y = −(7/3)X (λ = 4)</span>', `c₂·exp(4t) = ${fmt(c2)} × ${fmt(Math.exp(4*t))} = <b class="ty">${fmt(e2)}</b><br>vector = ${fmt(e2)}·(3,−7) = (<span class="ty">${fmt(3*e2)}</span>, <span class="ty">${fmt(-7*e2)}</span>)`],
    ['(X, Y) = sum of the two', `X = ${fmt(e1)} + ${fmt(3*e2)} = <b>${fmt(x)}</b><br>Y = 0 + ${fmt(-7*e2)} = <b>${fmt(y)}</b>`],
    ['check against the ODE', `Ẋ = −3X − 3Y = ${fmt(u)}<br>Ẏ = 4Y = ${fmt(v)}`],
    ['in deer–wolf coordinates', `x = X + 3 = ${fmt(x+3,3)}, y = Y = ${fmt(y,3)}`],
  ];
  $('liveRows').innerHTML=rows.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('');
  let note;
  if(S.x0===0&&S.y0===0) note='Start at the critical point itself: nothing moves.';
  else if(S.y0===0) note='<b>Start on Y = 0:</b> then c₂ = 0, the λ = 4 part is absent, and the point slides straight along the X-axis <b>into</b> the origin (exp(−3t) shrinks). This is the only line of starting points that ever reaches the critical point.';
  else if(Math.abs(S.y0+7*S.x0/3)<1e-9) note='<b>Start on Y = −(7/3)X:</b> then c₁ = 0, the λ = −3 part is absent, and the point slides straight <b>out</b> along that line (exp(4t) grows).';
  else if(t<-0.6) note=`<b>Going back in time (t = ${fmt(t,2)}):</b> exp(4t) = ${fmt(Math.exp(4*t))} has killed the teal component, exp(−3t) = ${fmt(Math.exp(-3*t))} has blown up the orange one. The curve came in from far away <b>along the X-axis</b> (the −3 eigenline).`;
  else if(t>0.35) note=`<b>Going forward (t = ${fmt(t,2)}):</b> exp(−3t) = ${fmt(Math.exp(-3*t))} has killed the orange component, exp(4t) = ${fmt(Math.exp(4*t))} is blowing up the teal one. The curve leaves <b>along Y = −(7/3)X</b> (the 4 eigenline). This is why every curve bends from the X-axis toward the steep line: a saddle.`;
  else note=`<b>Two motions added together:</b> the orange arrow (along Y = 0) is shrinking, the teal arrow (along Y = −(7/3)X) is growing. The dot is the tip of orange + teal. Drag t left and right to watch one component die while the other takes over.`;
  $('liveNote').innerHTML=note;
}

// ---------- explanation ----------
const steps=[
 {title:'1 · The matrix at (3,0)', html:()=>`
 <h3>Plug the point into the Jacobian</h3>
 <p>The deer–wolf system is \\(\\dot x = 3x - x^2 - xy,\\ \\dot y = y - y^2 + xy\\). Its Jacobian (the matrix of partial derivatives) is</p>
 \\[J(x,y)=\\begin{pmatrix}3-2x-y & -x\\\\ y & 1-2y+x\\end{pmatrix}.\\]
 <p>At the critical point \\((3,0)\\) put \\(x=3,\\ y=0\\) into each entry:</p>
 <table><tr><th>entry</th><th>formula</th><th>at (3, 0)</th></tr>
 <tr><td>top-left</td><td>3 − 2x − y</td><td>3 − 6 − 0 = −3</td></tr>
 <tr><td>top-right</td><td>−x</td><td>−3</td></tr>
 <tr><td>bottom-left</td><td>y</td><td>0</td></tr>
 <tr><td>bottom-right</td><td>1 − 2y + x</td><td>1 − 0 + 3 = 4</td></tr></table>
 \\[A=\\begin{pmatrix}-3 & -3\\\\ 0 & 4\\end{pmatrix}.\\]
 <p>The linearized system uses <b>shifted coordinates</b> \\(X = x-3,\\ Y = y\\) (distance from the critical point), so that the critical point sits at \\((X,Y)=(0,0)\\):</p>
 \\[\\dot X = -3X - 3Y,\\qquad \\dot Y = 4Y.\\]
 <p>Everything in the picture is drawn in these \\(X,Y\\) coordinates. The origin of the picture is the point \\((3,0)\\) of the original deer–wolf plane.</p>`},
 {title:'2 · Eigenvalues', html:()=>`
 <h3>Eigenvalues: −3 and 4</h3>
 <p>Solve \\(\\det(A-\\lambda I)=0\\):</p>
 \\[\\det\\begin{pmatrix}-3-\\lambda & -3\\\\ 0 & 4-\\lambda\\end{pmatrix} = (-3-\\lambda)(4-\\lambda) - (-3)(0) = (-3-\\lambda)(4-\\lambda) = 0.\\]
 <p>So \\(\\lambda = -3\\) or \\(\\lambda = 4\\). The shortcut in the solution ("upper triangular, so the eigenvalues are the diagonal entries") is exactly this: the bottom-left zero kills the cross term, and the determinant is just the product of the diagonal factors.</p>
 <p>One eigenvalue is negative, one positive: <b>opposite signs ⇒ saddle</b>. Along one direction solutions shrink (\\(\\exp(-3t)\\)), along the other they grow (\\(\\exp(4t)\\)). Because at least one direction grows, the point is <b>unstable</b>.</p>`},
 {title:'3 · Eigenvectors → eigenlines', html:()=>`
 <h3>Each eigenvalue gives a direction</h3>
 <p>An eigenvector \\(v\\) satisfies \\((A-\\lambda I)v=0\\). Write \\(v=\\binom{a}{b}\\).</p>
 <p><b>λ = −3.</b> \\(A-(-3)I = A+3I=\\begin{pmatrix}0&-3\\\\0&7\\end{pmatrix}\\). The equations are \\(0\\cdot a-3b=0\\) and \\(7b=0\\), so \\(b=0\\) and \\(a\\) is free. Take \\(v_1=\\binom{1}{0}\\).</p>
 <p><b>λ = 4.</b> \\(A-4I=\\begin{pmatrix}-7&-3\\\\0&0\\end{pmatrix}\\). The only equation is \\(-7a-3b=0\\), i.e. \\(b=-\\tfrac{7}{3}a\\). Take \\(a=3\\) to avoid fractions: \\(v_2=\\binom{3}{-7}\\).</p>
 <div class="key"><b>From eigenvector to eigenline.</b> An eigenvector is really a whole line: every multiple \\(c\\,v\\) is also an eigenvector. That line through the origin is the <b>eigenline</b>. A vector \\(\\binom{a}{b}\\) points along the line \\(Y = \\frac{b}{a}X\\).<br><br>
 \\(v_1=\\binom{1}{0}\\): slope \\(0/1=0\\), so the eigenline is <span class="tx"><b>Y = 0</b>, the X-axis</span>.<br>
 \\(v_2=\\binom{3}{-7}\\): slope \\(-7/3\\), so the eigenline is <span class="ty"><b>Y = −(7/3) X</b></span>: go 3 to the right, 7 down. It is the steep line through the origin from upper-left to lower-right.</div>
 <p>So, to answer the question directly: yes, the X-axis is the \\(\\lambda=-3\\) eigenline \\(Y=0\\). The other line in the picture, the steep one, is the \\(\\lambda=4\\) eigenline \\(Y=-\\tfrac73X\\). The Y-axis itself is <em>not</em> special here (dashed in the app): a point starting on the Y-axis does not stay on it.</p>`},
 {title:'4 · Why eigenlines are straight trajectories', html:()=>`
 <h3>On an eigenline, the motion is a straight slide</h3>
 <p>Try the guess \\(\\binom{X}{Y} = c\\,v\\,\\exp(\\lambda t)\\) with \\(v\\) an eigenvector. Its derivative is \\(\\lambda c v\\exp(\\lambda t)\\), and \\(A\\) applied to it is \\(c\\exp(\\lambda t)\\,Av = c\\exp(\\lambda t)\\,\\lambda v\\). Same thing, so it solves \\(\\dot{\\mathbf{X}} = A\\mathbf{X}\\). The point stays on the line of \\(v\\) forever and only its distance from the origin changes, by the factor \\(\\exp(\\lambda t)\\).</p>
 <p><span class="tx"><b>Y = 0, λ = −3:</b></span> \\(\\binom{X}{Y}=c\\binom{1}{0}\\exp(-3t)\\). The factor shrinks: the point slides along the X-axis <b>toward</b> the origin. That is why the arrows on the X-axis in the textbook picture point inward.</p>
 <p><span class="ty"><b>Y = −(7/3)X, λ = 4:</b></span> \\(\\binom{X}{Y}=c\\binom{3}{-7}\\exp(4t)\\). The factor grows: the point slides along the steep line <b>away</b> from the origin. Arrows outward.</p>
 <p>Check with numbers, start at \\((X,Y)=(3,-7)\\) on the steep line: at \\(t=0.2\\) the point is \\((3\\exp 0.8,\\,-7\\exp 0.8)=(6.68,\\,-15.6)\\). Still on the line (ratio \\(-7/3\\)), just farther out. In the app set X₀ = 3, Y₀ = −3·7/3 = −7 … the slider only reaches 4, so use X₀ = 1.5, Y₀ = −3.5.</p>`},
 {title:'5 · Building the whole portrait', html:()=>`
 <h3>Every other solution is a sum of the two slides</h3>
 \\[\\binom{X(t)}{Y(t)} = c_1\\binom{1}{0}\\exp(-3t) + c_2\\binom{3}{-7}\\exp(4t).\\]
 <p>The constants come from the start point: \\(Y_0=-7c_2\\) and \\(X_0=c_1+3c_2\\). For the current sliders \\((X_0,Y_0)=(${fmt(S.x0,1)},${fmt(S.y0,1)})\\): \\(c_2=${fmt(coeffs(S.x0,S.y0)[1],3)}\\), \\(c_1=${fmt(coeffs(S.x0,S.y0)[0],3)}\\). The app draws the two pieces as the orange and teal arrows; the dot is their sum.</p>
 ${table()}
 <p><b>Forward in time</b> (\\(t\\to+\\infty\\)): \\(\\exp(-3t)\\to0\\), the orange piece disappears, only \\(c_2\\binom{3}{-7}\\exp(4t)\\) is left. So every curve ends up running <b>outward parallel to the steep line</b> \\(Y=-\\tfrac73X\\).</p>
 <p><b>Backward in time</b> (\\(t\\to-\\infty\\)): \\(\\exp(4t)\\to0\\), the teal piece disappears, only \\(c_1\\binom{1}{0}\\exp(-3t)\\) is left (and it is huge). So every curve, traced back, came in <b>from far away along the X-axis</b>.</p>
 <div class="key">Put the two together: a curve comes in along the X-axis, gets near the origin, then turns and leaves along \\(Y=-\\tfrac73X\\). That bend between the incoming line and the outgoing line is the hyperbola shape, and four such families (one per wedge between the lines) make the saddle picture. The only solutions that actually reach the origin are the two halves of the X-axis; everything else misses and is thrown out along the steep line.</div>
 <p>For the deer and wolves: near "3 deer, 0 wolves", the X-axis direction says the deer population settles toward 3 when there are no wolves (stable along that line), but the smallest number of wolves (\\(Y\\neq0\\)) grows like \\(\\exp(4t)\\) and drags the state away along \\(Y=-\\tfrac73X\\): wolves up, deer down. That is why this critical point is unstable.</p>`}
];
function table(){ const ts=[-1,-0.5,0,0.5,1]; return `<table><tr><th>t</th><th class="tx">c₁·exp(−3t)</th><th class="ty">c₂·exp(4t)</th><th>X</th><th>Y</th><th>Y / X</th></tr>`+ts.map(t=>{const [x,y,e1,e2]=sol(S.x0,S.y0,t); return `<tr><td>${t}</td><td class="tx">${fmt(e1,3)}</td><td class="ty">${fmt(e2,3)}</td><td>${fmt(x,3)}</td><td>${fmt(y,3)}</td><td>${x!==0?fmt(y/x,3):'—'}</td></tr>`;}).join('')+'</table><p style="font-size:13px;color:var(--muted)">Watch Y / X in the last column move toward −2.333 = −7/3 as t grows: the curve becomes parallel to the steep eigenline.</p>'; }

function renderExplain(target){
  target.innerHTML=`<div class="bar"><div class="tabs" role="tablist">${steps.map((s,i)=>`<button class="tab" role="tab" aria-selected="${i===step}" data-i="${i}">${s.title}</button>`).join('')}</div>${solo?'':'<span class="spacer"></span><a class="btn" id="openTab" href="#explain" target="_blank">Open in new tab</a><button class="btn" id="closeExplain">Close</button>'}</div><div class="body">${steps[step].html()}</div>`;
  target.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setStep(+b.dataset.i,true));
  const c=target.querySelector('#closeExplain'); if(c) c.onclick=()=>{ $('explain').hidden=true; };
  const o=target.querySelector('#openTab'); if(o) o.onclick=()=>{ setTimeout(()=>{ $('explain').hidden=true; },50); };
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([target]).catch(()=>{});
}
function setStep(i,broadcast){ step=i; if(solo) renderExplain($('explainSolo')); else if(!$('explain').hidden) renderExplain($('explain')); if(broadcast&&chan) chan.postMessage({type:'state',step,S}); }

// ---------- wiring ----------
function sync(){ $('tv').textContent=S.t.toFixed(2); $('x0v').textContent=S.x0.toFixed(1); $('y0v').textContent=S.y0.toFixed(1); $('Lv').textContent=S.L.toFixed(2); draw(); live(); if(chan) chan.postMessage({type:'state',step,S}); }
let lastStart='';
function update(){ S.t=+$('t').value; S.x0=+$('x0').value; S.y0=+$('y0').value; S.L=Math.exp(+$('L').value); S.field=$('showField').checked; S.family=$('showFamily').checked; S.comp=$('showComp').checked; S.vel=$('showVel').checked; sync();
  const k=S.x0+','+S.y0; if(k!==lastStart){ lastStart=k; if(!$('explain').hidden&&step===4) renderExplain($('explain')); } }
['t','x0','y0','L','showField','showFamily','showComp','showVel'].forEach(id=>$(id).addEventListener('input',update));
$('explainBtn').onclick=()=>{ $('explain').hidden=false; renderExplain($('explain')); };
let playing=false,raf;
$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'❚❚ Pause':'▶ Play t'; if(playing){ if(+$('t').value>=1) $('t').value=-1.5; loop(); } else cancelAnimationFrame(raf); };
function loop(){ if(!playing)return; let t=+$('t').value+0.006; if(t>1){t=1;playing=false;$('play').textContent='▶ Play t';} $('t').value=t; update(); raf=requestAnimationFrame(loop); }
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);

if(solo){
  document.body.classList.add('solo');
  renderExplain($('explainSolo'));
  if(chan) chan.onmessage=e=>{ const m=e.data; if(m&&m.type==='state'){ const changed=(m.S.x0!==S.x0||m.S.y0!==S.y0); Object.assign(S,m.S); if(m.step!==step||(changed&&step===4)){ step=m.step; renderExplain($('explainSolo')); } } };
}else{
  update();
}
</script>


<script>
/* Phone-width safety net, inlined into every explorer by build.py.
   On narrow screens, anything wider than the page (a long equation, a table,
   a fixed-width figure) is shrunk to fit or given its own sideways scroll, so
   the page itself never scrolls horizontally. Does nothing on wide screens. */
(function () {
  var LIMIT = 820, MEDIA = { CANVAS: 1, IMG: 1, VIDEO: 1, svg: 1, IFRAME: 1 };

  function scrollsItself(el) {
    for (var p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      var o = getComputedStyle(p).overflowX;
      if (o === 'auto' || o === 'scroll') return true;
    }
    return false;
  }

  function fix(el, vw, depth) {
    var cs = getComputedStyle(el);
    if (cs.position === 'fixed' || depth > 14) return;
    if (MEDIA[el.tagName]) {
      el.style.maxWidth = '100%';
      if (el.tagName !== 'IFRAME' && !el.style.height) el.style.height = 'auto';
      return;
    }
    if (el.tagName === 'TABLE' || cs.display === 'table') {
      el.style.display = 'block'; el.style.maxWidth = '100%'; el.style.overflowX = 'auto';
      return;
    }
    if (cs.display === 'inline') el.style.display = 'inline-block';
    el.style.minWidth = '0'; el.style.maxWidth = '100%'; el.style.boxSizing = 'border-box';
    var edge = Math.min(el.getBoundingClientRect().right, vw) + 1;
    function tooWide() {
      return [].filter.call(el.children, function (c) {
        var r = c.getBoundingClientRect();
        return r.width && r.right > edge && !c.ownerSVGElement;
      });
    }
    var wide = tooWide();
    if (wide.length && cs.display.indexOf('flex') >= 0 && cs.flexDirection.indexOf('row') === 0 && cs.flexWrap === 'nowrap') {
      el.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
      wide = tooWide();
    }
    if (wide.length && cs.whiteSpace !== 'nowrap') {
      wide.forEach(function (c) { fix(c, vw, depth + 1); });
    }
    if (el.scrollWidth > el.clientWidth + 1) {
      el.style.overflowX = 'auto';
      if (el.style.display === 'inline-block') el.style.verticalAlign = 'bottom';
    }
  }

  function run() {
    var root = document.documentElement, vw = root.clientWidth;
    if (vw > LIMIT || !document.body) return;
    for (var pass = 0; pass < 4 && root.scrollWidth > vw + 1; pass++) {
      var all = document.body.getElementsByTagName('*');
      for (var i = 0; i < all.length; i++) {
        var el = all[i], r = el.getBoundingClientRect();
        if (!r.width || r.right <= vw + 1 || el.ownerSVGElement) continue;
        var p = el.parentElement;
        if (p !== document.body && p.getBoundingClientRect().right > vw + 1) continue; // start at the outermost offender
        if (scrollsItself(el)) continue;
        var ps = getComputedStyle(p);
        if (ps.display.indexOf('flex') >= 0 && ps.flexDirection.indexOf('row') === 0 && ps.flexWrap === 'nowrap') {
          p.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
          if (el.getBoundingClientRect().right <= vw + 1) continue;
        }
        fix(el, vw, 0);
      }
    }
  }

  var timer;
  function soon() { clearTimeout(timer); run(); timer = setTimeout(function () { run(); timer = setTimeout(run, 700); }, 300); }
  window.addEventListener('load', soon);
  window.addEventListener('resize', soon);
  ['click', 'change', 'toggle'].forEach(function (ev) {
    document.addEventListener(ev, function () { setTimeout(soon, 30); }, true);
  });
  if (document.readyState !== 'loading') soon(); else document.addEventListener('DOMContentLoaded', soon);
})();
</script>
