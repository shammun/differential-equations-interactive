<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18.032 Recitation 1, Problem 2 — where does the matrix send the unit square?</title>
<style>
:root{
  --bg:#eaf0fb; --card:#fff; --ink:#1d2340; --mut:#5c6489; --line:#e3e8f5;
  --i:#e2622c;  --i-soft:#fdeee5;  --i-text:#b4470f;
  --j:#149a83;  --j-soft:#e3f5f1;  --j-text:#0c6f5e;
  --sum:#6b4fd8; --sum-soft:#efebfd;
  --act:#3b5bdb; --act-soft:#e7ecfd;
  --ref:#9aa2c4;
  --warn:#c2255c; --warn-soft:#fdeaf1;
  --shadow:0 6px 22px rgba(59,91,219,.13), 0 1px 3px rgba(29,35,64,.08);
  --sans:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --math:"Cambria Math","STIX Two Math",Cambria,Georgia,"Times New Roman",serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;
  height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column}
.m{font-family:var(--math);font-style:italic;font-size:1.07em;white-space:nowrap}
.m b{font-style:normal;font-weight:700}
b.i{color:var(--i-text)} b.j{color:var(--j-text)} b.s{color:var(--sum)}

header{flex:none;display:flex;align-items:center;gap:6px 16px;padding:9px 14px 0;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
header p{margin:1px 0 0;color:var(--mut);font-size:12.5px}
.help-btn{margin-left:auto}

nav{flex:none;display:flex;gap:5px;padding:8px 14px 0;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:12.5px;border:0;background:rgba(255,255,255,.65);color:var(--ink);
  padding:5px 11px;border-radius:999px;cursor:pointer;line-height:1.3}
nav button:hover{background:#fff}
nav button[aria-selected="true"]{background:var(--act);color:#fff;box-shadow:0 4px 12px rgba(59,91,219,.32)}
nav .tag{font-family:var(--math);font-style:italic;opacity:.85;margin-left:5px;font-size:.95em}
nav button[aria-selected="true"] .tag{opacity:1}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,1fr);
  gap:10px;padding:8px 14px 12px}
.col{display:flex;flex-direction:column;gap:9px;min-height:0;min-width:0}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.figs{flex:1 1 0;display:flex;gap:9px;min-height:0}
.fig{display:flex;flex-direction:column;padding:7px 9px 8px;min-height:0;min-width:0}
.fig.before{flex:1 1 0}
.fig.after{flex:1.45 1 0}
.figtitle{flex:none;font-size:12px;color:var(--mut);line-height:1.3;margin:0 2px 4px;
  display:flex;justify-content:space-between;gap:2px 10px;flex-wrap:wrap}
.figtitle b{color:var(--ink);font-weight:600}
.cv{flex:1 1 0;position:relative;min-height:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.controls{flex:none;padding:8px 12px 9px;display:flex;flex-direction:column;gap:7px}
.steprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepname{font-size:13px;font-weight:650;flex:1 1 180px;min-width:0}
.stepname span{color:var(--act);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots button{width:22px;height:22px;border-radius:50%;border:1.5px solid #c7cfea;background:#fff;
  cursor:pointer;font:inherit;font-size:11px;color:var(--mut);padding:0;line-height:1}
.dots button.done{background:var(--act-soft);border-color:#b7c3f3;color:var(--act)}
.dots button.on{background:var(--act);border-color:var(--act);color:#fff;font-weight:700}
.btn{font:inherit;font-size:13px;border:0;border-radius:9px;padding:6px 13px;cursor:pointer;
  background:var(--act);color:#fff}
.btn.soft{background:var(--act-soft);color:var(--act)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.lbl{font-size:12px;color:var(--mut)}
input[type=range]{accent-color:var(--act);flex:1 1 130px;min-width:100px}
output{font-variant-numeric:tabular-nums;font-size:12.5px;min-width:44px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--act);margin:0}
.mrow{display:none;align-items:center;gap:6px 10px;flex-wrap:wrap}
body.custom .mrow, body.rot .mrow{display:flex}
.mgrid{display:grid;grid-template-columns:auto 1fr auto auto 1fr auto;gap:3px 7px;align-items:center;flex:1 1 320px}
.mgrid .lbl{font-family:var(--math);font-style:italic;font-size:14px;color:var(--ink)}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid #c7cfea;
  background:#fff;color:var(--act);cursor:pointer}

.calc,.notes{padding:10px 14px 14px;overflow:auto;min-height:0;font-size:13px;line-height:1.5}
.calc{flex:1.25 1 0} .notes{flex:1 1 0}
.calc h3,.notes h3{font-size:12.5px;margin:12px 0 5px;color:var(--act);font-weight:650;
  text-transform:uppercase;letter-spacing:.04em}
.calc h3:first-child,.notes h3:first-child{margin-top:0}
.calcline{font-family:var(--math);font-size:15px;background:#f5f7fe;border-radius:10px;
  padding:7px 11px;margin:4px 0 8px;line-height:1.85;overflow-x:auto}
.calcline .op{font-family:var(--sans);font-style:normal;font-size:12.5px;color:var(--mut)}
.result{margin:7px 0;padding:7px 11px;border-radius:10px;border-left:3px solid var(--act);background:var(--act-soft)}
.result.i{background:var(--i-soft);border-left-color:var(--i)}
.result.j{background:var(--j-soft);border-left-color:var(--j)}
.result.s{background:var(--sum-soft);border-left-color:var(--sum)}
.result.w{background:var(--warn-soft);border-left-color:var(--warn)}
.why{color:var(--mut);font-size:12.5px;margin:6px 0}
.calc p,.notes p{margin:0 0 8px;max-width:70ch}
table{border-collapse:collapse;font-size:12.5px;width:100%;margin:2px 0 8px}
th,td{padding:3px 8px 3px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cur td{background:var(--act-soft)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ccw{background:var(--j-soft);color:var(--j-text)}
.pill.cw{background:var(--warn-soft);color:var(--warn)}
.pill.flat{background:#eceef6;color:var(--mut)}
#cTheta{width:100%;height:126px;display:block;margin:2px 0 4px}
.mini{font-size:11.5px;color:var(--mut);margin:0 0 8px}
.entry{display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px;align-items:center;
  font-size:12.5px;margin:4px 0 8px}
.entry .k{font-family:var(--math);font-style:italic;font-size:14px}
.entry .v{font-variant-numeric:tabular-nums;font-weight:600}
.entry .n{color:var(--mut)}
.mat{display:inline-grid;grid-template-columns:auto auto;gap:0 10px;font-family:var(--math);font-style:italic;
  padding:1px 9px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);
  border-radius:3px;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
.vec{display:inline-grid;grid-template-columns:auto;gap:0;font-family:var(--math);font-style:italic;
  padding:1px 7px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:3px;
  text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
.mat.hl1 div:nth-child(odd){background:var(--i-soft);border-radius:3px}
.mat.hl2 div:nth-child(even){background:var(--j-soft);border-radius:3px}

/* floating explainer */
.float{position:fixed;z-index:60;background:#fff;border-radius:14px;display:flex;flex-direction:column;
  overflow:hidden;border:1px solid #cdd6f5;box-shadow:0 18px 50px rgba(29,35,64,.35),0 2px 8px rgba(29,35,64,.14)}
.float-head{flex:none;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;background:var(--act);
  color:#fff;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.float-head:active{cursor:grabbing}
.float-head .ttl{font-weight:600;font-size:13.5px}
.float-head .hint{font-size:11px;opacity:.75}
.ib{margin-left:auto;flex:none;background:rgba(255,255,255,.2);border:0;color:#fff;width:30px;height:30px;
  border-radius:8px;font-size:17px;line-height:1;cursor:pointer}
.ib+.ib{margin-left:0}
.ib:hover{background:rgba(255,255,255,.35)}
.float-body{flex:1;min-height:0;overflow:auto;padding:12px 18px 26px;font-size:13px;line-height:1.6}
.float-body h2{font-size:14px;margin:16px 0 6px;color:var(--act)}
.float-body h2:first-child{margin-top:0}
.float-body p{margin:0 0 9px;max-width:74ch}
.float-body ul{margin:0 0 9px;padding-left:20px;max-width:74ch}
.float-body li{margin:0 0 5px}
.float-grip{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:2}
.float-grip::after{content:"";position:absolute;right:2px;bottom:2px;width:17px;height:17px;
  background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(59,91,219,.55) 4px 6px);
  clip-path:polygon(100% 0,100% 100%,0 100%)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}

@media (max-width:900px){
  body{height:auto;min-height:100dvh;overflow:auto;display:block}
  header{padding:10px 10px 0}
  nav{padding:8px 10px 0}
  main{display:flex;flex-direction:column;padding:8px 10px 10px}
  .col{display:contents}
  .figs{order:1;flex:none;flex-direction:column;gap:8px}
  .fig.before .cv{height:150px;flex:none}
  .fig.after .cv{height:290px;flex:none}
  .controls{order:2;position:sticky;bottom:0;z-index:20;box-shadow:0 -6px 22px rgba(29,35,64,.2)}
  .calc{order:3;flex:none;overflow:visible}
  .notes{order:4;flex:none;overflow:visible}
  .mgrid{flex-basis:100%}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Where does the matrix send the unit square?</h1>
    <p>18.032 Recitation 1, Problem 2 — drawing <span class="m">0 → A<b>i</b> → A(<b>i</b>+<b>j</b>) → A<b>j</b> → 0</span>, one step at a time</p>
  </div>
  <button class="btn help-btn" id="helpBtn" aria-expanded="false" aria-controls="helpPanel">Why may I just connect the dots?</button>
</header>

<nav id="tabs" role="tablist" aria-label="Choose a matrix"></nav>

<main>
  <section class="col">
    <div class="figs">
      <div class="card fig before">
        <div class="figtitle"><b>Before — the unit square</b><span id="beforeNote"></span></div>
        <div class="cv"><canvas id="cBefore" role="img" aria-label="The unit square with its four corners"></canvas></div>
      </div>
      <div class="card fig after">
        <div class="figtitle"><b id="afterTitle">After — the image</b><span id="afterNote"></span></div>
        <div class="cv"><canvas id="cAfter" role="img" aria-label="The image of the unit square under the matrix"></canvas></div>
      </div>
    </div>

    <div class="card controls">
      <div class="steprow">
        <div class="stepname"><span id="stepNum"></span> <span id="stepTitle" style="color:inherit"></span></div>
        <div class="dots" id="dots" aria-label="Jump to a step"></div>
        <button class="btn soft" id="prev">◀ Back</button>
        <button class="btn" id="next">Next ▶</button>
        <button class="btn soft" id="play">Play all</button>
      </div>

      <div class="row">
        <label class="lbl" for="morph">slide the square into place</label>
        <input type="range" id="morph" min="0" max="1" step="0.005" value="1" aria-label="Morph from the identity to A">
        <output id="morphOut" for="morph">A</output>
        <label class="chk"><input type="checkbox" id="showGrid"> image of the grid</label>
        <label class="chk"><input type="checkbox" id="showMid"> midpoints</label>
        <label class="chk"><input type="checkbox" id="showLab" checked> coordinates</label>
      </div>

      <div class="mrow">
        <div class="mgrid" id="thetaBox" hidden>
          <label class="lbl" for="theta" style="grid-column:1">θ</label>
          <input type="range" id="theta" min="-180" max="180" step="1" value="30" style="grid-column:2/6">
          <output id="thetaOut" for="theta" style="grid-column:6">30°</output>
        </div>
        <div class="presets" id="thetaPresets" hidden>
          <button data-t="0">0°</button><button data-t="30">30°</button><button data-t="45">45°</button>
          <button data-t="60">60°</button><button data-t="90">90°</button><button data-t="135">135°</button>
          <button data-t="180">180°</button><button data-t="-45">−45°</button><button data-t="-90">−90°</button>
        </div>
        <div class="mgrid" id="abcdBox" hidden>
          <label class="lbl" for="ea">a</label><input type="range" id="ea" min="-3" max="3" step="0.1" value="2"><output id="eaOut">2</output>
          <label class="lbl" for="eb">b</label><input type="range" id="eb" min="-3" max="3" step="0.1" value="1"><output id="ebOut">1</output>
          <label class="lbl" for="ec">c</label><input type="range" id="ec" min="-3" max="3" step="0.1" value="1"><output id="ecOut">1</output>
          <label class="lbl" for="ed">d</label><input type="range" id="ed" min="-3" max="3" step="0.1" value="3"><output id="edOut">3</output>
        </div>
        <div class="presets" id="presets" hidden>
          <button data-m="2,1,1,3">2,1;1,3</button>
          <button data-m="1,2,2,4">singular</button>
          <button data-m="0,0,0,0">zero</button>
          <button data-m="1,0,0,1">identity</button>
          <button data-m="2,0,0,0.5">area-preserving</button>
        </div>
      </div>
    </div>
  </section>

  <section class="col">
    <div class="card calc" id="calc"></div>
    <div class="card notes" id="notes"></div>
  </section>
</main>

<div class="float" id="helpPanel" hidden role="dialog" aria-label="Why may I just connect the dots?">
  <div class="float-head" id="helpHead">
    <span class="ttl" id="helpTitle">Why may I just connect the dots?</span>
    <span class="hint">drag me</span>
    <button class="ib" id="helpTab" title="Open in a new tab">&#8599;</button>
    <button class="ib" id="helpX" title="Close">&times;</button>
  </div>
  <div class="float-body" id="helpBody"></div>
  <div class="float-grip" id="helpGrip"></div>
</div>

<script>
"use strict";
/* ================================================================
   18.032 Recitation 1, Problem 2 — interactive step-by-step drawing
   Pure vanilla JS + canvas. A is stored row-major as [a,b,c,d]:
       A = [ a  b ]
           [ c  d ]
   so   Ai = (a, c)  = column 1
        Aj = (b, d)  = column 2
        A(i+j) = Ai + Aj = (a+b, c+d)
   ================================================================ */

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
function fmt(v, dp){
  dp = (dp===undefined) ? 2 : dp;
  if (Math.abs(v) < 5e-3) v = 0;
  let s = v.toFixed(dp);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  if (s === '-0') s = '0';
  return s;
}
const V = p => '(' + fmt(p[0]) + ', ' + fmt(p[1]) + ')';
function matHTML(A, hl){
  const cls = 'mat' + (hl===1?' hl1':hl===2?' hl2':'');
  return '<span class="'+cls+'"><div>'+fmt(A[0])+'</div><div>'+fmt(A[1])+'</div>'+
         '<div>'+fmt(A[2])+'</div><div>'+fmt(A[3])+'</div></span>';
}
function vecHTML(p){ return '<span class="vec"><div>'+fmt(p[0])+'</div><div>'+fmt(p[1])+'</div></span>'; }

/* ---------- the seven matrices of Problem 2, plus a sandbox ---------- */
const MATS = [
  { id:'v2',    lab:'vertical stretch',   tag:'[1,0;0,2]',  A:[1,0,0,2] },
  { id:'h3',    lab:'horizontal stretch', tag:'[3,0;0,1]',  A:[3,0,0,1] },
  { id:'shear', lab:'shear',              tag:'[1,1;0,1]',  A:[1,1,0,1] },
  { id:'refx',  lab:'reflection in x',    tag:'[1,0;0,−1]', A:[1,0,0,-1] },
  { id:'swap',  lab:'swap coordinates',   tag:'[0,1;1,0]',  A:[0,1,1,0] },
  { id:'rot45', lab:'rotate & scale',     tag:'[1,−1;1,1]', A:[1,-1,1,1] },
  { id:'rot',   lab:'rotation by θ',      tag:'[cosθ,−sinθ;sinθ,cosθ]', A:null },
  { id:'own',   lab:'your own matrix',    tag:'[a,b;c,d]',  A:null }
];

const STEPS = [
  'The square and its four corners',
  'The origin never moves',
  'A i — the first column',
  'A j — the second column',
  'A(i+j) = A i + A j',
  'Join them in order',
  'Read off det A: area and orientation'
];

/* ---------- state ---------- */
var helpOpen = false;
const S = {
  mi: 0,            // matrix index
  step: 0,
  p: 1,             // progress of the current step's animation, 0..1
  morph: 1,
  theta: 30,
  own: [2,1,1,3],
  showGrid:false, showMid:false, showLab:true,
  playing:false, morphing:false, mt:0
};

function curMat(){
  const m = MATS[S.mi];
  if (m.id === 'rot'){
    const t = S.theta * Math.PI/180;
    return [Math.cos(t), -Math.sin(t), Math.sin(t), Math.cos(t)];
  }
  if (m.id === 'own') return S.own.slice();
  return m.A.slice();
}
const colI = A => [A[0], A[2]];
const colJ = A => [A[1], A[3]];
const sumC = A => [A[0]+A[1], A[2]+A[3]];
const detOf = A => A[0]*A[3] - A[1]*A[2];
const apply = (A,p) => [A[0]*p[0] + A[1]*p[1], A[2]*p[0] + A[3]*p[1]];
const lerpM = (A,t) => [1+t*(A[0]-1), t*A[1], t*A[2], 1+t*(A[3]-1)];   // identity -> A

/* ================================================================
   canvas plumbing
   ================================================================ */
function setupCanvas(cv){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function mkView(w,h,box){
  const sx = w/(box.x1-box.x0), sy = h/(box.y1-box.y0);
  const s = Math.min(sx,sy)*0.97;
  const ox = w/2 - s*(box.x0+box.x1)/2;
  const oy = h/2 + s*(box.y0+box.y1)/2;
  return { s:s, X:x=>ox+s*x, Y:y=>oy-s*y, P:p=>[ox+s*p[0], oy-s*p[1]] };
}
function fitBox(pts){
  let x0=0,x1=1,y0=0,y1=1;
  pts.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); });
  const pad = 0.75;
  x0=Math.floor((x0-pad)*2)/2; x1=Math.ceil((x1+pad)*2)/2;
  y0=Math.floor((y0-pad)*2)/2; y1=Math.ceil((y1+pad)*2)/2;
  const need = 3.6;
  if (x1-x0 < need){ const c=(x0+x1)/2; x0=c-need/2; x1=c+need/2; }
  if (y1-y0 < need){ const c=(y0+y1)/2; y0=c-need/2; y1=c+need/2; }
  return {x0,x1,y0,y1};
}
function grid(ctx,v,box,w,h){
  ctx.save();
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#eceff8';
  for (let x=Math.ceil(box.x0); x<=box.x1; x++){ ctx.beginPath(); ctx.moveTo(v.X(x),0); ctx.lineTo(v.X(x),h); ctx.stroke(); }
  for (let y=Math.ceil(box.y0); y<=box.y1; y++){ ctx.beginPath(); ctx.moveTo(0,v.Y(y)); ctx.lineTo(w,v.Y(y)); ctx.stroke(); }
  ctx.strokeStyle = '#b9c0d8'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0,v.Y(0)); ctx.lineTo(w,v.Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(v.X(0),0); ctx.lineTo(v.X(0),h); ctx.stroke();
  ctx.fillStyle = '#9aa2c4'; ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for (let x=Math.ceil(box.x0); x<=box.x1; x++) if (x!==0) ctx.fillText(x, v.X(x), v.Y(0)+3);
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for (let y=Math.ceil(box.y0); y<=box.y1; y++) if (y!==0) ctx.fillText(y, v.X(0)-4, v.Y(y));
  ctx.restore();
}
function arrow(ctx, from, to, color, lw, head){
  head = head || 9;
  const dx = to[0]-from[0], dy = to[1]-from[1], L = Math.hypot(dx,dy);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = lw; ctx.lineCap = 'round';
  if (L < 1.5){ ctx.restore(); return; }
  const ux = dx/L, uy = dy/L, hL = Math.min(head, L*0.45);
  ctx.beginPath(); ctx.moveTo(from[0],from[1]); ctx.lineTo(to[0]-ux*hL*0.8, to[1]-uy*hL*0.8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(to[0], to[1]);
  ctx.lineTo(to[0]-ux*hL - uy*hL*0.42, to[1]-uy*hL + ux*hL*0.42);
  ctx.lineTo(to[0]-ux*hL + uy*hL*0.42, to[1]-uy*hL - ux*hL*0.42);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function dot(ctx,p,color,r){
  ctx.save(); ctx.fillStyle=color; ctx.strokeStyle='#fff'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(p[0],p[1],r||5,0,7); ctx.fill(); ctx.stroke(); ctx.restore();
}
function tag(ctx,p,text,color,dx,dy,small){
  ctx.save();
  ctx.font = (small?'11px ':'600 12px ')+'system-ui, sans-serif';
  const wpx = ctx.measureText(text).width;
  const x = p[0]+dx, y = p[1]+dy;
  ctx.fillStyle = 'rgba(255,255,255,.86)';
  ctx.fillRect(x-3, y-9, wpx+6, 17);
  ctx.fillStyle = color; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function poly(ctx, pts, fill, stroke, lw, dash){
  ctx.save();
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for (let k=1;k<pts.length;k++) ctx.lineTo(pts[k][0],pts[k][1]);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||2; ctx.lineJoin='round'; ctx.stroke(); }
  ctx.restore();
}

/* ================================================================
   the "before" panel: the unit square, with the current corner lit up
   ================================================================ */
function drawBefore(){
  const cv = $('cBefore'); const {ctx,w,h} = setupCanvas(cv);
  const box = {x0:-1.15,x1:2.05,y0:-1.15,y1:2.05};
  const v = mkView(w,h,box);
  grid(ctx,v,box,w,h);

  const O=v.P([0,0]), I=v.P([1,0]), J=v.P([0,1]), IJ=v.P([1,1]);
  poly(ctx,[O,I,IJ,J], 'rgba(59,91,219,.10)', '#c3cdf0', 1.5);

  // traversal arrows on the boundary (always, faintly; bright at step >= 5)
  const bright = S.step>=5;
  const path=[O,I,IJ,J,O];
  for (let k=0;k<4;k++){
    const a=path[k], b=path[k+1];
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const u=[(b[0]-a[0]),(b[1]-a[1])], L=Math.hypot(u[0],u[1]);
    arrow(ctx,[mid[0]-u[0]/L*7,mid[1]-u[1]/L*7],[mid[0]+u[0]/L*7,mid[1]+u[1]/L*7],
          bright?'#3b5bdb':'#c3cdf0', bright?2:1.4, 7);
  }

  arrow(ctx,O,I,'#e2622c',3,10);
  arrow(ctx,O,J,'#149a83',3,10);

  const lit = {2:[1,0],3:[0,1],4:[1,1],1:[0,0]}[S.step];
  const pts = [[0,0,'0','#5c6489',8,12],[1,0,'i','#b4470f',10,14],[1,1,'i + j','#6b4fd8',9,-11],[0,1,'j','#0c6f5e',-26,-12]];
  pts.forEach(q=>{
    const P=v.P([q[0],q[1]]);
    const on = lit && lit[0]===q[0] && lit[1]===q[1];
    if (on){ ctx.save(); ctx.fillStyle='rgba(59,91,219,.18)'; ctx.beginPath(); ctx.arc(P[0],P[1],13,0,7); ctx.fill(); ctx.restore(); }
    dot(ctx,P, on?'#3b5bdb':'#8e97bb', on?6.5:4.5);
    if (S.showLab) tag(ctx,P,q[2], on?'#3b5bdb':'#5c6489', q[4], q[5], !on);
  });

  if (S.showMid){
    [[0.5,1],[1,0.5]].forEach(q=>{ const P=v.P(q); dot(ctx,P,'#6b4fd8',4); });
  }
  if (S.step>=6){
    const c=v.P([0.5,0.5]); tag(ctx,c,'area = 1','#3b5bdb',-24,0,true);
  }
  $('beforeNote').innerHTML = 'corners <span class="m">0, <b>i</b>, <b>i</b>+<b>j</b>, <b>j</b></span> — counterclockwise';
}

/* ================================================================
   the "after" panel — the step-by-step construction
   ================================================================ */
function drawAfter(){
  const cv = $('cAfter'); const {ctx,w,h} = setupCanvas(cv);
  const A = curMat();
  const Ai = colI(A), Aj = colJ(A), Aij = sumC(A), det = detOf(A);

  const box = fitBox([Ai,Aj,Aij,[0,0],[1,1]]);
  const v = mkView(w,h,box);
  grid(ctx,v,box,w,h);

  // image of the whole grid (optional)
  if (S.showGrid){
    ctx.save(); ctx.strokeStyle='rgba(107,79,216,.22)'; ctx.lineWidth=1;
    for (let k=-6;k<=6;k++){
      let p1=apply(A,[k,-6]), p2=apply(A,[k,6]);
      ctx.beginPath(); ctx.moveTo(...v.P(p1)); ctx.lineTo(...v.P(p2)); ctx.stroke();
      p1=apply(A,[-6,k]); p2=apply(A,[6,k]);
      ctx.beginPath(); ctx.moveTo(...v.P(p1)); ctx.lineTo(...v.P(p2)); ctx.stroke();
    }
    ctx.restore();
  }

  // ghost of the original unit square, for reference
  poly(ctx,[v.P([0,0]),v.P([1,0]),v.P([1,1]),v.P([0,1])],'rgba(150,158,190,.13)','#c9cfe2',1.2,[4,4]);

  const step = S.step, p = S.p;
  const O = v.P([0,0]);

  // ---- morph ghost: the square sliding from identity to A ----
  if (S.morph < 0.999){
    const M = lerpM(A, S.morph);
    const q = [[0,0],[1,0],[1,1],[0,1]].map(c=>v.P(apply(M,c)));
    poly(ctx,q,'rgba(59,91,219,.13)','#7b90e8',1.6);
    [[1,0],[1,1],[0,1]].forEach(c=>{
      const from = v.P(c), to = v.P(apply(A,c)), now = v.P(apply(M,c));
      ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle='rgba(107,79,216,.45)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(from[0],from[1]); ctx.lineTo(to[0],to[1]); ctx.stroke(); ctx.restore();
      dot(ctx,now,'#6b4fd8',4);
    });
  }

  // ---- step 6: filled image + orientation swirl ----
  if (step>=6 && Math.abs(det)>1e-9){
    poly(ctx,[O,v.P(Ai),v.P(Aij),v.P(Aj)], det>0?'rgba(20,154,131,.16)':'rgba(194,37,92,.13)', null);
    const c = v.P([(Ai[0]+Aj[0])/2,(Ai[1]+Aj[1])/2]);
    ctx.save();
    ctx.strokeStyle = det>0?'#149a83':'#c2255c'; ctx.lineWidth=2.2; ctx.lineCap='round';
    const R=Math.min(22, v.s*0.28), a0=-0.6, a1=3.5;
    ctx.beginPath(); ctx.arc(c[0],c[1],R, det>0? a1:a0, det>0? a0:a1, det>0); ctx.stroke();
    const ang = det>0? a0 : a1, tip=[c[0]+R*Math.cos(ang), c[1]+R*Math.sin(ang)];
    const tg = det>0 ? [Math.sin(ang), -Math.cos(ang)] : [-Math.sin(ang), Math.cos(ang)];
    arrow(ctx,[tip[0]-tg[0]*5,tip[1]-tg[1]*5],[tip[0]+tg[0]*5,tip[1]+tg[1]*5], det>0?'#149a83':'#c2255c',2.2,8);
    ctx.restore();
  }

  // ---- step 4: the tip-to-tail construction ----
  if (step>=4){
    const q = step===4 ? p : 1;
    const tipI = v.P(Ai), tipJ = v.P(Aj), corner = v.P(Aij);
    // translated copy of Aj, starting at the tip of Ai  (this is the key picture)
    const mv = [tipI[0] + (corner[0]-tipI[0])*q, tipI[1] + (corner[1]-tipI[1])*q];
    ctx.save(); ctx.setLineDash([5,4]);
    arrow(ctx,tipI,mv,'rgba(20,154,131,.85)',2.2,9);
    if (q>0.98){ ctx.setLineDash([5,4]); arrow(ctx,tipJ,corner,'rgba(226,98,44,.8)',2.2,9); }
    ctx.restore();
  }

  // ---- step 5: walk the path 0 -> Ai -> A(i+j) -> Aj -> 0 ----
  if (step>=5){
    const P=[O,v.P(Ai),v.P(Aij),v.P(Aj),O];
    const segL=[], tot=(()=>{ let t=0; for(let k=0;k<4;k++){ const L=Math.hypot(P[k+1][0]-P[k][0],P[k+1][1]-P[k][1]); segL.push(L); t+=L; } return t; })();
    const walk = (step===5? p:1)*tot;
    let acc=0;
    ctx.save(); ctx.strokeStyle='#3b5bdb'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]);
    for (let k=0;k<4;k++){
      const L=segL[k];
      if (walk >= acc+L){ ctx.lineTo(P[k+1][0],P[k+1][1]); }
      else {
        const f=Math.max(0,(walk-acc)/(L||1));
        ctx.lineTo(P[k][0]+(P[k+1][0]-P[k][0])*f, P[k][1]+(P[k+1][1]-P[k][1])*f);
        break;
      }
      acc+=L;
    }
    ctx.stroke(); ctx.restore();
    // traversal arrowheads
    for (let k=0;k<4;k++){
      const a=P[k], b=P[k+1], L=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if (L<6) continue;
      const done = walk >= (segL.slice(0,k).reduce((x,y)=>x+y,0) + L*0.55);
      if (!done) continue;
      const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], u=[(b[0]-a[0])/L,(b[1]-a[1])/L];
      arrow(ctx,[mid[0]-u[0]*8,mid[1]-u[1]*8],[mid[0]+u[0]*8,mid[1]+u[1]*8],'#3b5bdb',2.4,9);
    }
  }

  // ---- the two column arrows ----
  if (step>=2){
    const q = step===2 ? p : 1;
    arrow(ctx,O,[O[0]+(v.P(Ai)[0]-O[0])*q, O[1]+(v.P(Ai)[1]-O[1])*q],'#e2622c',3.2,11);
  }
  if (step>=3){
    const q = step===3 ? p : 1;
    arrow(ctx,O,[O[0]+(v.P(Aj)[0]-O[0])*q, O[1]+(v.P(Aj)[1]-O[1])*q],'#149a83',3.2,11);
  }

  // ---- midpoints (problem 1c tie-in) ----
  if (S.showMid && step>=4){
    [[0.5,1],[1,0.5]].forEach(c=>{ const P=v.P(apply(A,c)); dot(ctx,P,'#6b4fd8',4.5); });
  }

  // ---- the four labelled image points ----
  const pts=[];
  pts.push({p:[0,0], t:'0', c:'#5c6489', dx:-16, dy:13, on:step>=1});
  if (step>=2) pts.push({p:Ai, t:'A i '+(S.showLab?V(Ai):''), c:'#b4470f', dx:9, dy:13, on:true});
  if (step>=3) pts.push({p:Aj, t:'A j '+(S.showLab?V(Aj):''), c:'#0c6f5e', dx:9, dy:-12, on:true});
  if (step>=4) pts.push({p:Aij, t:'A(i+j) '+(S.showLab?V(Aij):''), c:'#6b4fd8', dx:9, dy:-13, on:true});
  pts.forEach(q=>{ const P=v.P(q.p); dot(ctx,P,q.c, q.on?5.5:4); if (q.on) tag(ctx,P,q.t,q.c,q.dx,q.dy); });

  // degenerate warning
  if (Math.abs(det)<1e-9 && step>=5){
    ctx.save(); ctx.fillStyle='#c2255c'; ctx.font='600 12px system-ui, sans-serif';
    ctx.fillText('det A = 0: the square is squashed flat', 10, 16); ctx.restore();
  }

  $('afterTitle').innerHTML = 'After — the image under A';
  $('afterNote').innerHTML = 'det A = <b>'+fmt(det)+'</b> &nbsp;·&nbsp; area = <b>'+fmt(Math.abs(det))+'</b> &nbsp;·&nbsp; '+
    (Math.abs(det)<1e-9 ? '<span class="pill flat">flattened</span>'
      : det>0 ? '<span class="pill ccw">counterclockwise</span>' : '<span class="pill cw">clockwise — flipped</span>');
}

/* ================================================================
   the live calculation panel
   ================================================================ */
function calcHTML(){
  const A = curMat(), Ai=colI(A), Aj=colJ(A), Aij=sumC(A), det=detOf(A);
  const st = S.step;
  let H = '<h3>Step '+st+' — '+STEPS[st]+'</h3>';

  if (st===0){
    H += '<p>The unit square has four corners, and every one of them is a combination of <span class="m"><b>i</b></span> and <span class="m"><b>j</b></span>:</p>'+
         '<div class="calcline">0 = 0<b>i</b> + 0<b>j</b><br>'+
         '<b>i</b> = 1<b>i</b> + 0<b>j</b><br>'+
         '<b>i</b>+<b>j</b> = 1<b>i</b> + 1<b>j</b><br>'+
         '<b>j</b> = 0<b>i</b> + 1<b>j</b></div>'+
         '<p class="why">Listed in that order they run counterclockwise around the square: bottom-left, bottom-right, top-right, top-left. That is the order the problem asks you to connect.</p>'+
         '<div class="result">Our matrix is A = '+matHTML(A)+'. Everything that follows uses only its two columns.</div>';
  }

  if (st===1){
    H += '<div class="calcline">A <span class="vec"><div>0</div><div>0</div></span> = '+
         '<span class="vec"><div>'+fmt(A[0])+'·0 + '+fmt(A[1])+'·0</div><div>'+fmt(A[2])+'·0 + '+fmt(A[3])+'·0</div></span> = '+
         '<span class="vec"><div>0</div><div>0</div></span></div>'+
         '<div class="result">The first of the four points, <span class="m">0</span>, is at the origin — and it stays there.</div>'+
         '<p class="why">Every linear map fixes the origin. That is why all these pictures are anchored at (0,0), and why the drawing is a parallelogram with a corner at the origin rather than a floating quadrilateral.</p>';
  }

  if (st===2){
    H += '<div class="calcline">A <b>i</b> = '+matHTML(A,1)+' <span class="vec"><div>1</div><div>0</div></span> = '+
         '<span class="vec"><div>'+fmt(A[0])+'·1 + '+fmt(A[1])+'·0</div><div>'+fmt(A[2])+'·1 + '+fmt(A[3])+'·0</div></span> = '+
         '<span class="vec"><div>'+fmt(Ai[0])+'</div><div>'+fmt(Ai[1])+'</div></span></div>'+
         '<div class="result i">A <b>i</b> = '+V(Ai)+' — <b>literally the first column of A</b>.</div>'+
         '<p class="why">Multiplying by <span class="m"><b>i</b> = (1,0)</span> picks out column 1 and throws column 2 away. You never have to compute this: just read the left-hand column off the matrix and draw an arrow from the origin to it.</p>';
  }

  if (st===3){
    H += '<div class="calcline">A <b>j</b> = '+matHTML(A,2)+' <span class="vec"><div>0</div><div>1</div></span> = '+
         '<span class="vec"><div>'+fmt(A[0])+'·0 + '+fmt(A[1])+'·1</div><div>'+fmt(A[2])+'·0 + '+fmt(A[3])+'·1</div></span> = '+
         '<span class="vec"><div>'+fmt(Aj[0])+'</div><div>'+fmt(Aj[1])+'</div></span></div>'+
         '<div class="result j">A <b>j</b> = '+V(Aj)+' — <b>the second column of A</b>.</div>'+
         '<p class="why">Same trick, other column. This is the answer to "how is A<b>j</b> drawn?": it is not a construction at all — it is one of the two columns, drawn as an arrow from the origin, exactly like A<b>i</b>.</p>';
  }

  if (st===4){
    H += '<p>Now use linearity instead of multiplying again. Since <span class="m"><b>i</b>+<b>j</b></span> is a sum,</p>'+
         '<div class="calcline">A(<b>i</b>+<b>j</b>) = A<b>i</b> + A<b>j</b> = '+
         '<span class="vec"><div>'+fmt(Ai[0])+'</div><div>'+fmt(Ai[1])+'</div></span> + '+
         '<span class="vec"><div>'+fmt(Aj[0])+'</div><div>'+fmt(Aj[1])+'</div></span> = '+
         '<span class="vec"><div>'+fmt(Ai[0])+' + '+fmt(Aj[0])+'</div><div>'+fmt(Ai[1])+' + '+fmt(Aj[1])+'</div></span> = '+
         '<span class="vec"><div>'+fmt(Aij[0])+'</div><div>'+fmt(Aij[1])+'</div></span></div>'+
         '<div class="result s">A(<b>i</b>+<b>j</b>) = '+V(Aij)+' — the sum of the two columns.</div>'+
         '<p class="why"><b>How to draw it without arithmetic:</b> put a copy of the green arrow A<b>j</b> at the tip of the orange arrow A<b>i</b> (tip to tail). Where it lands is the point. The dashed arrows on the picture are those two copies — start from A<b>i</b> and add A<b>j</b>, or start from A<b>j</b> and add A<b>i</b>; both land on the same corner. That is the fourth corner of the parallelogram.</p>'+
         '<p class="why">Check it the long way if you like: A(1,1) = ('+fmt(A[0])+'·1 + '+fmt(A[1])+'·1, '+fmt(A[2])+'·1 + '+fmt(A[3])+'·1) = '+V(Aij)+'. Same answer.</p>';
  }

  if (st===5){
    H += '<p>The four points, in the order the problem gives:</p>'+
         '<table><tr><th>corner</th><th>goes to</th><th>which is</th></tr>'+
         '<tr><td class="num">0</td><td class="num">0</td><td>origin is fixed</td></tr>'+
         '<tr><td class="num">i</td><td class="num">'+V(Ai)+'</td><td>column 1</td></tr>'+
         '<tr><td class="num">i + j</td><td class="num">'+V(Aij)+'</td><td>column 1 + column 2</td></tr>'+
         '<tr><td class="num">j</td><td class="num">'+V(Aj)+'</td><td>column 2</td></tr></table>'+
         '<div class="result">Connect them with straight segments in exactly that order, then close back to 0.</div>'+
         '<p class="why">Straight segments are legitimate because a linear map sends the straight edge between two corners to the straight segment between their images — see the "connect the dots" explanation for the one-line proof. Opposite sides come out parallel and equal, so the figure is always a parallelogram.</p>';
  }

  if (st===6){
    const cw = det<0, flat = Math.abs(det)<1e-9;
    H += '<div class="calcline">det A = ad − bc = ('+fmt(A[0])+')('+fmt(A[3])+') − ('+fmt(A[1])+')('+fmt(A[2])+') = '+fmt(det)+'</div>'+
         '<div class="result'+(flat?' w':cw?' w':'')+'">area of the image = |det A| = <b>'+fmt(Math.abs(det))+'</b>'+
         ' &nbsp;(the square had area 1, so A multiplies areas by '+fmt(Math.abs(det))+')</div>'+
         '<div class="result'+(cw?' w':'')+'">'+
         (flat ? 'det A = 0: the two columns lie on one line, so the square is crushed onto a segment — area 0, no orientation.'
               : cw ? 'det A &lt; 0: walking 0 → A<b>i</b> → A(<b>i</b>+<b>j</b>) → A<b>j</b> → 0 now goes <b>clockwise</b>. The plane has been turned over.'
                    : 'det A &gt; 0: the walk is still <b>counterclockwise</b>, so the plane was not flipped.')+'</div>'+
         '<p class="why">This is why the problem insists on an order for the four points. The shape alone does not tell you whether the map flipped the plane; the direction you travel around it does.</p>';
    // diagnosis of the shape
    const li=Math.hypot(Ai[0],Ai[1]), lj=Math.hypot(Aj[0],Aj[1]), dp=Ai[0]*Aj[0]+Ai[1]*Aj[1];
    let shape;
    if (flat) shape='a segment (degenerate)';
    else if (Math.abs(dp)<1e-6 && Math.abs(li-lj)<1e-6) shape='a square of side '+fmt(li);
    else if (Math.abs(dp)<1e-6) shape='a rectangle, '+fmt(li)+' by '+fmt(lj);
    else if (Math.abs(li-lj)<1e-6) shape='a rhombus of side '+fmt(li);
    else shape='a general parallelogram';
    H += '<h3>Shape check</h3><table>'+
         '<tr><td>|A i|</td><td class="num">'+fmt(li)+'</td></tr>'+
         '<tr><td>|A j|</td><td class="num">'+fmt(lj)+'</td></tr>'+
         '<tr><td>A i · A j</td><td class="num">'+fmt(dp)+(Math.abs(dp)<1e-6?' → perpendicular':' → not perpendicular')+'</td></tr>'+
         '<tr class="cur"><td>image is</td><td class="num">'+shape+'</td></tr></table>'+
         '<p class="why">Equal column lengths plus a zero dot product means the square stays a square; only the size and the tilt change.</p>';
  }

  if (MATS[S.mi].id==='rot') H += thetaBlock();
  if (MATS[S.mi].id==='own') H += ownBlock();

  if (S.showMid && st>=4){
    const m1=apply(A,[0.5,1]), m2=apply(A,[1,0.5]);
    H += '<h3>Midpoints (Problem 1c)</h3>'+
         '<div class="calcline">A(½<b>i</b>+<b>j</b>) = ½A<b>i</b> + A<b>j</b> = '+V(m1)+'<br>'+
         'A(<b>i</b>+½<b>j</b>) = A<b>i</b> + ½A<b>j</b> = '+V(m2)+'</div>'+
         '<p class="why">Each is the midpoint of an edge of the image parallelogram: midpoints go to midpoints, so the edges really are filled in evenly.</p>';
  }
  return H;
}

/* ================================================================
   the rotation matrix: how θ builds every entry
   ================================================================ */
function angDeg(p){
  if (Math.hypot(p[0],p[1]) < 1e-9) return null;
  let a = Math.atan2(p[1],p[0])*180/Math.PI;
  if (a <= -180+1e-9) a += 360;
  return a;
}
function angTxt(p){ const a=angDeg(p); return a===null ? '—' : fmt(a,1)+'°'; }
function lenTxt(p){ return fmt(Math.hypot(p[0],p[1]),3); }

const TH_SAMPLES = [0,30,45,60,90,135,180,-45,-90];

function thetaBlock(){
  const th = S.theta, r = th*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
  const A = curMat(), Ai=colI(A), Aj=colJ(A), Aij=sumC(A);

  let H = '<h3>How θ builds A</h3>'+
    '<div class="calcline">θ = '+fmt(th,0)+'° = '+fmt(r,4)+' rad'+
    '<br>cos θ = <b>'+fmt(c,4)+'</b> &nbsp;&nbsp; sin θ = <b>'+fmt(s,4)+'</b></div>'+
    '<p>Every entry of A is one of those two numbers, up to a sign:</p>'+
    '<div class="entry">'+
      '<span class="k">a = cos θ</span><span class="v">'+fmt(c,4)+'</span><span class="n">top-left</span>'+
      '<span class="k">b = −sin θ</span><span class="v">'+fmt(-s,4)+'</span><span class="n">top-right</span>'+
      '<span class="k">c = sin θ</span><span class="v">'+fmt(s,4)+'</span><span class="n">bottom-left</span>'+
      '<span class="k">d = cos θ</span><span class="v">'+fmt(c,4)+'</span><span class="n">bottom-right</span>'+
    '</div>'+
    '<div class="calcline">A = '+matHTML(A)+'</div>'+
    '<canvas id="cTheta" role="img" aria-label="cosine and sine as functions of theta, with the current angle marked"></canvas>'+
    '<p class="mini">The two curves are the only numbers in the matrix. The orange dot is cos θ (which fills <i>a</i> and <i>d</i>); the green dot is sin θ (which fills <i>c</i>, and <i>b</i> with a minus sign).</p>';

  H += '<h3>What that does to the drawing</h3>'+
    '<table><tr><th>point</th><th>formula</th><th>value</th><th>length</th><th>angle</th></tr>'+
    '<tr><td>A i</td><td class="num">(cos θ, sin θ)</td><td class="num">'+V(Ai)+'</td><td class="num">'+lenTxt(Ai)+'</td><td class="num">'+angTxt(Ai)+'</td></tr>'+
    '<tr><td>A j</td><td class="num">(−sin θ, cos θ)</td><td class="num">'+V(Aj)+'</td><td class="num">'+lenTxt(Aj)+'</td><td class="num">'+angTxt(Aj)+'</td></tr>'+
    '<tr><td>A(i+j)</td><td class="num">(cos θ − sin θ, sin θ + cos θ)</td><td class="num">'+V(Aij)+'</td><td class="num">'+lenTxt(Aij)+'</td><td class="num">'+angTxt(Aij)+'</td></tr>'+
    '</table>'+
    '<p class="why">A i sits at angle θ on the unit circle and A j at θ + 90°, so the right angle between the two columns is never lost — the image stays a <b>unit square</b>, just turned. The far corner keeps length √2 ≈ 1.414 and sits at θ + 45°: it rides a circle of radius √2 as you drag θ.</p>'+
    '<div class="calcline">A(i+j) = A i + A j = <span class="vec"><div>'+fmt(c,3)+'</div><div>'+fmt(s,3)+'</div></span> + '+
      '<span class="vec"><div>'+fmt(-s,3)+'</div><div>'+fmt(c,3)+'</div></span> = '+
      '<span class="vec"><div>'+fmt(c-s,3)+'</div><div>'+fmt(s+c,3)+'</div></span></div>'+
    '<div class="calcline">det A = ad − bc = cos²θ − (−sin θ)(sin θ) = cos²θ + sin²θ'+
      '<br>&nbsp;&nbsp;&nbsp;&nbsp;= '+fmt(c*c,4)+' + '+fmt(s*s,4)+' = <b>1</b></div>'+
    '<div class="result">det A = 1 for <b>every</b> θ: area 1 is preserved and the walk stays counterclockwise. A rotation is rigid — it can never stretch, squash or flip.</div>';

  let rows = '';
  TH_SAMPLES.forEach(t=>{
    const rr=t*Math.PI/180, cc=Math.cos(rr), ss=Math.sin(rr);
    const cur = Math.abs(((t - th + 540)%360) - 180) < 0.5;
    rows += '<tr'+(cur?' class="cur"':'')+'><td class="num">'+t+'°</td>'+
      '<td class="num">'+fmt(cc,3)+'</td><td class="num">'+fmt(ss,3)+'</td>'+
      '<td class="num">('+fmt(cc,3)+', '+fmt(ss,3)+')</td>'+
      '<td class="num">('+fmt(-ss,3)+', '+fmt(cc,3)+')</td></tr>';
  });
  H += '<h3>A few angles side by side</h3>'+
    '<table><tr><th>θ</th><th>cos θ</th><th>sin θ</th><th>A i</th><th>A j</th></tr>'+rows+'</table>'+
    '<p class="why">Read the pattern down the columns. At θ = 0 the matrix is the identity. At θ = 90° the columns become A i = (0,1) = <b>j</b> and A j = (−1,0) = −<b>i</b>: the square is carried onto the second quadrant. At θ = 180° both columns reverse, A = −I, and the square lands in the third quadrant — still counterclockwise, because reversing <i>both</i> columns is a rotation, not a reflection. Negative θ turns the other way.</p>';
  return H;
}

function drawThetaCurve(){
  const cv = $('cTheta'); if (!cv) return;
  const o = setupCanvas(cv); const ctx=o.ctx, w=o.w, h=o.h;
  if (w<10||h<10) return;
  const L=26, R=8, T=8, B=16, pw=w-L-R, ph=h-T-B;
  const X = t => L + (t+180)/360*pw;
  const Y = y => T + (1-y)/2*ph;
  ctx.save();
  ctx.strokeStyle='#e9ecf7'; ctx.lineWidth=1;
  [-180,-90,0,90,180].forEach(t=>{ ctx.beginPath(); ctx.moveTo(X(t),T); ctx.lineTo(X(t),T+ph); ctx.stroke(); });
  [-1,0,1].forEach(y=>{ ctx.beginPath(); ctx.moveTo(L,Y(y)); ctx.lineTo(L+pw,Y(y)); ctx.stroke(); });
  ctx.strokeStyle='#b9c0d8'; ctx.beginPath(); ctx.moveTo(L,Y(0)); ctx.lineTo(L+pw,Y(0)); ctx.stroke();
  ctx.fillStyle='#9aa2c4'; ctx.font='10px system-ui, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  [-180,-90,0,90,180].forEach(t=>ctx.fillText(t+'°', X(t), T+ph+3));
  ctx.textAlign='right'; ctx.textBaseline='middle';
  [-1,0,1].forEach(y=>ctx.fillText(y, L-4, Y(y)));
  const curve=(f,col)=>{ ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=2;
    for(let t=-180;t<=180;t+=2){ const p=[X(t),Y(f(t*Math.PI/180))]; t===-180?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); }
    ctx.stroke(); };
  curve(Math.cos,'#e2622c'); curve(Math.sin,'#149a83');
  const th=S.theta, r=th*Math.PI/180;
  ctx.strokeStyle='#3b5bdb'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(X(th),T); ctx.lineTo(X(th),T+ph); ctx.stroke(); ctx.setLineDash([]);
  dot(ctx,[X(th),Y(Math.cos(r))],'#e2622c',5);
  dot(ctx,[X(th),Y(Math.sin(r))],'#149a83',5);
  ctx.font='600 11px system-ui, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const lx = X(th) + (th>120? -70 : 8);
  ctx.fillStyle='#b4470f'; ctx.fillText('cos θ = '+fmt(Math.cos(r),3), lx, Y(Math.cos(r))-1);
  ctx.fillStyle='#0c6f5e'; ctx.fillText('sin θ = '+fmt(Math.sin(r),3), lx, Y(Math.sin(r))-1);
  ctx.restore();
}

function ownBlock(){
  const A=curMat(), Ai=colI(A), Aj=colJ(A), det=detOf(A);
  const cross = A[0]*A[3]-A[1]*A[2];
  let msg;
  if (Math.abs(cross)<1e-9) msg = 'The two columns are parallel (or one is zero), so they span only a line: det A = 0 and the square is crushed flat. Every point of the plane lands on that single line.';
  else if (Math.abs(Math.abs(det)-1)<1e-9) msg = '|det A| = 1: whatever the distortion, the area of the image is still exactly 1.';
  else msg = 'A multiplies every area by '+fmt(Math.abs(det))+'.';
  return '<h3>Your matrix right now</h3>'+
    '<div class="entry">'+
      '<span class="k">a</span><span class="v">'+fmt(A[0])+'</span><span class="n">x-part of A i</span>'+
      '<span class="k">c</span><span class="v">'+fmt(A[2])+'</span><span class="n">y-part of A i</span>'+
      '<span class="k">b</span><span class="v">'+fmt(A[1])+'</span><span class="n">x-part of A j</span>'+
      '<span class="k">d</span><span class="v">'+fmt(A[3])+'</span><span class="n">y-part of A j</span>'+
    '</div>'+
    '<p class="why">a and c move only the orange arrow; b and d move only the green one. Nothing else in the picture can change.</p>'+
    '<div class="calcline">A i = ('+fmt(A[0])+', '+fmt(A[2])+') &nbsp;&nbsp; A j = ('+fmt(A[1])+', '+fmt(A[3])+')'+
    '<br>det A = ('+fmt(A[0])+')('+fmt(A[3])+') − ('+fmt(A[1])+')('+fmt(A[2])+') = '+fmt(det)+'</div>'+
    '<div class="result'+(Math.abs(det)<1e-9?' w':'')+'">'+msg+'</div>';
}

/* ================================================================
   the per-matrix notes panel
   ================================================================ */
function matrixProse(){
  const m = MATS[S.mi], A = curMat(), det = detOf(A);
  const Ai=colI(A), Aj=colJ(A);
  let body='';
  switch(m.id){
    case 'v2': body =
      '<p><span class="m">A<b>i</b> = (1,0)</span> is unchanged — nothing happens along the horizontal direction. <span class="m">A<b>j</b> = (0,2)</span> is twice as long, so the top edge is lifted to height 2.</p>'+
      '<p>The square becomes the <b>1 × 2 rectangle</b> with corners (0,0), (1,0), (1,2), (0,2). Since det A = +2, areas double and the orientation is untouched.</p>'+
      '<p class="why">A diagonal matrix scales each axis on its own, with no mixing: the first column stays on the x-axis and the second stays on the y-axis.</p>'; break;
    case 'h3': body =
      '<p>The mirror image of the previous case: <span class="m">A<b>i</b> = (3,0)</span> is stretched, <span class="m">A<b>j</b> = (0,1)</span> is left alone, giving the <b>3 × 1 rectangle</b>. det A = +3.</p>'+
      '<p class="why">Compare the two: both are diagonal, both keep the axes fixed as directions, and in each case det A is just the product of the two diagonal entries — the two stretch factors multiplied together.</p>'; break;
    case 'shear': body =
      '<p><span class="m">A<b>i</b> = (1,0)</span> is pinned in place, so the bottom edge of the square does not move at all. But <span class="m">A<b>j</b> = (1,1)</span> has been pushed one unit to the right, so the top edge slides sideways.</p>'+
      '<p>The result is a leaning parallelogram with corners (0,0), (1,0), (2,1), (1,1). det A = +1, so <b>the area is unchanged</b> even though the shape is visibly distorted — the base and the height are both still 1.</p>'+
      '<p class="why">Think of a deck of cards pushed over: every card keeps its size, each one just slides further than the one below it. Turn on "image of the grid" to see this.</p>'; break;
    case 'refx': body =
      '<p><span class="m">A<b>i</b> = (1,0)</span> is fixed; <span class="m">A<b>j</b> = (0,−1)</span> points straight down. The square lands below the axis, on (0,0), (1,0), (1,−1), (0,−1).</p>'+
      '<p>det A = −1: the same area, but the walk 0 → A<b>i</b> → A(<b>i</b>+<b>j</b>) → A<b>j</b> → 0 now runs <b>clockwise</b>. That minus sign is the algebraic signature of "turned over".</p>'+
      '<p class="why">No amount of rotating or stretching can produce this — you would have to lift the plane out into three dimensions and flip it. That is a genuine difference between det &gt; 0 and det &lt; 0.</p>'; break;
    case 'swap': body =
      '<p>The two basis vectors trade places: <span class="m">A<b>i</b> = (0,1) = <b>j</b></span> and <span class="m">A<b>j</b> = (1,0) = <b>i</b></span>. The image, <i>as a set of points</i>, is the very same unit square.</p>'+
      '<p>But det A = −1, and the path is traversed the other way round. This is the reflection in the line <span class="m">y = x</span>, not the identity.</p>'+
      '<p class="why">A useful warning: "same picture" does not mean "same map". Watch the arrowheads in step 5, and use the midpoints toggle to see that individual points really do move.</p>'; break;
    case 'rot45': body =
      '<p><span class="m">A<b>i</b> = (1,1)</span> and <span class="m">A<b>j</b> = (−1,1)</span>. Both have length <span class="m">√2 ≈ 1.414</span>, and their dot product is (1)(−1) + (1)(1) = 0, so they are still perpendicular.</p>'+
      '<p>Perpendicular and equal in length means the image is <b>still a square</b>, of side √2, turned 45°. Indeed A = √2 × (rotation by 45°). det A = 2 — lengths scale by √2, so areas scale by (√2)² = 2.</p>'; break;
    case 'rot': body =
      '<p><span class="m">A<b>i</b> = (cos θ, sin θ)</span> is the unit vector at angle θ, and <span class="m">A<b>j</b> = (−sin θ, cos θ)</span> is the unit vector at θ + 90°. Both have length 1 and they stay perpendicular.</p>'+
      '<p>So the unit square is carried rigidly around the origin. det A = cos²θ + sin²θ = 1 for every θ: areas and orientation are preserved, as any rigid motion must do.</p>'+
      '<p class="why">Drag θ and watch the corner A(<b>i</b>+<b>j</b>): it rides a circle of radius √2, which is exactly the statement that the diagonal of the square keeps its length.</p>'; break;
    default: body =
      '<p>Move the four sliders and watch the two columns move. Some things to try:</p>'+
      '<ul><li>make the columns point the <b>same way</b> (e.g. b = 2a, d = 2c) — det A = 0 and the square collapses onto a line;</li>'+
      '<li>keep <span class="m">ad − bc = 1</span> while distorting the shape — the area stays exactly 1;</li>'+
      '<li>swap the two columns — the picture is unchanged but the sign of det A flips.</li></ul>'+
      '<p class="why">Current columns: A<b>i</b> = '+V(Ai)+', A<b>j</b> = '+V(Aj)+', det A = '+fmt(det)+'.</p>';
  }
  return body;
}
function notesHTML(){
  return '<h3>'+MATS[S.mi].lab+'</h3>' + matrixProse() +
    '<h3>The one rule behind all seven</h3>'+
    '<p>Read the two columns, draw them from the origin, complete the parallelogram. You never multiply A by anything except <span class="m"><b>i</b></span> and <span class="m"><b>j</b></span>.</p>';
}

function render(){
  drawBefore(); drawAfter();
  $('calc').innerHTML = calcHTML();
  $('notes').innerHTML = notesHTML();
  drawThetaCurve();
  try { if (helpOpen || (panel && !panel.hidden)) updateHelp(); } catch(e){}
  try { pushHelpWin(); } catch(e){}
  $('stepNum').textContent = 'Step ' + S.step + '.';
  $('stepTitle').textContent = STEPS[S.step];
  $('prev').disabled = S.step===0;
  $('next').disabled = S.step===STEPS.length-1;
  Array.from($('dots').children).forEach((b,k)=>{
    b.className = k===S.step ? 'on' : (k<S.step ? 'done':'');
  });
}
function redrawOnly(){ drawBefore(); drawAfter(); }

function buildTabs(){
  const nav = $('tabs');
  MATS.forEach((m,k)=>{
    const b=document.createElement('button');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', k===0?'true':'false');
    b.innerHTML = m.lab + '<span class="tag">'+m.tag+'</span>';
    b.onclick = ()=>{ setMat(k); };
    nav.appendChild(b);
  });
}
function setMat(k){
  S.mi = k; S.p = 1;
  Array.from($('tabs').children).forEach((b,q)=>b.setAttribute('aria-selected', q===k?'true':'false'));
  document.body.classList.toggle('rot', MATS[k].id==='rot');
  document.body.classList.toggle('custom', MATS[k].id==='own');
  $('thetaBox').hidden = MATS[k].id!=='rot';
  $('thetaPresets').hidden = MATS[k].id!=='rot';
  $('abcdBox').hidden  = MATS[k].id!=='own';
  $('presets').hidden  = MATS[k].id!=='own';
  render();
  try { if (helpOpen || (panel && !panel.hidden)) updateHelp(); } catch(e){}
  try { pushHelpWin(); } catch(e){}
}
function buildDots(){
  const d=$('dots');
  STEPS.forEach((t,k)=>{
    const b=document.createElement('button');
    b.textContent=k; b.title='Step '+k+': '+t;
    b.onclick=()=>goto(k,false);
    d.appendChild(b);
  });
}

/* --- step animation --- */
let anim=null;
function goto(k, animate){
  k = Math.max(0, Math.min(STEPS.length-1, k));
  const forward = k>S.step;
  S.step=k;
  if (animate && forward && k>=1){ S.p=0; startAnim(); } else { S.p=1; render(); }
}
function startAnim(){
  if (anim) cancelAnimationFrame(anim);
  const t0=performance.now(), dur=700;
  const tick=(t)=>{
    const u=Math.min(1,(t-t0)/dur);
    S.p = u<1 ? (1-Math.pow(1-u,3)) : 1;     // ease-out
    redrawOnly();
    if (u<1){ anim=requestAnimationFrame(tick); }
    else { anim=null; render(); if (S.playing) setTimeout(playStep, 650); }
  };
  anim=requestAnimationFrame(tick);
}
function playStep(){
  if (!S.playing) return;
  if (S.step >= STEPS.length-1){ S.playing=false; $('play').textContent='Play all'; render(); return; }
  goto(S.step+1, true);
}

/* --- morph sweep --- */
let morphAnim=null;
function sweepMorph(){
  if (morphAnim) cancelAnimationFrame(morphAnim);
  const t0=performance.now(), dur=1400;
  S.morph=0;
  const tick=(t)=>{
    const u=Math.min(1,(t-t0)/dur);
    S.morph = u;
    $('morph').value = u; $('morphOut').textContent = u>=0.999?'A':fmt(u,2);
    redrawOnly();
    if (u<1) morphAnim=requestAnimationFrame(tick); else { morphAnim=null; render(); }
  };
  morphAnim=requestAnimationFrame(tick);
}

/* --- controls --- */
$('prev').onclick = ()=>{ S.playing=false; $('play').textContent='Play all'; goto(S.step-1,false); };
$('next').onclick = ()=>{ S.playing=false; $('play').textContent='Play all'; goto(S.step+1,true); };
$('play').onclick = ()=>{
  if (S.playing){ S.playing=false; $('play').textContent='Play all'; return; }
  S.playing=true; $('play').textContent='Stop';
  S.step=0; S.p=1; render(); setTimeout(playStep, 450);
};
$('morph').oninput = e=>{
  S.morph=parseFloat(e.target.value);
  $('morphOut').textContent = S.morph>=0.999?'A':fmt(S.morph,2);
  redrawOnly();
};
$('morphOut').onclick = sweepMorph;
$('showGrid').onchange = e=>{ S.showGrid=e.target.checked; redrawOnly(); };
$('showMid').onchange  = e=>{ S.showMid=e.target.checked;  render(); };
$('showLab').onchange  = e=>{ S.showLab=e.target.checked;  redrawOnly(); };
$('theta').oninput = e=>{ S.theta=parseFloat(e.target.value); $('thetaOut').textContent=S.theta+'°'; render(); };
['a','b','c','d'].forEach((nm,k)=>{
  const el=$('e'+nm);
  el.oninput = e=>{ S.own[k]=parseFloat(e.target.value); $('e'+nm+'Out').textContent=fmt(S.own[k]); render(); };

$('thetaPresets').onclick = e=>{

$('presets').onclick = e=>{

  S.own = b.dataset.m.split(',').map(Number);

document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;

/* ================================================================
   floating explanation panel
   ================================================================ */
const HELP_GENERAL = `
<h2>The one fact everything rests on</h2>
<p>A matrix acting on vectors is a <b>linear map</b>: <span class="m">A(u + v) = Au + Av</span> and <span class="m">A(cu) = c Au</span>. Put together, <span class="m">A(c<sub>1</sub>u + c<sub>2</sub>v) = c<sub>1</sub>Au + c<sub>2</sub>Av</span>.</p>
<p>Any vector in the plane is <span class="m">(x, y) = x<b>i</b> + y<b>j</b></span>, so</p>
<p style="text-align:center"><span class="m" style="font-size:16px">A(x, y) = x (A<b>i</b>) + y (A<b>j</b>)</span></p>
<p>Two vectors' worth of information — the images of <span class="m"><b>i</b></span> and <span class="m"><b>j</b></span> — determines the whole transformation of the plane. And those two vectors are sitting right there in the matrix: they are its columns.</p>

<h2>Where each corner of the square goes</h2>
<ul>
<li><span class="m">0 = 0<b>i</b> + 0<b>j</b> &nbsp;→&nbsp; A0 = 0.</span> The origin never moves.</li>
<li><span class="m"><b>i</b> = (1,0) &nbsp;→&nbsp; A<b>i</b> = (a, c)</span>, the <b>first column</b>. Multiplying by (1,0) selects column 1 and discards column 2.</li>
<li><span class="m"><b>j</b> = (0,1) &nbsp;→&nbsp; A<b>j</b> = (b, d)</span>, the <b>second column</b>. Nothing is constructed here — you just read it off and draw an arrow from the origin.</li>
<li><span class="m"><b>i</b>+<b>j</b> = (1,1) &nbsp;→&nbsp; A(<b>i</b>+<b>j</b>) = A<b>i</b> + A<b>j</b></span>, the <b>sum of the two columns</b>.</li>
</ul>
<p>So the answer to "how is <span class="m">A(<b>i</b>+<b>j</b>)</span> drawn?" is: tip to tail. Slide a copy of the arrow <span class="m">A<b>j</b></span> so its tail sits at the tip of <span class="m">A<b>i</b></span>; its new tip is the point. Equivalently slide <span class="m">A<b>i</b></span> to the tip of <span class="m">A<b>j</b></span> — both copies land on the same place, which is precisely why the figure closes up into a parallelogram.</p>

<h2>Why may I join the corners with straight segments?</h2>
<p>Because a linear map takes a straight segment to a straight segment. A point on the edge from <span class="m">u</span> to <span class="m">v</span> is <span class="m">(1−s)u + s v</span> for <span class="m">0 ≤ s ≤ 1</span>, and</p>
<p style="text-align:center"><span class="m" style="font-size:16px">A((1−s)u + s v) = (1−s)Au + s Av</span></p>
<p>which is the point at the very same fraction <span class="m">s</span> along the segment from <span class="m">Au</span> to <span class="m">Av</span>. So the edge fills the segment evenly: the midpoint goes to the midpoint, the quarter point to the quarter point. Nothing bends, nothing bunches up. Once you have the four corner images, the four edges are determined, and the picture is finished.</p>
<p>The same identity explains why opposite sides come out parallel and equal in length (both pairs are copies of <span class="m">A<b>i</b></span> and <span class="m">A<b>j</b></span>) — the image of the unit square is always a parallelogram, never some lopsided quadrilateral.</p>

<h2>Why does the problem give an order?</h2>
<p>The list <span class="m">0 → A<b>i</b> → A(<b>i</b>+<b>j</b>) → A<b>j</b> → 0</span> is the image of the corners <span class="m">0 → <b>i</b> → <b>i</b>+<b>j</b> → <b>j</b> → 0</span>, which walks counterclockwise around the original square. Walking the image in the same order tells you something the shape alone cannot:</p>
<ul>
<li>if the walk is still <b>counterclockwise</b>, <span class="m">det A &gt; 0</span> — the plane was stretched or rotated but not turned over;</li>
<li>if it comes out <b>clockwise</b>, <span class="m">det A &lt; 0</span> — the plane was reflected;</li>
<li><span class="m">|det A|</span> is the area of the image, since the square you started from had area 1.</li>
</ul>
<p>The <span class="m">[0,1;1,0]</span> case is the sharpest illustration: its image is the same unit square you started with, yet the traversal runs backwards. Same picture, different map.</p>

<h2>A worked example, all the way through</h2>
<p>Take <span class="m">A = [2, 1; 1, 3]</span>. Columns: <span class="m">A<b>i</b> = (2,1)</span>, <span class="m">A<b>j</b> = (1,3)</span>. Sum: <span class="m">A(<b>i</b>+<b>j</b>) = (3,4)</span>. Draw <span class="m">(0,0) → (2,1) → (3,4) → (1,3) → (0,0)</span>. Check: <span class="m">det A = 2·3 − 1·1 = 5</span>, so the parallelogram has area 5 and the walk is counterclockwise. The edge midpoints are <span class="m">A(½<b>i</b>+<b>j</b>) = (2, 3.5)</span> and <span class="m">A(<b>i</b>+½<b>j</b>) = (2.5, 2.5)</span> — halfway along the corresponding edges, as promised.</p>

<h2>How to use this app</h2>
<ul>
<li><b>Step 0–6</b> walk the construction; "Play all" runs it automatically, and the arrow keys step through it.</li>
<li>The <b>panel on the right</b> shows the actual arithmetic for the step you are on, with your current matrix's numbers.</li>
<li><b>Slide the square into place</b> drags the picture continuously from the identity to A, so you can see each corner travel from its home to its image. Click the read-out next to the slider to play the sweep.</li>
<li><b>Image of the grid</b> shows what A does to the whole plane, not just the square — the clearest way to see why a shear leaves areas alone.</li>
<li><b>Midpoints</b> adds the two points from Problem 1(c), to confirm that edges fill in evenly.</li>
<li>The last two tabs let you drive θ, or type any matrix you like — including singular ones, where the square is crushed flat.</li>
</ul>
`;

/* ---- the live, matrix-specific half of the explainer ---- */
function helpMatrixHTML(){
  const m=MATS[S.mi], A=curMat(), Ai=colI(A), Aj=colJ(A), Aij=sumC(A), det=detOf(A);
  const li=Math.hypot(Ai[0],Ai[1]), lj=Math.hypot(Aj[0],Aj[1]), dp=Ai[0]*Aj[0]+Ai[1]*Aj[1];
  const flat=Math.abs(det)<1e-9;
  let shape;
  if (flat) shape='a flat segment — the square has been crushed onto a line';
  else if (Math.abs(dp)<1e-6 && Math.abs(li-lj)<1e-6) shape='still a square, of side '+fmt(li,3);
  else if (Math.abs(dp)<1e-6) shape='a rectangle, '+fmt(li,3)+' by '+fmt(lj,3);
  else if (Math.abs(li-lj)<1e-6) shape='a rhombus of side '+fmt(li,3);
  else shape='a general parallelogram';

  let H = '<h2>The matrix you are looking at: '+m.lab+'</h2>'+
    '<div class="calcline">A = '+matHTML(A)+
      (m.id==='rot' ? ' &nbsp;<span class="op">with θ = '+fmt(S.theta,0)+'°, cos θ = '+fmt(Math.cos(S.theta*Math.PI/180),4)+
                      ', sin θ = '+fmt(Math.sin(S.theta*Math.PI/180),4)+'</span>' : '')+
    '</div>'+
    '<p>Here is the entire drawing for these numbers, corner by corner.</p>'+
    '<div class="calcline">'+
      'A0 = (0, 0) <span class="op">— the origin is fixed</span><br>'+
      'A<b>i</b> = column 1 = ('+fmt(A[0])+', '+fmt(A[2])+')<br>'+
      'A<b>j</b> = column 2 = ('+fmt(A[1])+', '+fmt(A[3])+')<br>'+
      'A(<b>i</b>+<b>j</b>) = A<b>i</b> + A<b>j</b> = ('+fmt(A[0])+' + '+fmt(A[1])+', '+fmt(A[2])+' + '+fmt(A[3])+') = ('+fmt(Aij[0])+', '+fmt(Aij[1])+')'+
    '</div>'+
    '<p>So the path to draw is <span class="m">(0,0) → '+V(Ai)+' → '+V(Aij)+' → '+V(Aj)+' → (0,0)</span>, four straight segments.</p>'+
    '<div class="calcline">det A = ad − bc = ('+fmt(A[0])+')('+fmt(A[3])+') − ('+fmt(A[1])+')('+fmt(A[2])+') = <b>'+fmt(det)+'</b></div>'+
    '<ul>'+
      '<li>area of the image = |det A| = <b>'+fmt(Math.abs(det))+'</b> (the square had area 1)</li>'+
      '<li>orientation: '+(flat ? 'undefined — the figure has no interior left'
            : det>0 ? 'the walk stays <b>counterclockwise</b>, so the plane was not flipped'
                    : 'the walk comes out <b>clockwise</b>, so the plane was turned over')+'</li>'+
      '<li>|A<b>i</b>| = '+fmt(li,3)+', &nbsp;|A<b>j</b>| = '+fmt(lj,3)+', &nbsp;A<b>i</b> · A<b>j</b> = '+fmt(dp,3)+
        (Math.abs(dp)<1e-6?' (perpendicular)':' (not perpendicular)')+' → the image is '+shape+'</li>'+
      '<li>edge midpoints: A(½<b>i</b>+<b>j</b>) = '+V(apply(A,[0.5,1]))+', &nbsp;A(<b>i</b>+½<b>j</b>) = '+V(apply(A,[1,0.5]))+'</li>'+
    '</ul>'+
    matrixProse();

  if (m.id==='rot'){
    const r=S.theta*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    H += '<h2>What each entry becomes as θ moves</h2>'+
      '<div class="calcline">a = cos θ = '+fmt(c,4)+' &nbsp;&nbsp; b = −sin θ = '+fmt(-s,4)+'<br>'+
      'c = sin θ = '+fmt(s,4)+' &nbsp;&nbsp; d = cos θ = '+fmt(c,4)+'</div>'+
      '<p>Only two numbers exist in this matrix, <span class="m">cos θ</span> and <span class="m">sin θ</span>, and they are reused four times. As θ grows from 0 to 90°, cos θ falls from 1 to 0 while sin θ rises from 0 to 1, so the orange arrow A<b>i</b> = (cos θ, sin θ) slides around the unit circle from <span class="m"><b>i</b></span> to <span class="m"><b>j</b></span>, dragging the whole square with it. The green arrow A<b>j</b> = (−sin θ, cos θ) is the same vector turned a further 90°, which is why the corner never stops being a right angle.</p>'+
      '<ul>'+
        '<li>currently A<b>i</b> is at '+angTxt(Ai)+' and A<b>j</b> at '+angTxt(Aj)+' — exactly 90° apart, both of length 1;</li>'+
        '<li>the far corner A(<b>i</b>+<b>j</b>) = '+V(Aij)+' has length '+lenTxt(Aij)+' ≈ √2 and sits at '+angTxt(Aij)+', which is θ + 45°: it rides a circle of radius √2;</li>'+
        '<li>det A = cos²θ + sin²θ = '+fmt(c*c,4)+' + '+fmt(s*s,4)+' = 1 at <i>every</i> angle, so no area is ever gained or lost and the orientation never flips;</li>'+
        '<li>θ = 0 gives the identity; θ = 90° gives A<b>i</b> = <b>j</b>, A<b>j</b> = −<b>i</b>; θ = 180° gives A = −I; negative θ turns clockwise.</li>'+
      '</ul>'+
      '<p>Contrast this with <span class="m">[1,0;0,−1]</span>, which also leaves lengths alone but has det = −1. Rotations and reflections both preserve length; only the reflection reverses the walk. That sign is the whole difference between "turned" and "turned over".</p>';
  }
  if (m.id==='own'){
    H += '<h2>Driving it yourself</h2>'+
      '<p>The sliders a and c move only the orange arrow, b and d only the green one; nothing else in the picture can change. Right now <span class="m">A<b>i</b> = '+V(Ai)+'</span> and <span class="m">A<b>j</b> = '+V(Aj)+'</span>.</p>'+
      (flat ? '<p><b>det A = 0.</b> The two columns lie along one line, so the two arrows can no longer reach off that line — the whole plane, square included, is flattened onto it. Nothing can be un-done: many different starting points now share the same image.</p>'
            : '<p>Keep ad − bc fixed while you move the sliders and the area of the figure will not budge, however strange the shape gets. Push the columns towards each other and det A slides towards 0; cross them over and it changes sign, which you will see as the arrowheads reversing direction.</p>');
  }
  return H;
}
function helpHTML(){ return helpMatrixHTML() + HELP_GENERAL; }

updateHelp();

hbtn.onclick = ()=>{ panel.hidden ? openPanel() : closePanel(); };
$('helpX').onclick = closePanel;

}
function pushHelpWin(){

                   helpHTML();

}
$('helpTab').onclick = ()=>{
  const css = '<style>body{font-family:'+"system-ui,-apple-system,'Segoe UI',Arial,sans-serif"+

/* drag */
(function(){
  const head=$('helpHead'); let dx=0,dy=0,drag=false;
  head.addEventListener('pointerdown', e=>{
    if (e.target.classList.contains('ib')) return;
    drag=true; head.setPointerCapture(e.pointerId);
    dx=e.clientX-panel.offsetLeft; dy=e.clientY-panel.offsetTop;
  });
  head.addEventListener('pointermove', e=>{
    if(!drag) return;
    panel.style.left=Math.min(window.innerWidth-60, Math.max(-panel.offsetWidth+70, e.clientX-dx))+'px';
    panel.style.top =Math.min(window.innerHeight-40, Math.max(0, e.clientY-dy))+'px';
  });
  head.addEventListener('pointerup', ()=>{drag=false;});
  const grip=$('helpGrip'); let rz=false, sx=0, sy=0, sw=0, sh=0;
  grip.addEventListener('pointerdown', e=>{
    rz=true; grip.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY; sw=panel.offsetWidth; sh=panel.offsetHeight; e.preventDefault();
  });
  grip.addEventListener('pointermove', e=>{
    if(!rz) return;
    panel.style.width=Math.max(280, sw+e.clientX-sx)+'px';
    panel.style.height=Math.max(180, sh+e.clientY-sy)+'px';
  });
  grip.addEventListener('pointerup', ()=>{rz=false;});
})();

<script>
/* Phone-width safety net, inlined into every explorer by build.py.
   On narrow screens, anything wider than the page (a long equation, a table,
   a fixed-width figure) is shrunk to fit or given its own sideways scroll, so
   the page itself never scrolls horizontally. Does nothing on wide screens. */
(function () {
  var LIMIT = 820, MEDIA = { CANVAS: 1, IMG: 1, VIDEO: 1, svg: 1, IFRAME: 1 };

  function scrollsItself(el) {
    for (var p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      var o = getComputedStyle(p).overflowX;
      if (o === 'auto' || o === 'scroll') return true;
    }
    return false;
  }

  function fix(el, vw, depth) {
    var cs = getComputedStyle(el);
    if (cs.position === 'fixed' || depth > 14) return;
    if (MEDIA[el.tagName]) {
      el.style.maxWidth = '100%';
      if (el.tagName !== 'IFRAME' && !el.style.height) el.style.height = 'auto';
      return;
    }
    if (el.tagName === 'TABLE' || cs.display === 'table') {
      el.style.display = 'block'; el.style.maxWidth = '100%'; el.style.overflowX = 'auto';
      return;
    }
    if (cs.display === 'inline') el.style.display = 'inline-block';
    el.style.minWidth = '0'; el.style.maxWidth = '100%'; el.style.boxSizing = 'border-box';
    var edge = Math.min(el.getBoundingClientRect().right, vw) + 1;
    function tooWide() {
      return [].filter.call(el.children, function (c) {
        var r = c.getBoundingClientRect();
        return r.width && r.right > edge && !c.ownerSVGElement;
      });
    }
    var wide = tooWide();
    if (wide.length && cs.display.indexOf('flex') >= 0 && cs.flexDirection.indexOf('row') === 0 && cs.flexWrap === 'nowrap') {
      el.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
      wide = tooWide();
    }
    if (wide.length && cs.whiteSpace !== 'nowrap') {
      wide.forEach(function (c) { fix(c, vw, depth + 1); });
    }
    if (el.scrollWidth > el.clientWidth + 1) {
      el.style.overflowX = 'auto';
      if (el.style.display === 'inline-block') el.style.verticalAlign = 'bottom';
    }
  }

  function run() {
    var root = document.documentElement, vw = root.clientWidth;
    if (vw > LIMIT || !document.body) return;
    for (var pass = 0; pass < 4 && root.scrollWidth > vw + 1; pass++) {
      var all = document.body.getElementsByTagName('*');
      for (var i = 0; i < all.length; i++) {
        var el = all[i], r = el.getBoundingClientRect();
        if (!r.width || r.right <= vw + 1 || el.ownerSVGElement) continue;
        var p = el.parentElement;
        if (p !== document.body && p.getBoundingClientRect().right > vw + 1) continue; // start at the outermost offender
        if (scrollsItself(el)) continue;
        var ps = getComputedStyle(p);
        if (ps.display.indexOf('flex') >= 0 && ps.flexDirection.indexOf('row') === 0 && ps.flexWrap === 'nowrap') {
          p.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
          if (el.getBoundingClientRect().right <= vw + 1) continue;
        }
        fix(el, vw, 0);
      }
    }
  }

  var timer;
  function soon() { clearTimeout(timer); run(); timer = setTimeout(function () { run(); timer = setTimeout(run, 700); }, 300); }
  window.addEventListener('load', soon);
  window.addEventListener('resize', soon);
  ['click', 'change', 'toggle'].forEach(function (ev) {
    document.addEventListener(ev, function () { setTimeout(soon, 30); }, true);
  });
  if (document.readyState !== 'loading') soon(); else document.addEventListener('DOMContentLoaded', soon);
})();
</script>
