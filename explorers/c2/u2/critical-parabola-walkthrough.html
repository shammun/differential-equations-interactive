</header>
<main>

  </section>

    <div id="expbody"></div>
  </section>
</main>
<script>

const SRC_HTML = (() => {

  document.head.appendChild(l);
}
const R = String.raw;
const $ = id => document.getElementById(id);
const TAU = 2 * Math.PI;

/* ============ parameters shared by all steps ============ */
const P = {
  tr: 2, det: 1, lockPar: false, insFx: 1, insFy: 1,
  x0: 1, v0: 0.5, tt: 0, play: true, ode: 'tb', spd: 1, dtStep: '0.1', tmax: 8, pz: 3, showV: false,

<h2>Where the critical parabola lives</h2>
<p>Every 2×2 matrix is summarised by two numbers:</p>
$$\bA=\begin{bmatrix}a&b\\c&d\end{bmatrix}:\qquad \begin{aligned}\operatorname{tr}\bA&=a+d,\\ \det\bA&=ad-bc.\end{aligned}$$
<p>Plot them as one point $(\Tr,\Det)$, with Tr across and Det up. This is the <b>trace–determinant plane</b> in the figure. The type of phase portrait depends almost entirely on where the point sits.</p>
<details class="qa" open><summary>Five words used on every step (and where each is explained in full)</summary><div>
<ul>
<li><b>The system.</b> $\dot\bx=\bA\bx$ is short for two equations, $\dot x=ax+by$ and $\dot y=cx+dy$. A dot means a derivative with respect to time $t$ (two dots: second derivative). The matrix tells each point $(x,y)$ which way, and how fast, to move.</li>
<li><b>Trajectory and phase portrait.</b> Follow a point as it moves: the curve it traces in the $(x,y)$ plane is a trajectory, and the arrows show the direction of increasing time. A phase portrait is a picture of many trajectories at once (the inset shows one). Each picture in this app is a phase portrait unless it is labelled as a graph against time.</li>
<li><b>Eigenvalue and eigenvector.</b> An eigenvector is a nonzero vector $\bv$ that the matrix only stretches, $\bA\bv=\lambda\bv$; the stretch factor $\lambda$ is the eigenvalue. Example: $\begin{bmatrix}1&2\\0&1\end{bmatrix}\binom10=\binom10$, so $\binom10$ is an eigenvector with $\lambda=1$. Eigenvalues are growth rates: a start on an eigenvector moves as $\exp(\lambda t)\bv$ (step 7 finds them, step 2 reads them).</li>
<li><b>Eigenline.</b> The line through the origin along an eigenvector. Motion on it is straight: outward if $\lambda&gt;0$, inward if $\lambda&lt;0$. The blue lines in the figures are eigenlines.</li>
<li><b>exp.</b> $\exp(\lambda t)$ is the exponential $e^{\lambda t}$, written with “exp” throughout. It doubles every $0.69/\lambda$ time units when $\lambda&gt;0$ and halves that often when $\lambda&lt;0$.</li>
</ul>
<p>Every other term has an entry in the last step, the glossary.</p></div></details>
<h3>The critical parabola is a curve, not a number</h3>
<p>The <span class="pref" data-part="parab">blue curve</span> is $\Det=\Tr^2/4$. Each point on it, for example $(2,1)$ or $(-4,4)$, is a whole family of matrices. All of them have one thing in common: a <b>repeated real eigenvalue</b> $\lambda=\Tr/2$.</p>
<div class="box clar"><b>Reading the textbook line</b>“$\det\bA=(\mathrm{tr}^2)\,\bA/4$” is a typesetting slip. It means $\det\bA=(\operatorname{tr}\bA)^2/4$.</div>
<div class="box ask"><b>Question: what is this critical parabola? Is it a standard value or quantity? How do we get it?</b>
<p>It is <b>not</b> a fixed value. It is a <b>curve</b> in the trace–determinant plane. Every 2×2 matrix sits at one point $(\Tr,\Det)$ of that plane, and the critical parabola is the set of points where the two eigenvalues are equal.</p>
<p><b>How we get it, in four lines.</b></p>
<p>1. Eigenvalues solve $\det(\bA-\lambda\bI)=0$, which for any 2×2 matrix becomes (step 6 shows the algebra)</p>
$$\lambda^2-\Tr\,\lambda+\Det=0.$$
<p>2. The quadratic formula gives</p>
$$\lambda=\frac{\Tr\pm\sqrt{\Tr^2-4\Det}}{2}.$$
<p>3. Everything depends on the sign of the <b>discriminant</b> $\Delta=\Tr^2-4\Det$: if $\Delta&gt;0$ there are two different real eigenvalues, if $\Delta&lt;0$ a complex pair, and if $\Delta=0$ one repeated real eigenvalue $\lambda=\Tr/2$.</p>
<p>4. Setting $\Delta=0$:</p>
$$\Tr^2-4\Det=0\quad\Longrightarrow\quad \Det=\frac{\Tr^2}{4}.$$
<p>With Tr across and Det up, that is an upward-opening parabola through the origin. It is called <i>critical</i> because it is the border between two kinds of behaviour.</p>
<p><b>Worked numbers.</b> Fix $\Tr=4$, so the parabola is at $\Det=16/4=4$. Use the three “Tr = 4” buttons under the figure to visit these points.</p>
<table class="num"><tr><th>Det</th><th>Δ = 16 − 4Det</th><th>eigenvalues</th><th>portrait</th></tr>
<tr><td>3 (below)</td><td>4</td><td>1 and 3</td><td>node</td></tr>
<tr><td>4 (on)</td><td>0</td><td>2, 2</td><td>degenerate or star node</td></tr>
<tr><td>5 (above)</td><td>−4</td><td>2 ± i</td><td>spiral</td></tr></table>
<p>Below the parabola the solutions behave like $\exp(t)$ and $\exp(3t)$: no rotation. Above it they behave like $\exp(2t)\cos t$ and $\exp(2t)\sin t$: rotation. On the parabola the two real eigenvalues have just merged and rotation has not started yet.</p>
<p><b>Two different matrices at the same point.</b> Both $\begin{bmatrix}2&1\\0&2\end{bmatrix}$ and $\begin{bmatrix}2&0\\0&2\end{bmatrix}$ have $\Tr=4$, $\Det=4$. The first has only one eigenline (degenerate node), the second has every direction as an eigenline (star node). Step 7 explains why, and step 6 answers how we know the eigenvalue is repeated.</p></div>
<h3>What it separates</h3>
<p>Step 2 shows <i>how</i> each of these labels is decided from the eigenvalues, with worked numbers, and includes the textbook's own statement for the region below the parabola (its section 5: $\det\bA<(\operatorname{tr}\bA)^2/4$ gives real, distinct eigenvalues).</p>
<ul>
<li><b><span class="pref" data-part="spiral">Above</span></b> the parabola: complex eigenvalues, so trajectories rotate. These are spirals (a centre when Tr = 0).</li>
<li><b><span class="pref" data-part="node">Between</span></b> the parabola and the Tr axis: two different real eigenvalues with the same sign. These are nodes.</li>
<li><b><span class="pref" data-part="saddle">Below</span></b> the Tr axis (Det &lt; 0): real eigenvalues of opposite sign. This is a saddle.</li>
<li><b>On</b> the parabola: the two eigenvalues have merged into one. This section is about exactly this case.</li>
</ul>
<p>The <span class="pref" data-part="inset">inset</span> shows the phase portrait of one matrix at the current point. If it covers something you want to read, drag it by any part of the box to another spot. It uses the <b>companion matrix</b> $\begin{bmatrix}0&1\\-\Det&\Tr\end{bmatrix}$, which step 5 explains. Move the point across the parabola and watch the inset switch between straight-ish node curves and spirals.</p>
<div class="box try"><b>Try it</b>Tick “Lock the point onto the parabola” and slide Tr. You stay on the curve, and the live panel always shows a discriminant of exactly 0.</div>
<p>Step 6 explains <i>why</i> this curve gives a repeated eigenvalue. Step 5 first shows where the companion matrix comes from.</p>`,

<li><b>Teal half-line</b> (Tr = 0, Det &gt; 0): centres, where the spirals neither grow nor shrink.</li>
<li><b>Dark dot</b>: your current $(\Tr,\Det)$. The dashed lines read off its coordinates. When a drag ends close to the parabola, the Det axis or the Tr axis, the point snaps exactly onto it, so landing on the blue curve really gives $\Det=\Tr^2/4$ and a repeated real eigenvalue, not a near miss with two slightly different (or slightly complex) eigenvalues.</li>
<li><b>Inset</b>: the phase portrait of the companion matrix for your point. Blue lines inside it are eigenlines when they exist. Drag the box anywhere on the figure; the dotted grip in its corner marks it as movable.</li>

<h2>The companion matrix is a second-order equation in disguise</h2>
<p>The state vector is $\begin{pmatrix}x\\y\end{pmatrix}$ and the system is $\dot{\bx}=\bA\bx$ with</p>
$$\bA=\begin{bmatrix}0&1\\-\Det&\Tr\end{bmatrix}.$$
<h3>Row by row</h3>
$$\begin{aligned}\dot x &= 0\cdot x + 1\cdot y = y\\ \dot y &= -\Det\,x + \Tr\,y\end{aligned}$$
<p>Row 1 says $y=\dot x$. That is the “via $y=\dot x$” in the textbook. The 0 and 1 in the top row exist only to enforce it. In the figure, every point above the horizontal axis ($y&gt;0$) moves right, because there $\dot x=y&gt;0$.</p>
<h3>Substitute</h3>
<p>If $y=\dot x$ then $\dot y=\ddot x$. Put both into row 2:</p>
$$\ddot x = -\Det\,x + \Tr\,\dot x \quad\Longrightarrow\quad \ddot x - \Tr\,\dot x + \Det\,x = 0.$$
<p>The bottom row holds the coefficients of the ODE with their signs flipped, because $\ddot x$ was moved to the other side.</p>
<h3>Going the other way: from any equation to its matrix</h3>
<p>Given $\ddot x+p\,\dot x+q\,x=0$, match it with $\ddot x-\Tr\,\dot x+\Det\,x=0$: $\Tr=-p$ and $\Det=q$. The <b>Equation</b> menu under the figure does exactly this for ten standard equations, from the textbook point to a spring, a damped spring and a saddle.</p>
<h3>Check the trace and determinant</h3>
$$\begin{aligned}\operatorname{tr}\bA &= 0+\Tr=\Tr,\\ \det\bA &= (0)(\Tr)-(1)(-\Det)=\Det.\end{aligned}$$
<h3>Same characteristic polynomial</h3>
<p>Trying $x=\exp(rt)$ in the ODE gives $r^2-\Tr\,r+\Det=0$. The eigenvalue equation of $\bA$ is $\lambda^2-\Tr\,\lambda+\Det=0$. They are the same polynomial, so the eigenvalues of $\bA$ are exactly the exponents $r$ of the ODE.</p>
<h3>What this means on the parabola</h3>
<p>On the parabola $\Tr=2\lambda$ and $\Det=\lambda^2$, so the equation is</p>
$$\ddot x - 2\lambda\,\dot x + \lambda^2 x = 0,\qquad r^2-2\lambda r+\lambda^2=(r-\lambda)^2=0.$$
<p>The only exponent is $r=\lambda$, so $\exp(\lambda t)$ is one solution and $t\exp(\lambda t)$ is the second. When $\lambda&lt;0$ this is the <b>critically damped</b> oscillator: the border between overdamped (node, no oscillation) and underdamped (spiral, oscillation). The same $t\exp(\lambda t)$ term drives the degenerate node in step 8.</p>
<details class="qa"><summary>Overdamped, critically damped, underdamped: what the words mean</summary><div>
<p>$\ddot x+p\,\dot x+q\,x=0$ with $p,q&gt;0$ describes a mass on a spring ($q$) with friction ($p$). Release it from a stretched position and watch $x(t)$:</p>
<ul>
<li><b>Underdamped</b> (little friction, $p^2&lt;4q$, complex exponents): it swings back and forth, each swing smaller. A spiral sink in the phase plane.</li>
<li><b>Overdamped</b> (much friction, $p^2&gt;4q$, two real exponents): it creeps back to rest without ever crossing zero, slowly, because one exponent is close to 0. A nodal sink.</li>
<li><b>Critically damped</b> ($p^2=4q$, one repeated exponent): the fastest return to rest without oscillating. Exactly on the parabola, and the reason car suspensions are tuned near this case.</li>
</ul>
<p>Since $p=-\Tr$ and $q=\Det$, the condition $p^2=4q$ is $\Det=\Tr^2/4$: the critical parabola again.</p></div></details>

<h2>Why the parabola means a repeated eigenvalue</h2>
<div class="box ask"><b>Question: how do we know that the system has a repeated eigenvalue on the critical parabola?</b>
<p><b>Short answer.</b> The quantity $\Tr^2-4\Det$ is exactly the <b>squared gap between the two eigenvalues</b>, $(\lambda_1-\lambda_2)^2$. On the parabola it equals zero, so the gap is zero and the eigenvalues are equal. Sections 1–4 below prove this, in both directions, and section 5 checks it with numbers. In the figure the two eigenvalues are dots: watch them collide exactly when Det reaches $\Tr^2/4$.</p></div>
<h3>1. The characteristic polynomial</h3>
<p>For $\bA=\begin{bmatrix}a&b\\c&d\end{bmatrix}$, eigenvalues solve $\det(\bA-\lambda\bI)=0$:</p>
$$\begin{aligned}(a-\lambda)(d-\lambda)-bc&=\lambda^2-(a+d)\lambda+(ad-bc)\\&=\lambda^2-\Tr\,\lambda+\Det=0.\end{aligned}$$
<h3>2. Trace = sum, determinant = product</h3>
<p>A quadratic with roots $\lambda_1,\lambda_2$ factors as $(\lambda-\lambda_1)(\lambda-\lambda_2)=\lambda^2-(\lambda_1+\lambda_2)\lambda+\lambda_1\lambda_2$. Matching coefficients:</p>
$$\Tr=\lambda_1+\lambda_2,\qquad \Det=\lambda_1\lambda_2.$$
<h3>3. The discriminant is the squared gap</h3>
$$\begin{aligned}\Tr^2-4\Det&=(\lambda_1+\lambda_2)^2-4\lambda_1\lambda_2\\&=\lambda_1^2+2\lambda_1\lambda_2+\lambda_2^2-4\lambda_1\lambda_2\\&=\lambda_1^2-2\lambda_1\lambda_2+\lambda_2^2\\&=(\lambda_1-\lambda_2)^2.\end{aligned}$$
<div class="box key"><b>The key fact</b>$\Tr^2-4\Det$ measures how far apart the two eigenvalues are. It is zero exactly when they are equal.</div>
<h3>4. Both directions</h3>
<p><b>On the parabola ⇒ repeated.</b> $\Det=\Tr^2/4$ makes $(\lambda_1-\lambda_2)^2=0$, so $\lambda_1=\lambda_2$.</p>
<p><b>Repeated ⇒ on the parabola.</b> If $\lambda_1=\lambda_2=\lambda$, then $\Tr=2\lambda$ and $\Det=\lambda^2=(2\lambda)^2/4=\Tr^2/4$.</p>
<p>A third view: substituting $\Det=\Tr^2/4$ turns the polynomial into a perfect square,</p>
$$\lambda^2-\Tr\,\lambda+\frac{\Tr^2}{4}=\Bigl(\lambda-\frac{\Tr}{2}\Bigr)^2,$$
<p>which has only the root $\lambda=\Tr/2$, counted twice.</p>
<h3>5. Worked numbers (Tr = 6)</h3>
<p>Use the four Tr = 6 buttons under the figure to visit each row.</p>
<table class="num"><tr><th>Det</th><th>roots</th><th>gap</th><th>Tr² − 4Det</th></tr>
<tr><td>5</td><td>1, 5</td><td>4</td><td>16 = 4²</td></tr>
<tr><td>8</td><td>2, 4</td><td>2</td><td>4 = 2²</td></tr>
<tr><td>9</td><td>3, 3</td><td>0</td><td>0</td></tr>
<tr><td>10</td><td>3 ± i</td><td>2i</td><td>−4 = (2i)²</td></tr></table>
<p>Above the parabola, $(\lambda_1-\lambda_2)^2$ would have to be negative. No two <i>real</i> numbers can do that, so the eigenvalues become a complex pair instead (their gap is the imaginary number $2i$ in the last row).</p>
<p>As Det rises towards the parabola the two real eigenvalues slide together, meet at $\Tr/2$, and then leave the real axis as a complex pair. The figure shows this collision.</p>
<div class="box try"><b>Try it</b>Set Tr = 4 and drag Det from −2 up to 7. The amber and teal dots approach each other on the real axis, merge into one blue dot at Det = 4, then split vertically.</div>`,

<li><b>One blue dot</b>: the repeated eigenvalue, which happens only on the parabola.</li>
<li><b>Two magenta dots</b> mirrored above and below the axis: a complex pair.</li>
<li><b>Grey cross</b>: the path the eigenvalues follow when you change only Det. They always stay centred on the dashed line at $\Tr/2$, because their average is $\Tr/2$.</li>
<li><b>Ruler at the bottom</b>: the Det axis at this Tr. The blue tick is the parabola height $\Tr^2/4$. Left of it the eigenvalues are real, right of it they are complex.</li>

<h2>One eigenline or a whole plane of them?</h2>
<p>An <b>eigenvector</b> is a nonzero $\bu$ that $\bA$ only stretches: $\bA\bu=\lambda\bu$. Rearranged:</p>
$$(\bA-\lambda\bI)\bu=\mathbf 0.$$
<p>Each eigenvector gives a straight-line solution $\bx=c\,\exp(\lambda t)\,\bu$. The line through the origin in its direction is called an <b>eigenline</b>. Here $\lambda$ is the one repeated eigenvalue, so the question is: how many directions satisfy this equation?</p>
<h3>Finding the textbook matrix from its solution</h3>
<p>The textbook gives $\bx=c_1\binom10\exp(t)+c_2\bigl[\binom01\exp(t)+\binom20 t\exp(t)\bigr]$ but not $\bA$. We can recover it:</p>
<ul>
<li>The $c_1$ term is a straight-line solution, so $\binom10$ is an eigenvector with $\lambda=1$: $\bA\binom10=\binom10$. That is column 1 of $\bA$.</li>
<li>Substituting the $c_2$ term into $\dot\bx=\bA\bx$ and comparing the $\exp(t)$ parts gives $\bA\binom01=\binom01+\binom20=\binom21$. That is column 2.</li>
</ul>
$$\bA=\begin{bmatrix}1&2\\0&1\end{bmatrix},\qquad \Tr=2,\quad \Det=1=\frac{2^2}{4}.$$
<p>So the textbook system is $\dot x=x+2y,\ \dot y=y$. It sits on the parabola, with $\lambda=1$. The app uses the family $\bA=\begin{bmatrix}\lambda&b\\0&\lambda\end{bmatrix}$, and the textbook case is $\lambda=1,\ b=2$.</p>
<h3>Why there is just one eigenline</h3>
$$\bA-\lambda\bI=\begin{bmatrix}0&b\\0&0\end{bmatrix},\qquad (\bA-\lambda\bI)\begin{pmatrix}u_1\\u_2\end{pmatrix}=\begin{pmatrix}b\,u_2\\0\end{pmatrix}.$$
<p>If $b\neq0$ this is zero only when $u_2=0$. The eigenvectors are exactly the multiples of $\binom10$: one line, the $x$-axis. That is the blue line in the textbook figure.</p>
<p>If $b=0$, then $\bA-\lambda\bI$ is the zero matrix and <i>every</i> $\bu$ works. That is the star node, and it is exactly the case $\bA=\lambda\bI$.</p>
<h3>This is not special to triangular matrices</h3>
<p>Take $\bA=\begin{bmatrix}3&-1\\1&1\end{bmatrix}$: Tr = 4, Det = 4, so $\lambda=2$ (repeated).</p>
$$\bA-2\bI=\begin{bmatrix}1&-1\\1&-1\end{bmatrix}\ \Rightarrow\ u_1-u_2=0\ \Rightarrow\ \bu\parallel\begin{pmatrix}1\\1\end{pmatrix}.$$
<p>Again one eigenline, now the diagonal $y=x$. Switch the matrix menu to see it.</p>
<div class="box key"><b>The general argument</b>Let $\bN=\bA-\lambda\bI$. Because $\lambda$ is an eigenvalue, $\det\bN=0$. If $\bN\neq\mathbf0$, a nonzero 2×2 matrix with zero determinant has rank 1, so the solutions of $\bN\bu=\mathbf0$ form exactly one line. (Rank 1 means the two rows are multiples of each other: $\det\bN=0$ says exactly that. Then the two equations in $\bN\bu=\mathbf0$ are really one equation in two unknowns, and one equation cuts the plane down to a line. For $\bN=\begin{bmatrix}0&b\\0&0\end{bmatrix}$ that one equation is $b\,u_2=0$.) If $\bN=\mathbf0$, that means $\bA=\lambda\bI$ and the whole plane is eigenvectors. There is no third option. This is why the textbook writes “$\bA\neq\lambda\bI$” for the degenerate node and “$\bA=\lambda\bI$” for the star.</div>
<h3>Other matrices to try</h3>
<p>The matrix menu has matrices with <b>two</b> different eigenvalues (two eigenlines, each tested with its own $\lambda$: choose which with “Test which eigenvalue”), a rotation with <b>complex</b> eigenvalues (no real vector keeps its direction, so every image is tilted and there is no eigenline), and the star. Choose <b>Custom</b>, or press “Edit this matrix”, to set the four entries yourself:</p>
$$\bA=\begin{bmatrix}a&b\\c&d\end{bmatrix}\quad\text{with } a \text{ top left},\ b \text{ top right},\ c \text{ bottom left},\ d \text{ bottom right}.$$
<p>Watch the equation on the figure: it always shows where $a,b,c,d$ sit and the eigenvalues they produce. Use “Zoom” if the images $\bA\bu$ grow out of the window.</p>
<h3>How far does A turn a vector?</h3>
<p>Tapping a vector $\bv$ reports the angle it was turned by. The calculation, with the vector $\bv=(3.84,\ 1.73)$ and the matrix $\begin{bmatrix}0.4&2\\-1.15&1\end{bmatrix}$, for which $\bA\bv=(4.996,\ -2.686)$:</p>
<ol>
<li>Direction of $\bv$: $\operatorname{atan2}(1.73,\ 3.84)=24.25^\circ$, measured anticlockwise from the $+x$ axis. atan2 takes the $y$ component first and uses the signs of both components, so it knows which quadrant the arrow points into (step 4 explains atan2).</li>
<li>Direction of $\bA\bv$: $\operatorname{atan2}(-2.686,\ 4.996)=-28.26^\circ$, below the axis.</li>
<li>Subtract: $-28.26^\circ-24.25^\circ=-52.5^\circ$. Negative means clockwise.</li>
<li>If the difference is more than $180^\circ$ either way, add or subtract $360^\circ$: a turn of $300^\circ$ anticlockwise is the same as $60^\circ$ clockwise.</li>
</ol>
<p>A cross-check uses two products. The dot product gives the size of the angle:</p>
$$\cos\theta=\frac{\bv\cdot\bA\bv}{|\bv|\,|\bA\bv|}=\frac{3.84\cdot4.996+1.73\cdot(-2.686)}{4.212\cdot5.672}=0.609,\qquad \theta=52.5^\circ.$$
<p>The 2-D cross product gives the direction:</p>
$$v_x(Av)_y-v_y(Av)_x=3.84\cdot(-2.686)-1.73\cdot4.996=-18.96&lt;0,$$
<p>so the turn is clockwise.</p>
<p>An eigenvector is turned by exactly $0^\circ$ (or $180^\circ$ when $\lambda&lt;0$, which points it backwards along the same line): that is another way to say “A only stretches it”. With complex eigenvalues no direction gets $0^\circ$, which is why there is no eigenline.</p>
<details class="qa"><summary>Why is this called “defective”?</summary><div><p>The eigenvalue is counted twice in the polynomial (algebraic multiplicity 2), but there is only one independent eigenvector (geometric multiplicity 1). The matrix is “missing” an eigenvector, so it cannot be diagonalised. Step 8 shows how the missing straight-line solution is replaced by one containing $t\exp(\lambda t)$.</p></div></details>`,

<h2>Solving the degenerate system</h2>
<p>Write the system $\dot\bx=\bA\bx$ with $\bA=\begin{bmatrix}\lambda&b\\0&\lambda\end{bmatrix}$ as two equations:</p>
$$\dot x=\lambda x+b\,y,\qquad \dot y=\lambda y.$$
<h3>a. The y-equation stands alone</h3>
<p>$\dot y=\lambda y$ is the basic growth/decay equation, so</p>
$$y=\ct{c_2\exp(\lambda t)}.$$
<h3>b. Feed it into the x-equation</h3>
$$\dot x-\lambda x=b\,c_2\exp(\lambda t).$$
<p>Multiply both sides by $\exp(-\lambda t)$. This is called an <b>integrating factor</b>: a factor chosen so that the left side turns into the derivative of a single product. Check it with the product rule, remembering that $\frac{d}{dt}\exp(-\lambda t)=-\lambda\exp(-\lambda t)$:</p>
$$\frac{d}{dt}\bigl[\exp(-\lambda t)\,x\bigr]=\exp(-\lambda t)\,\dot x-\lambda\exp(-\lambda t)\,x=\exp(-\lambda t)(\dot x-\lambda x)=b\,c_2.$$
<p>The right side is a constant. Integrate:</p>
$$\exp(-\lambda t)\,x=c_1+b\,c_2\,t$$
<p>and multiplying back by $\exp(\lambda t)$:</p>
$$x=(\ca{c_1}+\cm{b\,c_2\,t})\exp(\lambda t).$$
<div class="box key"><b>Where the t comes from</b>The $x$-equation is pushed by $b\,c_2\exp(\lambda t)$, a term growing at exactly its own natural rate $\lambda$. That is resonance: after dividing out $\exp(\lambda t)$, what is left grows steadily, at constant speed $b\,c_2$. That gives the factor $t$.</div>
<details class="qa"><summary>Resonance, in everyday terms</summary><div><p>Push a swing at any random rhythm and it jiggles; push it at its own rhythm and each push adds to the last, so the amplitude grows steadily with time. Here the “push” on $x$ is $b\,c_2\exp(\lambda t)$, and $\exp(\lambda t)$ is exactly the rhythm $x$ would follow on its own ($\dot x=\lambda x$). The pushes add up instead of averaging out, and the running total is what the factor $t$ records. The same thing happens in $\ddot x+\omega^2x=\cos(\omega t)$, whose solution contains $t\sin(\omega t)$.</p></div></details>
<h3>c. Vector form</h3>
$$\begin{aligned}\bx=\;&\ca{c_1\begin{pmatrix}1\\0\end{pmatrix}\exp(\lambda t)}\\ &+c_2\Bigl[\ct{\begin{pmatrix}0\\1\end{pmatrix}\exp(\lambda t)}+\cm{\begin{pmatrix}b\\0\end{pmatrix}t\exp(\lambda t)}\Bigr].\end{aligned}$$
<p>With $\lambda=1,\ b=2$ this is exactly the textbook's example solution (they write $\exp(t)$ as $e^t$). At $t=0$ it gives $\bx(0)=(c_1,c_2)$, so $c_1$ and $c_2$ are simply the starting coordinates.</p>
<h3>d. The general recipe (any defective matrix)</h3>
<p>With only one eigenvector $\bv$, you get only one straight-line solution, $\exp(\lambda t)\bv$. The second solution is</p>
$$\bx_2=\exp(\lambda t)\,(\bw+t\,\bv),\qquad\text{where }(\bA-\lambda\bI)\bw=\bv.$$
<p>A vector $\bw$ with $(\bA-\lambda\bI)\bw=\bv$ is called a <b>generalized eigenvector</b>: $\bA-\lambda\bI$ does not kill it, but sends it onto the eigenvector. Any $\bw$ off the eigenline works, because $\bA-\lambda\bI$ maps the whole plane onto the eigenline (step 7's general argument); different choices only shuffle the constants $c_1,c_2$. In the textbook, $\bw=\binom01$ and $(\bA-\bI)\bw=\binom20$: so the recipe's $\bv$ is $\binom20$, the eigenvector $2\binom10$ — exactly the vector that multiplies $t\exp(t)$ in the formula. (Any nonzero multiple of an eigenvector is again an eigenvector; rescaling $\bv$ only rescales the constants.)</p>
<p><b>Check</b> by differentiating with the product rule, and by multiplying by $\bA$ (using $\bA\bv=\lambda\bv$ and $\bA\bw=\lambda\bw+\bv$):</p>
$$\begin{aligned}\dot\bx_2&=\exp(\lambda t)\,(\lambda\bw+\lambda t\bv+\bv)\\ \bA\bx_2&=\exp(\lambda t)\,(\bA\bw+t\bA\bv)\\&=\exp(\lambda t)\,(\lambda\bw+\bv+\lambda t\bv)\end{aligned}$$
<p>They match. (In this check $\bv=(\bA-\lambda\bI)\bw$: for the textbook numbers $\bw=\binom01$ and $\bv=(\bA-\bI)\bw=\binom20$, so $\bA\bw=\lambda\bw+\bv$ is just that relation rearranged.)</p>
<div class="box try"><b>Try it</b>Set $c_2=0$. The magenta piece vanishes and the solution stays on the eigenline ($y=0$ for all time). Set $c_2\neq0$ and the $t\exp(\lambda t)$ piece takes over for large $|t|$.</div>`,

  text: () => R`
<h2>Why the sign of λ decides repelled or attracted</h2>
<p>Every solution is built from only two time functions, $\exp(\lambda t)$ and $t\exp(\lambda t)$:</p>
$$\bx(t)=\exp(\lambda t)\begin{pmatrix}c_1+b\,c_2\,t\\ c_2\end{pmatrix}.$$
<p>So the whole question is what these do as $t\to+\infty$ (far future) and $t\to-\infty$ (far past).</p>
<h3>Case λ &gt; 0 (textbook, λ = 1)</h3>
<table class="num"><tr><th>t</th><th>exp(t)</th><th>t·exp(t)</th></tr>
<tr><td>−10</td><td>0.0000454</td><td>−0.000454</td></tr>
<tr><td>−5</td><td>0.00674</td><td>−0.0337</td></tr>
<tr><td>−2</td><td>0.135</td><td>−0.271</td></tr>
<tr><td>0</td><td>1</td><td>0</td></tr>
<tr><td>2</td><td>7.39</td><td>14.8</td></tr>
<tr><td>5</td><td>148</td><td>742</td></tr></table>
<ul>
<li><b>Far past</b> ($t\to-\infty$): $\exp(t)\to0$. The product $t\exp(t)$ also $\to0$, because the exponential shrinks much faster than $|t|$ grows: going from $t=-10$ to $t=-11$ multiplies $|t|$ by $1.1$ but multiplies $\exp(t)$ by $\exp(-1)\approx0.37$, so the product loses about two thirds of its size with every unit step. (For a formal proof write $t\exp(t)=t/\exp(-t)$ and apply L'Hôpital's rule, which compares the growth rates of numerator and denominator: $1/(-\exp(-t))\to0$.) So $\bx(t)\to\mathbf0$.</li>
<li><b>Far future</b> ($t\to+\infty$): both blow up, so $|\bx(t)|\to\infty$.</li>
</ul>
<p>Every trajectory therefore starts (infinitely long ago) at the origin and runs away to infinity. That is what <b>repelled from (0, 0)</b> means. The origin is a <b>source</b>.</p>
<h3>Case λ &lt; 0</h3>
<p>Everything flips. As $t\to+\infty$, $\exp(\lambda t)\to0$ and $t\exp(\lambda t)\to0$, so $\bx(t)\to\mathbf0$. Every trajectory is <b>attracted to (0, 0)</b>: a <b>sink</b>. Run backwards in time and they blow up instead.</p>
<h3>The distance makes it explicit</h3>
$$|\bx(t)|=\exp(\lambda t)\sqrt{(c_1+b\,c_2t)^2+c_2^2}.$$
<p>The square root grows at most linearly in $|t|$. The exponential factor always wins, so its sign decides everything. It is the same as the one-dimensional equation $\dot x=\lambda x$.</p>
<h3>On the eigenline itself</h3>
<p>If $c_2=0$ then $\bx=c_1\exp(\lambda t)\binom10$: the motion is a straight run along the $x$-axis, outward if $\lambda&gt;0$ and inward if $\lambda&lt;0$. Those are the blue arrows in the textbook figure.</p>
<details class="qa"><summary>Why does the λ &lt; 0 picture look mirrored, not just reversed?</summary><div><p>Reversing time replaces $\bA$ by $-\bA=\begin{bmatrix}-\lambda&-b\\0&-\lambda\end{bmatrix}$. That changes the sign of $b$ too. Changing the sign of $b$ is the same as reflecting $x\to-x$. So the $\lambda&lt;0$ portrait is the $\lambda&gt;0$ portrait reflected left–right with arrows reversed. The hooks bend the other way.</p></div></details>`,

<li><b>Magenta particles</b>: actual points moving under the equation. They stream away from the origin when $\lambda&gt;0$ and into it when $\lambda&lt;0$.</li>
<li><b>Thick magenta curve and dot</b>: the trajectory starting at $(c_1,c_2)$. Tap the figure to move this start point.</li>
</ul>
<p>Drag $\lambda$ through 0. At exactly $\lambda=0$ nothing grows or shrinks: the curves turn into horizontal lines (see step 15).</p>`,

<h2>Tangent at (0, 0), parallel far away</h2>
<h3>1. Only the direction matters</h3>
$$\bx(t)=\exp(\lambda t)\begin{pmatrix}c_1+b\,c_2\,t\\ c_2\end{pmatrix}.$$
<p>The factor $\exp(\lambda t)$ is a positive number: it changes the length of $\bx$ but not its direction. The direction from the origin is set by $\bigl(c_1+b\,c_2t,\;c_2\bigr)$.</p>
<h3>2. Slope of the position</h3>
$$\frac{y}{x}=\frac{c_2}{c_1+b\,c_2\,t}.$$
<p>The top is fixed and the bottom grows linearly in $t$. So as $t\to+\infty$ <i>and</i> as $t\to-\infty$, the slope goes to 0. At both ends of its life the point lines up with the $x$-axis, the eigenline.</p>
<h3>3. Slope of the curve itself</h3>
$$\frac{dy}{dx}=\frac{\dot y}{\dot x}=\frac{\lambda c_2}{\lambda(c_1+b\,c_2t)+b\,c_2}\;\longrightarrow\;0.$$
<p>The tangent direction also flattens to horizontal at both ends.</p>
<h3>4. Which end is which (λ &gt; 0)</h3>
<ul>
<li>$t\to-\infty$ is where $\bx\to\mathbf0$ (step 10). The curve arrives at the origin with slope 0: it is <b>tangent to the eigenline at (0, 0)</b>.</li>

</ul>
<p>For $\lambda&lt;0$ the roles of the two ends swap, which is why the textbook says the same sentence holds for both signs.</p>
<h3>5. The half turn</h3>

<h2>Drawing the figure, layer by layer</h2>
<p>The textbook picture can be drawn with no computer, using only the system $\dot x=\lambda x+by,\ \dot y=\lambda y$. With $\lambda=1,b=2$: $\dot x=x+2y,\ \dot y=y$. Pick a stage box under the figure to add one layer at a time; the stage you are on is highlighted here and promoted in the explanation tabs.</p>
<h3>Stage 1. Axes and the eigenline</h3>
<p>On the $x$-axis $y=0$, so $\dot y=0$ (points stay on the axis) and $\dot x=\lambda x$. Points slide straight along it: outward if $\lambda&gt;0$, inward if $\lambda&lt;0$. That is the blue line with its arrows.</p>
<h3>Stage 2. Velocity arrows</h3>
<p>At any point, $\dot\bx=\bA\bx$ is the direction of motion. Textbook numbers:</p>
<table class="num"><tr><th>point</th><th>(ẋ, ẏ) = (x+2y, y)</th><th>heading</th></tr>

<h3>Stage 3. Where curves are vertical</h3>
<p>Curves are vertical where $\dot x=0$, i.e. $\lambda x+by=0$, the line $y=-\tfrac{\lambda}{b}x$ ($y=-x/2$ in the textbook). In the upper half, to the left of this line, motion is leftward. To the right of it, motion is rightward. The line is where each upper curve reaches its leftmost point.</p>
<h3>Stage 4. Up or down, and symmetry</h3>
<p>$\dot y=\lambda y$: for $\lambda&gt;0$ upper-half points always move up and lower-half points always move down. Since $y=c_2\exp(\lambda t)$ never changes sign, <b>no curve crosses the eigenline</b>.</p>
<p>The system is linear, so if $\bx(t)$ is a solution then so is $-\bx(t)$. The lower half is the upper half rotated 180° about the origin.</p>

<p>Put a small number $\delta$ in the bottom-left corner of the textbook matrix:</p>
$$\bA=\begin{bmatrix}\lambda&b\\ \delta&\lambda\end{bmatrix},\qquad \Tr=2\lambda,\qquad \Det=\lambda^2-b\delta.$$
$$\Tr^2-4\Det=4\lambda^2-4\lambda^2+4b\delta=4b\delta,\qquad \text{eigenvalues } \lambda\pm\sqrt{b\delta}.$$
<p>The trace never changes, so the point moves straight up and down across the parabola:</p>
<ul>
<li>$\delta&gt;0$: below the parabola. Two real eigenvalues $\lambda\pm\sqrt{b\delta}$ give two eigenlines. This is an ordinary <b>node</b>.</li>
<li>$\delta=0$: on the parabola. The two eigenlines have <b>merged</b> into one. This is the degenerate node.</li>
<li>$\delta&lt;0$: above the parabola. The eigenvalues $\lambda\pm i\sqrt{b|\delta|}$ are complex, there are no eigenlines, and the motion is a <b>spiral</b>.</li>
</ul>
<h3>Measure the rotation</h3>
<p>Follow one trajectory over its whole life and add up how much its direction of motion turns:</p>
<ul>
<li><b>Node:</b> less than 180°. It leaves along one eigenline and ends parallel to the other, which is less than a half turn away.</li>
<li><b>Degenerate node:</b> exactly 180°. It leaves heading one way along the single eigenline and ends heading the opposite way along it (step 11).</li>
<li><b>Spiral:</b> without limit. It keeps winding forever around the origin.</li>
</ul>
<p>The degenerate node is the last case that still has a straight-line solution, and its curves turn as far as possible without starting to spiral. That is the meaning of the textbook's sentence “a borderline case between a node and a spiral”.</p>
<div class="box try"><b>Try it</b>Start at δ = 0.3 and watch the two blue eigenlines. Slide δ toward 0: the lines close up like scissors and merge. Continue below 0: they disappear and the curves start to wind. The live panel shows the total turning angle.</div>`,

<h2>The star node: A = λI</h2>
$$\bA=\lambda\bI=\begin{bmatrix}\lambda&0\\0&\lambda\end{bmatrix},\qquad \Tr=2\lambda,\quad \Det=\lambda^2=\frac{\Tr^2}{4}.$$
<p>It sits on the parabola, at the very same point as the degenerate node with the same $\lambda$. The trace–determinant plane cannot tell the two apart. You have to look at the matrix itself.</p>
<h3>Every nonzero vector is an eigenvector</h3>
$$(\bA-\lambda\bI)\bu=\mathbf0\cdot\bu=\mathbf0\quad\text{for every }\bu.$$
<p>The eigenvectors fill the whole plane (2-dimensional), so every line through the origin is an eigenline.</p>
<h3>The equations decouple</h3>
$$\dot x=\lambda x,\qquad \dot y=\lambda y\quad\Longrightarrow\quad x=c_1\exp(\lambda t),\quad y=c_2\exp(\lambda t).$$
<p>That is the general solution in the textbook, $\bx=\exp(\lambda t)\bigl[c_1\binom10+c_2\binom01\bigr]$. Note there is <b>no</b> $t\exp(\lambda t)$ term: two independent eigenvectors give two straight-line solutions, so nothing is missing.</p>
<h3>Why trajectories are rays</h3>
$$\frac{y}{x}=\frac{c_2\exp(\lambda t)}{c_1\exp(\lambda t)}=\frac{c_2}{c_1}\quad\text{(constant).}$$
<p>The direction from the origin never changes, so each trajectory is a straight half-line (a <b>ray</b>) from the origin. Equivalently, $\bx(t)=\exp(\lambda t)\,\bx(0)$ is just the starting point scaled.</p>

<p>$\dot\bx=\lambda\bx$: the velocity is a multiple of the position, so it always points along the ray. Its length is $|\lambda|\,|\bx|$: points far out move fast, points near the origin move slowly.</p>

function parabolaCase(l, b){
  const z = Math.abs(l) < 1e-9, s = Math.abs(b) < 1e-9;
  if (!z && !s) return l > 0 ? 'Degenerate node, repelled (λ > 0)' : 'Degenerate node, attracted (λ < 0)';
  if (!z && s) return l > 0 ? 'Star node, repelled (λ > 0)' : 'Star node, attracted (λ < 0)';
  if (z && !s) return 'λ = 0 with one eigenline: a line of fixed points, parallel straight-line motion';
  return 'λ = 0 and A = 0: every point is fixed';
}

<h2>Every case on the parabola</h2>
<p>The family $\bA=\begin{bmatrix}\lambda&b\\0&\lambda\end{bmatrix}$ covers every behaviour that can happen on the critical parabola. Every matrix with a repeated eigenvalue can be turned into one of these by a change of coordinates.</p>
<details class="qa"><summary>What “a change of coordinates” means here</summary><div><p>Take the eigenvector $\bv$ as the new first axis and a generalized eigenvector $\bw$ (step 8) as the new second axis. A point is then described by how much of $\bv$ and how much of $\bw$ it contains. In those coordinates the matrix sends $\bv\mapsto\lambda\bv$ and $\bw\mapsto\lambda\bw+\bv$, which is exactly $\begin{bmatrix}\lambda&1\\0&\lambda\end{bmatrix}$ (scaling $\bw$ changes the 1 into any $b$). This is the <i>Jordan form</i> of the matrix. The picture is only skewed, never changed in kind: hooked curves stay hooked, so every degenerate node looks like the textbook one seen from a slanted angle. Step 7's example $\begin{bmatrix}3&-1\\1&1\end{bmatrix}$ is the textbook matrix viewed with the axis $y=x$ as its eigenline.</p></div></details>

    const r1 = E.l1, r2 = E.l2, C1 = (r2 * x0 - v0) / (r2 - r1), C2 = (v0 - r1 * x0) / (r2 - r1);
    h += C.ln(R`x(t) = C_1\exp(r_1t) + C_2\exp(r_2t)`, 'two different exponents: r₁ = ' + ft(r1, 3) + ', r₂ = ' + ft(r2, 3));
    h += C.ln(R`\begin{aligned}C_1 &= \frac{r_2x_0-\dot x_0}{r_2-r_1} = ${f(C1, 3)}\\ C_2 &= \frac{\dot x_0-r_1x_0}{r_2-r_1} = ${f(C2, 3)}\end{aligned}`, 'chosen so that x(0) and ẋ(0) match the start');
    xt = C1 * Math.exp(r1 * t) + C2 * Math.exp(r2 * t);
  } else if (E.type === 'rep'){
    const r = E.l;
    h += C.ln(R`\begin{aligned}x(t) &= \bigl(x_0 + (\dot x_0 - r x_0)\,t\bigr)\exp(rt)\\ &= \bigl(${f(x0, 3)} ${sg(v0 - r * x0, 3)}\,t\bigr)\exp(${f(r, 3)}t)\end{aligned}`, 'repeated exponent r = ' + ft(r, 3) + ': the second solution is t·exp(rt)');
    xt = (x0 + (v0 - r * x0) * t) * Math.exp(r * t);
  } else {
    const a = E.re, b = E.im;
    h += C.ln(R`x(t) = \exp(${f(a, 3)}t)\Bigl(${f(x0, 3)}\cos(${f(b, 3)}t) + ${f((v0 - a * x0) / b, 3)}\sin(${f(b, 3)}t)\Bigr)`, 'complex exponents ' + ft(a, 3) + ' ± ' + ft(b, 3) + 'i: oscillation inside an exponential envelope');
    xt = Math.exp(a * t) * (x0 * Math.cos(b * t) + (v0 - a * x0) / b * Math.sin(b * t));
  }
  if (t !== undefined) h += C.ln(R`x(${f(t)}) = ${f(xt, 4)}`);
  return h;
}

/* ---------- 1. trace-determinant map ---------- */
function regionCalc(kind){
  const T = P.tr, D = P.det, E = eig(compA()), inR = {spiral: E.disc < -1e-9, node: E.disc > 1e-9 && D > 1e-9, saddle: D < -1e-9, centre: Math.abs(T) < 1e-9 && D > 1e-9}[kind];
  const cond = {spiral: R`\Delta = \Tr^2 - 4\Det < 0 \iff \Det > \tfrac{\Tr^2}{4}`, node: R`\Delta > 0 \text{ and } \Det = \lambda_1\lambda_2 > 0`, saddle: R`\Det = \lambda_1\lambda_2 < 0`, centre: R`\Tr = 0,\ \Det > 0:\ \lambda = \pm i\sqrt{\Det}`}[kind];
  const ex = {spiral: R`\Tr = 2,\ \Det = 2:\ \lambda = 1 \pm i`, node: R`\Tr = 3,\ \Det = 2:\ \lambda = 1,\ 2`, saddle: R`\Tr = 1,\ \Det = -2:\ \lambda = -1,\ 2`, centre: R`\Det = 4:\ \lambda = \pm 2i \ (\ddot x + 4x = 0)`}[kind];
  return C.ln(cond, 'the condition that defines this region') + C.ln(ex, 'an example') +
    C.ln(R`\text{your point: }\Delta = ${f(E.disc, 3)},\ \Det = ${f(D)}`) + C.res(inR ? 'Your point <b>is</b> in this region.' : 'Your point is <b>not</b> in this region.', !inR) +
    C.p('Tap any spot of the plane to analyse that exact (Tr, Det).');
}
Object.assign(STEPS[0], {
  explain: () => R`<p>Every point of this plane stands for all 2×2 matrices with that trace (across) and determinant (up).</p>` + TAPHINT,
  parts(){
    return [
      {id: 'point', name: 'Your point (Tr, Det)', col: COL.ink, short: 'drag it anywhere on the plane.', detail: () => tdCalc(P.tr, P.det, 'your point')},
      {id: 'parab', name: 'Critical parabola', col: COL.blue, short: 'the curve $\\Det=\\Tr^2/4$, where the two eigenvalues are equal. Tap it to analyse one point on it.',
        detail: () => { const T = P.tr, par = T * T / 4; return C.ln(R`\Det = \frac{\Tr^2}{4}`, 'the whole curve') + C.ln(R`\text{at your }\Tr = ${f(T)}:\ \frac{\Tr^2}{4} = ${f(par, 3)}`) + C.ln(R`\lambda^2 ${sg(-T)}\,\lambda + ${f(par, 3)} = \bigl(\lambda ${sg(-T / 2, 3)}\bigr)^2`, 'on the curve the polynomial is a perfect square, so λ = Tr/2 is repeated') + C.ln(R`\Det - \frac{\Tr^2}{4} = ${f(P.det - par, 3)}`, 'your point relative to the curve'); }},
      {id: 'spiral', name: 'Spiral region (violet)', col: '#7d8fd9', short: 'above the parabola: complex eigenvalues, so trajectories rotate.', detail: () => regionCalc('spiral')},
      {id: 'node', name: 'Node region (amber)', col: '#d6a03c', short: 'between the parabola and the Tr axis: two different real eigenvalues of the same sign.', detail: () => regionCalc('node')},
      {id: 'saddle', name: 'Saddle region (grey)', col: '#9aa1ad', short: 'Det < 0: real eigenvalues of opposite sign.', detail: () => regionCalc('saddle')},
      {id: 'centre', name: 'Centres (teal half-line)', col: COL.teal, short: 'Tr = 0, Det > 0: closed orbits. Tap it to analyse one point on it.', detail: () => regionCalc('centre')},
      {id: 'inset', name: 'Companion-matrix portrait', col: '#5a6373', short: 'the phase portrait of one matrix at your point. Drag the box to move it; tap a curve inside it to analyse that curve.',
        detail: () => { const A = compA(), E = eig(A), L = eigenlines(A); return C.ln(R`\bA = ${mat(0, 1, -P.det, P.tr)}`) + C.ln(eigTex(E, 3)) + (L !== 'all' && L.length ? C.ln(L.map(e => R`\lambda=${f(e.l, 3)}:\ (1,\ ${f(e.l, 3)})`).join(R`,\quad `), 'eigenline directions: for a companion matrix they are (1, λ)') : '') + C.res('<span class="tag">' + esc(regionName(P.tr, P.det)) + '</span>'); }},
      {id: 'icurve', name: 'Curves in the inset', col: '#444', short: 'trajectories of the companion matrix.', detail: () => groupNote('curve')}
    ];
  },
  probe(X, Y){
    const q = this._ins, iv = this._iv, v = this._v;
    if (q && X >= q.x0 && X <= q.x0 + q.s && Y >= q.y0 && Y <= q.y0 + q.s){ if (!iv || Y < iv.y0) return null; return {kind: 'traj', panel: 'inset', x: rnd2(iv.ix(X)), y: rnd2(iv.iy(Y))}; }
    if (!v) return null;
    let tr = rnd2(v.ix(X)), det = rnd2(v.iy(Y)), on = false;
    if (Math.abs(Y - v.Y(tr * tr / 4)) < 9){ det = tr * tr / 4; on = true; }
    else if (Math.abs(X - v.X(0)) < 7 && det > 0) tr = 0;
    else if (Math.abs(Y - v.Y(0)) < 6) det = 0;
    return {kind: 'td', panel: 'main', tr, det, on};
  },
  probeInfo(pr){
    if (pr.kind === 'traj') return {title: 'Trajectory through ' + '(' + ft(pr.x) + ', ' + ft(pr.y) + ') in the inset', html: trajCalc(compA(), [pr.x, pr.y], {startWhy: 'the tapped point of the inset: (x, ẋ) at t = 0'}) + C.p('The inset uses the companion matrix of your point, so its first component is a solution of $\\ddot x-\\Tr\\,\\dot x+\\Det\\,x=0$.')};
    return {title: 'Point (Tr, Det) = (' + ft(pr.tr) + ', ' + ft(pr.det, pr.on ? 4 : 2) + ')' + (pr.on ? ' on the parabola' : ''), html: tdCalc(pr.tr, pr.det, pr.on ? 'snapped onto the critical parabola' : 'the tapped point of the plane')};
  }
});

/* ---------- 2. companion matrix ---------- */
Object.assign(STEPS[1], {
  explain: () => R`<p>The same motion is drawn twice: as a path in the phase plane and as an ordinary graph of $x$ against time.</p>` + TAPHINT,
  parts(){
    const A = compA(), q = app(mexp(A, P.tt), [P.x0, P.v0]), d = app(A, q), L = eigenlines(A);
    const out = [
      {id: 'traj', name: 'Your trajectory', col: COL.mag, short: 'the path of $(x,\\dot x)$ from your start. Solid = already travelled, dashed = still to come.',

      {id: 'start', name: 'Start point', col: '#555', short: 'the initial condition $(x(0),\\dot x(0))$.', detail: () => C.ln(R`x(0) = ${f(P.x0)},\qquad \dot x(0) = y(0) = ${f(P.v0)}`) + C.p('Move it with the sliders, by dragging it, or by tapping the phase plane with Inspect parts off.')},
      {id: 'dot', name: 'State at time t', col: COL.mag, short: 'where the motion is now, in both panels.',

      {id: 'vel', name: 'Velocity arrow', col: COL.ink, short: 'the direction $\\mathbf A\\mathbf x$ the state is moving.',
        detail: () => C.ln(R`\dot x = 0\cdot(${f(q[0], 3)}) + 1\cdot(${f(q[1], 3)}) = ${f(d[0], 3)}`, 'row 1: equals y') + C.ln(R`\dot y = -(${f(P.det)})(${f(q[0], 3)}) + (${f(P.tr)})(${f(q[1], 3)}) = ${f(d[1], 3)}`, 'row 2: this is ẍ')},
      {id: 'xt', name: 'x(t) graph', col: COL.mag, short: 'the ordinary solution curve of the second-order equation.', detail: () => odeSolCalc(P.tr, P.det, P.x0, P.v0, P.tt)},
      {id: 'cursor', name: 'Time cursor', col: '#6b7280', short: 'the current time; tap or drag on the x(t) panel to move it.', detail: () => C.ln(R`t = ${f(P.tt)},\quad \text{step} = ${P.dtStep},\quad t + \text{step} = ${f(P.tt + parseFloat(P.dtStep))}`)}
    ];
    if (P.showV) out.push({id: 'vt', name: 'ẋ(t) graph', col: COL.teal, short: 'the velocity $\\dot x=y$ against time (dashed).', detail: () => C.ln(R`\dot x(${f(P.tt)}) = ${f(q[1], 4)}`)});
    if (L !== 'all' && L.length) out.push({id: 'eig', name: L.length === 1 ? 'Eigenline' : 'Eigenlines', col: COL.blue, short: 'straight-line solutions, along $(1,\\lambda)$.',
      detail: k => { const ls = k === null ? L : [L[+k] || L[0]]; return ls.map(e => C.ln(R`\bA\begin{pmatrix}1\\ ${f(e.l, 3)}\end{pmatrix} = \begin{pmatrix}${f(e.l, 3)}\\ ${f(-P.det + P.tr * e.l, 3)}\end{pmatrix} = ${f(e.l, 3)}\begin{pmatrix}1\\ ${f(e.l, 3)}\end{pmatrix}`, 'λ = ' + ft(e.l, 3) + ': because λ² = Tr·λ − Det, the vector (1, λ) is only stretched')).join('') + C.p('A start on this line gives $x(t)=x_0\\exp(\\lambda t)$: pure exponential, no turning.'); }});
    if (Math.max(...A.map(Math.abs)) > 1e-9) out.push({id: 'others', name: 'Other trajectories', col: '#9aa1ad', short: 'what other starting points would do.', detail: () => groupNote('trajectory')});
    return out;
  },
  probe(X, Y){
    const a = this._pv, b = this._tv;
    if (a && X >= a.x0 && X <= a.x0 + a.W && Y >= a.y0 && Y <= a.y0 + a.H) return {kind: 'traj', panel: 'phase', x: rnd2(a.ix(X)), y: rnd2(a.iy(Y))};
    if (b && X >= b.x0 && X <= b.x0 + b.W && Y >= b.y0 && Y <= b.y0 + b.H) return {kind: 'time', panel: 'xt', t: clamp(rnd2(b.ix(X)), 0, P.tmax)};
    return null;
  },
  probeInfo(pr){
    const A = compA();
    if (pr.kind === 'traj') return {title: 'Trajectory through (' + ft(pr.x) + ', ' + ft(pr.y) + ')', html: trajCalc(A, [pr.x, pr.y], {startWhy: 'the tapped point: x(0) = ' + ft(pr.x) + ', ẋ(0) = ' + ft(pr.y)}) + C.p('As a solution of the equation (its x(t) is the orange dashed curve in the x(t) panel):') + odeSolCalc(P.tr, P.det, pr.x, pr.y)};
    const q = app(mexp(A, pr.t), [P.x0, P.v0]), d = app(A, q), res = d[1] - P.tr * d[0] + P.det * q[0];
    return {title: 'Your trajectory at time t = ' + ft(pr.t), html: C.ln(R`x(${f(pr.t)}) = ${f(q[0], 4)},\qquad \dot x(${f(pr.t)}) = ${f(q[1], 4)}`) + C.ln(R`\ddot x = -\Det\,x + \Tr\,\dot x = -(${f(P.det)})(${f(q[0], 4)}) + (${f(P.tr)})(${f(q[1], 4)}) = ${f(d[1], 4)}`, 'row 2 of the matrix') + C.ln(R`\ddot x - \Tr\,\dot x + \Det\,x = ${f(Math.abs(res) < 5e-5 ? 0 : res, 4)}`, 'the equation holds at this moment too') + C.p('The same moment is ringed in orange on the phase plane.')};
  }
});

/* ---------- 3. eigenvalues collide ---------- */
Object.assign(STEPS[2], {
  explain: () => R`<p>The plane is the complex plane: real part across, imaginary part up. The dots are the two eigenvalues of any matrix with your $(\Tr,\Det)$.</p>` + TAPHINT,
  parts(){
    const E = eig(compA()), T = P.tr, D = P.det, out = [];
    const chk = l => C.ln(R`\lambda^2 - \Tr\,\lambda + \Det = (${f(l, 3)})^2 - (${f(T)})(${f(l, 3)}) + ${f(D)} = ${f(Math.abs(l * l - T * l + D) < 5e-6 ? 0 : l * l - T * l + D, 4)}`, 'plugging it back in gives zero');
    if (E.type === 'real'){
      out.push({id: 'l1', name: 'λ₁ (amber dot)', col: COL.amb, short: 'the smaller real eigenvalue.', detail: () => C.ln(R`\lambda_1 = \frac{\Tr - \sqrt\Delta}{2} = \frac{${f(T)} - ${f(Math.sqrt(E.disc), 3)}}{2} = ${f(E.l1, 3)}`) + chk(E.l1)});
      out.push({id: 'l2', name: 'λ₂ (teal dot)', col: COL.teal, short: 'the larger real eigenvalue.', detail: () => C.ln(R`\lambda_2 = \frac{\Tr + \sqrt\Delta}{2} = \frac{${f(T)} + ${f(Math.sqrt(E.disc), 3)}}{2} = ${f(E.l2, 3)}`) + chk(E.l2)});
      out.push({id: 'gap', name: 'Gap bracket', col: COL.ink, short: 'the distance between the eigenvalues, $\\sqrt\\Delta$.', detail: () => C.ln(R`\lambda_2 - \lambda_1 = ${f(E.l2 - E.l1, 3)}`) + C.ln(R`(\lambda_2-\lambda_1)^2 = ${f((E.l2 - E.l1) ** 2, 3)} = \Tr^2 - 4\Det = ${f(E.disc, 3)}`, 'the squared gap is the discriminant')});
    } else if (E.type === 'rep'){
      out.push({id: 'lrep', name: 'Repeated eigenvalue (blue dot)', col: COL.blue, short: 'both eigenvalues in one place: you are on the parabola.', detail: () => C.ln(R`\lambda^2 ${sg(-T)}\,\lambda ${sg(D, 3)} = \bigl(\lambda ${sg(-T / 2, 3)}\bigr)^2`, 'a perfect square') + C.ln(R`\lambda_1 = \lambda_2 = \frac{\Tr}{2} = ${f(E.l, 3)},\quad (\lambda_1 - \lambda_2)^2 = 0 = \Delta`)});
    } else {
      out.push({id: 'lc', name: 'Complex pair (magenta dots)', col: COL.mag, short: 'mirror images above and below the real axis.', detail: k => C.ln(R`\lambda = ${f(E.re, 3)} ${k === '1' ? '-' : '+'} ${f(E.im, 3)}\,i`, k === null ? 'the pair' : (k === '1' ? 'the lower dot' : 'the upper dot')) + C.ln(R`\lambda_1+\lambda_2 = 2(${f(E.re, 3)}) = ${f(2 * E.re, 3)} = \Tr`) + C.ln(R`\lambda_1\lambda_2 = (${f(E.re, 3)})^2 + (${f(E.im, 3)})^2 = ${f(E.re * E.re + E.im * E.im, 3)} = \Det`) + C.ln(R`(\lambda_1-\lambda_2)^2 = (${f(2 * E.im, 3)}\,i)^2 = ${f(-4 * E.im * E.im, 3)} = \Delta`, 'negative: no real gap could do this')});
    }
    out.push({id: 'cross', name: 'Eigenvalue path (grey cross)', col: '#b9bfc9', short: 'where the eigenvalues travel when only Det changes.',
      detail: k => (k !== '1' ? C.ln(R`\Det < ${f(T * T / 4, 3)}:\ \lambda = ${f(T / 2, 3)} \pm \sqrt{${f(T * T / 4, 3)} - \Det}`, 'horizontal arm: two real eigenvalues, symmetric about Tr/2') : '') + (k !== '0' ? C.ln(R`\Det > ${f(T * T / 4, 3)}:\ \lambda = ${f(T / 2, 3)} \pm i\sqrt{\Det - ${f(T * T / 4, 3)}}`, 'vertical arm: a complex pair') : '') + C.p('Tap any spot of the plane to see which Det puts an eigenvalue there.')});
    out.push({id: 'mid', name: 'Centre line Tr/2', col: '#7b8290', short: 'the average of the eigenvalues; it does not move when Det changes.', detail: () => C.ln(R`\frac{\lambda_1+\lambda_2}{2} = \frac{\Tr}{2} = ${f(T / 2, 3)}`)});
    out.push({id: 'ruler', name: 'Det ruler', col: '#5a6373', short: 'the Det axis at this Tr. Tap it to try a Det value.', detail: () => C.ln(R`\text{your }\Det = ${f(D)},\qquad \frac{\Tr^2}{4} = ${f(T * T / 4, 3)}`) + C.ln(R`\Det - \frac{\Tr^2}{4} = ${f(D - T * T / 4, 3)}`, D > T * T / 4 + 1e-9 ? 'right of the blue tick: complex pair' : D < T * T / 4 - 1e-9 ? 'left of the blue tick: two real eigenvalues' : 'on the tick: repeated')});
    return out;
  },
  probe(X, Y){
    const r = this._ruler, v = this._v;
    if (r && Y >= r.top && Y <= r.top + r.h) return {kind: 'detv', det: rnd2(clamp(r.dmin + (X - r.x0) / r.W * (r.dmax - r.dmin), r.dmin, r.dmax))};
    if (!v) return null;
    let re = rnd2(v.ix(X)), im = rnd2(Math.abs(v.iy(Y)));
    if (Math.abs(Y - v.Y(0)) < 7) im = 0;
    if (Math.abs(X - v.X(P.tr / 2)) < 6) re = P.tr / 2;
    return {kind: 'lam', re, im};
  },
  probeInfo(pr){
    const T = P.tr;
    if (pr.kind === 'detv') return {title: 'Det = ' + ft(pr.det) + ' on the ruler', html: tdCalc(T, pr.det, 'your Tr with the tapped Det') + C.p('The orange rings in the plane are the eigenvalues for this Det.')};
    if (!pr.im){
      const a = pr.re, D = T * a - a * a, o = T - a;
      return {title: 'Real eigenvalue λ = ' + ft(a, 3), html: C.ln(R`\lambda^2 - ${f(T)}\,\lambda + \Det = 0 \ \text{ at }\ \lambda = ${f(a, 3)}`, 'when is the tapped number an eigenvalue for your Tr? Solve for Det') + C.ln(R`\begin{aligned}\Det &= \Tr\,\lambda - \lambda^2\\ &= (${f(T)})(${f(a, 3)}) - (${f(a, 3)})^2 = ${f(D, 3)}\end{aligned}`) + C.ln(R`\text{partner eigenvalue} = \Tr - \lambda = ${f(o, 3)}`, 'because the two eigenvalues add up to Tr (dashed ring)') + C.ln(R`\lambda_1\lambda_2 = (${f(a, 3)})(${f(o, 3)}) = ${f(a * o, 3)} = \Det\ \checkmark`) + C.res(Math.abs(a - T / 2) < 1e-9 ? 'This is the middle, λ = Tr/2: the partner is the same number, so this Det = Tr²/4 is on the critical parabola.' : 'It is not in the middle, so the two eigenvalues differ: this Det is below the parabola.')};
    }
    const a = pr.re, b = pr.im;
    return {title: 'Complex pair λ = ' + ft(a, 3) + ' ± ' + ft(b, 3) + 'i', html: C.ln(R`\lambda = ${f(a, 3)} \pm ${f(b, 3)}\,i`, 'complex eigenvalues always come with their mirror image') + C.ln(R`\Tr = \lambda_1 + \lambda_2 = ${f(2 * a, 3)},\qquad \Det = \lambda_1\lambda_2 = ${f(a * a + b * b, 3)}`, 'the matrix with these eigenvalues') + C.ln(R`\Det - \frac{\Tr^2}{4} = ${f(a * a + b * b, 3)} - ${f(a * a, 3)} = ${f(b * b, 3)} > 0`, 'always above the parabola, by exactly b²') + C.res(Math.abs(2 * a - T) < 1e-9 ? 'This pair is reachable with your Tr: set Det = ' + ft(a * a + b * b, 3) + '.' : 'Your Tr is ' + ft(T) + ', so this pair needs Tr = ' + ft(2 * a, 3) + ' instead.', Math.abs(2 * a - T) >= 1e-9)};
  }
});

/* ---------- 4. eigenlines ---------- */
Object.assign(STEPS[3], {

    if (E === 'all') out.push({id: 'eig', name: 'Every direction (blue tint)', col: COL.blue, short: 'the matrix is λI and every vector is an eigenvector.', detail: () => C.ln(R`\bA - \lambda\bI = ${mat(0, 0, 0, 0)}\ \Rightarrow\ (\bA-\lambda\bI)\bv = \mathbf 0 \text{ for every } \bv`, '2-dimensional eigenspace: the star node')});
    else if (E.length) out.push({id: 'eig', name: E.length === 1 ? 'Eigenline (thick blue)' : 'Two eigenlines (thick blue)', col: COL.blue, short: E.length === 1 ? 'the only line of eigenvectors.' : 'one line for each eigenvalue.',
      detail: k => (k === null ? E : [E[+k] || E[0]]).map(e => { const N = [A[0] - e.l, A[1], A[2], A[3] - e.l]; return C.ln(R`\lambda = ${f(e.l, 3)}:\ (\bA-\lambda\bI)\bv = ${mat(N[0], N[1], N[2], N[3], 3)}\begin{pmatrix}v_1\\ v_2\end{pmatrix} = \mathbf 0 \ \Rightarrow\ \bv \parallel ${vtx(e.v, 3)}`, 'solve N v = 0: its rows are proportional, so one equation remains'); }).join('')});
    else out.push({id: 'noeig', name: 'No eigenline', col: COL.mag, nohit: true, short: 'complex eigenvalues: every direction is turned.', detail: () => { const Eg = eig(A); return C.ln(R`\lambda = ${f(Eg.re, 3)} \pm ${f(Eg.im, 3)}\,i`, 'no real root, so no real vector v with Av = λv') + C.p('All 24 images are orange: none is parallel to its u.'); }});
    out.push({id: 'dir', name: 'The 24 test directions', col: '#9aa1ad', short: 'each grey u with its image. Tap one in the figure to test it.', detail: k => { if (k === null) return groupNote('direction') + C.ln(R`\text{eigen directions found: } ${dirs.length ? dirs.map(d => d + '^\\circ').join(',\\ ') : '\\text{none}'}`); const b = +k * TAU / 24, w = [Math.cos(b), Math.sin(b)]; return C.ln(R`\text{direction } ${+k * 15}^\circ:\ \bu = ${vtx(w, 3)}`) + vecCalc(A, l, w); }});
    out.push({id: 'imgE', name: 'Blue images', col: COL.blue, short: 'images that point along their u: those u are eigenvectors.', detail: () => C.ln(R`${dirs.length ? dirs.map(d => d + '^\\circ').join(',\\ ') : '\\text{none}'}`, 'the directions that pass the test')});
    if (E !== 'all') out.push({id: 'img', name: 'Orange images', col: COL.org, short: 'images that point somewhere else: those u are not eigenvectors.', detail: () => C.p('All the other ' + (24 - dirs.length) + ' directions. ' + (P.mat === 'tri' && P.b > 0 ? 'Each image is λu pushed sideways by $b\\,u_2$.' : ''))});
    out.push({id: 'grey', name: 'Unit vectors (grey)', col: '#9aa1ad', short: 'the 24 test directions on the unit circle.', detail: () => C.p('Every 15°. Tap one in the figure to see its full test.')});
    return out;
  },
  probe(X, Y){ const v = this._v; if (!v) return null; const x = rnd2(v.ix(X)), y = rnd2(v.iy(Y)); return Math.hypot(x, y) < 0.03 ? null : {kind: 'vec', x, y}; },
  probeInfo(pr){ return {title: 'Vector v = (' + ft(pr.x) + ', ' + ft(pr.y) + ')', html: vecCalc(ringA(), ringLam(), [pr.x, pr.y])}; }
});

/* ---------- 5. solving ---------- */
function pieces5(t){
  const s = triSol(t), a = P.c1 * s.e, m = P.b * P.c2 * s.te;
  return C.ln(R`\exp(\lambda t) = \exp\bigl(${f(P.lam)}\cdot(${f(t)})\bigr) = ${f(s.e, 4)}`) + C.ln(R`t\exp(\lambda t) = (${f(t)})(${f(s.e, 4)}) = ${f(s.te, 4)}`) +
    C.ln(R`\ca{c_1\exp(\lambda t)} = (${f(P.c1)})(${f(s.e, 4)}) = ${f(a, 4)}`, 'amber piece') +
    C.ln(R`\cm{b\,c_2\,t\exp(\lambda t)} = (${f(P.b)})(${f(P.c2)})(${f(s.te, 4)}) = ${f(m, 4)}`, 'magenta piece') +
    C.ln(R`x(${f(t)}) = ${f(a, 4)} ${sg(m, 4)} = ${f(s.x, 4)}`, 'their sum') + C.ln(R`y(${f(t)}) = \ct{c_2\exp(\lambda t)} = ${f(s.y, 4)}`) +
    C.ln(R`\begin{aligned}\dot x &= ${f(s.dx, 4)}\\ \lambda x + b y &= ${f(P.lam * s.x + P.b * s.y, 4)}\end{aligned}`, 'derivative check: the two agree, so it solves the system');
}
Object.assign(STEPS[4], {
  explain: () => R`<p>Top panel: $x(t)$ and its two pieces. Bottom panel: $y(t)$. Time runs left to right.</p>` + TAPHINT,
  parts(){
    const ts = tStar(), out = [
      {id: 'amb', name: 'c₁·exp(λt) (amber dashed)', col: COL.amb, short: 'the eigenvector piece of x.', detail: () => C.ln(R`c_1\exp(\lambda t) = ${f(P.c1)}\exp(${f(P.lam)}t)`) + pieces5(P.t)},
      {id: 'mag', name: 'b·c₂·t·exp(λt) (magenta dashed)', col: COL.mag, short: 'the extra piece only a defective matrix has; 0 at t = 0.', detail: () => C.ln(R`b\,c_2\,t\exp(\lambda t) = ${f(P.b * P.c2)}\,t\exp(${f(P.lam)}t)`) + pieces5(P.t) + C.p('For large $|t|$ the factor $t$ makes it dominate the amber piece.')},
      {id: 'xsum', name: 'x(t) (dark)', col: COL.ink, short: 'the sum of the two pieces.', detail: () => C.ln(R`x(t) = (${f(P.c1)} ${sg(P.b * P.c2)}\,t)\exp(${f(P.lam)}t)`) + pieces5(P.t)},
      {id: 'yt', name: 'y(t) (teal)', col: COL.teal, short: 'just $c_2\\exp(\\lambda t)$; it never changes sign.', detail: () => C.ln(R`y(t) = ${f(P.c2)}\exp(${f(P.lam)}t),\quad y(${f(P.t)}) = ${f(triSol(P.t).y, 4)}`) + C.p('Because it keeps its sign, no trajectory crosses the eigenline.')},
      {id: 'tcur', name: 'Time cursor', col: '#6b7280', short: 'the time chosen with the slider. Tap any time in either panel to inspect it.', detail: () => pieces5(P.t)}
    ];
    if (ts !== null) out.push({id: 'tstar', name: 't* (orange dotted)', col: COL.org, short: 'the moment $\\dot x=0$: x turns around.', detail: () => { const q = triSol(ts); return C.ln(R`\dot x = \exp(\lambda t)\bigl[\lambda(c_1 + b c_2 t) + b c_2\bigr] = 0`, 'product rule, then set it to zero') + C.ln(R`t^* = -\frac{c_1}{b\,c_2} - \frac1\lambda = -\frac{${f(P.c1)}}{${f(P.b * P.c2)}} - \frac{1}{${f(P.lam)}} = ${f(ts, 3)}`) + C.ln(R`x(t^*) = ${f(q.x, 4)},\quad y(t^*) = ${f(q.y, 4)}`); }});
    return out;
  },
  probe(X, Y){ const a = this._v1, b = this._v2; for (const v of [a, b]) if (v && X >= v.x0 && X <= v.x0 + v.W && Y >= v.y0 && Y <= v.y0 + v.H) return {kind: 'time', panel: 'x5', t: rnd2(v.ix(X))}; return null; },
  probeInfo(pr){ return {title: 'Every piece at time t = ' + ft(pr.t), html: pieces5(pr.t)}; }
});

/* ---------- 6–11. phase portraits ---------- */
function trajTitle(pr){ return 'Trajectory through (' + ft(pr.x) + ', ' + ft(pr.y) + ')'; }
function triExtra(p){
  const l = P.lam, b = P.b, x = p[0], y = p[1];
  let h = C.ln(R`x(t) = (${f(x, 3)} ${sg(b * y, 3)}\,t)\exp(${f(l)}t),\qquad y(t) = ${f(y, 3)}\exp(${f(l)}t)`, 'the same answer written as in step 8, with c₁ = ' + ft(x) + ' and c₂ = ' + ft(y));
  if (Math.abs(b * y) > 1e-9 && Math.abs(l) > 1e-9){ const ts = -x / (b * y) - 1 / l, e = Math.exp(l * ts); h += C.ln(R`t^* = -\frac{${f(x, 3)}}{${f(b * y, 3)}} - \frac{1}{${f(l)}} = ${f(ts, 3)}:\ (${f((x + b * y * ts) * e, 3)},\ ${f(y * e, 3)})`, 'its turning point (vertical tangent)'); }
  return h;
}

  },

function classifyCalc(T, D){

  if (E.type === 'complex'){

    h += C.ln(R`\text{rotation rate } b = ${f(E.im, 3)},\qquad \text{size factor } \exp(a t),\ a = \tfrac{\Tr}{2} = ${f(E.re, 3)}`, 'the sine and cosine make the trajectory go round; the exponential in front sets whether it grows or shrinks');
    if (Math.abs(E.re) < 1e-9) h += C.res('<span class="tag">a = 0: the size never changes. A centre: closed loops.</span>');
    else h += C.res('<span class="tag">' + (E.re < 0 ? 'a < 0: the loops shrink. Spiral sink.' : 'a > 0: the loops grow. Spiral source.') + '</span>');
    return h;
  }
  if (E.type === 'rep'){
    h += C.ln(R`\lambda_1 = \lambda_2 = \frac{\Tr}{2} = ${f(E.l, 3)}`, 'Δ = 0: on the critical parabola (degenerate or star node)');
    h += C.res('<span class="tag">' + (E.l > 0 ? 'λ > 0: repelled' : E.l < 0 ? 'λ < 0: attracted' : 'λ = 0: nothing grows or shrinks') + '</span>');
    return h;
  }
  h += C.ln(R`\lambda_1 = \frac{\Tr - \sqrt\Delta}{2} = ${f(E.l1, 3)},\qquad \lambda_2 = \frac{\Tr + \sqrt\Delta}{2} = ${f(E.l2, 3)}`, 'Δ > 0: two real eigenvalues. Solutions are c₁exp(λ₁t)v₁ + c₂exp(λ₂t)v₂');
  h += C.ln(R`\lambda_1\lambda_2 = (${f(E.l1, 3)})(${f(E.l2, 3)}) = ${f(E.l1 * E.l2, 3)} = \Det`, D < 0 ? 'a negative product needs one positive and one negative factor: the eigenvalues have OPPOSITE signs' : 'a positive product needs two factors of the same sign: the eigenvalues have the SAME sign');
  if (D < 0){
    h += C.ln(R`\exp(${f(E.l1, 3)}t)\to 0,\qquad \exp(${f(E.l2, 3)}t)\to\infty \quad (t\to+\infty)`, 'one direction is pulled in, the other pushed out');
    h += C.res('<span class="tag">Saddle: attracted along one eigenline, repelled along the other</span>');
    return h;
  }
  h += C.ln(R`\lambda_1 + \lambda_2 = ${f(E.l1, 3)} ${sg(E.l2, 3)} = ${f(T, 3)} = \Tr`, T < 0 ? 'two numbers of the same sign add to a negative number only if both are negative' : T > 0 ? 'two numbers of the same sign add to a positive number only if both are positive' : 'zero sum: impossible with the same sign unless both are 0');
  if (Math.abs(D) < 1e-9) h += C.res('<span class="tag">Det = 0: one eigenvalue is 0, a line of fixed points</span>');

  return h;
}

  text: () => R`
<h2>Sinks, sources and saddles</h2>
<p>Step 1 painted the map with words: spiral sinks up here, nodal sources over there, saddles below. This step shows <i>why</i> each label is where it is. Everything follows from one rule and two numbers.</p>
<h3>One rule: eigenvalues are growth rates</h3>
<p>Every solution of $\dot\bx=\bA\bx$ is built from exponentials of the eigenvalues. With two real eigenvalues,</p>
$$\bx(t)=c_1\exp(\lambda_1t)\,\bv_1+c_2\exp(\lambda_2t)\,\bv_2,$$
<p>and with a complex pair $\lambda=a\pm bi$,</p>
$$\bx(t)=\exp(at)\bigl[\text{a combination of }\cos(bt)\text{ and }\sin(bt)\bigr].$$
<p>So the sign of each (real part of an) eigenvalue is a verdict: positive means that piece <b>grows</b>, negative means it <b>shrinks</b>. Think of $\exp(\lambda t)$ as a dial: $\exp(2t)$ doubles every 0.35 time units, $\exp(-2t)$ halves. That is the whole story; the map just records where the verdicts change.</p>
<h3>The decision, in three questions</h3>
<p><b>Question 1: real or complex?</b> $\Delta=\Tr^2-4\Det$. Negative means complex (above the parabola), positive means two real eigenvalues (below it).</p>
<p><b>Question 2 (real case): same sign or opposite signs?</b> The product is the determinant: $\lambda_1\lambda_2=\Det$. A negative product forces opposite signs; a positive product forces the same sign.</p>
<p><b>Question 3 (same sign): which sign?</b> The sum is the trace: $\lambda_1+\lambda_2=\Tr$. If both have the same sign, the sum has that sign too. So $\Tr&lt;0$ means both negative, $\Tr&gt;0$ both positive.</p>
<p>In the complex case there is only one real part, $a=\Tr/2$, so the trace alone decides.</p>
<h3>The textbook's section 5: distinct real eigenvalues</h3>
<div class="box ask"><b>From the textbook</b>
<p>Consider the 2×2 system $\dot\bx=\bA\bx$ and suppose $\det\bA&lt;\dfrac{(\operatorname{tr}\bA)^2}{4}$. Then the eigenvalues are real and distinct.</p>
<ul><li>If $\det\bA&lt;0$, the product $\lambda_1\lambda_2&lt;0$, so the eigenvalues have opposite signs: <b>saddle</b>.</li>
<li>If $\det\bA&gt;0$, the eigenvalues have the same sign, and if $\operatorname{tr}\bA&gt;0$: <b>nodal source</b>; if $\operatorname{tr}\bA&lt;0$: <b>nodal sink</b>.</li></ul></div>
<p>Each line of this statement has a reason, and the reasons are short. They are set out one at a time below, with the same two examples throughout: $(\Tr,\Det)=(3,2)$ and $(1,-2)$. Press the “Nodal source (3, 2)” and “Saddle (1, −2)” buttons under the figure to follow along.</p>
<h3>Why det A &lt; (tr A)²/4 makes the eigenvalues real and distinct</h3>
<p>The eigenvalues are the two roots of $\lambda^2-\Tr\,\lambda+\Det=0$ (step 6 derives this), so by the quadratic formula</p>
$$\lambda=\frac{\Tr\pm\sqrt{\Tr^2-4\Det}}{2}.$$
<p>Everything hangs on the number under the square root. Rearrange the textbook's condition:</p>
$$\det\bA&lt;\frac{(\operatorname{tr}\bA)^2}{4}\ \iff\ 4\det\bA&lt;(\operatorname{tr}\bA)^2\ \iff\ \Tr^2-4\Det&gt;0.$$
<p>So the condition says precisely that the number under the root is <b>positive</b>. The square root of a positive number is a real number, which makes both roots <b>real</b>; and it is not zero, so adding it and subtracting it give two <b>different</b> numbers: <b>distinct</b>. Example $(3,2)$: $\Tr^2-4\Det=9-8=1$, so $\lambda=\frac{3\pm1}{2}=1$ and $2$. Example $(1,-2)$: $1+8=9$, so $\lambda=\frac{1\pm3}{2}=2$ and $-1$.</p>
<p>What goes wrong otherwise: under the root, zero gives one repeated root (the parabola, $\Det=\Tr^2/4$), and a negative number has no real square root, so the roots are complex (above the parabola).</p>
<h3>Why the determinant is the product and the trace is the sum</h3>
<p>A quadratic with roots $\lambda_1,\lambda_2$ factors as $(\lambda-\lambda_1)(\lambda-\lambda_2)=\lambda^2-(\lambda_1+\lambda_2)\lambda+\lambda_1\lambda_2$. Comparing with $\lambda^2-\Tr\,\lambda+\Det$:</p>
$$\lambda_1+\lambda_2=\Tr,\qquad \lambda_1\lambda_2=\Det.$$
<p>Check: $(3,2)$ has $1+2=3$ and $1\cdot2=2$; $(1,-2)$ has $2+(-1)=1$ and $2\cdot(-1)=-2$. These two facts are the whole engine of the classification: the sign of a product and the sign of a sum are easy to reason about.</p>
<h3>Why det A &lt; 0 means a saddle</h3>
<p>$\lambda_1\lambda_2=\Det&lt;0$. The product of two real numbers is negative only when one factor is positive and the other negative: $(+)(+)=+$, $(-)(-)=+$, but $(+)(-)=-$. So one eigenvalue is negative and the other positive, no matter what the trace is. (The trace cannot override this: with $\lambda=2,-1$ the trace is $1$; with $\lambda=1,-2$ it is $-1$; both are saddles.)</p>
<p>Why opposite signs produce the saddle picture: every solution is</p>
$$\bx(t)=c_1\exp(\lambda_1t)\,\bv_1+c_2\exp(\lambda_2t)\,\bv_2,\qquad \lambda_1&lt;0&lt;\lambda_2.$$
<p>As $t\to+\infty$ the first term dies out and the second grows without bound, so every trajectory ends up moving away along the eigenline of $\lambda_2$ (the <i>unstable</i> line). As $t\to-\infty$ it is the other way round: the trajectory came in along the eigenline of $\lambda_1$ (the <i>stable</i> line). Approach along one straight line, leave along another: that is the saddle shape, named after the mountain pass where a path climbs in from one side and descends on the other. Only trajectories that start exactly on the stable line reach the origin; everything else swerves past it.</p>
<h3>Why det A &gt; 0 means the same sign, and why the trace then decides</h3>
<p>$\lambda_1\lambda_2=\Det&gt;0$. A positive product of real numbers needs both factors positive or both negative. So the two eigenvalues share a sign; which sign is not decided yet.</p>
<p>The trace settles it: $\lambda_1+\lambda_2=\Tr$. Two positive numbers add up to a positive number, two negative numbers to a negative number. So</p>
<ul>
<li>$\Tr&gt;0$: both eigenvalues positive. Both exponentials $\exp(\lambda_1t),\exp(\lambda_2t)$ grow, so every trajectory moves away from the origin: a <b>nodal source</b>. Example $(3,2)$: $\lambda=1,2$.</li>
<li>$\Tr&lt;0$: both negative. Both exponentials shrink, so every trajectory moves in: a <b>nodal sink</b>. Example $(-3,2)$: $\lambda=-1,-2$.</li>
</ul>
<p>“Nodal” rather than “spiral” because real eigenvalues give plain exponentials, with no sine or cosine, so nothing rotates. And $\Tr=0$ cannot happen here: two numbers of the same sign add to zero only if both are zero, which would make $\Det=0$, not positive. So in this region the trace is never zero, and it always makes a clear decision.</p>
<h3>Why the picture is coloured the way it is</h3>
<p>The textbook's picture is the map restricted to $\Det&lt;\Tr^2/4$, the outside of the parabola. The horizontal line is the Tr axis ($\Det=0$), the vertical line the Det axis ($\Tr=0$).</p>
<ul>
<li><b>Blue, below the Tr axis:</b> $\Det&lt;0$, so saddles, on both sides of the vertical line, because the trace does not matter there.</li>
<li><b>Green, above the Tr axis and outside the parabola:</b> $\Det&gt;0$ with real eigenvalues, so nodes. The vertical line splits them: nodal sinks on the left ($\Tr&lt;0$), nodal sources on the right ($\Tr&gt;0$).</li>
<li><b>White, inside the parabola:</b> $\Det&gt;\Tr^2/4$, complex eigenvalues. Not part of this section; it is the spiral region described next.</li>
</ul>
<p>Tick “Colour the map as in the textbook” under the figure to see the app's map drawn this way. On the parabola itself, $\det\bA=(\operatorname{tr}\bA)^2/4$, the square root is zero and the two eigenvalues stop being distinct. That border case is the subject of this whole app.</p>
<details class="qa"><summary>Complex eigenvalues: what $i$ is doing here, and why it means rotation</summary><div>
<p>When $\Delta&lt;0$ the quadratic formula asks for the square root of a negative number. Writing $i$ for $\sqrt{-1}$ (so $i^2=-1$), the two roots are $a\pm bi$ with $a=\Tr/2$ and $b=\sqrt{-\Delta}/2$: a <i>conjugate pair</i>, mirror images across the real axis.</p>
<p>Euler's formula connects this to turning: $\exp(i\theta)=\cos\theta+i\sin\theta$, a point on the unit circle at angle $\theta$. So</p>
$$\exp\bigl((a+bi)t\bigr)=\exp(at)\bigl(\cos(bt)+i\sin(bt)\bigr):$$
<p>a factor $\exp(at)$ that sets the size, times a factor that goes round the circle at angular speed $b$ (one full turn every $2\pi/b$ time units). Real solutions are built from the real and imaginary parts, $\exp(at)\cos(bt)$ and $\exp(at)\sin(bt)$, which is why trajectories spiral: they rotate while $\exp(at)$ shrinks or grows them.</p></div></details>
<h3>Above the parabola: spirals, and why Tr picks sink or source</h3>
<p>Complex eigenvalues $a\pm bi$ give $\cos(bt)$ and $\sin(bt)$: the trajectory goes round and round, with angular speed $b$. In front sits $\exp(at)$ with $a=\Tr/2$. It is a size dial that never stops turning:</p>
<ul>
<li>$\Tr&lt;0$: $a&lt;0$, each loop is smaller than the last: a <b>spiral sink</b>. Example $(\Tr,\Det)=(-2,2)$: $\lambda=-1\pm i$. After one full turn ($t=2\pi$) the size is multiplied by $\exp(-2\pi)\approx0.0019$.</li>
<li>$\Tr&gt;0$: $a&gt;0$, each loop is bigger: a <b>spiral source</b>. Example $(2,2)$: $\lambda=1\pm i$, size multiplied by $\exp(2\pi)\approx535$ per turn.</li>
<li>$\Tr=0$: $a=0$, the size never changes: a <b>centre</b>, closed loops. Example $(0,4)$: $\lambda=\pm2i$, the spring $\ddot x+4x=0$.</li>
</ul>
<h3>Below the parabola, above the axis: nodes</h3>
<p>Here $\Delta&gt;0$ and $\Det&gt;0$: two real eigenvalues with the same sign. Both exponentials grow, or both shrink, so every trajectory leaves the origin, or every trajectory arrives. No rotation, because there is no sine or cosine.</p>
<ul>
<li>Example $(-3,2)$: $\lambda^2+3\lambda+2=0$ gives $\lambda=-1,-2$. Both shrink: <b>nodal sink</b>. Note $\Tr=-3&lt;0$.</li>
<li>Example $(3,2)$: $\lambda=1,2$. Both grow: <b>nodal source</b>. $\Tr=3&gt;0$.</li>
</ul>
<p>The slower one ($|\lambda|$ smaller) wins near the origin and the faster one wins far away, which is why node curves bend from one eigenline towards the other.</p>
<h3>Below the Tr axis: saddles</h3>
<p>$\Det&lt;0$ means $\lambda_1\lambda_2&lt;0$: one eigenvalue is negative, the other positive, whatever the trace. One eigenline pulls trajectories in, the other pushes them out, so a typical trajectory comes in along the first line, swerves, and leaves along the second. Example $(1,-2)$: $\lambda^2-\lambda-2=0$ gives $\lambda=-1,2$.</p>
<h3>On the parabola</h3>
<p>$\Delta=0$: one repeated eigenvalue $\lambda=\Tr/2$, and its sign alone decides: repelled for $\Tr&gt;0$, attracted for $\Tr&lt;0$. The rest of this app is about that case.</p>
<div class="box try"><b>Try it</b>Press the preset buttons under the figure in turn and watch the live panel answer the three questions for each. Then drag the point slowly from a nodal sink, through the parabola, into the spiral region: the two eigenvalues merge and then turn complex, while the trace keeps saying “shrink”.</div>`,
  explain: () => R`<p>Left: the trace–determinant map with your point. Right: the phase portrait of the companion matrix at that point, with its eigenlines when they exist.</p>` + TAPHINT,
  parts(){
    const T = P.tr, D = P.det, E = eig(compA()), L = eigenlines(compA());
    const out = [

      {id: 'spiral', name: 'Spiral region (violet)', col: '#7d8fd9', short: 'complex eigenvalues: rotation, with Tr/2 as the size dial.', detail: () => regionCalc('spiral')},

  text: () => R`
<h2>Why these two solutions, and why the sign of λ decides</h2>
<p>The textbook gives one formula for each case (writing $\exp(t)$ as $e^t$):</p>
$$\begin{aligned}\text{degenerate node: }\ \bx&=c_1\binom10\exp(t)+c_2\Bigl[\binom01\exp(t)+\binom20t\exp(t)\Bigr]\\ \text{star node: }\ \bx&=\exp(\lambda t)\Bigl[c_1\binom10+c_2\binom01\Bigr]\end{aligned}$$
<p>Three questions: why these, why nothing else, and why $\lambda&gt;0$ repels while $\lambda&lt;0$ attracts. Take them in order.</p>
<h3>What a general solution must look like</h3>
<p>A solution is fixed once you know where it starts: two numbers, $x(0)$ and $y(0)$. There is exactly one solution through each starting point (the uniqueness theorem). So a <b>general solution</b> is a formula with <b>two free constants</b> that can reach <b>every</b> starting point. Two constants, no more, no fewer.</p>
<h3>Star node: A = λI</h3>
<p>The two equations do not talk to each other:</p>
$$\dot x=\lambda x,\qquad \dot y=\lambda y.$$
<p>What functions satisfy $\dot f=\lambda f$? Only $f=C\exp(\lambda t)$. Reason: for any solution, $\frac{d}{dt}\bigl[f\exp(-\lambda t)\bigr]=(\dot f-\lambda f)\exp(-\lambda t)=0$, so $f\exp(-\lambda t)$ is a constant $C$. Therefore</p>
$$x=c_1\exp(\lambda t),\quad y=c_2\exp(\lambda t)\quad\Longrightarrow\quad \bx=\exp(\lambda t)\Bigl[c_1\binom10+c_2\binom01\Bigr].$$
<p>That is the textbook formula. It is general because at $t=0$ it gives $(c_1,c_2)$, any point you like. And nothing else is possible: no $t\exp(\lambda t)$, no other exponent, no sine or cosine, because each component alone is forced to be $C\exp(\lambda t)$. The two straight-line solutions $\binom10\exp(\lambda t)$ and $\binom01\exp(\lambda t)$ exist because both basis vectors are eigenvectors.</p>
<h3>Degenerate node: one eigenline, one straight-line solution</h3>
<p>Now $\bA=\begin{bmatrix}1&2\\0&1\end{bmatrix}$ (step 7 recovers it from the formula). The only eigenvector is $\binom10$, so there is only <b>one</b> straight-line solution, $c_1\binom10\exp(t)$. That is the first term. A second straight-line solution would need a second eigenvector, and there is none. So the second independent solution must leave the eigenline, and it cannot be a pure exponential.</p>
<h3>The second solution, forced out of the equations</h3>
$$\dot x=x+2y,\qquad \dot y=y.$$
<p>The $y$ equation stands alone: $y=c_2\exp(t)$. Feed it into the $x$ equation:</p>
$$\dot x-x=2c_2\exp(t).$$
<p>The push on the right grows at exactly the natural rate of $x$ itself. That is resonance, and resonance produces a factor $t$: multiply by $\exp(-t)$, so $\frac{d}{dt}[x\exp(-t)]=2c_2$, integrate, $x\exp(-t)=c_1+2c_2t$, hence</p>
$$x=(c_1+2c_2t)\exp(t),\quad y=c_2\exp(t)\quad\Longrightarrow\quad \bx=c_1\binom10\exp(t)+c_2\Bigl[\binom01\exp(t)+\binom20t\exp(t)\Bigr].$$
<p>Exactly the textbook formula. The vector in front of $t\exp(t)$ is $\binom20=(\bA-\bI)\binom01$: pushing the second basis vector through $\bA-\bI$ lands on the eigenline. That is why it is $\binom20$ and not something else.</p>
<h3>Why no other form would work</h3>
<ul>
<li><b>Another exponent?</b> Try $\bx=\bv\exp(\mu t)$ with $\mu\neq\lambda$. Substituting gives $\mu\bv=\bA\bv$, so $\mu$ would have to be an eigenvalue. There is only $\lambda$.</li>
<li><b>Sines and cosines?</b> They appear only for complex eigenvalues, that is, above the parabola. On the parabola $\Delta=0$: no rotation.</li>
<li><b>Higher powers, $t^2\exp(\lambda t)$?</b> With $\bN=\bA-\lambda\bI$ we have $\bN^2=\mathbf0$ (its only eigenvalue is 0, so its characteristic polynomial is $\mu^2$, and a matrix satisfies its own characteristic polynomial), so $\exp(\bA t)=\exp(\lambda t)(\bI+t\bN)$: the series stops after the $t$ term. Nothing beyond $t\exp(\lambda t)$ can ever appear.</li>
<li><b>A second straight line?</b> Needs a second eigenvector. The eigenspace is one-dimensional.</li>
</ul>
<h3>Why these are the general solutions</h3>
<p>Set $t=0$ in either formula: you get $(c_1,c_2)$. So every starting point is reached by exactly one choice of constants, and by uniqueness every solution is one of these. Two constants, every start: general. The two pieces are independent because one lies on the eigenline and the other does not (for the star, because they point along different axes).</p>
<h3>The sign of λ: repelled or attracted, for both cases</h3>
<p>Both formulas have the same shape:</p>
$$\bx(t)=\exp(\lambda t)\times\bigl(\text{a vector that is constant, or grows only like } t\bigr).$$
<p>The exponential is a size dial and the bracket can never fight it, because an exponential beats any power of $t$:</p>
<table class="num"><tr><th>t</th><th>exp(t)</th><th>t·exp(t)</th><th>exp(−t)</th><th>t·exp(−t)</th></tr>
<tr><td>−10</td><td>0.000045</td><td>−0.00045</td><td>22026</td><td>−220260</td></tr>
<tr><td>−2</td><td>0.135</td><td>−0.271</td><td>7.39</td><td>−14.8</td></tr>
<tr><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td></tr>
<tr><td>2</td><td>7.39</td><td>14.8</td><td>0.135</td><td>0.271</td></tr>
<tr><td>10</td><td>22026</td><td>220260</td><td>0.000045</td><td>0.00045</td></tr></table>
<ul>
<li><b>λ &gt; 0.</b> Going back in time ($t\to-\infty$) everything is multiplied by a tiny $\exp(\lambda t)$: the solution was at the origin. Going forward it is multiplied by a huge number: it leaves. Every trajectory <b>comes out of</b> $(0,0)$: repelled, a source.</li>
<li><b>λ &lt; 0.</b> The same numbers read in the other direction: going forward in time $\exp(\lambda t)\to0$, so every trajectory <b>ends at</b> $(0,0)$: attracted, a sink.</li>
</ul>
<p>For the star this is exact: $|\bx(t)|=\exp(\lambda t)\,|\bx(0)|$, a pure stretch along the ray. For the degenerate node $|\bx(t)|=\exp(\lambda t)\sqrt{(c_1+2c_2t)^2+c_2^2}$: the square root grows only like $|t|$, and the table shows the exponential winning. With $c_1=c_2=1$ and $\lambda=1$: at $t=-5$ the size is $\exp(-5)\sqrt{(-9)^2+1}=0.061$, at $t=5$ it is $\exp(5)\sqrt{11^2+1}=1639$.</p>
<p>In the figure, the bottom plot draws $|\bx(t)|$ on a logarithmic scale: the star is a straight line of slope $\lambda$, and the degenerate node hugs that line, bending only slightly because of the factor $t$. Flip the sign of $\lambda$ and both lines flip their slope.</p>
<div class="box try"><b>Try it</b>Set $\lambda=1$, press “Play time” and watch both dots run away from the origin along their curves. Set $\lambda=-1$: both run in. Then tap a far corner of either portrait: the orange trajectory through it is analysed, and its fate at $t\to\pm\infty$ is the same as every other one.</div>`,
