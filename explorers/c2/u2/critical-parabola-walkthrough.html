<h2>Three ODEs: stability and structural stability</h2>
<div class="box ask"><b>Question: determine the stability and the structural stability of $\ddot y+5\dot y+6y=0$, of $\ddot y+\dot y-6y=0$, and of $\ddot y+2\dot y+y=0$, by considering their companion systems.</b>
<p>Read $\ddot y + b\,\dot y + c\,y = 0$ as a mass on a spring: $b$ is the friction (damping) and $c$ the spring stiffness. Two separate questions are asked about each equation. <b>Stability</b> (step 20): for THIS equation, does every motion die out? <b>Structural stability</b> (step 21): if the coefficients $b,c$ were measured a tiny bit differently, would the <i>type</i> of the phase portrait stay the same? These are genuinely different questions, and the second ODE below proves it.</p></div>
<h3>1. From one second-order ODE to a system</h3>
<p>The ODE talks about one quantity $y$ and its derivatives; a phase-plane system wants a <b>pair</b> of first-order equations. The bridge is a pure relabelling — four small moves, done here in full for the first ODE, $\ddot y+5\dot y+6y=0$.</p>
<p><b>Move 1: name the state.</b> Let $u_1=y$ (the position) and $u_2=\dot y$ (the velocity). Nothing is solved here: two things that already exist are simply given names. (The app's figure calls them $x$ and $y$; the printed solution writes the state as $(y,\dot y)$ — same idea, different letters.)</p>
<p><b>Move 2: the first row costs nothing.</b> What is $\dot u_1$? It is the derivative of $y$, which is $\dot y$ — and $\dot y$ has a name: $u_2$. So</p>
$$\dot u_1 = u_2 = (0)\,u_1 + (1)\,u_2,$$
<p>and the top row of the matrix is $[\,0\ \ 1\,]$, for <i>every</i> equation of this kind, with no computation at all.</p>
<p><b>Move 3: solve the ODE for $\ddot y$.</b> Move everything except $\ddot y$ to the other side; each term flips its sign as it crosses:</p>
$$\ddot y + 5\dot y + 6y = 0 \quad\Longrightarrow\quad \ddot y = -6y - 5\dot y.$$
<p><b>Move 4: the second row IS the ODE.</b> $\dot u_2=\ddot y$, and in the new names $-6y-5\dot y$ reads $-6u_1-5u_2$:</p>
$$\dot u_2 = (-6)\,u_1 + (-5)\,u_2,$$
<p>so the bottom row is $[\,-6\ \ -5\,]$. Stack the two rows:</p>
$$\frac{d}{dt}\begin{pmatrix}u_1\\u_2\end{pmatrix}=\begin{bmatrix}0&1\\-6&-5\end{bmatrix}\begin{pmatrix}u_1\\u_2\end{pmatrix}.$$
<p>That is exactly the matrix $\bA=\begin{bmatrix}0&1\\-6&-5\end{bmatrix}$ of the live panel, and the sentence “the bottom row is the ODE with its signs flipped” is Move 3 said in words. With general letters, $\ddot y+b\dot y+cy=0$ gives $\ddot y=-c\,y-b\,\dot y$, hence</p>
$$\bA=\begin{bmatrix}0&1\\-c&-b\end{bmatrix},\qquad \operatorname{tr}\bA=-b,\qquad \det\bA=(0)(-b)-(1)(-c)=c.$$
<p>Two tiny facts worth memorising: <b>trace = minus the damping</b>, <b>determinant = the stiffness</b>. The same four moves on the other two equations:</p>
<table class="num" style="text-align:left"><tr><th style="text-align:left">ODE</th><th style="text-align:left">solved for ÿ (Move 3)</th><th style="text-align:left">bottom row</th></tr>
<tr><td style="text-align:left">ÿ + 5ẏ + 6y = 0</td><td style="text-align:left">ÿ = −6y − 5ẏ</td><td style="text-align:left">[−6&nbsp;&nbsp;−5]</td></tr>
<tr><td style="text-align:left">ÿ + ẏ − 6y = 0</td><td style="text-align:left">ÿ = <b>+6y</b> − ẏ</td><td style="text-align:left">[<b>+6</b>&nbsp;&nbsp;−1]</td></tr>
<tr><td style="text-align:left">ÿ + 2ẏ + y = 0</td><td style="text-align:left">ÿ = −y − 2ẏ</td><td style="text-align:left">[−1&nbsp;&nbsp;−2]</td></tr></table>
<div class="box warn"><b>The sign trap of ODE 2</b>There $c=-6$ is already negative, so when the term $-6y$ crosses the $=$ sign it becomes $+6y$: the bottom-left entry is $-c=-(-6)=\boldsymbol{+6}$. Mechanically writing “minus the printed coefficients” would give the wrong matrix. The safe recipe: first solve for $\ddot y$, then copy the two coefficients exactly as they stand.</div>
<p><b>Check, always available:</b> multiply the bottom row back onto $(y,\dot y)$: it gives $-c\,y-b\,\dot y$, and the ODE says $\ddot y$ equals exactly that. The live panel on the right runs this four-move build, with its own digits, for whichever ODE is selected — and for a dot tapped on the map.</p>
<h3>2. Why the ODE and the system have the same characteristic polynomial</h3>
<p>Try $y=\exp(st)$ in the ODE: each dot multiplies by $s$, so $s^2+b\,s+c=0$. The eigenvalues of $\bA$ solve $\lambda^2-\operatorname{tr}\bA\,\lambda+\det\bA=\lambda^2+b\lambda+c=0$ — the <b>same polynomial</b>. So the exponents of the ODE and the eigenvalues of the system are the same numbers, and anything decided by eigenvalues (stability, portrait type) can be read off either one. That is the entire point of the solution's opening paragraph.</p>
<h3>3. The stability test: two plus signs</h3>
<p>Stable means every solution dies out, which needs every root of $s^2+bs+c$ to have a negative real part. Step 20 showed the clean test: that happens <b>exactly when $b&gt;0$ and $c&gt;0$</b> — positive friction and a genuine restoring spring. Equivalently $\operatorname{tr}\bA=-b&lt;0$ and $\det\bA=c&gt;0$: the stable upper-left quadrant of the map.</p>
<h3>4. The structural-stability test: stay off the boundary curves</h3>
<p>Step 21: a system is structurally UNstable exactly when its point sits on one of the map's boundary curves — the positive Det axis ($\operatorname{tr}\bA=0$, centres), the Tr axis ($\det\bA=0$, combs), or the critical parabola ($(\operatorname{tr}\bA)^2=4\det\bA$). With $\operatorname{tr}\bA=-b$ and $\det\bA=c$ the three checks become, in ODE language:</p>
$$b\neq0\ ?\qquad c\neq0\ ?\qquad b^2-4c\neq0\ ?$$
<p>All three ODEs here have $b\neq0$ and $c\neq0$, so — as the printed solution says — “it remains to check if $b^2-4c=0$”: only the parabola can still bite.</p>
<h3>5. The three ODEs, every digit</h3>
<p><b>ODE 1: $\ddot y+5\dot y+6y=0$</b> ($b=5$, $c=6$). Both positive → <b>stable</b>. Indeed $s^2+5s+6=(s+2)(s+3)$: roots $-2,-3$, both negative. Parabola check: $b^2-4c=25-24=1\neq0$ → <b>structurally stable</b>. (Only just: on the map the point $(-5,6)$ sits a mere $0.25$ below the parabola at $6.25$ — stable margins can be thin and still count.)</p>
<p><b>ODE 2: $\ddot y+\dot y-6y=0$</b> ($b=1$, $c=-6$). The stiffness is negative, so $\det\bA=-6&lt;0$: a <b>saddle</b>, and saddles are always <b>unstable</b>. Indeed $s^2+s-6=(s+3)(s-2)$: roots $-3$ and $+2$, and the $+2$ makes solutions grow. Parabola check: $1^2-4(-6)=1+24=25\neq0$ → <b>structurally stable</b>.</p>
<div class="box key"><b>The punchline of ODE 2</b>It is <b>unstable yet structurally stable</b>. No contradiction: stability asks about the solutions of this one system (they blow up); structural stability asks whether the <i>picture type</i> survives small changes of the system (a saddle deep inside the saddle region stays a saddle). Bad news, reliably bad.</div>
<p><b>ODE 3: $\ddot y+2\dot y+y=0$</b> ($b=2$, $c=1$). Both positive → <b>stable</b>. But $s^2+2s+1=(s+1)^2$: a repeated root $s=-1$, and the parabola check confirms it: $2^2-4(1)=4-4=0$. The point $(-2,1)$ sits <b>exactly on the critical parabola</b> — this is the critically damped oscillator of step 5, a defective node — so it is <b>structurally unstable</b>: nudge $\delta$ under the figure and watch. $\delta&gt;0$ (slightly stiffer): $b^2-4c&lt;0$, complex roots, the portrait becomes a <b>spiral sink</b> (underdamped). $\delta&lt;0$: two real roots, a <b>nodal sink</b> (overdamped). The <i>type</i> flips either way — though both neighbours happen to remain stable, since the point stays in the upper-left quadrant.</p>
<table class="num"><tr><th>ODE</th><th>b</th><th>c</th><th>roots</th><th>b² − 4c</th><th>stability</th><th>structural</th></tr>
<tr><td>ÿ + 5ẏ + 6y = 0</td><td>5</td><td>6</td><td>−2, −3</td><td>1 ≠ 0</td><td>stable</td><td>structurally stable</td></tr>
<tr><td>ÿ + ẏ − 6y = 0</td><td>1</td><td>−6</td><td>−3, +2</td><td>25 ≠ 0</td><td>unstable (saddle)</td><td>structurally stable</td></tr>
<tr><td>ÿ + 2ẏ + y = 0</td><td>2</td><td>1</td><td>−1, −1</td><td>0</td><td>stable</td><td>structurally unstable</td></tr></table>
<div class="box try"><b>Try it</b>Pick ODE 3 and slide δ slowly from $-0.2$ to $+0.2$: the portrait morphs node → defective node → spiral while the orange nudged point crosses the parabola. Then do the same to ODE 1: the portrait wobbles but stays a nodal sink — that robustness is what “structurally stable” means.</div>
<details class="qa"><summary>Reading the cramped printed solution</summary><div>
<ul>
<li>The tall stack “$\operatorname{tr}\bA\pm\sqrt{(\operatorname{tr}\bA)^2-4\det\bA}$ over $2$, where $\operatorname{tr}\bA=-b$, $\det\bA=c$” is the quadratic formula for the eigenvalues, $\lambda=\frac{-b\pm\sqrt{b^2-4c}}{2}$, split across six lines.</li>
<li>The final image interleaves two columns of each block. Un-tangled, each block is one line. First: $\ddot y+5\dot y+6y=0$: $b^2-4c=(5)^2-4(6)=1\neq0\Rightarrow$ structurally stable. Second: $\ddot y+\dot y-6y=0$: $1^2-4(-6)=25\neq0\Rightarrow$ structurally stable. Third: $\ddot y+2\dot y+y=0$: $2^2-4(1)=0\Rightarrow$ structurally unstable.</li>
<li>“A system is stable if and only if $\operatorname{tr}\bA=-b&lt;0$ and $\det\bA=c&gt;0$” is section 3 above; “since $b&gt;0$ for all three DEs, and $c&lt;0$ only for the second” is the whole stability verdict in one sentence.</li>
</ul></div></details>`,
  explain: () => R`<p>Left: the trace–determinant map with one dot per ODE at $(\operatorname{tr}\bA,\det\bA)=(-b,\ c)$, coloured green when stable and red when unstable; the ring marks the chosen one, and the orange dot (when $\delta\neq0$) is the nudged version. Right: the phase portrait of the chosen companion system, drawn with the nudge applied.</p>` + TAPHINT,

  psecsMap: {td: ['Trace', 'Determinant', 'Discriminant']},
  text: () => R`
<h2>Glossary</h2>
<p>Short definitions of every term that appears in the app, in alphabetical order, each with the step where it is developed. Terms in <i>italics</i> have their own entries.</p>
<h3>atan2</h3><p>The two-argument arctangent. $\operatorname{atan2}(y,x)$ is the angle, anticlockwise from the positive $x$-axis, of the arrow from the origin to $(x,y)$. Unlike $\arctan(y/x)$ it uses the signs of both numbers, so it knows the quadrant: $\operatorname{atan2}(1,1)=45^\circ$ but $\operatorname{atan2}(-1,-1)=-135^\circ$. Used for the <i>heading</i>. Step 4.</p>
<h3>Cayley–Hamilton theorem</h3><p>A square matrix satisfies its own characteristic equation: for a 2×2 matrix, $\bA^2-(\Tr)\bA+(\Det)\bI=\mathbf 0$. Used to show $\bN^2=q\bI$ for the trace-free part $\bN$. Step 4.</p>
<h3>Centre</h3><p>Purely imaginary eigenvalues $\pm\omega i$: closed elliptical orbits, period $2\pi/\omega$. On the map, the positive Det axis. Stable but not asymptotically stable. Steps 2, 3.</p>
<h3>Characteristic polynomial</h3><p>$\det(\bA-\lambda\bI)=\lambda^2-\Tr\,\lambda+\Det$. Its roots are the <i>eigenvalues</i>. Step 6.</p>
<h3>Comb</h3><p>The phase portrait of a matrix with one zero and one nonzero eigenvalue: a spine of stationary points (the 0-eigenline) with straight teeth parallel to the other eigenline. Attracting when the other eigenvalue (= Tr) is negative, repelling when it is positive. Combs fill the Tr axis of the map, except the origin. Steps 16, 18.</p>
<h3>Companion matrix</h3><p>$\begin{bmatrix}0&1\\-\Det&\Tr\end{bmatrix}$, the matrix of the second-order equation $\ddot x-\Tr\,\dot x+\Det\,x=0$ written as a system with $y=\dot x$. One convenient representative of each point of the map. Step 5.</p>
<h3>Complex eigenvalues</h3><p>Roots $a\pm bi$ of the characteristic polynomial when the <i>discriminant</i> is negative, with $i^2=-1$. They always come as a conjugate pair. By Euler's formula they give solutions $\exp(at)\cos(bt)$ and $\exp(at)\sin(bt)$: rotation at angular speed $b$ with size set by $\exp(at)$. Step 2.</p>
<h3>Critical parabola</h3><p>The curve $\Det=\Tr^2/4$ in the trace–determinant plane: the points where the <i>discriminant</i> is zero and the two eigenvalues coincide. The border between nodes and spirals, and the subject of this app. Steps 1, 6.</p>
<h3>Critically damped</h3><p>A damped oscillator $\ddot x+p\dot x+qx=0$ with $p^2=4q$: the fastest return to rest without oscillation; repeated exponent, so it sits on the critical parabola. Overdamped ($p^2&gt;4q$, node) and underdamped ($p^2&lt;4q$, spiral) are its neighbours. Step 5.</p>
<h3>Degenerate case</h3><p>A system on a boundary between the big regions of the trace–determinant plane: centres (positive Det axis), degenerate and star nodes (critical parabola), combs (Tr axis), and the origin. Structurally unstable. Steps 16, 19, 21.</p>
<h3>Degenerate node</h3><p>Also improper or defective node. Repeated nonzero eigenvalue with only one <i>eigenline</i> ($\bA\neq\lambda\bI$). Curves are tangent to the eigenline at the origin and parallel to it far away, bending once. Source for $\lambda&gt;0$, sink for $\lambda&lt;0$. Steps 7 to 12.</p>
<h3>Determinant</h3><p>$\det\bA=ad-bc$ for $\bA=\begin{bmatrix}a&b\\c&d\end{bmatrix}$; equals the product of the eigenvalues, $\lambda_1\lambda_2$. Its sign separates saddles ($\Det&lt;0$) from everything else. Steps 1, 2.</p>
<h3>Discriminant</h3><p>$\Delta=\Tr^2-4\Det$, the quantity under the square root in the quadratic formula for the eigenvalues; equal to $(\lambda_1-\lambda_2)^2$. $\Delta&gt;0$: two real eigenvalues; $\Delta=0$: repeated; $\Delta&lt;0$: complex pair. Steps 1, 6.</p>
<h3>Eigenline</h3><p>The line through the origin along an <i>eigenvector</i>, labelled in figures with its eigenvalue (for example “$\lambda_1=0$”). Motion on it is a straight run, $\bx=c\exp(\lambda t)\bv$: outward if $\lambda&gt;0$, inward if $\lambda&lt;0$, no motion if $\lambda=0$. Steps 7, 17 (how to find and draw one).</p>
<h3>Eigenvalue, eigenvector</h3><p>$\bA\bv=\lambda\bv$ with $\bv\neq\mathbf0$: the matrix only stretches $\bv$ by the factor $\lambda$. Eigenvalues are the growth rates of the system; eigenvectors are the directions in which the growth is pure. Steps 2, 6, 7.</p>
<h3>Equilibrium</h3><p>Also fixed point or critical point: a point where $\bA\bx=\mathbf0$, so nothing moves. For $\det\bA\neq0$ only the origin; for $\det\bA=0$ a whole line. All the portrait names describe behaviour near it. Step 3.</p>
<h3>exp</h3><p>$\exp(u)=e^u$. In the app every exponential is written $\exp(\lambda t)$. It is the size dial of every solution: growing for $\lambda&gt;0$, shrinking for $\lambda&lt;0$, and always beating any power of $t$. Steps 9, 10.</p>
<h3>Generalized eigenvector</h3><p>A vector $\bw$ with $(\bA-\lambda\bI)\bw=\bv$, an eigenvector. It supplies the second solution $\exp(\lambda t)(\bw+t\bv)$ when the matrix is defective. Step 8.</p>
<h3>Heading</h3><p>The direction of the velocity $(\dot x,\dot y)$ at a point, as an angle: $0^\circ$ right, $90^\circ$ up, $180^\circ$ left. Computed with <i>atan2</i>. A degenerate node's curve turns its heading by exactly $180^\circ$. Steps 4, 11.</p>
<h3>Integrating factor</h3><p>A factor, here $\exp(-\lambda t)$, chosen so that one side of an equation becomes the derivative of a single product, which can then be integrated directly. Step 8.</p>
<h3>Log scale</h3><p>An axis on which each unit step multiplies the value by 10 ($\log_{10}$). An exponential $\exp(\lambda t)$ becomes a straight line of slope $\lambda/\ln10$. Step 9.</p>
<h3>Matrix exponential</h3><p>$\exp(\bA t)=\bI+\bA t+\frac{\bA^2t^2}{2}+\cdots$. The solution of $\dot\bx=\bA\bx$ through $\bp$ is $\exp(\bA t)\bp$. For 2×2 matrices it collapses to $\exp(mt)[C(t)\bI+S(t)\bN]$. Step 4.</p>
<h3>Non-isolated critical point</h3><p>An equilibrium with other equilibria arbitrarily close to it, as on a whole line of stationary points when $\Det=0$. Contrast an isolated equilibrium, like the origin of a node, spiral or saddle. Step 16.</p>
<h3>Node</h3><p>Two real eigenvalues of the same sign (nodal sink if both negative, nodal source if both positive). No rotation; curves tangent to the slow eigenline near the origin, parallel to the fast one far away. Below the parabola, above the Tr axis. Steps 2, 3.</p>
<h3>Phase plane, phase portrait</h3><p>The $(x,y)$ plane in which solutions are drawn as curves, and the picture of many such curves with arrows. Steps 1, 3.</p>
<h3>Perturbation</h3><p>A small change to the entries of a matrix, as when a coefficient is measured or rounded slightly differently, or when a tank gets a small leak. Step 21.</p>
<h3>Probe</h3><p>The orange trajectory, point or value drawn when an empty spot of a figure is tapped, with its line-by-line calculation in the live panel. Step 4 explains the calculation.</p>
<h3>Rank</h3><p>The number of independent rows of a matrix. A nonzero 2×2 matrix with zero determinant has rank 1: its rows are proportional, so $\bN\bu=\mathbf0$ is one equation and its solutions form one line. Step 7.</p>
<h3>Resonance</h3><p>Forcing a system at exactly its own natural rate, so the responses add up instead of averaging out; the running total shows up as a factor $t$. Step 8.</p>
<h3>Semistable</h3><p>Also neutrally stable. All solutions stay bounded, but not all tend to 0. Centres (undamped oscillators) and attracting combs (such as the two tanks). Step 20.</p>
<h3>Saddle</h3><p>Real eigenvalues of opposite sign ($\Det&lt;0$). One eigenline attracts, the other repels; typical trajectories approach and then leave. Unstable. Steps 2, 3.</p>
<h3>Sink, source</h3><p>Sink: every nearby trajectory approaches the equilibrium as $t\to+\infty$ (all real parts negative). Source: every nearby trajectory leaves (all real parts positive). Steps 2, 9, 10.</p>
<h3>Spiral</h3><p>Also focus. Complex eigenvalues: trajectories wind around the origin, shrinking (spiral sink, $\Tr&lt;0$) or growing (spiral source, $\Tr&gt;0$). Above the parabola. Steps 2, 3.</p>
<h3>Stable, unstable</h3><p>As used in the textbook: a system is stable when all trajectories tend to 0 as $t\to+\infty$, and unstable when some trajectories are unbounded. The test for 2×2 systems is $\operatorname{tr}\bA&lt;0$ and $\det\bA&gt;0$. (In general dynamical-systems language, the textbook's “stable” is called asymptotically stable.) Steps 3, 20.</p>
<h3>Structural stability</h3><p>A system is structurally stable when small perturbations of the entries of $\bA$ do not change the type of its phase portrait. For 2×2 systems: exactly the big regions of the map (saddles, nodes, spirals); every boundary case is structurally unstable. Step 21.</p>
<h3>Star node</h3><p>Also proper node. $\bA=\lambda\bI$: every vector is an eigenvector, every trajectory a straight ray. Same point of the map as the degenerate node with that $\lambda$. Step 14.</p>
<h3>Stationary point</h3><p>Another name for an <i>equilibrium</i>: a constant solution. In the two-tank example, any state with equal heights. Step 16.</p>
<h3>Trace–determinant plane</h3><p>The plane with axes Tr and Det, in which each system $\dot\bx=\bA\bx$ is one point. Not to be confused with the phase plane, in which the same system is a whole picture of trajectories. Steps 1, 19.</p>
<h3>Trace</h3><p>$\operatorname{tr}\bA=a+d$, the sum of the diagonal entries; equals the sum of the eigenvalues, $\lambda_1+\lambda_2$. Its sign decides sink versus source whenever the eigenvalues share a sign. Steps 1, 2.</p>
<h3>Trajectory</h3><p>The curve a solution traces in the phase plane; equivalently an orbit. Arrows mark increasing time. Exactly one passes through each point. Step 3.</p>
<h3>Uniqueness theorem</h3><p>For $\dot\bx=\bA\bx$, each starting point has exactly one solution. Hence trajectories never cross, and a general solution needs exactly two constants, $x(0)$ and $y(0)$. Steps 4, 9.</p>
<h3>Zero eigenvalue</h3><p>$\Det=0$: a line of equilibria along the eigenvector of 0; the other eigenvalue moves points straight towards or away from that line, so the portrait is a comb. The Tr axis of the map. Steps 3, 15, 16 (the two tanks).</p>`,
  explain: () => R`<p>The trace–determinant map, as a reference. Each region's entry is promoted when it is tapped in the list.</p>` + TAPHINT,

function openerChain(){ const out = []; let w = null; try { w = window.opener; } catch(e){} for (let i = 0; i < 5 && w; i++){ out.push(w); try { w = w.opener; } catch(e){ break; } } return out; }

function mayLead(){ if (MODE === 'text') return false; if (document.hasFocus()) return true; return MODE === 'main' && FOCUSED.size === 0; }

function openCompanion(kind){
  closeOverlay();
  const name = kind === 'fig' ? 'cpFig' : 'cpText';
  let w = null; try { w = window.open('', name); } catch(e){}
  if (!w){ alert('The browser blocked the new tab. Allow pop-ups for this page and try again.'); return; }
  let alive = false; try { alive = !!(w.CP_PEER && w.CP_PEER.mode === kind); } catch(e){}

  else { try { const d = w.document; d.open(); d.write(SRC_HTML); d.close(); } catch(e){} }
  try { w.focus(); } catch(e){}

window.CP_PEER = {mode: MODE};

/* fallback for browsers that refuse to run scripts in the new tab: the main window keeps it updated */
const LEG = {w: null, t: 0};

    const d = w.document; d.getElementById('t').textContent = (S.step + 1) + '. ' + STEPS[S.step].title;

<script>
/* Phone-width safety net, inlined into every explorer by build.py.

(function () {
