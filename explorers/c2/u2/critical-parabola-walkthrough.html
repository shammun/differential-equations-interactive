  text: () => R`
<h2>A gallery of every portrait type</h2>
<p>All the names on the map (spiral sink, nodal source, saddle, …) describe one thing: <b>how trajectories behave near the equilibrium at the origin</b>. Pick a type with the boxes under the figure. Its portrait appears on the left, its position on the map and its eigenvalues on the right, and its definition is promoted in the explanation tabs. The sliders stay inside that type's family, so you can see what varies within a type and what never changes.</p>
<h3>Words used in every name</h3>
<ul>
<li><b>Equilibrium</b> (fixed point): a point where the velocity $\bA\bx$ is zero, so a solution that starts there never moves. For $\dot\bx=\bA\bx$ with $\det\bA\neq0$ the only one is $(0,0)$.</li>
<li><b>Trajectory</b>: the path a solution traces in the $(x,y)$ plane as time runs. The arrows show the direction of increasing time.</li>
<li><b>Eigenline</b>: a line through the origin along an eigenvector. Solutions that start on it stay on it and move as $\exp(\lambda t)$: straight in or straight out.</li>
<li><b>Sink</b>: every nearby trajectory approaches the equilibrium as $t\to+\infty$. The equilibrium is <i>asymptotically stable</i>. Happens when every eigenvalue has a negative real part.</li>
<li><b>Source</b>: every nearby trajectory moves away (it approaches the equilibrium only backwards in time). <i>Unstable</i>. Every eigenvalue has a positive real part.</li>
<li><b>Node</b> (nodal): the eigenvalues are real, so there is no rotation; trajectories arrive or leave along bending curves tangent to an eigenline. The degenerate node is also called an <i>improper node</i> and the star node a <i>proper node</i>.</li>
<li><b>Spiral</b> (focus): the eigenvalues are complex, so trajectories wind around the equilibrium while shrinking or growing. The imaginary part $\omega$ is the angular speed: one full turn every $2\pi/\omega$ time units.</li>
<li><b>Saddle</b>: one direction attracts and one repels, so almost every trajectory comes in and then leaves. Unstable, but with a stable eigenline.</li>
<li><b>Centre</b>: closed loops that neither shrink nor grow. <i>Stable but not asymptotically stable</i>: trajectories stay close but never arrive.</li>
<li><b>Stable / unstable</b>: stable means solutions that start close stay close; asymptotically stable means they also converge; unstable means some leave.</li>
</ul>
<h3>Spiral sink</h3>
<p><b>Definition.</b> Complex eigenvalues $a\pm\omega i$ with $a&lt;0$. Trajectories circle the origin with angular speed $\omega$ while their size shrinks like $\exp(at)$: the origin is an asymptotically stable focus.</p>
<p><b>On the map.</b> Above the parabola ($\Delta&lt;0$), left of the Det axis ($\Tr=2a&lt;0$).</p>
<p><b>Example.</b> $\bA=\begin{bmatrix}-1&-2\\2&-1\end{bmatrix}$: $\Tr=-2$, $\Det=5$, $\Delta=4-20=-16$, $\lambda=-1\pm2i$. Each full turn ($t=\pi$) multiplies the size by $\exp(-\pi)\approx0.043$.</p>
<p><b>How to recognise it.</b> Curves cross the axes again and again, each crossing closer to the origin than the last.</p>
<h3>Spiral source</h3>
<p><b>Definition.</b> Complex eigenvalues with $a&gt;0$: the same winding, but every loop is larger. Unstable focus.</p>
<p><b>On the map.</b> Above the parabola, right of the Det axis. <b>Example.</b> $\begin{bmatrix}1&-2\\2&1\end{bmatrix}$: $\lambda=1\pm2i$. Reverse every arrow of the spiral sink.</p>
<h3>Centre</h3>
<p><b>Definition.</b> Purely imaginary eigenvalues $\pm\omega i$ ($a=0$): closed orbits, ellipses around the origin, with period $2\pi/\omega$. Stable, not asymptotically stable.</p>
<p><b>On the map.</b> Exactly on the positive Det axis. <b>Example.</b> $\begin{bmatrix}0&-2\\2&0\end{bmatrix}$: $\lambda=\pm2i$, or the spring $\ddot x+4x=0$.</p>
<h3>Nodal sink</h3>
<p><b>Definition.</b> Two different real eigenvalues, both negative. Every trajectory approaches the origin without rotating. Near the origin it is tangent to the slow eigenline (the eigenvalue closest to 0), because the fast piece $\exp(\lambda_{\text{fast}}t)$ has already died out. Asymptotically stable node.</p>
<p><b>On the map.</b> Below the parabola, above the Tr axis ($\Delta&gt;0$, $\Det&gt;0$), with $\Tr&lt;0$. <b>Example.</b> $\begin{bmatrix}-1&1\\0&-2\end{bmatrix}$: $\lambda=-1,-2$, eigenlines along $(1,0)$ and $(1,-1)$.</p>
<h3>Nodal source</h3>
<p><b>Definition.</b> Two different real eigenvalues, both positive. Trajectories leave the origin tangent to the slow eigenline and end up parallel to the fast one. Unstable node.</p>
<p><b>On the map.</b> Below the parabola, above the Tr axis, $\Tr&gt;0$. <b>Example.</b> $\begin{bmatrix}1&1\\0&2\end{bmatrix}$: $\lambda=1,2$.</p>
<h3>Saddle</h3>
<p><b>Definition.</b> Real eigenvalues of opposite sign. Along the eigenline of the negative eigenvalue (the <i>stable</i> line) trajectories come in; along the positive one (the <i>unstable</i> line) they go out. A typical trajectory approaches along the stable line, turns, and escapes along the unstable one. Unstable.</p>
<p><b>On the map.</b> Below the Tr axis: $\Det=\lambda_1\lambda_2&lt;0$, whatever the trace. <b>Example.</b> $\begin{bmatrix}-1&1\\0&2\end{bmatrix}$: $\lambda=-1,2$.</p>
<h3>Degenerate node</h3>
<p><b>Definition.</b> One repeated real eigenvalue $\lambda\neq0$ with only one eigenline ($\bA\neq\lambda\bI$). Curves are tangent to the eigenline at the origin and parallel to it far away, bending once in between. Sink if $\lambda&lt;0$, source if $\lambda&gt;0$.</p>
<p><b>On the map.</b> On the parabola, away from the vertex. <b>Example.</b> the textbook's $\begin{bmatrix}1&2\\0&1\end{bmatrix}$, $\lambda=1$.</p>
<h3>Star node</h3>
<p><b>Definition.</b> $\bA=\lambda\bI$, $\lambda\neq0$: every vector is an eigenvector, so every trajectory is a straight ray. Sink or source by the sign of $\lambda$.</p>
<p><b>On the map.</b> The same point of the parabola as the degenerate node with that $\lambda$. <b>Example.</b> $\begin{bmatrix}2&0\\0&2\end{bmatrix}$.</p>
<h3>Zero eigenvalue</h3>
<p><b>Definition.</b> $\Det=0$, so one eigenvalue is 0: a whole line of equilibria along its eigenvector. The other eigenvalue $\lambda$ moves points straight towards that line ($\lambda&lt;0$) or away from it ($\lambda&gt;0$) along parallel lines.</p>
<p><b>On the map.</b> On the Tr axis. <b>Example.</b> $\begin{bmatrix}-1&1\\0&0\end{bmatrix}$: $\lambda=-1,0$; the equilibria lie along $(1,1)$.</p>
<p>A fully worked physical example, two connected tanks with $\lambda_1=0,\ \lambda_2=-2$, is in step 16.</p>
<h3>How to use this step</h3>
<p>Pick a type, then move its sliders and watch three things at once: the portrait changes shape, the point on the map slides inside its region, and the eigenvalue dots move. When a slider carries you to a border (λ₁ = λ₂, or Det → 0) the verdict under the portrait changes name. Tap any curve or empty spot in the portrait to see the full calculation for that trajectory.</p>`,
  explain: () => R`<p>${ptype().name}: ${ptype().guide}</p>` + TAPHINT,
  parts(){
    const A = galA(), E = eig(A), L = eigenlines(A), out = [
      {id: 'curves', name: 'Trajectories (dark)', col: '#3a3f48', short: 'the portrait of this matrix. Tap one to analyse it.', detail: () => groupNote('trajectory') + C.ln(R`\bA = ${mat(A[0], A[1], A[2], A[3])}`)},
      {id: 'map', name: 'Position on the map', col: COL.ink, short: 'the (Tr, Det) of this matrix, inside its region.', detail: () => classifyCalc(E.T, E.D)},
      {id: 'lam', name: 'Eigenvalues (complex plane)', col: COL.mag, short: 'real ones on the axis, complex ones as a mirrored pair.', detail: () => C.ln(R`\lambda^2 ${sg(-E.T)}\,\lambda ${sg(E.D)} = 0 \ \Rightarrow\ ${E.type === 'complex' ? R`\lambda = ${f(E.re, 3)}\pm ${f(E.im, 3)}i` : eigTex(E, 3)}`) + C.ln(ptype().eigs, 'the signature of a ' + ptype().name.toLowerCase())}
    ];

    if (L === 'all') out.push({id: 'eig', name: 'Every direction is an eigenline', col: COL.blue, nohit: true, short: 'A = λI.', detail: () => C.p('Every ray is a trajectory.')});
    return out;
  },
  draw(){
    const pad = 8, wide = CW > CH * 1.05, A = galA(), E = eig(A), t = ptype();
    let pv, mv, lv;
    if (wide){ const w1 = Math.round(CW * 0.6); pv = [pad, pad, w1 - 2 * pad, CH - 2 * pad]; const h2 = Math.round((CH - 3 * pad) / 2); mv = [w1, pad, CW - w1 - pad, h2]; lv = [w1, 2 * pad + h2, CW - w1 - pad, CH - 3 * pad - h2]; }
    else { const h1 = Math.round(CH * 0.58); pv = [pad, pad, CW - 2 * pad, h1 - 2 * pad]; const w2 = Math.round((CW - 3 * pad) / 2); mv = [pad, h1, w2, CH - h1 - pad]; lv = [2 * pad + w2, h1, CW - 3 * pad - w2, CH - h1 - pad]; }
    panel(pv[0], pv[1], pv[2], pv[3], t.name + ': phase portrait');
    const v = sqView(pv[0] + 4, pv[1] + 20, pv[2] - 8, pv[3] - 24, 3); this._v = v; clipTo(v); grid(v, 1); axes(v, 'x', 'y', false);

  text: () => R`
<h2>Reading the trajectory calculation, line by line</h2>
<p>Whenever a point or a curve is tapped anywhere in this app, the live panel writes out the same calculation. This step takes it apart. The figure draws every quantity that appears in it, for the matrix $\bA$ of the current $(\Tr,\Det)$ and the point $\bp$. The worked example uses the textbook point $(\Tr,\Det)=(2,1)$, so $\bA=\begin{bmatrix}0&1\\-1&2\end{bmatrix}$, and the point $\bp=(0.26,\ 2.10)$; press the first button under the figure to load it.</p>
<h3>Line 1: the point p</h3>
<p>A trajectory is a curve, and one point on it is enough to pin it down: through every point of the plane passes exactly one trajectory. This is the <b>existence and uniqueness theorem</b> for $\dot\bx=\bA\bx$: given a starting point there is a solution, and only one. Two consequences used all through the app: trajectories never cross (two curves through one point would be two solutions from the same start), and the two numbers $x(0),y(0)$ fix everything that follows. So the tapped point $\bp$ is taken as the state of the solution at time $t=0$. Nothing depends on that choice of clock: using a different moment only relabels the times along the same curve.</p>
<h3>Line 2: the velocity at p</h3>
<p>The system $\dot\bx=\bA\bx$ is a rule: “at the point $\bx$, move with velocity $\bA\bx$.” So the velocity at $\bp$ is the matrix times the point, worked out row by row:</p>
$$\dot x = a\,x + b\,y,\qquad \dot y = c\,x + d\,y.$$
<p>Worked example:</p>
$$\dot x = 0\cdot0.26 + 1\cdot2.10 = 2.10,\qquad \dot y = -1\cdot0.26 + 2\cdot2.10 = 3.94.$$
<p>The dark arrow at $\bp$ in the figure is this velocity. It is tangent to the trajectory: the curve leaves $\bp$ in exactly this direction.</p>
<h3>Line 3: the heading angle, atan2</h3>
<p>A velocity is an arrow with two components, $(\dot x,\dot y)$. Its <b>heading</b> is the direction of that arrow written as one angle, measured anticlockwise from the positive $x$-axis: $0^\circ$ means moving right, $90^\circ$ up, $180^\circ$ left, $-90^\circ$ (or $270^\circ$) down.</p>
<p>$\operatorname{atan2}(\dot y,\dot x)$ is the two-argument arctangent: it returns the angle of the arrow $(\dot x,\dot y)$. The ordinary $\arctan(\dot y/\dot x)$ cannot tell $(1,1)$ from $(-1,-1)$, since both have ratio 1; atan2 looks at the signs of both components and so knows the quadrant. Worked example:</p>
$$\operatorname{atan2}(3.94,\ 2.10)=61.9^\circ,$$
<p>so the curve leaves $\bp$ steeply up and to the right. The orange arc in the figure shows this angle.</p>
<p>Why it is worth tracking: in the degenerate node the heading of a curve turns from $180^\circ$ (leaving the origin to the left) to $0^\circ$ (heading right far away), exactly half a turn. A node turns less, a spiral turns forever (step 13).</p>
<h3>Line 4: m and q, splitting the matrix</h3>
<p>Every 2×2 matrix can be split as</p>
$$\bA = m\bI + \bN,\qquad m=\frac{\Tr}{2}=\frac{\lambda_1+\lambda_2}{2},\qquad \bN=\bA-m\bI.$$
<p>$m\bI$ is a plain stretch by the average eigenvalue; $\bN$ is whatever is left over. Because the trace of $\bN$ is $\Tr-2m=0$, its two eigenvalues are opposites, $\pm\sqrt q$, and the Cayley–Hamilton theorem gives</p>
<details class="qa"><summary>The Cayley–Hamilton theorem in one line</summary><div><p>Every square matrix satisfies its own characteristic equation. For a 2×2 matrix $\bM$ with trace $T$ and determinant $D$ that means $\bM^2-T\bM+D\,\bI=\mathbf0$. Check it on $\bM=\begin{bmatrix}1&2\\0&1\end{bmatrix}$ ($T=2$, $D=1$): $\bM^2=\begin{bmatrix}1&4\\0&1\end{bmatrix}$ and $\bM^2-2\bM+\bI=\begin{bmatrix}1-2+1&4-4\\0&1-2+1\end{bmatrix}=\mathbf0$. For $\bN$, whose trace is 0 and whose determinant is $-q$, it reads $\bN^2-q\bI=\mathbf0$.</p></div></details>
$$\bN^2 = q\,\bI,\qquad q = m^2-\Det=\frac{\Tr^2-4\Det}{4}=\frac{\Delta}{4}.$$
<p>So $q$ is just the discriminant divided by 4, and its sign is the familiar decision: $q&gt;0$ two real eigenvalues, $q=0$ repeated, $q&lt;0$ complex. Worked example: $m=1$, $q=1-1=0$, the repeated case.</p>
<h3>Line 5: N and Np</h3>
<p>Multiplying the split by $\bp$ splits the velocity too:</p>
$$\bA\bp = m\,\bp + \bN\bp.$$
<p>$m\bp$ (teal dashed in the figure) points along $\bp$ itself: it only pushes the point straight out from, or in towards, the origin. $\bN\bp$ (magenta) is the rest: the part of the velocity that turns the point off its own ray. The two arrows add head to tail to give the dark velocity arrow.</p>
<p>Worked example:</p>
$$\bN=\begin{bmatrix}-1&1\\-1&1\end{bmatrix},\qquad \bN\bp=\begin{pmatrix}-0.26+2.10\\-0.26+2.10\end{pmatrix}=\begin{pmatrix}1.84\\1.84\end{pmatrix},$$
$$m\bp+\bN\bp=\begin{pmatrix}0.26+1.84\\2.10+1.84\end{pmatrix}=\begin{pmatrix}2.10\\3.94\end{pmatrix}=\bA\bp.$$
<p>In the repeated case $\bN^2=\mathbf0$, so $\bN$ sends every vector into the eigenline: $\bN\bp$ points along $(1,1)$, which is the eigenline of this matrix. That is why, far along the trajectory, everything lines up with the eigenline.</p>
<h3>Line 6: the solution formula</h3>
<p>The solution through $\bp$ is $\bx(t)=\exp(\bA t)\,\bp$, where $\exp(\bA t)$ is the <b>matrix exponential</b>.</p>
<details class="qa"><summary>What exp(At) is</summary><div><p>For a number, $\exp(at)=1+at+\frac{(at)^2}{2!}+\frac{(at)^3}{3!}+\cdots$. The same series with a matrix in place of the number defines $\exp(\bA t)=\bI+\bA t+\frac{\bA^2t^2}{2!}+\cdots$, a matrix that depends on $t$. Differentiating the series term by term gives $\frac{d}{dt}\exp(\bA t)=\bA\exp(\bA t)$, and at $t=0$ it equals $\bI$. So $\bx(t)=\exp(\bA t)\bp$ satisfies $\dot\bx=\bA\bx$ and starts at $\bp$: by uniqueness, it is the solution. The series is usually hard to sum, except that here it collapses, as the next lines show. Two matrices that commute ($\mathbf X\mathbf Y=\mathbf Y\mathbf X$) obey $\exp(\mathbf X+\mathbf Y)=\exp(\mathbf X)\exp(\mathbf Y)$, exactly like numbers; $m\bI$ commutes with everything.</p></div></details>
<p>Since $m\bI$ commutes with $\bN$, $\exp(\bA t)=\exp(mt)\exp(\bN t)$, and the series of $\exp(\bN t)$ collapses because $\bN^2=q\bI$:</p>
$$\exp(\bN t)=\bI+t\bN+\frac{t^2}{2}q\bI+\frac{t^3}{6}q\bN+\cdots = C(t)\,\bI + S(t)\,\bN.$$
<p>The even powers pile into $C(t)$ and the odd powers into $S(t)$, with $S$ multiplying $\bN$. So every trajectory of every 2×2 system is</p>
$$\bx(t)=\exp(mt)\bigl[C(t)\,\bp + S(t)\,\bN\bp\bigr].$$
<h3>Line 7: the three cases</h3>
<ul>
<li>$q=0$ (repeated): $C=1$, $S=t$, so $\bx(t)=\exp(mt)(\bp+t\bN\bp)$. Worked example: $$\bx(t)=\exp(t)\begin{pmatrix}0.26+1.84t\\ 2.10+1.84t\end{pmatrix}.$$ For large $|t|$ the $t\bN\bp$ term dominates and the direction tends to that of $\bN\bp$: the eigenline.</li>
<li>$q&gt;0$ (real, $r=\sqrt q$): $C=\cosh(rt)$, $S=\sinh(rt)/r$, where $\cosh u=\frac{\exp(u)+\exp(-u)}{2}$ and $\sinh u=\frac{\exp(u)-\exp(-u)}{2}$ are the hyperbolic cosine and sine: nothing but averages and half-differences of the two exponentials $\exp(\pm rt)$. Multiplied by $\exp(mt)$ they give $\exp((m\pm r)t)=\exp(\lambda_{1,2}t)$, the two eigenvalue exponentials. Equivalently, split $\bp=c_1\bv_1+c_2\bv_2$ along the two eigenlines and write $c_1\exp(\lambda_1t)\bv_1+c_2\exp(\lambda_2t)\bv_2$; the panel shows both forms.</li>
<li>$q&lt;0$ (complex, $\beta=\sqrt{-q}$): $C=\cos(\beta t)$, $S=\sin(\beta t)/\beta$. The bracket rotates with period $2\pi/\beta$ and $\exp(mt)$ sets the size.</li>
</ul>
<h3>Line 8: where it goes</h3>
<p>“$t\to+\infty$: runs off to infinity” and “$t\to-\infty$: $\to(0,0)$” summarise the exponential factor: the size $|\bx(t)|$ is computed at a far-future and a far-past time and compared with the size now. A trajectory that is tiny in the past and huge in the future comes out of the origin (repelled); the reverse means it goes into the origin (attracted); “stays at a similar size” is the centre.</p>
<h3>Line 9: vertical and horizontal tangents</h3>
<p>Along the curve the velocity components change sign at particular moments. Where $\dot x=0$ the curve is momentarily vertical (it has stopped moving across and is about to go the other way); where $\dot y=0$ it is horizontal. The panel finds these moments by watching for the sign changes along the solution and reports the point and the time. For the degenerate node the vertical tangent is the turn of the hook: the curve has left the origin to the left and swings round to head right.</p>
<div class="box try"><b>Try it</b>Load the worked example, then drag the point $\bp$ around (Inspect off). The teal and magenta arrows always add up to the dark one, and the magenta one always points along the eigenline. Then press “Complex (−1, 2)” and watch the heading rotate as you move $\bp$ round the origin.</div>`,

const TSTAGES = ['The 0-eigenline: stationary points', 'The −2-eigenline: straight in', 'One other trajectory', 'The whole comb'];
STEPS.push({

  eq: () => R`\lambda_1 = 0,\quad \lambda_2 = ${f(-2 * P.kf)}`,
  anim: true,

  controls: [

    {r: 'tk', label: 'Time t', min: 0, max: 4, step: 0.01},

    {btns: [['Textbook trajectory: 2(1,1) + (−1,1)exp(−2t)', () => { P.kf = 1; P.h10 = 1; P.h20 = 3; P.tk = 0; P.tstage = 3; }], ['Equal heights (stationary)', () => { P.h10 = 1.5; P.h20 = 1.5; P.tk = 0; }], ['Restart time', () => { P.tk = 0; }]]}
  ],
  secsMap: {eig0: ['Layer 1', 'How the 0-eigenline', 'The eigenvalues'], eig2: ['Layer 2', 'How the −2-eigenline', 'The eigenvalues'], stat: ['Layer 1', 'non-isolated'], comb: ['Layer 4', 'Why every trajectory is a straight'], traj: ['Layer 3', 'Why every trajectory is a straight'], start: ['From the starting heights'], target: ['From the starting heights', 'Layer 3'], dot: ['Layer 3'], tanks: ['What it means for the tanks'], h1t: ['What it means for the tanks'], h2t: ['What it means for the tanks']},
  psecsMap: {traj: ['Layer 3', 'Why every trajectory is a straight'], time: ['What it means for the tanks']},
  text: () => R`
<h2>A zero eigenvalue: two connected fluid tanks</h2>
<h3>The degenerate cases: boundaries between the regions</h3>
<p>The big regions of the trace–determinant plane correspond to nodes, saddles and spirals. What are the system behaviours on the <b>boundaries</b> of these regions? These cases are called <b>degenerate</b> cases. So far: systems on the upper vertical axis are centres (step 3), and systems on the critical parabola are degenerate or star nodes (steps 6 to 15). This step and the next two treat the remaining boundary, the horizontal Tr axis. There $\det\bA=\lambda_1\lambda_2=0$, so one of the eigenvalues is zero; the other is $\operatorname{tr}\bA=\lambda_1+\lambda_2$, which is nonzero except at the origin. (Step 19 shows the whole map with every boundary labelled.)</p>
<p>The textbook's example is a pair of connected tanks. Its phase portrait looks like neither a node nor a saddle: it is a two-sided <b>comb</b>. Each piece of the picture is derived below, so that nothing has to be taken on trust. Step 17 shows the general method for finding and drawing any line labelled with an eigenvalue, such as “$\lambda_1=0$” and “$\lambda_2=-2$” here: these lines are <b>eigenlines</b>.</p>
<h3>The system</h3>
<p>Two tanks hold fluid at heights $h_1$ and $h_2$ and are joined by a pipe at the bottom. Fluid flows from the higher tank to the lower one, faster when the difference is bigger. With flow rate 1:</p>
$$\dot h_1 = h_2 - h_1,\qquad \dot h_2 = h_1 - h_2\qquad\Longleftrightarrow\qquad \frac{d}{dt}\begin{pmatrix}h_1\\h_2\end{pmatrix}=\begin{bmatrix}-1&1\\1&-1\end{bmatrix}\begin{pmatrix}h_1\\h_2\end{pmatrix}.$$
<p>Read the first equation as “tank 1 rises when tank 2 is higher”. The tanks are non-leaking: adding the two equations gives $\frac{d}{dt}(h_1+h_2)=0$, so the total amount of fluid never changes. The slider “pipe flow rate $k$” multiplies the matrix by $k$ (a wider pipe); the textbook uses $k=1$.</p>
<h3>The eigenvalues</h3>
<p>$\Tr=-1+(-1)=-2$ and $\Det=(-1)(-1)-(1)(1)=0$. So the characteristic polynomial is</p>
$$\lambda^2-\Tr\,\lambda+\Det=\lambda^2+2\lambda=\lambda(\lambda+2)=0\quad\Longrightarrow\quad \lambda_1=0,\ \ \lambda_2=-2.$$
<p>$\Det=0$ always forces one eigenvalue to be zero, because $\Det=\lambda_1\lambda_2$. On the map this matrix sits on the Tr axis at $\Tr=-2$.</p>
<h3>How the 0-eigenline is found and drawn</h3>
<p>Solve $(\bA-0\bI)\bv=\mathbf0$, that is $\bA\bv=\mathbf0$:</p>
$$\begin{bmatrix}-1&1\\1&-1\end{bmatrix}\begin{pmatrix}v_1\\v_2\end{pmatrix}=\begin{pmatrix}-v_1+v_2\\v_1-v_2\end{pmatrix}=\mathbf0\quad\Longrightarrow\quad v_2=v_1\quad\Longrightarrow\quad \bv_1=\begin{pmatrix}1\\1\end{pmatrix}.$$
<p>Both rows say the same thing, $v_2=v_1$ (rank 1, step 7). The eigenline is every multiple of $(1,1)$: the points $(1,1),(2,2),(-1,-1),(0.5,0.5),\dots$, which all lie on the line $h_2=h_1$. That is the 45° diagonal through the origin, drawn in blue and labelled $\lambda_1=0$. In tank language: the states with equal heights.</p>
<h3>How the −2-eigenline is found and drawn</h3>
<p>Solve $(\bA+2\bI)\bv=\mathbf0$:</p>
$$\begin{bmatrix}1&1\\1&1\end{bmatrix}\begin{pmatrix}v_1\\v_2\end{pmatrix}=\begin{pmatrix}v_1+v_2\\v_1+v_2\end{pmatrix}=\mathbf0\quad\Longrightarrow\quad v_2=-v_1\quad\Longrightarrow\quad \bv_2=\begin{pmatrix}-1\\1\end{pmatrix}.$$
<p>Every multiple of $(-1,1)$: the points $(-1,1),(1,-1),(-2,2),\dots$, on the line $h_2=-h_1$. That is the other diagonal, drawn in orange and labelled $\lambda_2=-2$. Check both by multiplying: $\bA\binom11=\binom{0}{0}=0\cdot\binom11$ and $\bA\binom{-1}{1}=\binom{2}{-2}=-2\binom{-1}{1}$.</p>
<h3>The general solution</h3>
<p>Each eigenvalue–eigenvector pair gives a solution $\exp(\lambda t)\bv$. With $\lambda_1=0$, $\exp(0\cdot t)=1$, so that solution does not change in time at all:</p>
$$\begin{pmatrix}h_1(t)\\h_2(t)\end{pmatrix}=c_1\begin{pmatrix}1\\1\end{pmatrix}+c_2\begin{pmatrix}-1\\1\end{pmatrix}\exp(-2t).$$
<h3>Layer 1. On the 0-eigenline: stationary points</h3>
<p>Take $c_2=0$: the solution is $c_1\binom11$ for all time. It never moves: a <b>stationary point</b> (equilibrium). Its position on the diagonal depends on $c_1$. Directly: at any point $(c,c)$ the velocity is $\bA\binom cc=\binom{-c+c}{c-c}=\mathbf0$.</p>
<p>So <i>every</i> point of the 0-eigenline is stationary. Such equilibria are called <b>non-isolated critical points</b>: around each one there are other equilibria arbitrarily close, along the line. Compare a node or spiral, where the origin is the only equilibrium (an isolated one). In the figure they are the small open circles on the blue line.</p>
<h3>Layer 2. On the −2-eigenline: straight in</h3>
<p>Take $c_1=0$: the solution is $c_2\binom{-1}{1}\exp(-2t)$. It stays on the orange line (always a multiple of $(-1,1)$) and its size shrinks by the factor $\exp(-2t)$: halved every $0.35$ time units. So it slides straight into the origin, which is the stationary point at the crossing of the two lines. The arrows on the orange line point inward from both ends.</p>
<h3>Layer 3. Any other trajectory</h3>
<p>Now $c_1,c_2\neq0$. Split the solution into its two pieces:</p>
<ul>
<li>$c_1\binom11$ is a fixed point on the blue line. It never moves.</li>
<li>$c_2\binom{-1}{1}\exp(-2t)$ always points along $(-1,1)$ and only shrinks.</li>
</ul>
<p>So the state is “a fixed point plus a shrinking arrow parallel to the orange line”. It therefore moves along a straight line through $c_1\binom11$ <b>parallel to the −2-eigenline</b>, and as $t\to\infty$ the arrow vanishes and the state arrives at the point $c_1\binom11$ on the 0-eigenline. Which side of the blue line it comes from depends on the sign of $c_2$.</p>
<p>The textbook's example, $2\binom11+\binom{-1}{1}\exp(-2t)$ ($c_1=2$, $c_2=1$):</p>
<table class="num"><tr><th>t</th><th>exp(−2t)</th><th>h₁</th><th>h₂</th></tr>
<tr><td>0</td><td>1</td><td>1.000</td><td>3.000</td></tr>
<tr><td>0.25</td><td>0.607</td><td>1.393</td><td>2.607</td></tr>
<tr><td>0.5</td><td>0.368</td><td>1.632</td><td>2.368</td></tr>
<tr><td>1</td><td>0.135</td><td>1.865</td><td>2.135</td></tr>
<tr><td>2</td><td>0.018</td><td>1.982</td><td>2.018</td></tr>
<tr><td>∞</td><td>0</td><td>2</td><td>2</td></tr></table>
<p>Every row satisfies $h_1+h_2=4$: all the points lie on the straight line $h_2=4-h_1$, which is parallel to $h_2=-h_1$. They end at $(2,2)$. Press the “Textbook trajectory” button to see it.</p>
<h3>Why every trajectory is a straight line: the velocity check</h3>
<p>There is an even quicker way to see the shape, straight from the matrix. At any point,</p>
$$\bA\begin{pmatrix}h_1\\h_2\end{pmatrix}=\begin{pmatrix}h_2-h_1\\h_1-h_2\end{pmatrix}=(h_1-h_2)\begin{pmatrix}-1\\1\end{pmatrix}.$$
<p>The velocity always points along $(-1,1)$, the orange direction: towards the diagonal from either side, with speed proportional to $h_1-h_2$, the distance from it. A point that only ever moves in one fixed direction travels along a straight line, and it slows down as it nears the blue line, where the speed becomes zero. That is why every tooth of the comb is a straight segment ending on the blue line.</p>
<h3>Layer 4. The whole comb</h3>
<p>Draw one such segment through every point of the blue line, from both sides: the result looks like a two-sided comb whose spine is the 0-eigenline and whose teeth run parallel to the −2-eigenline. (For this symmetric matrix the teeth meet the spine at right angles; for other matrices with a zero eigenvalue they are slanted, as in step 3's “Zero eigenvalue” example.) On the map, the whole Tr axis has this kind of picture: arrows point towards the line of equilibria when the other eigenvalue $\Tr$ is negative, and away from it when $\Tr$ is positive.</p>
<h3>From the starting heights to c₁ and c₂</h3>
<p>Put $t=0$ in the general solution: $h_1(0)=c_1-c_2$ and $h_2(0)=c_1+c_2$. Adding and subtracting:</p>
$$c_1=\frac{h_1(0)+h_2(0)}{2},\qquad c_2=\frac{h_2(0)-h_1(0)}{2}.$$
<p>So $c_1$ is the <b>average height</b> and $c_2$ is half the <b>difference</b>. The trajectory ends at $c_1\binom11$: both tanks at the average height. Since $h_1+h_2=2c_1$ for all time, the total amount of fluid is conserved, as it must be.</p>
<h3>What it means for the tanks</h3>
<ul>
<li>Equal starting heights ($c_2=0$): no flow through the pipe; the heights stay as they are. That is a stationary point on the 0-eigenline.</li>
<li>Different starting heights: fluid flows from the higher tank to the lower. The difference $h_2-h_1=2c_2\exp(-2t)$ shrinks exponentially, and both heights approach the average. In the phase plane, the state slides along a tooth of the comb towards the diagonal.</li>
</ul>
<p>The eigenvalue $-2$ is the rate at which the <i>difference</i> decays; the eigenvalue $0$ says the <i>total</i> does not decay at all. Increase $k$ (a wider pipe) and only the first rate changes: $\lambda_2=-2k$.</p>
<div class="box try"><b>Try it</b>Pick the layer boxes in order to build the picture as the textbook does. Then press “Play time” and watch the dot slide down its tooth while the tanks level out. Tap a different starting point in the phase plane (Inspect off), or tap any tooth or empty spot with Inspect on to analyse that trajectory.</div>`,
  explain: () => R`<p>Layer ${P.tstage} of 4: ${TSTAGES[P.tstage - 1].toLowerCase()}. The phase plane has $h_1$ across and $h_2$ up; the tanks and the graph show the same motion.</p>` + TAPHINT,
  parts(){
    const s = tankSol(P.tk), st = P.tstage, l2 = -2 * P.kf, out = [
      {id: 'eig0', name: 'The 0-eigenline (blue)', col: COL.blue, short: 'h₂ = h₁: equal heights; every point is stationary.', detail: () => C.ln(R`\bA\begin{pmatrix}1\\1\end{pmatrix} = \begin{pmatrix}${f(-P.kf)} + ${f(P.kf)}\\ ${f(P.kf)} - ${f(P.kf)}\end{pmatrix} = \begin{pmatrix}0\\0\end{pmatrix} = 0\cdot\begin{pmatrix}1\\1\end{pmatrix}`, 'eigenvalue 0, eigenvector (1, 1)') + C.p('Every multiple of (1, 1) lies on the line h₂ = h₁, the 45° diagonal.')},
      {id: 'stat', name: 'Stationary points (open circles)', col: COL.blue, short: 'non-isolated critical points along the blue line.', detail: k => { const c = k === null ? 1 : +k; return C.ln(R`\bA\begin{pmatrix}${f(c)}\\ ${f(c)}\end{pmatrix} = \begin{pmatrix}0\\0\end{pmatrix}`, 'zero velocity: this point never moves') + C.p('Equal heights: no flow in the pipe.'); }}
    ];
    if (st >= 2) out.push({id: 'eig2', name: 'The ' + ft(l2) + '-eigenline (orange)', col: COL.org, short: 'h₂ = −h₁: solutions slide straight into the origin.', detail: () => C.ln(R`\bA\begin{pmatrix}-1\\1\end{pmatrix} = \begin{pmatrix}${f(2 * P.kf)}\\ ${f(-2 * P.kf)}\end{pmatrix} = ${f(l2)}\begin{pmatrix}-1\\1\end{pmatrix}`, 'eigenvalue ' + ft(l2) + ', eigenvector (−1, 1)') + C.ln(R`c_2\begin{pmatrix}-1\\1\end{pmatrix}\exp(${f(l2)}t)`, 'shrinks to the origin, halving every ' + ft(Math.log(2) / (2 * P.kf), 3) + ' time units')});
    if (st >= 3){
      out.push({id: 'traj', name: 'Your trajectory (magenta)', col: COL.mag, short: 'a straight segment parallel to the orange line.', detail: () => tankCalc(P.h10, P.h20)});

      out.push({id: 'target', name: 'End point c₁(1, 1)', col: COL.blue, short: 'both tanks at the average height.', detail: () => C.ln(R`c_1 = \frac{${f(P.h10)} + ${f(P.h20)}}{2} = ${f(s.c1, 3)}`, 'the average height') + C.ln(R`c_1\begin{pmatrix}1\\1\end{pmatrix} = (${f(s.c1, 3)},\ ${f(s.c1, 3)})`)});

    }
    if (st >= 4) out.push({id: 'comb', name: 'The comb (black teeth)', col: '#3a3f48', short: 'one tooth through every stationary point, from both sides. Tap one to analyse it.', detail: () => groupNote('tooth')});
    out.push({id: 'tanks', name: 'The two tanks', col: '#d9a520', short: 'the same motion as heights of fluid.', detail: () => C.ln(R`h_1 = ${f(s.h1, 3)},\quad h_2 = ${f(s.h2, 3)},\quad h_1 + h_2 = ${f(s.h1 + s.h2, 3)}`, 'the total never changes') + C.ln(R`\text{flow through the pipe} = k(h_2 - h_1) = ${f(P.kf * (s.h2 - s.h1), 3)}`, s.h2 > s.h1 ? 'positive: from tank 2 into tank 1' : s.h2 < s.h1 ? 'negative: from tank 1 into tank 2' : 'zero: no flow')});
    out.push({id: 'h1t', name: 'h₁(t) (amber)', col: COL.amb, short: 'height of tank 1 against time.', detail: () => C.ln(R`h_1(t) = c_1 - c_2\exp(${f(l2)}t) = ${f(s.c1, 3)} ${sg(-s.c2, 3)}\exp(${f(l2)}t)`)});
    out.push({id: 'h2t', name: 'h₂(t) (teal)', col: COL.teal, short: 'height of tank 2 against time.', detail: () => C.ln(R`h_2(t) = c_1 + c_2\exp(${f(l2)}t) = ${f(s.c1, 3)} ${sg(s.c2, 3)}\exp(${f(l2)}t)`)});
    return out;
  },

<h2>Drawing eigenlines</h2>
<p>Many figures in this app show straight lines through the origin labelled with an eigenvalue, such as “$\lambda_1=0$” and “$\lambda_2=-2$” in the two-tank example. This step shows exactly how such a line is found and drawn, in six stages. Pick a matrix and a stage under the figure; the live panel shows every number.</p>
<h3>Is this an eigenline?</h3>
<p>Yes. A line labelled with a value of $\lambda$ is the <b>eigenline</b> of that eigenvalue: the straight line through the origin made of all multiples of its eigenvector. It is labelled with $\lambda$ because $\lambda$ says how points on it move: $\exp(\lambda t)$ stretches them outward ($\lambda&gt;0$), shrinks them inward ($\lambda&lt;0$), or leaves them fixed ($\lambda=0$).</p>
<h3>Stage 1. Find the eigenvalues</h3>
<p>Solve $\lambda^2-\Tr\,\lambda+\Det=0$. For the tanks, $\bA=\begin{bmatrix}-1&1\\1&-1\end{bmatrix}$: $\Tr=-2$, $\Det=0$, so $\lambda^2+2\lambda=\lambda(\lambda+2)=0$ and $\lambda=0$ or $-2$. Each real eigenvalue will give one line (or, for $\bA=\lambda\bI$, every line). Complex eigenvalues give no line at all.</p>
<h3>Stage 2. Solve for the first eigenvector</h3>
<p>An eigenvector satisfies $\bA\bv=\lambda\bv$, which rearranges to $(\bA-\lambda\bI)\bv=\mathbf0$. Subtract $\lambda$ from the diagonal and write out the two rows. Because $\lambda$ is an eigenvalue, $\det(\bA-\lambda\bI)=0$: the two rows are multiples of each other, so they give <b>one</b> equation, not two. For the tanks and $\lambda=0$:</p>
$$\begin{bmatrix}-1&1\\1&-1\end{bmatrix}\begin{pmatrix}v_1\\v_2\end{pmatrix}=\mathbf0\quad\Longrightarrow\quad -v_1+v_2=0\quad\Longrightarrow\quad v_2=v_1.$$
<p>One equation in two unknowns leaves one free choice. Choosing $v_1=1$ gives $\bv=(1,1)$; choosing $v_1=2$ gives $(2,2)$, which is the same direction. Check by multiplying: $\bA\binom11=\binom00=0\cdot\binom11$. In the figure the dark arrow is $\bv$ and the dashed arrow is $\bA\bv$, which lies along $\bv$ (here it has length zero).</p>
<h3>Stage 3. Draw the first eigenline</h3>
<p>Take every multiple $s\,\bv$: $s=1$ gives $(1,1)$, $s=2$ gives $(2,2)$, $s=-1$ gives $(-1,-1)$, $s=0.5$ gives $(0.5,0.5)$. All these points lie on one straight line through the origin, here $h_2=h_1$ (slope $v_2/v_1=1$). That line is the eigenline. The dots in the figure are the multiples; the test point (slider “multiple $s$”) can be dragged along the line, and at every position its velocity $\bA(s\bv)=\lambda s\bv$ points along the line itself.</p>
<p>In general the slope of the eigenline is $v_2/v_1$, and its equation is $y=(v_2/v_1)\,x$; if $v_1=0$ it is the vertical axis.</p>
<h3>Stage 4. The second eigenline</h3>
<p>Repeat with the other eigenvalue. Tanks, $\lambda=-2$: $\bA+2\bI=\begin{bmatrix}1&1\\1&1\end{bmatrix}$, so $v_1+v_2=0$, $\bv=(1,-1)$ (the textbook writes $(-1,1)$, the same line). Its multiples lie on $h_2=-h_1$, the other diagonal. Check: $\bA\binom{1}{-1}=\binom{-2}{2}=-2\binom{1}{-1}$.</p>
<p>A repeated eigenvalue with $\bA\neq\lambda\bI$ gives only one line (step 7), so stage 4 shows nothing new; with $\bA=\lambda\bI$ every line is an eigenline.</p>
<h3>Stage 5. Motion along each line</h3>
<p>A start on an eigenline, $\bx(0)=s\bv$, gives $\bx(t)=s\exp(\lambda t)\,\bv$: it never leaves the line, and only its distance from the origin changes. So each eigenline gets arrows by the sign of its $\lambda$:</p>
<ul><li>$\lambda&gt;0$: arrows point away from the origin (points slide out).</li>
<li>$\lambda&lt;0$: arrows point towards the origin (points slide in). Tanks: $-2$, so the orange line has arrows pointing in, and points halve their distance every $0.35$ time units.</li>
<li>$\lambda=0$: no arrows at all; every point is a stationary point, drawn as an open circle. Tanks: the blue line.</li></ul>
<h3>Stage 6. The rest of the portrait</h3>
<p>Every other solution is a combination $c_1\exp(\lambda_1t)\bv_1+c_2\exp(\lambda_2t)\bv_2$, and its curve is shaped by the two lines: as time runs, the term with the larger $\lambda$ dominates, so curves end up parallel to that line, and near the origin (or in the past) the other line wins. For the tanks one term never changes, so the curves are straight segments parallel to the orange line, ending on the blue one: the comb of step 16 and step 18.</p>
<div class="box try"><b>Try it</b>Choose “Slanted comb” and go through the stages: the two lines are no longer the diagonals, but the same three calculations (subtract λ, read one row, take multiples) place them. Then choose “Custom” and make your own matrix: the live panel solves it line by line.</div>`,

<h2>Combs</h2>
<p>The two-tank example (step 16) generalizes: whenever a system has <b>one zero and one nonzero eigenvalue</b>, its phase portrait is a <b>comb</b>.</p>
<h3>Definition</h3>
<p><b>Comb:</b> the eigenvalues are real and distinct, with exactly one of them zero. Write $\lambda_1=0$ and $\lambda_2\neq0$, with eigenvectors $\bv_1$ and $\bv_2$ (step 17 shows how to find them and draw their eigenlines).</p>
<h3>Every point on the 0-eigenline is stationary</h3>
<p>For a point $s\bv_1$ on the 0-eigenline, $\bA(s\bv_1)=s\cdot0\cdot\bv_1=\mathbf0$: zero velocity. So the whole line is made of stationary points, the spine of the comb.</p>
<h3>General solution</h3>
$$\bx(t)=c_1\bv_1+c_2\exp(\lambda_2t)\,\bv_2.$$
<p>The first term has $\exp(0\cdot t)=1$ and never changes. The constants come from the start: write $\bx(0)=c_1\bv_1+c_2\bv_2$, that is, split the starting point along the two eigenlines (the live panel does it).</p>
<h3>Other trajectories</h3>
<p>Other trajectories run along lines <b>parallel to the eigenline of</b> $\lambda_2\neq0$, and</p>
<ul><li>tend to infinity if $\lambda_2&gt;0$: $\exp(\lambda_2t)$ grows, so the point moves away from the spine forever (a <b>repelling comb</b>);</li>
<li>approach the 0-eigenline if $\lambda_2&lt;0$: $\exp(\lambda_2t)\to0$, so the point arrives at $c_1\bv_1$ (an <b>attracting comb</b>).</li></ul>
<h3>Why straight, and why parallel to v₂</h3>
<p>The velocity of any solution is $\dot\bx=c_2\lambda_2\exp(\lambda_2t)\,\bv_2$: always a multiple of $\bv_2$. A point that only ever moves in one direction travels along a straight line, so every tooth of the comb is a straight segment in the direction of $\bv_2$. The teeth need not be perpendicular to the spine: tilt the two directions with the sliders and the comb slants, exactly as in the textbook's figure.</p>
<h3>On the trace–determinant plane</h3>
<p>$\Det=\lambda_1\lambda_2=0\cdot\lambda_2=0$ and $\Tr=\lambda_1+\lambda_2=\lambda_2\neq0$. So combs sit on the horizontal Tr axis, everywhere except the origin (at the origin both eigenvalues would be 0). The sign of $\Tr=\lambda_2$ decides the type: on the <b>left half</b> ($\Tr&lt;0$) the combs are <b>attracting</b>; on the <b>right half</b> ($\Tr&gt;0$) they are <b>repelling</b>. Conversely, $\det\bA=0$ with $\operatorname{tr}\bA\neq0$ always means a comb.</p>
<div class="box try"><b>Try it</b>Press “Two tanks”: the comb of step 16. Now slide λ₂ from −2 through 0 to +2 and watch the arrows on the teeth flip while the map point crosses the origin from the attracting half to the repelling half. Tilt v₁ and v₂ to slant the comb.</div>`,

  const A = combA(), [v1, v2] = combVecs(), cc = combCoords(p), l2 = P.cl2;

  h += C.ln(R`\dot\bx = ${f(cc[1] * l2, 3)}\exp(${f(l2)}t)\,\bv_2`, 'always along v₂: the path is a straight line parallel to the orange eigenline');
  if (Math.abs(cc[1]) < 1e-6) h += C.res('c₂ = 0: the start is on the spine, a stationary point.');

  return h;
}

  text: () => R`
<h2>The full trace–determinant picture</h2>
<h3>Two different planes</h3>
<p>The <b>trace–determinant plane</b> has axes Tr and Det. It is completely different from the <b>phase plane</b>, whose axes are $x$ and $y$ (or $h_1,h_2$). A phase portrait shows all possible trajectories of one system $\dot\bx=\bA\bx$ for one specific $\bA$. In the trace–determinant plane that whole system is just <b>one point</b>, $(\operatorname{tr}\bA,\det\bA)$, and the position of that point tells which kind of phase portrait the system has. The figure shows both: the map on the left, and on the right the phase portrait belonging to your point.</p>
<h3>The big regions</h3>
<p>Above the critical parabola $\Det=\Tr^2/4$ the eigenvalues are complex: spiral sinks ($\Tr&lt;0$) and spiral sources ($\Tr&gt;0$). Below the parabola they are real and distinct: nodal sinks and nodal sources above the Tr axis, saddles below it (step 2 explains each sign).</p>
<h3>The boundaries: degenerate cases</h3>
<p>The big regions correspond to nodes, saddles and spirals. The systems on the <b>boundaries</b> between regions are called <b>degenerate cases</b>:</p>
<ul>
<li><b>The upper vertical axis</b> ($\Tr=0$, $\Det&gt;0$): <b>centres</b>, between spiral sinks and spiral sources (step 3).</li>
<li><b>The critical parabola</b> ($\Det=\Tr^2/4$): <b>degenerate nodes and star nodes</b>, between nodes and spirals (steps 6 to 15). Both kinds sit at the same point: the map cannot tell them apart. Tick the box under the figure to switch the portrait between them.</li>
<li><b>The horizontal Tr axis</b> ($\Det=\lambda_1\lambda_2=0$): one eigenvalue is zero. The other is $\Tr=\lambda_1+\lambda_2$, nonzero except at the origin. These are <b>combs</b>: attracting on the left half, repelling on the right half (steps 16 and 18).</li>
</ul>
<p>Each boundary is defined by an <b>equation</b> ($\Tr=0$, $\Det=\Tr^2/4$, $\Det=0$), while each big region is defined by <b>inequalities</b>. A point satisfying an equation is a needle in a haystack: almost any small change to the matrix knocks it off. That is the idea of structural stability (step 21).</p>
<h3>The origin</h3>
<p>At $(0,0)$ both eigenvalues are zero. Two quite different systems live there: $\bA=\mathbf0$, where every point is stationary, and nonzero matrices like $\begin{bmatrix}0&1\\0&0\end{bmatrix}$, where $\dot x=y,\ \dot y=0$: trajectories are horizontal lines travelled at constant speed (step 15). The origin of the map is drawn as an open circle because it belongs to none of the named types.</p>
<div class="box try"><b>Try it</b>Use the preset buttons to visit each boundary, then drag the point a tiny distance off it in each direction: the portrait on the right changes type. Inside a big region, dragging changes the portrait's shape but never its type.</div>`,

<h2>Stability</h2>
<p>An important question for a given system $\dot\bx=\bA\bx$ is whether it is stable. For example, damped oscillators (with nonzero damping) are always stable: whatever the start, the motion dies out.</p>
<h3>Three words</h3>
<ul>
<li><b>Stable:</b> all trajectories tend to $\mathbf0$ as $t\to+\infty$.</li>
<li><b>Unstable:</b> some trajectories are unbounded as $t\to+\infty$ (they grow without limit).</li>
<li><b>Semistable</b> (or <b>neutrally stable</b>): the borderline case in which all solutions are bounded, but not all tend to $\mathbf0$. Example: a centre, which corresponds to an undamped oscillator; it swings forever with the same amplitude. Another: an attracting comb, whose solutions settle on the 0-eigenline but not at the origin.</li>
</ul>
<p>The plot on the right shows the size $|\bx(t)|$ of eight solutions starting on the unit circle, on a log scale: falling lines mean stable, level lines semistable, rising lines unstable.</p>
<h3>When are the real parts of the eigenvalues negative?</h3>
<p>Every solution is built from $\exp(\lambda_1t)$ and $\exp(\lambda_2t)$ (with $\cos$ and $\sin$ in the complex case), and $|\exp(\lambda t)|=\exp(\operatorname{Re}\lambda\cdot t)$. So all solutions tend to 0 exactly when $\operatorname{Re}\lambda_1&lt;0$ and $\operatorname{Re}\lambda_2&lt;0$. The question becomes one about a quadratic.</p>
<p><b>Question.</b> For the polynomial $\lambda^2+b\lambda+c$, what are the signs of $b$ and $c$ so that the real parts of both roots are negative? <b>Answer:</b> $b$ positive and $c$ positive.</p>
<p><b>Why.</b> The roots are $\lambda_{1,2}=\frac{-b\pm\sqrt{b^2-4c}}{2}$. There are three cases.</p>
<ul>
<li><b>$b^2-4c&gt;0$:</b> the roots are real and distinct. The larger one, $\frac{-b+\sqrt{b^2-4c}}{2}$, decides. If $b&gt;0$, it is negative only when $\sqrt{b^2-4c}&lt;b$, that is $b^2-4c&lt;b^2$, that is $c&gt;0$. If $b&lt;0$, it is positive, because $-b&gt;0$ and $\sqrt{b^2-4c}&gt;0$. Example: $\lambda^2+3\lambda+2$, roots $-1,-2$.</li>
<li><b>$b^2-4c=0$:</b> the repeated root $-\frac b2$ is negative exactly when $b&gt;0$; and since $b^2=4c$, then also $c&gt;0$. Example: $\lambda^2+2\lambda+1$, root $-1$ twice.</li>
<li><b>$b^2-4c&lt;0$:</b> complex roots with real part $-\frac b2$ and nonzero imaginary part. The real part is negative exactly when $b&gt;0$; and $b^2&lt;4c$ forces $c&gt;0$ too. Example: $\lambda^2+2\lambda+5$, roots $-1\pm2i$.</li>
</ul>
<p>In all three cases: $\operatorname{Re}\lambda_1&lt;0$ and $\operatorname{Re}\lambda_2&lt;0$ <b>if and only if</b> $b&gt;0$ and $c&gt;0$.</p>
<h3>Tests for stability</h3>
<p>Stability is decided by the eigenvalues, so for 2×2 systems it is decided by the trace and determinant. The characteristic polynomial is $\det(\bA-\lambda\bI)=\lambda^2-\Tr\,\lambda+\Det$, so $b=-\Tr$ and $c=\Det$:</p>
$$\begin{aligned}\dot\bx=\bA\bx\text{ is stable}&\iff\operatorname{Re}\lambda_1,\ \operatorname{Re}\lambda_2&lt;0\quad(\text{so }\exp(\lambda_1t),\exp(\lambda_2t)\to0)\\&\iff\text{the characteristic polynomial has positive coefficients}\\&\iff\operatorname{tr}\bA&lt;0\ \text{ and }\ \det\bA&gt;0.\end{aligned}$$
<p>These tests are the same as for a single second-order equation $\ddot x+b\dot x+cx=0$: positive damping $b$ and positive stiffness $c$.</p>
<h3>The stability map</h3>
<ul>
<li><b>Stable:</b> the open upper-left quadrant, $\Tr&lt;0$ and $\Det&gt;0$: spiral sinks, nodal sinks, and the degenerate and star sinks on the left half of the parabola.</li>
<li><b>Semistable:</b> the positive Det axis (centres) and the negative Tr axis (attracting combs).</li>
<li><b>Unstable:</b> everything else: the right half ($\Tr&gt;0$), all saddles ($\Det&lt;0$), and the repelling combs.</li>
<li><b>The origin</b> is special: $\bA=\mathbf0$ is semistable (nothing moves), while a nonzero matrix there is unstable (solutions grow like $t$).</li>
</ul>
<h3>Concept check 1</h3>
<p>The matrix $\bA=\begin{bmatrix}a&1\\1&a\end{bmatrix}$ has real eigenvalues. For which $a$ is $\dot\bx=\bA\bx$ stable? Choose “Concept check 1” under the figure and slide $a$.</p>
<details class="qa"><summary>Solution</summary><div><p>Stable means $\operatorname{tr}\bA&lt;0$ and $\det\bA&gt;0$:</p>
$$\operatorname{tr}\bA=2a&lt;0,\qquad \det\bA=a^2-1&gt;0.$$
<p>The first gives $a&lt;0$; the second gives $a&gt;1$ or $a&lt;-1$. Together: $\boldsymbol{a&lt;-1}$. On the map, these matrices trace the dashed curve $\Det=\Tr^2/4-1$ (put $\Tr=2a$ into $a^2-1$), a copy of the critical parabola shifted down by 1, which is why the eigenvalues are always real. Only its part in the green quadrant is stable.</p></div></details>
<h3>Concept check 2</h3>
<p>The matrix $\mathbf B=\begin{bmatrix}b&-1\\1&b\end{bmatrix}$ has complex eigenvalues. For which $b$ do all solutions of $\dot\bx=\mathbf B\bx$ tend to $(0,0)$?</p>

$$\operatorname{tr}\mathbf B=2b&lt;0,\qquad \det\mathbf B=b^2+1&gt;0.$$
<p>The first gives $b&lt;0$; the second holds for every real $b$. Together: $\boldsymbol{b&lt;0}$. These matrices lie on $\Det=\Tr^2/4+1$, above the critical parabola (complex eigenvalues $b\pm i$): spiral sinks for $b&lt;0$, a centre at $b=0$, spiral sources for $b&gt;0$.</p></div></details>`,

<h2>Structural stability</h2>
<p>Stability (step 20) is a question about the solutions of one fixed system. There is a different, equally important question: what happens if the <b>system itself</b> is changed slightly, by perturbing the matrix $\bA$? Real coefficients are measured, rounded and approximated, so a picture that falls apart under the tiniest change in $\bA$ cannot be trusted. This is the <b>structural stability</b> of the system.</p>
<h3>Definition</h3>
<p><b>Definition.</b> If the phase portrait type is robust, in the sense that small perturbations in the entries of $\bA$ do not change the type of the phase portrait, then the system is called <b>structurally stable</b>.</p>
<h3>Structurally stable systems</h3>
<p>Structurally stable systems are those corresponding to the large regions of the trace–determinant plane, not the borderline cases. Hence, for a 2×2 matrix $\bA$, the system $\dot\bx=\bA\bx$ is structurally stable <b>if and only if</b> the eigenvalues of $\bA$ are</p>
<ul><li>real, distinct and nonzero, corresponding to saddles, nodal sources or nodal sinks; or</li>
<li>complex with nonzero real part, corresponding to spirals.</li></ul>
<p>The systems on the <b>boundaries</b> between different phase portrait types are <b>structurally unstable</b>. The reason is in the map: a small change in the four entries of $\bA$ moves $(\Tr,\Det)$ by a small amount in some direction. Inside a big region, a small enough move stays inside. On a boundary curve, almost every direction leaves the curve. Choose “Random small changes” under the figure to see this: start from a centre and the 80 nudged matrices land on both sides of the Det axis, as spiral sinks and spiral sources, and none of them is still a centre; start from a spiral sink and all 80 stay spiral sinks.</p>
<h3>Two connected fluid tanks</h3>
<p>Recall the tanks of step 16: $\dot\bx=\bA\bx$ with $\bA=\begin{bmatrix}-1&1\\1&-1\end{bmatrix}$ and $\bx=\binom{h_1}{h_2}$. The eigenvalues are $0$ and $-2$, so the system sits on the negative Tr axis: its phase portrait is a comb. It is <b>semistable</b>, since every trajectory approaches a point on the 0-eigenline. But it is <b>structurally unstable</b>. To see this, perturb the lower-right entry of $\bA$.</p>
<h3>System with one leaky tank</h3>
<p>Let fluid leak from tank 2 at the rate $b\,h_2$. The system becomes $\dot\bx=\widetilde{\bA}\bx$ with</p>
$$\widetilde{\bA}=\begin{bmatrix}-1&1\\1&-1-b\end{bmatrix},\qquad b&gt;0,$$
<p>a perturbation of $\bA$ in one entry. Its trace is $-2-b$ and its determinant is $(-1)(-1-b)-1=b$, so its eigenvalues are the roots of</p>
$$\lambda^2+(2+b)\lambda+b=0\quad\Longrightarrow\quad\lambda=\frac{-(2+b)\pm\sqrt{(2+b)^2-4b}}{2}=\frac{-(2+b)\pm\sqrt{4+b^2}}{2}.$$
<p>The discriminant $4+b^2$ is positive, so the eigenvalues are real and distinct. Since $(2+b)^2=4+4b+b^2&gt;4+b^2$ when $b&gt;0$, the square root is smaller than $2+b$, and <b>both eigenvalues are negative</b>. With $b=0.3$: $\lambda=\frac{-2.3\pm2.022}{2}=-0.139$ and $-2.161$. The phase portrait is a <b>node sink</b>: the perturbed system is stable, since all trajectories tend to the origin. Physically, both tanks eventually empty out, as long as there is a leak.</p>
<p>If $b&lt;0$ instead, which corresponds to fluid continuously flowing into tank 2, then $\det\widetilde{\bA}=b&lt;0$: a saddle, and the system is unstable. The amount of fluid in the two tanks grows without limit; more realistically, both tanks eventually overflow.</p>
<h3>Conclusion</h3>
<p>The phase portrait of the system with $b=0$, a comb, is of a different type from the phase portrait of the system with any value of $b$ where $b&gt;0$, a nodal sink. The qualitative behaviour of the system with $b=0$ is changed drastically by the slightest change in $b$. Therefore the system with $b=0$ is structurally unstable. On the map, the point $(-2-b,\ b)$ moves straight off the Tr axis, upward into the nodal sinks for $b&gt;0$ and downward into the saddles for $b&lt;0$.</p>
<h3>Concept check</h3>
<p>Consider a system $\dot\bx=\bA\bx$ with $\operatorname{tr}\bA=0$ and $\det\bA=2$. Its phase portrait is a centre. What is most likely to happen to the phase portrait if one makes very small changes in the entries of $\bA$: a centre, a spiral, a degenerate or star node, a node source or sink, a comb, or a saddle?</p>
<details class="qa"><summary>Solution</summary><div><p><b>A spiral.</b> The system is represented by the point $(0,2)$ on the positive Det axis, far from the origin. It is surrounded by the big regions of spiral sinks and spiral sources, so any small change in the entries of the matrix will most likely move the point into one of them and result in a spiral phase portrait. Check it with the random nudges starting from the centre.</p></div></details>

<h2>A worked exam problem, from start to finish</h2>
<div class="box ask"><b>Question: the family of matrices $\bA=\begin{bmatrix}a&2\\-2&-1\end{bmatrix}$ is given. For each of $a=-6,\ -5,\ -2,\ 1,\ 2,\ 3,\ 4,\ 5$: what type of phase portrait does $\dot\bx=\bA\bx$ have, is it stable, and which way does any spiral or centre turn?</b>
<p>Everything needed is already in this app: the two numbers of step 1 (trace and determinant), the three questions of step 2, and one small extra trick for the direction of turning. This step works the whole problem slowly, one piece at a time. The letter $a$ is doing double duty: it is the top-left <i>entry</i> of the matrix and also the <i>parameter</i> being varied.</p></div>
<h3>0. What the question is asking, in plain words</h3>
<p>$\dot\bx=\bA\bx$ is a <b>rule of motion</b>. Put a point anywhere in the plane; the matrix looks at where the point is and tells it which way to drift and how fast. The point then traces out a path. Draw many such paths at once and the picture is the <b>phase portrait</b>.</p>
<p>Each value of $a$ gives a different matrix, so a different rule, so a different picture. The exercise asks three things about each of the eight pictures:</p>
<ul>
<li><b>Which picture is it?</b> The possible shapes all appear in this app: node (step 2), spiral, centre, saddle, comb (step 18), defective/degenerate node (steps 7–12), star node (step 14).</li>
<li><b>Is it stable?</b> Three words, in plain language:</li>
</ul>
<table class="num" style="text-align:left"><tr><th style="text-align:left">word</th><th style="text-align:left">what actually happens</th></tr>
<tr><td style="text-align:left">stable</td><td style="text-align:left">every path falls into (0, 0): the motion dies out</td></tr>
<tr><td style="text-align:left">unstable</td><td style="text-align:left">some paths run off to infinity</td></tr>
<tr><td style="text-align:left">neutrally stable</td><td style="text-align:left">nothing escapes, but not everything falls in (e.g. loops that circle forever)</td></tr></table>
<ul>
<li><b>Which way does it turn?</b> Only rotating pictures — spirals and centres — have a direction. Clockwise or anticlockwise is read straight off the arrows.</li>
</ul>
<div class="box key"><b>The one idea behind the whole exercise</b>Every solution of $\dot\bx=\bA\bx$ is built out of the two functions $\exp(\lambda_1 t)$ and $\exp(\lambda_2 t)$, where $\lambda_1,\lambda_2$ are the <b>eigenvalues</b> of the matrix. Each eigenvalue is a growth rate: negative means that piece shrinks, positive means it grows, and an $i$ in it means the motion rotates. So the entire exercise is: <i>find the two eigenvalues for each $a$, then read their signs</i>. Nothing else is needed.</div>
<h3>1. Two numbers from one matrix</h3>
<p>Match the matrix against the general $\begin{bmatrix}a&b\\c&d\end{bmatrix}$: top-left $=a$, top-right $b=2$, bottom-left $c=-2$, bottom-right $d=-1$. Then</p>
$$\operatorname{tr}\bA = a + d = a + (-1) = a - 1,$$
$$\det\bA = ad - bc = (a)(-1) - (2)(-2) = -a + 4 = 4 - a.$$
<p>Watch the sign in the determinant: $-(2)(-2)$ is $+4$, a very common slip. Worked numbers: $a=-6$ gives $\Tr=-7,\ \Det=10$; $a=5$ gives $\Tr=4,\ \Det=-1$.</p>
<h3>2. The eigenvalues, from the quadratic formula</h3>
<p>The eigenvalues always solve $\lambda^2-\Tr\,\lambda+\Det=0$ (step 6), so here</p>
$$\lambda^2-(a-1)\lambda+(4-a)=0,\qquad \lambda=\frac{(a-1)\pm\sqrt{\Delta}}{2},$$
<p>with the discriminant worked out slowly:</p>
$$\begin{aligned}\Delta &= (a-1)^2-4(4-a)\\ &= (a^2-2a+1)-(16-4a)\\ &= a^2+2a-15.\end{aligned}$$
<p>To factor $a^2+2a-15$, look for two numbers that multiply to $-15$ and add to $+2$: they are $+5$ and $-3$. So</p>
$$\Delta=(a-3)(a+5),\qquad \lambda=\frac{a-1}{2}\pm\frac{\sqrt{(a-3)(a+5)}}{2}.$$
<details class="qa"><summary>Reading the cramped equations in a typical printed solution</summary><div>
<p>Solutions typeset in a narrow column often break one equation across many short lines, which makes them look like several different statements. Two common examples:</p>
<ul>
<li>A stack reading “$\lambda^2$ / $-\operatorname{tr}\bA\lambda$ / $+\det\bA$ / $=$ / $\lambda^2$ / $-(a-1)$ / $\lambda$ / $+(-a+4)$” is <b>one</b> line: $\lambda^2-\operatorname{tr}\bA\,\lambda+\det\bA=\lambda^2-(a-1)\lambda+(-a+4)$, the characteristic polynomial with this family's trace and determinant filled in. And $(-a+4)$ is just $(4-a)$ written in the other order.</li>
<li>A stack reading “$\lambda$ / $=\frac{a-1}{2}$ / $\pm$ / $\sqrt{(a-3)(a+5)}\,/\,2$” is the quadratic formula above, split at the $\pm$: one formula, not four.</li>
<li>Likewise “$\det\bA$ / $-(\operatorname{tr}\bA)^2/4=$ / $-\operatorname{tr}\bA$ / $+3$ / $-(\operatorname{tr}\bA)^2/4=0$” is the single equation $\det\bA-(\operatorname{tr}\bA)^2/4 = -\operatorname{tr}\bA+3-(\operatorname{tr}\bA)^2/4 = 0$: section 4 below does this calculation cleanly.</li>
<li>The stack with the red mark, “At $\bx=\binom10$, $\bA\bx = \begin{bmatrix}a&2\\-2&-1\end{bmatrix}\binom10 = \binom{a}{-2}$”, is one matrix-times-vector multiplication: top row $(a)(1)+(2)(0)=a$, bottom row $(-2)(1)+(-1)(0)=-2$. It is the velocity at the point $(1,0)$, used for the clockwise test in section 5. (The red $\backslash{=}$ is only a typesetting glitch for $=$.)</li>
</ul></div></details>
<h3>One value worked completely: a = −6, every single step</h3>
<p>Before the general theory, here is one value of $a$ done with every keystroke visible. Put $a=-6$ into the matrix:</p>
$$\bA=\begin{bmatrix}-6&2\\-2&-1\end{bmatrix}.$$
<p><b>Step 1, the two numbers.</b></p>
$$\Tr = -6 + (-1) = -7,$$
$$\Det = (-6)(-1) - (2)(-2) = 6 - (-4) = 6 + 4 = 10.$$
<p><b>Step 2, the equation.</b> $\lambda^2-\Tr\,\lambda+\Det=0$ becomes $\lambda^2-(-7)\lambda+10=0$, and minus a negative is plus:</p>
$$\lambda^2+7\lambda+10=0.$$
<p><b>Step 3, the quadratic formula.</b> Under the square root: $\Delta = 7^2-4\cdot10 = 49-40 = 9$, and $\sqrt9=3$. So</p>
$$\lambda=\frac{-7\pm3}{2}:\qquad \frac{-7+3}{2}=\frac{-4}{2}=-2,\qquad \frac{-7-3}{2}=\frac{-10}{2}=-5.$$
<p><b>Step 4, read the two rates.</b> No $i$ appeared, so nothing rotates: this is the node family. Both rates are negative, so both building blocks $\exp(-2t)$ and $\exp(-5t)$ die out as time runs; wherever a point starts, it slides into $(0,0)$ and stays.</p>
<div class="box key"><b>Verdict for a = −6</b>A <b>nodal sink</b>, and it is <b>stable</b>. No rotation, so the clockwise question does not apply. Press the “a = −6” button under the figure and compare with the live panel: it runs these exact lines with these exact numbers.</div>
<h3>A complex value worked completely: a = −2, where the square root goes negative</h3>
<p>Now $a=-2$, the case where something unfamiliar happens:</p>
$$\bA=\begin{bmatrix}-2&2\\-2&-1\end{bmatrix},\qquad \Tr=-2+(-1)=-3,\qquad \Det=(-2)(-1)-(2)(-2)=2+4=6.$$
<p>The equation is $\lambda^2+3\lambda+6=0$, and under the square root:</p>
$$\Delta = 3^2-4\cdot6 = 9-24 = -15.$$
<p><b>A negative number under the square root.</b> No real number squares to $-15$. The fix is the symbol $i$, defined by $i^2=-1$, so that $\sqrt{-15}=\sqrt{15}\,i$. The formula then gives a <b>complex pair</b>:</p>
$$\lambda=\frac{-3\pm\sqrt{15}\,i}{2}=-1.5\pm\frac{\sqrt{15}}{2}\,i\approx-1.5\pm1.94\,i.$$
<p><b>How to read a complex eigenvalue.</b> It has two parts doing two different jobs:</p>
<ul>
<li>The <b>real part</b> $-1.5$ is the size dial: the overall size of the motion behaves like $\exp(-1.5t)$, which shrinks. So the path ends at $(0,0)$: stable.</li>
<li>The <b>imaginary part</b> $\pm1.94$ puts $\cos(1.94t)$ and $\sin(1.94t)$ into the solution: the path goes round and round, one lap every $2\pi/1.94\approx3.2$ time units.</li>
</ul>
<p>Shrinking while circling is a <b>spiral sink</b>. One question is left: which way round? Compute the velocity at the easiest possible point, $(1,0)$:</p>
$$\bA\begin{pmatrix}1\\0\end{pmatrix}=\begin{pmatrix}(-2)(1)+(2)(0)\\(-2)(1)+(-1)(0)\end{pmatrix}=\begin{pmatrix}-2\\-2\end{pmatrix}.$$
<p>The vertical component is $-2$: at a point sitting on the positive $x$-axis, the motion is <b>downward</b>. Going downward while crossing the right-hand side of a circle means going round <b>clockwise</b>.</p>
<div class="box clar"><b>Every other value of a works exactly the same way</b>Same five moves every time: trace, determinant, discriminant, quadratic formula, read the signs. The sections below do the five moves once with the letter $a$ kept general, which answers all eight values at a stroke — and the buttons under the figure replay any single value with its own numbers in the live panel.</div>
<h3>3. The sign of (a − 3)(a + 5) decides real or complex</h3>
<p>$\Delta$ is a product of two factors, so only the signs of the factors matter. $a+5$ turns positive once $a&gt;-5$; $a-3$ turns positive once $a&gt;3$:</p>
<table class="num"><tr><th>range of a</th><th>a + 5</th><th>a − 3</th><th>Δ</th><th>eigenvalues</th></tr>
<tr><td>a &lt; −5</td><td>−</td><td>−</td><td>+</td><td>real, distinct</td></tr>
<tr><td>a = −5</td><td>0</td><td>−</td><td>0</td><td>repeated: λ = −3</td></tr>
<tr><td>−5 &lt; a &lt; 3</td><td>+</td><td>−</td><td>−</td><td>complex pair</td></tr>
<tr><td>a = 3</td><td>+</td><td>0</td><td>0</td><td>repeated: λ = 1</td></tr>
<tr><td>a &gt; 3</td><td>+</td><td>+</td><td>+</td><td>real, distinct</td></tr></table>
<p>At the repeated values the eigenvalue is $\lambda=\frac{a-1}{2}$: at $a=-5$ that is $-3$, at $a=3$ it is $1$. Both times $\bA-\lambda\bI$ is <b>not</b> the zero matrix (section 6 shows it), so these are <b>defective nodes</b> — one eigenline, the hooked curves of steps 7–12 — not star nodes.</p>
<h3>4. The whole family is a line on the map</h3>
<p>Each value of $a$ is one point of the trace–determinant plane. Eliminate $a$ to see the whole family at once: from $\Tr=a-1$, read off $a=\Tr+1$, and substitute into the determinant:</p>
$$\Det = 4-a = 4-(\Tr+1) = 3-\Tr.$$
<p>So the family traces the straight dashed line $\Det=3-\Tr$ of slope $-1$: as $a$ grows, the point slides down and to the right, cutting through one region after another. Three crossings mark where the portrait type changes:</p>
<ul>
<li><b>The critical parabola.</b> Set $3-\Tr=\Tr^2/4$, i.e. $\Tr^2+4\Tr-12=0$, which factors as $(\Tr+6)(\Tr-2)=0$: crossings at $\Tr=-6$ ($a=-5$) and $\Tr=2$ ($a=3$), the two repeated-eigenvalue cases of section 3.</li>
<li><b>The Det axis</b> ($\Tr=0$): at $a=1$, with $\Det=3&gt;0$: a <b>centre</b>.</li>
<li><b>The Tr axis</b> ($\Det=0$): at $a=4$, with the other eigenvalue $\Tr=3&gt;0$: a <b>repelling comb</b> (step 18).</li>
</ul>
<p>Reading the line from left to right, the family visits, in order: nodal sink → defective node (sink) → spiral sink → centre → spiral source → defective node (source) → comb → saddle. Slide $a$ with the slider and watch exactly this sequence.</p>
<h3>5. Why every rotation here is clockwise</h3>
<p>Spirals and centres turn; nodes, saddles and combs do not (real eigenvalues mean no sine or cosine, step 2). To find <i>which way</i> a spiral or centre turns, compute the velocity at one convenient point and see where it pushes. The easiest point is $(1,0)$, on the positive $x$-axis:</p>
$$\bA\begin{pmatrix}1\\0\end{pmatrix}=\begin{pmatrix}(a)(1)+(2)(0)\\ (-2)(1)+(-1)(0)\end{pmatrix}=\begin{pmatrix}a\\-2\end{pmatrix}.$$
<p>The second component is $\dot y=-2$, and it does not contain $a$ at all. So at the point $(1,0)$ the motion is <b>downward for every member of the family</b>. A trajectory crossing the positive $x$-axis while moving down is going round the origin <b>clockwise</b>. That settles the direction for $a=-2$, $1$ and $2$ in one stroke.</p>
<div class="box key"><b>The general shortcut</b>For any 2×2 matrix with complex eigenvalues, the velocity at $(1,0)$ is $(a,\ c)$: its $\dot y$ is just the <b>bottom-left entry</b> $c$. So $c&gt;0$ means anticlockwise and $c&lt;0$ means clockwise. Here $c=-2&lt;0$: clockwise. The magenta arrow at $(1,0)$ in the figure shows this test live.</div>
<h3>6. All eight answers</h3>
<p>Now each value of $a$ is three short questions (step 2): real or complex? same sign or opposite? growing or shrinking? Press each button under the figure and compare with the live panel.</p>
<table class="num"><tr><th>a</th><th>Tr</th><th>Det</th><th>Δ</th><th>eigenvalues</th><th>portrait</th><th>stability</th><th>turning</th></tr>
<tr><td>−6</td><td>−7</td><td>10</td><td>9</td><td>−5, −2</td><td>nodal sink</td><td>stable</td><td>—</td></tr>
<tr><td>−5</td><td>−6</td><td>9</td><td>0</td><td>−3, −3</td><td>defective node (sink)</td><td>stable</td><td>—</td></tr>
<tr><td>−2</td><td>−3</td><td>6</td><td>−15</td><td>−1.5 ± 1.94i</td><td>spiral sink</td><td>stable</td><td>clockwise</td></tr>
<tr><td>1</td><td>0</td><td>3</td><td>−12</td><td>±1.73i</td><td>centre</td><td>neutrally stable</td><td>clockwise</td></tr>
<tr><td>2</td><td>1</td><td>2</td><td>−7</td><td>0.5 ± 1.32i</td><td>spiral source</td><td>unstable</td><td>clockwise</td></tr>
<tr><td>3</td><td>2</td><td>1</td><td>0</td><td>1, 1</td><td>defective node (source)</td><td>unstable</td><td>—</td></tr>
<tr><td>4</td><td>3</td><td>0</td><td>9</td><td>0, 3</td><td>repelling comb</td><td>unstable</td><td>—</td></tr>
<tr><td>5</td><td>4</td><td>−1</td><td>20</td><td>2 ± √5 ≈ 4.24, −0.24</td><td>saddle</td><td>unstable</td><td>—</td></tr></table>
<p>Spot checks on the three delicate rows:</p>
<ul>
<li><b>a = −5 and a = 3 (on the parabola):</b> defective, not star, because $\bA-\lambda\bI$ is nonzero. At $a=-5$, $\lambda=-3$: $\bA+3\bI=\begin{bmatrix}-2&2\\-2&2\end{bmatrix}\neq\mathbf0$ (one eigenline, along $(1,1)$). At $a=3$, $\lambda=1$: $\bA-\bI=\begin{bmatrix}2&2\\-2&-2\end{bmatrix}\neq\mathbf0$ (one eigenline, along $(1,-1)$). A star node would need $\bA=\lambda\bI$, i.e. zero off-diagonal entries, and this family always has $2$ and $-2$ there.</li>
<li><b>a = 4 (on the Tr axis):</b> $\Det=0$ forces $\lambda_1=0$ (since $\Det=\lambda_1\lambda_2$), and the other eigenvalue is $\Tr=3$. A zero eigenvalue means a whole line of fixed points with straight teeth beside it: a comb, repelling because $3&gt;0$.</li>
<li><b>a = 1 (on the Det axis):</b> $\Tr=0$ with $\Det=3&gt;0$: purely imaginary eigenvalues $\pm i\sqrt3$, closed loops. Bounded forever, but never approaching $(0,0)$: neutrally stable.</li>
</ul>
<h3>Reading the answer grid of the exercise</h3>
<p>The checkbox grid of the original exercise uses words that map onto this app as follows:</p>
<ul>
<li><b>node</b> means a nodal source or nodal sink only — the exercise says so in its note — not the degenerate or star kind.</li>
<li><b>defective node</b> is this app's <b>degenerate node</b>: two names for the same portrait (the glossary lists “improper node” as a third).</li>
<li><b>neutrally stable</b> is this app's <b>semistable</b> (step 20): bounded solutions that do not all tend to $(0,0)$. Only the centre at $a=1$ earns it here.</li>
<li><b>stable</b> means every solution tends to $(0,0)$: the test is $\operatorname{tr}\bA&lt;0$ and $\det\bA&gt;0$ (step 20), which holds for $a=-6,-5,-2$ and fails from $a=1$ onwards.</li>
</ul>
<div class="box try"><b>Try it</b>Press the eight buttons in order and watch three things at once: the dot sliding down the dashed line through region after region, the portrait on the right changing type at exactly $a=-5,\ 1,\ 3,\ 4$, and the magenta arrow at $(1,0)$ pointing down the whole time. Then drag $a$ slowly across $3$: two eigenlines close like scissors into one ($a=3$), then vanish as the spiralling starts — the same collapse as step 13, approached from the other side.</div>`,

const qA = () => [1, P.qb, 0, 1];
function qSol(t){
  const e = Math.exp(t), m = P.qb * P.qy0;
  return {e, x: (P.qx0 + m * t) * e, y: P.qy0 * e, dx: (P.qx0 + m * t + m) * e, dy: P.qy0 * e};
}
function qPieces(t){

    C.ln(R`x(${f(t)}) = ${f(a, 4)} ${sg(m2, 4)} = ${f(s.x, 4)}`, 'their sum: the magenta curve') +
    C.ln(R`y(${f(t)}) = (${f(P.qy0)})(${f(e, 4)}) = ${f(s.y, 4)}`, 'the teal curve') +
    C.ln(R`\begin{aligned}\dot x &= ${f(s.dx, 4)}\\ x + b\,y &= ${f(s.x + P.qb * s.y, 4)}\end{aligned}`, 'check: the two agree, so the formula really solves ẋ = x + by at this moment');
}

<h2>Solving the repeated-eigenvalue IVP by hand</h2>
<div class="box ask"><b>Question: for $\bA=\begin{bmatrix}1&b\\0&1\end{bmatrix}$ with $b\neq0$, find two independent solutions of $\dot\bx=\bA\bx$ by solving the two differential equations separately, and write down the solution of the initial value problem $\bx(0)=\binom{x_0}{y_0}$ in terms of $x_0$, $y_0$ and $b$.</b>
<p>An <b>initial value problem</b> (IVP) is the rule of motion plus one piece of extra information: where the point is at time $0$. Because there is exactly one path through each starting point (the uniqueness theorem, step 4), these two things together pin the motion down completely. The answer asked for is a pair of explicit formulas, $x(t)$ and $y(t)$, containing the letters $x_0$, $y_0$ and $b$. The course's answer boxes read, in keyboard notation, <span class="rawtex">x_0*e^t + y_0*b*t*e^t</span> and <span class="rawtex">y_0*e^t</span> — the derivation below shows exactly where every symbol in them comes from.</p></div>
<h3>0. Why “solve the two equations separately” works here</h3>
<p>Write the system out row by row:</p>
$$\dot x = x + b\,y,\qquad \dot y = y.$$
<p>The matrix is <b>triangular</b> (a zero in the bottom-left corner), so the second equation mentions only $y$ — it does not care what $x$ is doing. That is the whole trick: solve the self-contained $y$-equation first, then feed its answer into the $x$-equation. This is the same system as step 8 with $\lambda=1$; here it is solved again with the start values $x_0,y_0$ in place of abstract constants.</p>
<h3>1. Solve the y-equation first</h3>
<p>$\dot y=y$ is the plainest growth equation there is: the only functions equal to their own derivative are $C\exp(t)$. Which $C$? Set $t=0$: $y(0)=C\exp(0)=C$, and the problem says $y(0)=y_0$. So $C=y_0$ and</p>
$$y(t)=y_0\exp(t).$$
<p>That is already the second answer box, finished.</p>
<h3>2. Feed y into the x-equation</h3>
<p>Put $y=y_0\exp(t)$ into $\dot x=x+b\,y$ and move the $x$ to the left:</p>
$$\dot x - x = b\,y_0\exp(t).$$
<p>The push on the right grows like $\exp(t)$ — exactly the rate $x$ would grow at on its own. That is <b>resonance</b> (step 8), and resonance is what will produce the factor $t$.</p>
<h3>3. The integrating factor, slowly</h3>
<p>Multiply both sides by $\exp(-t)$. The point of this factor is that the left side collapses into the derivative of one product — check it with the product rule:</p>
$$\frac{d}{dt}\bigl[x\exp(-t)\bigr] = \dot x\exp(-t) - x\exp(-t) = (\dot x - x)\exp(-t) = b\,y_0\exp(t)\exp(-t) = b\,y_0.$$
<p>The right side is a <b>constant</b>. A quantity whose derivative is the constant $b\,y_0$ is $(\text{its start}) + b\,y_0\,t$, and its start is $x(0)\exp(0)=x_0$:</p>
$$x\exp(-t) = x_0 + b\,y_0\,t.$$
<p>Multiply back by $\exp(t)$:</p>
$$x(t) = \bigl(x_0 + b\,y_0\,t\bigr)\exp(t) = x_0\exp(t) + y_0\,b\,t\exp(t).$$
<p>That is the first answer box. Worked numbers with $b=2$, $x_0=1$, $y_0=1$ at $t=1$: $x=(1+2)\exp(1)=3\times2.718=8.15$ and $y=2.72$. Check against the equation: $\dot x$ by the product rule is $(1+2t)\exp(t)+2\exp(t)=5\exp(1)=13.59$, and $x+by=8.15+2\times2.72=13.59$. They match.</p>
<h3>From ẋ − x = (bC)exp(t) to x = C₂exp(t) + (bC)t·exp(t), every micro-step</h3>
<p>This is the jump the printed solution makes in one line (“The solution to this inhomogeneous ODE is…”). Here it is with nothing skipped, in the solution's own letters: $C$ is the constant from the $y$-equation, so the forcing is $bC\exp(t)$ (in the IVP version above, $C=y_0$). And a reminder: the “$(bC)/\exp(t)$” look of the printed display is only a line break — it is the product $(bC)\exp(t)$, not a fraction.</p>
<p><b>(i) Why integrating both sides directly is not allowed.</b> Integrating $\dot x$ would give back $x$, fine — but the left side also contains $-x$, and $\int x\,dt$ cannot be written down, because $x(t)$ is exactly the unknown function being searched for. Before anything can be integrated, the two $x$-terms must be packed into <b>one single derivative</b>.</p>
<p><b>(ii) Multiply the whole equation by $\exp(-t)$.</b></p>
$$\exp(-t)\,\dot x - \exp(-t)\,x \;=\; bC\exp(t)\exp(-t) \;=\; bC,$$
<p>because $\exp(t)\exp(-t)=\exp(t-t)=\exp(0)=1$: on the right the exponentials cancel and only the constant $bC$ survives. (That cancellation is the resonance showing up: the forcing grows at exactly the system's own rate.)</p>
<p><b>(iii) The left side is one derivative in disguise.</b> Apply the product rule to $x\exp(-t)$, remembering $\frac{d}{dt}\exp(-t)=-\exp(-t)$:</p>
$$\frac{d}{dt}\bigl[x\exp(-t)\bigr] \;=\; \dot x\exp(-t) + x\cdot\bigl(-\exp(-t)\bigr) \;=\; \exp(-t)\,(\dot x - x).$$
<p>That is <i>exactly</i> the left side of (ii). This is the whole reason the multiplier $\exp(-t)$ was chosen and not something else: its derivative brings in the minus sign needed to manufacture the “$-x$”. So (ii) can be rewritten as</p>
$$\frac{d}{dt}\bigl[x\exp(-t)\bigr] = bC.$$
<p><b>(iv) NOW integrating is allowed</b>, because both sides are known: “some function has derivative equal to the constant $bC$”. Such a function is $bC\,t$ plus an arbitrary constant — call it $C_2$. This is the moment $C_2$ is born: it is the constant of integration.</p>
$$x\exp(-t) = C_2 + bC\,t.$$
<p><b>(v) Unwrap</b> by multiplying both sides by $\exp(t)$ (which undoes the $\exp(-t)$):</p>
$$x(t) = C_2\exp(t) + (bC)\,t\exp(t).$$
<p><b>(vi) Check by differentiating</b> — product rule on the $t\exp(t)$ term:</p>
$$\dot x = C_2\exp(t) + bC\exp(t) + bC\,t\exp(t)\qquad\Rightarrow\qquad \dot x - x = bC\exp(t).\ \checkmark$$
<p>Worked numbers with $b=2$, $C=1$ (forcing $2\exp(t)$) and $C_2=1$, at $t=1$: $x = e + 2e = 3e \approx 8.15$, $\dot x = e + 2e + 2e = 5e$, and $\dot x - x = 5e - 3e = 2e$, which is the forcing $2\exp(1)$. It checks. The live panel repeats the same verification, and also tabulates $x(t)\exp(-t)$ at several times so the straight line $C_2 + bC\,t$ of step (iv) can be seen in actual numbers.</p>
<details class="qa"><summary>A second route to the same answer: guess and adjust (undetermined coefficients)</summary><div>
<p>Solve the two halves separately and add them:</p>
<ul>
<li><b>Homogeneous half</b> ($\dot x - x = 0$): $x_h = C_2\exp(t)$, the familiar growth solution.</li>
<li><b>Particular half</b>: the usual move is to guess something shaped like the forcing, $x_p = A\exp(t)$. Here that guess <b>fails</b>: $\dot x_p - x_p = A\exp(t) - A\exp(t) = 0$, which can never equal $bC\exp(t)$. It fails precisely because $\exp(t)$ already solves the homogeneous half — resonance again. The standard repair is to multiply the guess by $t$: try $x_p = A\,t\exp(t)$. Then $\dot x_p = A\exp(t) + A\,t\exp(t)$ (product rule), so $\dot x_p - x_p = A\exp(t)$, and matching with $bC\exp(t)$ fixes $A = bC$.</li>
</ul>
<p>Sum of the halves: $x = C_2\exp(t) + bC\,t\exp(t)$ — the same answer as the integrating factor, and a second, independent explanation of where the famous factor $t$ comes from: the naive guess is “used up” by the homogeneous solution, and $t$ is the smallest correction that survives.</p></div></details>
<h3>4. Fit the start values: why the constants ARE x₀ and y₀</h3>
<p>The two independent solutions the question asks for are the two building blocks</p>
$$\bx_1(t)=\begin{pmatrix}1\\0\end{pmatrix}\exp(t),\qquad \bx_2(t)=\begin{pmatrix}0\\1\end{pmatrix}\exp(t)+\begin{pmatrix}b\\0\end{pmatrix}t\exp(t),$$
<p>and the general solution is $\bx=C_1\bx_1+C_2\bx_2$ — wait, which constant is which? Set $t=0$. Then $\exp(0)=1$ and $t\exp(t)=0$, so the whole formula collapses to</p>
$$\bx(0)=C_1\begin{pmatrix}1\\0\end{pmatrix}+C_2\begin{pmatrix}0\\1\end{pmatrix}=\begin{pmatrix}C_1\\C_2\end{pmatrix}.$$
<p>Matching with $\bx(0)=\binom{x_0}{y_0}$ gives $C_1=x_0$ and $C_2=y_0$: the arbitrary constants are nothing mysterious, they are simply the starting coordinates. (The printed solution names them $C_2$ and $C$ instead of $C_1$ and $C_2$ — same idea, different letters.)</p>
<h3>5. Read the answer</h3>
$$\bx(t)=x_0\begin{pmatrix}1\\0\end{pmatrix}\exp(t)+y_0\Bigl[\begin{pmatrix}0\\1\end{pmatrix}\exp(t)+\begin{pmatrix}b\\0\end{pmatrix}t\exp(t)\Bigr].$$
<ul>
<li>$y(t)=y_0\exp(t)$ never changes sign: no trajectory ever crosses the eigenline (the $x$-axis).</li>
<li>If $y_0=0$ the resonance piece vanishes and the motion is a straight run along the eigenline: $x=x_0\exp(t)$. Press the “$y_0=0$” button and watch.</li>
<li>If $y_0\neq0$, the piece $y_0\,b\,t\exp(t)$ is $0$ at $t=0$ but eventually dominates everything — it is what bends the paths into the hooks of the degenerate node (steps 8–12).</li>
</ul>
<div class="box try"><b>Try it</b>Load the textbook values and press Play: the dot runs along the magenta path while the right panel shows $x(t)$ splitting into its amber and orange pieces. Then tap different starts in the phase plane — the live panel redoes the whole derivation with the new $x_0,y_0$ each time.</div>
<details class="qa"><summary>Reading the cramped printed solution (including one real typo)</summary><div>
<ul>
<li>The first stack, “$\lambda^2$ / $-2\lambda$ / $-1=0$ $\Rightarrow$ $\lambda=1,1$”, contains a genuine <b>typo</b> (or a rendering slip): with $\Tr=2$ and $\Det=1$ the characteristic equation is $\lambda^2-2\lambda\boldsymbol{+}1=0=(\lambda-1)^2$, which does give $\lambda=1,1$. As printed, $\lambda^2-2\lambda-1=0$ would give $1\pm\sqrt2$ — not the stated roots. Trust the $+1$.</li>
<li>The eigenvector stack says: $(\bA-\bI)\bv=\begin{bmatrix}0&b\\0&0\end{bmatrix}\bv=\mathbf0$ forces $b\,v_2=0$, so $v_2=0$ and $\bv=\binom10$ — one eigenline, exactly as in step 7.</li>
<li>“$\dot x - x = (bC)/\exp(t)$” <i>looks</i> like a fraction but is the product $(bC)\exp(t)$ broken across two lines.</li>
<li>“$C_2\exp(t)$ / $+(bC)$ / $t\exp(t)$” is one formula: $x=C_2\exp(t)+bC\,t\exp(t)$.</li>
<li>The giant nested parentheses of the “vector form” are only the column vectors stacked vertically: $C_2\binom10\exp(t)+C\bigl[\binom01\exp(t)+\binom b0\,t\exp(t)\bigr]$.</li>
</ul></div></details>`,
  explain: () => R`<p>Left: the phase plane with the IVP trajectory through $(x_0,y_0)$ in magenta and the moving state at time $t$. Right: the two answer formulas as graphs — $x(t)$ magenta, $y(t)$ teal — with $x$ split into its amber piece $x_0\exp(t)$ and orange piece $y_0\,b\,t\exp(t)$.</p>` + TAPHINT,
