<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomy of a spiral sink: x′ = −x − y, y′ = 2x − 3y</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">

<style>
:root{
  --paper:#e5ebe8; --card:#fcfdfc; --ink:#1c2524; --mut:#566461; --line:#d7e0dc;
  --board:#1f2e2b; --acc:#276b5d; --acc-soft:#e0eeea;
  --c1:#9a6f00; --c1s:#fbf1d3; --c2:#1f76a3; --c2s:#dff0f8; --cx:#b83e63; --cxs:#fbe7ed; --co:#b3591a; --cos:#fcebdd;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:Literata,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--paper);
  height:100vh;height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{flex:none;display:flex;align-items:center;gap:6px 18px;padding:9px 12px 7px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
.sys{font-size:13px;color:var(--mut)}
.ttl{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:3px 10px 3px 4px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav button:hover{border-color:var(--acc)}
nav .num{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:600}
nav button[aria-current="step"]{background:var(--acc);color:#fff;border-color:var(--acc)}
nav button[aria-current="step"] .num{background:#fff;color:var(--acc)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr) minmax(250px,.78fr);gap:10px;padding:2px 12px 12px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--line);min-height:0;min-width:0}
/* derivation text */
.textcol{display:flex;flex-direction:column}
#text{flex:1;min-height:0;overflow:auto;padding:12px 18px 16px;font-family:var(--serif);font-size:14.5px;line-height:1.62}
#text h2{font-size:18px;margin:2px 0 8px;font-weight:600;letter-spacing:-.01em}
#text h3{font-family:var(--ui);font-size:13.5px;font-weight:600;color:var(--acc);margin:16px 0 4px}
#text p{margin:0 0 9px}
#text ol,#text ul{margin:0 0 10px;padding-left:22px}
#text li{margin-bottom:4px}
#lab{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.labbtns{display:flex;gap:6px}
#labtext{flex:1;min-height:0;overflow:auto;padding:12px 18px 16px;font-family:var(--serif);font-size:14.5px;line-height:1.62}
#labtext h2{font-size:18px;margin:2px 0 8px;font-weight:600;letter-spacing:-.01em}
#labtext h3{font-family:var(--ui);font-size:13.5px;font-weight:600;color:var(--acc);margin:16px 0 4px}
#labtext p{margin:0 0 9px}
#labtext ul{margin:0 0 10px;padding-left:22px}

.key{background:var(--acc-soft);border-left:3px solid var(--acc);padding:8px 11px;border-radius:0 10px 10px 0;margin:10px 0}
.keyidea{background:#e8f1fb;border:1px solid #b9d4ee;border-left:4px solid #1f76a3;padding:8px 11px;border-radius:0 10px 10px 0;margin:6px 0 12px;font-size:14.5px}
.keyidea>b:first-child{color:#1f5f86}
.qa{border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin:6px 0;background:#fcfdfc}
.qa summary{cursor:pointer}
.qa[open]{background:#f3f8f6}
.qa>div{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.hint3{font-family:var(--ui);font-size:12.5px;color:var(--mut)}
.clar{background:#fbf5e1;border-left:3px solid #c49410;padding:8px 11px;border-radius:0 10px 10px 0;margin:10px 0;font-size:14px}
.clar>b:first-child{color:#8a6300}
.warn{background:var(--cos);border-left:3px solid var(--co);padding:8px 11px;border-radius:0 10px 10px 0;margin:10px 0}
.pager{flex:none;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:13px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}
.btn.soft{background:var(--card);color:var(--acc)}
.btn:disabled{opacity:.35;cursor:default}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:3px 0;margin:6px 0}
.k1{color:var(--c1)} .k2{color:var(--c2)} .kx{color:var(--cx)} .ko{color:var(--co)} .kg{color:var(--acc)}
/* figure */
.figcard{display:flex;flex-direction:column;overflow:hidden}
.fighead{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px 6px 12px;font-size:12.5px;color:var(--mut)}
.fighead #figtitle{flex:1;min-width:0}
.fighead b{color:var(--ink);font-weight:600}
.cvwrap{flex:1;min-height:0;position:relative;margin:0 8px;border-radius:10px;overflow:hidden;background:#1f2e2b}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:8px;z-index:5;background:rgba(252,253,252,.975);border-radius:10px;
  box-shadow:0 10px 36px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.ovhead{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.ovhead b{flex:1;font-size:13.5px}
.ovbody{flex:1;overflow:auto;padding:10px 16px 14px;font-family:var(--serif);font-size:14px;line-height:1.6}
.ovbody p{margin:0 0 9px}
.ovbody ul{margin:0 0 9px;padding-left:20px}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.controls{flex:none;padding:8px 12px 10px;display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.lbl{font-size:12.5px;color:var(--mut);min-width:94px}
.row input[type=range]{flex:1 1 140px;min-width:100px;accent-color:var(--acc)}
.row input.r1{accent-color:#c49410} .row input.r2{accent-color:var(--c2)} .row input.ro{accent-color:var(--co)}
output{font-variant-numeric:tabular-nums;font-size:13px;min-width:62px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);cursor:pointer}
.chk input{accent-color:var(--acc);margin:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--acc)}
.chips button.sel{background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.chips button.ok{background:#dcf1e1;border-color:#2e8b57;color:#1d5e3a}
.chips button.bad{background:var(--cxs);border-color:var(--cx);color:var(--cx)}
.chips .lbl{align-self:center}
.hint{font-size:12px;color:var(--mut)}
/* live calc */
.calc{overflow:auto;padding:10px 14px 14px;font-size:13px;line-height:1.5}
.calc h4{font-size:13px;margin:12px 0 4px;color:var(--acc);font-weight:600}
.calc h4:first-child{margin-top:0}
.calc .ln{padding:3px 0;border-bottom:1px dashed var(--line);overflow-x:auto;overflow-y:hidden}
.calc .why{color:var(--mut);font-size:12px;margin:3px 0 2px}
.calc .res{margin:7px 0 3px;padding:6px 10px;background:var(--acc-soft);border-radius:8px;overflow-x:auto}
.calc .bad{background:var(--cos)}
.calc table{border-collapse:collapse;font-size:12.5px;margin:4px 0}
.calc td,.calc th{padding:2px 8px 2px 0;border-bottom:1px solid var(--line);text-align:left}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--cxs);color:var(--cx)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:880px){
  body{height:auto;min-height:100dvh;overflow:auto}
  main{display:flex;flex-direction:column;padding:2px 8px 12px}
  nav{margin-left:0;flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:3px}
  .figcard{order:1} .calc{order:2;overflow:visible} .textcol{order:3}
  #text{overflow:visible}
  #lab{overflow:auto;display:block} #labtext{overflow:visible}
  .cvwrap{flex:none;height:min(64vh,470px)}
  .lbl{min-width:70px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<body>
<header>
  <div class="ttl"><h1>Anatomy of a spiral sink</h1><span class="sys" id="sys"></span><button class="btn soft" id="openLabBtn" style="font-size:12px;padding:3px 10px">How the direction field is drawn</button></div>
  <nav id="nav" aria-label="Steps"></nav>
</header>
<main>
  <section class="card textcol" aria-label="Derivation">
    <div id="text"></div>

        <div class="ovbody" id="ovbody"></div>

  </section>

</main>
<div id="lab" hidden>
  <header>
    <div class="ttl"><h1>How the direction field is drawn</h1><span class="sys">a step-by-step construction</span></div>
    <nav id="labnav" aria-label="Construction steps"></nav>
    <div class="labbtns"><button class="btn soft" id="labtab">Open in new tab</button><button class="btn" id="labclose">Back to the app</button></div>
  </header>
  <main>
    <section class="card textcol" aria-label="Construction explanation">
      <div id="labtext"></div>
      <div class="pager"><button class="btn soft" id="labprev">Previous step</button><button class="btn" id="labnext">Next step</button></div>
    </section>

      <div class="fighead"><div id="labfigtitle"></div></div>
      <div class="cvwrap" id="lcvwrap"><canvas id="lcv"></canvas></div>
      <div class="controls" id="labcontrols"></div>
    </section>
    <section class="card calc" id="labcalc" aria-label="Live calculation"></section>
  </main>
</div>

<script>
"use strict";
const R = String.raw;
const PI = Math.PI, TAU = 2 * Math.PI;
const PHI = (1 + Math.sqrt(5)) / 2;

/* ---------------- math typesetting ---------------- */
const MAC = {
  "\\ca": "\\htmlClass{k1}{#1}", "\\cb": "\\htmlClass{k2}{#1}", "\\cx": "\\htmlClass{kx}{#1}",
  "\\co": "\\htmlClass{ko}{#1}", "\\cg": "\\htmlClass{kg}{#1}"
};
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
// Write every exponential e^{...} as exp(...), as requested (applied to all typeset math and canvas labels)
function expToFn(s, cmd){
  let out = '', i = 0;
  while (i < s.length){
    if (s[i] === 'e' && s[i + 1] === '^' && i + 2 < s.length && !/\\[A-Za-z]*$/.test(out) && !/R$/.test(out)){
      let inner, j;
      if (s[i + 2] === '{'){ j = matchBrace(s, i + 2); inner = s.slice(i + 3, j); i = j + 1; }
      else if (s[i + 2] === '\\'){ const m = /^\\[A-Za-z]+/.exec(s.slice(i + 2)); inner = m ? m[0] : '\\'; i += 2 + inner.length; }
      else { inner = s[i + 2]; i += 3; }
      out += cmd + '(' + expToFn(inner, cmd) + ')';
    } else { out += s[i]; i++; }
  }
  return out;
}
function tex(s, disp){
  s = expToFn(s, '\\exp');
  if (window.katex){
    try { return katex.renderToString(s, {displayMode: !!disp, throwOnError: false, trust: true, strict: false, macros: MAC}); }
    catch(e){}
  }
  return disp ? '<pre>' + esc(s) + '</pre>' : '<code>' + esc(s) + '</code>';
}
function md(html){
  return html.replace(/\$\$([\s\S]+?)\$\$/g, (m, s) => tex(s, true))
             .replace(/\$([^$]+?)\$/g, (m, s) => tex(s, false));
}
function nf(x, d = 3){
  if (!isFinite(x)) return '\\infty';
  if (Math.abs(x) > 0 && Math.abs(x) < Math.pow(10, -d) * 0.5) {
    const e = Math.floor(Math.log10(Math.abs(x))); const m = x / Math.pow(10, e);
    return m.toFixed(2) + '\\times10^{' + e + '}';
  }
  let s = x.toFixed(d); if (/^-0\.?0*$/.test(s)) s = s.slice(1); return s;
}
function np(x, d = 3){ return '(' + nf(x, d) + ')'; }
function pf(x, d = 2){ let s = x.toFixed(d); if (/^-0\.?0*$/.test(s)) s = s.slice(1); return s.replace('-', '−'); }
function sgn(x, d = 3){ const s = nf(Math.abs(x), d); return (x < 0 ? '- ' : '+ ') + s; }
const L = (s) => '<div class="ln">' + tex(s) + '</div>';
const LD = (s) => '<div class="ln">' + tex(s, true) + '</div>';
const Y = (h) => '<div class="why">' + md(h) + '</div>';
const RES = (h, bad) => '<div class="res' + (bad ? ' bad' : '') + '">' + md(h) + '</div>';

/* ---------------- the system and its exact solutions ---------------- */
// Real solutions for A_alpha = A + (alpha+2) I  (alpha = -2 is the problem on the board)
function U1(al, t){ const e = Math.exp(al*t), c = Math.cos(t), s = Math.sin(t); return [e*c, e*(c+s)]; }
function U2(al, t){ const e = Math.exp(al*t), c = Math.cos(t), s = Math.sin(t); return [e*s, e*(s-c)]; }
function XS(al, c1, c2, t){ const e = Math.exp(al*t), c = Math.cos(t), s = Math.sin(t); return [e*(c1*c + c2*s), e*((c1-c2)*c + (c1+c2)*s)]; }
function Qf(x, y){ return 2*x*x - 2*x*y + y*y; }
function F0(x, y){ return [-x - y, 2*x - 3*y]; }

/* ---------------- state ---------------- */
const S = { step: 0, c1: 1, c2: 0, t: 0, alpha: -2, phi: 0, lam: -2, t1: 0, t2: PI/2, t3: PI/4,
  px: 1, py: 0, field: true, onlyC1: false, withDecay: true, playing: false,
  a: -1, b: -1, c: 2, d: -3, k: 2, bd: 1, x0: 1, y0: -0.5, tneg: false, gs: 1, gw: 3, a1: 2, a2: 0, b1: 0, b2: -1, ma: 2, mb: -5, mc: 1, md: 4, mcPick: null, ea: -0.2, eb: 1, p1True: false, p1Mode: 'wait', p1Probe: null, p1Focus: 'particle', showCallout: true, coOff: {}, coExp: {}, p1dt: 0.1, mSel: null, p1Pause: false, mdt: 0.1, mk: 0, mx0: 1, my0: 0, mRun: false, mRK: false, mcHide: true, mcHint: false, qi: 0, qans: {}, qrev: {}, qrand: null, qEll: false, parts: [], seeds: [], visited: {} };

/* ---------------- canvas helpers ---------------- */
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d'); const mainCtx = ctx;
const cvwrap = document.getElementById('cvwrap');
let W = 300, H = 300, dirty = true;
const UIF = '"IBM Plex Sans",system-ui,sans-serif';
const K = { board:'#1f2e2b', board2:'#172422', grid:'rgba(225,238,232,.07)', axis:'rgba(225,238,232,.42)',
  chalk:'#edf3ef', faint:'rgba(237,243,239,.32)', y:'#f3d37b', b:'#8cc8e8', p:'#f4a0b8', o:'#f5a25d',
  g:'#a9dcae', lbl:'rgba(237,243,239,.72)' };

function resize(){
  const r = cvwrap.getBoundingClientRect(); const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(60, r.width); H = Math.max(60, r.height);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dirty = true;
}
function full(){ return {x: 0, y: 0, w: W, h: H}; }
function split(){
  const g = 8;
  if (W >= H * 1.2) { const w = (W - g) / 2; return [{x:0,y:0,w,h:H}, {x:w+g,y:0,w,h:H}]; }
  const h = (H - g) / 2; return [{x:0,y:0,w:W,h}, {x:0,y:h+g,w:W,h}];
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function panel(r, col){ PANELS.push(r); ctx.save(); ctx.fillStyle = col || K.board; rr(r.x, r.y, r.w, r.h, 9); ctx.fill(); ctx.restore(); }
function mkView(r, xmin, xmax, ymin, ymax, equal, pads){
  const p = pads || {l: 34, r: 12, t: 12, b: 24};
  const px = r.x + p.l, py = r.y + p.t, pw = Math.max(10, r.w - p.l - p.r), ph = Math.max(10, r.h - p.t - p.b);
  if (equal){
    const s = Math.min(pw/(xmax-xmin), ph/(ymax-ymin)); const cx = (xmin+xmax)/2, cy = (ymin+ymax)/2;
    xmin = cx - pw/s/2; xmax = cx + pw/s/2; ymin = cy - ph/s/2; ymax = cy + ph/s/2;
  }
  const v = {px, py, pw, ph, xmin, xmax, ymin, ymax};
  v.X = x => px + (x - v.xmin)/(v.xmax - v.xmin)*pw;
  v.Y = y => py + ph - (y - v.ymin)/(v.ymax - v.ymin)*ph;
  v.ix = X => v.xmin + (X - px)/pw*(v.xmax - v.xmin);
  v.iy = Yv => v.ymin + (py + ph - Yv)/ph*(v.ymax - v.ymin);
  v.sx = pw/(v.xmax - v.xmin); v.sy = ph/(v.ymax - v.ymin);
  return v;
}
function clipV(v){ ctx.beginPath(); ctx.rect(v.px, v.py, v.pw, v.ph); ctx.clip(); }
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw/p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
function fmtTick(x){ if (Math.abs(x) < 1e-9) return '0'; return String(+x.toFixed(3)).replace('-', '−'); }
function piLabel(x){ const k = Math.round(x/(PI/2)); if (k === 0) return '0'; if (k % 2 === 0) { const m = k/2; return (m === 1 ? '' : m === -1 ? '−' : String(m).replace('-','−')) + 'π'; } return (k === 1 ? '' : String(k).replace('-','−')) + 'π/2'; }
function seg(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function gridAxes(v, o = {}){
  const sx = o.xpi ? PI/2 : (o.xstep || niceStep((v.xmax - v.xmin)/Math.max(2, v.pw/72)));
  const sy = o.ystep || niceStep((v.ymax - v.ymin)/Math.max(2, v.ph/56));
  const xs = [], ys = [];
  for (let k = Math.ceil(v.xmin/sx); k*sx <= v.xmax + 1e-9; k++) xs.push(k*sx);
  for (let k = Math.ceil(v.ymin/sy); k*sy <= v.ymax + 1e-9; k++) ys.push(k*sy);
  ctx.save(); clipV(v); ctx.lineWidth = 1; ctx.strokeStyle = K.grid;
  xs.forEach(x => seg(v.X(x), v.py, v.X(x), v.py + v.ph));
  ys.forEach(y => seg(v.px, v.Y(y), v.px + v.pw, v.Y(y)));
  ctx.strokeStyle = K.axis; ctx.lineWidth = 1.2;
  if (v.ymin < 0 && v.ymax > 0) seg(v.px, v.Y(0), v.px + v.pw, v.Y(0));
  if (v.xmin < 0 && v.xmax > 0) seg(v.X(0), v.py, v.X(0), v.py + v.ph);
  ctx.restore();
  ctx.save(); ctx.fillStyle = K.lbl; ctx.font = '10.5px ' + UIF;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';

<p>We want all pairs of functions $x(t)$, $y(t)$ with</p>
$$x' = -x - y,\qquad y' = 2x - 3y .$$
<p>Read these two lines as a <b>velocity rule</b>. Wherever the point $(x,y)$ is, the right-hand sides give its velocity $(x',y')$. At the point $(1,0)$, for example:</p>
$$x' = -1 - 0 = -1,\qquad y' = 2(1) - 3(0) = 2 .$$
<p>So a particle at $(1,0)$ moves 1 unit left and 2 units up per unit of time (as a rate: over a short time $\Delta t$ it moves by about $\Delta t\times(-1,2)$; step 1b shows exactly how the point advances in time). Every faint arrow in the figure is this same little calculation done at a different point. Tap the board to drop a particle and watch it obey the arrows.</p>
<h3>Matrix form</h3>
$$\begin{pmatrix}x\\y\end{pmatrix}' = \underbrace{\begin{pmatrix}-1 & -1\\ 2 & -3\end{pmatrix}}_{A}\begin{pmatrix}x\\y\end{pmatrix}$$
<p>Row 1 of $A$ holds the coefficients of the $x'$ equation, row 2 those of the $y'$ equation.</p>

<p>So the app draws the velocity multiplied by a positive number $s$:</p>

/* ---------- 1b. How the point moves in time ---------- */
function rk4Step(x, y, h){
  const k1 = F0(x, y), k2 = F0(x + h/2*k1[0], y + h/2*k1[1]), k3 = F0(x + h/2*k2[0], y + h/2*k2[1]), k4 = F0(x + h*k3[0], y + h*k3[1]);
  return [x + h/6*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0]), y + h/6*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1])];
}
function motionPaths(){
  const h = S.mdt, n = S.mk, E = [[S.mx0, S.my0]], Rk = [[S.mx0, S.my0]];
  for (let i = 0; i < n; i++){
    const [x, y] = E[i], [u, w] = F0(x, y); E.push([x + h*u, y + h*w]);
    Rk.push(rk4Step(Rk[i][0], Rk[i][1], h));
  }
  return {E, Rk};
}
function motionMax(){ return Math.min(400, Math.ceil(6/S.mdt)); }

  text: R`<h2>How does the point move if t never appears?</h2>
<p>The equations $x'=-x-y,\ y'=2x-3y$ contain no $t$ on the right-hand side. They are a <b>velocity rule that depends only on position</b>: tell me where the point is, and I tell you its velocity. Think of a river current: the current at a spot does not depend on the clock, but a leaf floating in it still moves, because it keeps arriving at new spots where the current is different.</p>
<p>So time enters only through the motion itself: at every instant the point reads the velocity <i>at the place where it is at that instant</i>, moves a tiny bit in that direction, reads the velocity at the new place, and so on.</p>
<h3>Velocity is not a position</h3>
<p>$(x',y')$ is a <b>velocity</b> (units: distance per unit time). It says how fast $x$ and $y$ are changing, not where the point goes. So neither of the two readings in your question is quite right:</p>
<ul>
<li>"Move to the point $(x',y')$" mixes up velocity and position. At $(1,0)$ the velocity is $(-1,2)$, but the point certainly does not jump to $(-1,2)$.</li>
<li>"Add $x'$ and $y'$ to $x$ and $y$" is closer, but it silently assumes the point moves with that velocity for a <b>whole unit of time</b>. That is too long a step (see below).</li>
</ul>
<h3>The correct rule: displacement = velocity × time</h3>
<p>Over a short time $\Delta t$ the velocity barely changes, so the displacement is approximately velocity times $\Delta t$:</p>
$$x(t+\Delta t)\approx x(t)+x'\,\Delta t,\qquad y(t+\Delta t)\approx y(t)+y'\,\Delta t .$$
<p>Then recompute $(x',y')$ at the <i>new</i> point and repeat. This recipe is <b>Euler's method</b>. It is literally the definition of the derivative read backwards: $x'\approx\dfrac{x(t+\Delta t)-x(t)}{\Delta t}$.</p>
<h3>Worked numbers from (1, 0) with Δt = 0.1</h3>
<p><b>Step 1.</b> At $(1,0)$: $x'=-1-0=-1$, $y'=2(1)-3(0)=2$. Move by $0.1\times(-1,\,2)=(-0.1,\,0.2)$. New point $(0.9,\ 0.2)$ at $t=0.1$.</p>
<p><b>Step 2.</b> At $(0.9,\,0.2)$: $x'=-0.9-0.2=-1.1$, $y'=1.8-0.6=1.2$. Move by $(-0.11,\,0.12)$. New point $(0.79,\ 0.32)$ at $t=0.2$.</p>
<p><b>Step 3.</b> At $(0.79,\,0.32)$: $x'=-1.11$, $y'=1.58-0.96=0.62$. Move by $(-0.111,\,0.062)$. New point $(0.679,\ 0.382)$ at $t=0.3$.</p>
<p>The exact solution from $(1,0)$ is $x=e^{-2t}(\cos t+\sin t)$, $y=2e^{-2t}\sin t$ (this is $c_1=1,\ c_2=1$ from step 5). At $t=0.3$ it gives $(0.686,\ 0.324)$. Euler's $(0.679,\ 0.382)$ is close but drifting: each step used the velocity from the <i>start</i> of the step, although the velocity kept changing during it.</p>
<h3>Smaller steps → the exact curve</h3>
<p>Halving $\Delta t$ roughly halves Euler's error. In the limit $\Delta t\to0$ the steps merge into the smooth exact curve, which is exactly what the solution formula gives: a curve whose velocity equals $(x',y')$ at <i>every</i> instant, not just at step starts. Try the $\Delta t$ slider.</p>
<h3>What "adding x′ and y′" (Δt = 1) does</h3>
<p>From $(1,0)$: $(1,0)+(-1,2)=(0,2)$. There $\mathbf v=(-2,-6)$, so next $(-2,-4)$. The points fly <b>outward</b>, even though the true motion is a sink. The reason: each Euler step multiplies the eigen-component by $1+\lambda\Delta t$. With $\lambda=-2+i$ and $\Delta t=1$ that factor is $-1+i$, of size $\sqrt2\approx1.41>1$, so every step grows. For Euler to shrink at all we need</p>
$$|1+\lambda\Delta t|^2=(1-2\Delta t)^2+\Delta t^2<1\iff5\Delta t^2-4\Delta t<0\iff\Delta t<0.8 .$$
<h3>Better stepping: RK4</h3>
<p>Runge–Kutta 4 samples the velocity four times inside each step (start, twice at the middle, end) and uses a weighted average, $\tfrac16(k_1+2k_2+2k_3+k_4)$. It is far more accurate for the same $\Delta t$ (tick "also show RK4"). The playground and the direction-field lab draw trajectories with RK4 and a tiny step; steps 1, 5, 6 and 7 use the exact formula directly.</p>
<h3>A consequence of "no t"</h3>
<p>Because the arrow at a point never changes with time, two different trajectories can never cross (at a crossing point there would have to be two different arrows). And starting at $(1,0)$ at $t=5$ instead of $t=0$ produces the same path, just 5 time units later.</p>`,
  explain: R`<ul><li>Faint arrows: the direction field. White ring: the start point (drag it).</li>
<li><span class="sw" style="background:#b3591a"></span>Orange dots and segments: Euler's method. Each segment is $\Delta t\times$ (velocity at the dot where it starts).</li>
<li>At the inspected dot (white circle) two arrows start. The <b>white arrow</b> is the velocity $(x',y')$ there, shrunk by a display factor $s$ so it fits; it shows direction only. The <b>orange dashed arrow</b> is the actual move $\Delta t\,(x',y')$: its tip is the next point, $x_{k+1}=x_k+\Delta t\,x'$, $y_{k+1}=y_k+\Delta t\,y'$.</li>
<li>The value box (tap a dot to choose which) shows the essentials; click <b>▸ show all the working</b> to expand it with the substituted velocity, the coordinates of both arrows, and $x_{k+1}=x_k+\Delta x$, $y_{k+1}=y_k+\Delta y$ worked out. Drag the box anywhere; double-click to reset its place.</li>

/* ---------- 2. Characteristic equation ---------- */
STEPS.push({
  name: 'λ equation',
  fig: '<b>Left:</b> the characteristic polynomial for real λ. <b>Right:</b> its roots in the complex plane.',
  text: R`<h2>The characteristic equation</h2>
<h3>Why eigenvalues at all</h3>
<p>Try the simplest imaginable motion: a solution that always points along one fixed vector $v$ and only changes size,</p>
$$X(t)=e^{\lambda t}v .$$
<p>Plug it in. The left side is $X'=\lambda e^{\lambda t}v$; the right side is $AX=e^{\lambda t}Av$. Cancel $e^{\lambda t}$ (it is never zero):</p>
$$Av=\lambda v\quad\Longleftrightarrow\quad (A-\lambda I)v=0 .$$
<p>A <i>nonzero</i> $v$ can satisfy this only if the matrix $A-\lambda I$ flattens some direction to zero, which happens exactly when its determinant is zero.</p>
<div class="clar"><b>Why “determinant = 0” is the condition.</b> If $\det(A-\lambda I)\neq0$, the matrix $A-\lambda I$ has an inverse. Multiplying $(A-\lambda I)v=0$ by that inverse gives $v=0$: only the zero vector works, and a zero vector gives no direction. If $\det(A-\lambda I)=0$, the two rows are multiples of each other, so the "two" equations are really <i>one</i> equation in two unknowns, and it has nonzero solutions. For any $2\times2$ matrix $\begin{pmatrix}p&q\\r&s\end{pmatrix}$, the determinant $ps-qr$ is zero exactly when the rows $(p,q)$ and $(r,s)$ are proportional; for example $\begin{pmatrix}1&2\\3&6\end{pmatrix}$ has $1\cdot6-2\cdot3=0$ and row 2 is $3\times$ row 1.</div>
<h3>Computing the determinant</h3>
$$A-\lambda I=\begin{pmatrix}-1-\lambda & -1\\ 2 & -3-\lambda\end{pmatrix}$$
$$\det(A-\lambda I)=(-1-\lambda)(-3-\lambda)-(-1)(2)$$
<p>First product: $(-1-\lambda)(-3-\lambda)=(1+\lambda)(3+\lambda)=\lambda^2+4\lambda+3$. Second term: $-(-1)(2)=+2$. Together:</p>
$$\lambda^2+4\lambda+5=0 .$$
<p>A shortcut for any $2\times2$ matrix: $\det(A-\lambda I)=\lambda^2-(\operatorname{tr}A)\,\lambda+\det A$. Here $\operatorname{tr}A=-1+(-3)=-4$ and $\det A=(-1)(-3)-(-1)(2)=5$.</p>
<div class="clar"><b>Where the shortcut comes from.</b> For $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$: $\det(A-\lambda I)=(a-\lambda)(d-\lambda)-bc=\lambda^2-(a+d)\lambda+(ad-bc)$. The middle coefficient is minus the trace $a+d$ (sum of the diagonal) and the constant is the determinant $ad-bc$. With $a=-1,\ b=-1,\ c=2,\ d=-3$: $\lambda^2-(-4)\lambda+5=\lambda^2+4\lambda+5$, the same as the long way.</div>
<h3>Solving it</h3>
$$\lambda=\frac{-4\pm\sqrt{4^2-4\cdot1\cdot5}}{2}=\frac{-4\pm\sqrt{-4}}{2}=\frac{-4\pm 2i}{2}=-2\pm i$$
<p>since $\sqrt{-4}=\sqrt4\,\sqrt{-1}=2i$. Completing the square says the same thing more transparently:</p>
$$\lambda^2+4\lambda+5=(\lambda+2)^2+1=0\ \Longrightarrow\ (\lambda+2)^2=-1\ \Longrightarrow\ \lambda+2=\pm i .$$
<h3>Reading the picture</h3>
<p>The left graph is $p(\lambda)=(\lambda+2)^2+1$ for real $\lambda$. Its lowest value is $1$ at $\lambda=-2$, so it never reaches zero: <b>there is no real eigenvalue</b>, which means there is no straight-line direction that $A$ merely stretches. Every trajectory is forced to turn. That is the first sign of a spiral.</p>
<div class="key">$\lambda=\co{-2}\pm\cb{1}\,i$. The real part $\co{-2}$ becomes the size factor $e^{-2t}$ (decay). The imaginary part $\cb{1}$ becomes the rotation $\cos t,\ \sin t$ (one full turn every $2\pi$). The board writes this split as $e^{(-2+i)t}=e^{-2t}\cdot e^{it}$.</div>
<p><b>Looking ahead: eigenvalues are unique, eigenvectors are not.</b> The two eigenvalues are completely pinned down by this equation. The eigenvector found in tab 3 is not: any nonzero multiple of it works too. Tab 3 describes that freedom with an angle $\varphi$ (a slider): multiplying the eigenvector by $e^{i\varphi}$ gives another valid eigenvector, and it turns out not to change the final set of solutions.</p>`,
  explain: R`<p><b>Left panel.</b> The yellow parabola is $p(\lambda)=\lambda^2+4\lambda+5$ drawn only for real inputs. A real eigenvalue would be a place where the curve crosses the green zero line. It never does: its minimum is 1, at $\lambda=-2$. Drag the λ slider to evaluate $p$ anywhere.</p>
<p><b>Right panel.</b> The complex plane: horizontal axis is the real part, vertical axis the imaginary part. The two roots $-2+i$ and $-2-i$ are the pink dots. They are mirror images (complex conjugates), which always happens for a real matrix.</p>
<p>The orange arrow is the real part ($-2$, controls shrinking). The blue dashed segments are the imaginary parts ($\pm1$, control turning).</p>`,

  move(X, Yv){ const v = this.v; if (!v) return; S.lam = r2d(Math.max(-5, Math.min(1, v.ix(X)))); },

STEPS.push({
  name: 'Eigenvector',
  fig: '<b>Real part a</b> (yellow) and <b>imaginary part b</b> (blue) of the eigenvector, drawn as arrows.',
  text: R`<h2>The complex eigenvector</h2>
<p>Take $\lambda=-2+i$ and solve $(A-\lambda I)v=0$ for $v=\begin{pmatrix}v_1\\v_2\end{pmatrix}$.</p>
$$A-\lambda I=\begin{pmatrix}-1-(-2+i) & -1\\ 2 & -3-(-2+i)\end{pmatrix}=\begin{pmatrix}1-i & -1\\ 2 & -1-i\end{pmatrix}$$
<p><b>Row 1</b> says $(1-i)v_1 - v_2 = 0$, so $v_2=(1-i)v_1$. Any nonzero $v_1$ works; pick $v_1=1$:</p>
$$v=\begin{pmatrix}1\\ 1-i\end{pmatrix}.$$
<p><b>Why row 2 needs no separate check.</b> The matrix whose determinant is zero is the one we are solving with: $A-\lambda I$ at $\lambda=-2+i$. That is not an accident: in step 2 we <i>chose</i> $\lambda$ as a root of $\det(A-\lambda I)=0$, so at this $\lambda$ the determinant must vanish. Checking it directly:</p>
$$\det\begin{pmatrix}1-i&-1\\2&-1-i\end{pmatrix}=(1-i)(-1-i)-(-1)(2).$$
<p>First term: $(1-i)(-1-i)=-(1-i)(1+i)=-(1-i^2)=-(1+1)=-2$. Second term: $-(-1)(2)=+2$. Total: $-2+2=0$ ✓.</p>
<div class="clar"><b>What a zero determinant tells us here.</b> The two rows are multiples of each other (step 2 explains why). Find the multiplier $m$ with row 2 $=m\times$ row 1. From the first entries: $2=m(1-i)$, so $m=\dfrac{2}{1-i}=\dfrac{2(1+i)}{(1-i)(1+i)}=\dfrac{2(1+i)}{2}=1+i$. Check the second entries: $m\times(-1)=-(1+i)=-1-i$, exactly row 2's second entry ✓. So equation 2 is just $(1+i)\times$ equation 1: whenever equation 1 holds, equation 2 holds automatically. That is why we solved only row 1.</div>
<p>Direct check of row 2 with $v=(1,\,1-i)$ anyway:</p>
$$2\cdot1+(-1-i)(1-i)=2-(1+i)(1-i)=2-2=0\ \checkmark$$
<h3>Split into real and imaginary parts</h3>
$$v=\begin{pmatrix}1\\1\end{pmatrix}+i\begin{pmatrix}0\\-1\end{pmatrix},\qquad \ca{a}=\begin{pmatrix}1\\1\end{pmatrix},\quad \cb{b}=\begin{pmatrix}0\\-1\end{pmatrix}.$$
<p>A complex eigenvector does not point anywhere in the real plane by itself. Its two real pieces $\ca{a}$ and $\cb{b}$ span the plane in which the motion happens, and (step 6) both of them lie on the ellipse that the motion traces.</p>
<h3>The conjugate, and the note on the board</h3>
<p>For $\bar\lambda=-2-i$ you get the conjugate eigenvector $\bar v=(1,\ 1+i)$. The board's note ("conjugate e-vector; real, imag → 2 real solutions") says: the conjugate pair carries no new information, so work with one of them and extract <b>two real solutions</b> from its real and imaginary parts.</p>
<h3>Freedom of choice, and where the angle φ comes from</h3>
<p><b>φ is not computed from the matrix.</b> Tab 2 found the eigenvalues, and those are fixed numbers: $\lambda^2+4\lambda+5=0$ has the roots $-2\pm i$ and nothing else. Eigenvectors are different: if $v$ is an eigenvector, so is every nonzero multiple $kv$ (see the yellow box below), and with complex numbers $k$ may be complex. The board simply picked $v_1=1$, giving $v=(1,\,1-i)$. Picking $v_1=k$ instead would give $kv$, which is just as correct.</p>
<p><b>Why an angle.</b> Any complex number can be written as size × turn (tab 0): $k=|k|\,e^{i\varphi}$. The size $|k|$ only stretches everything, which is easy to picture, so the slider varies only the turn: $k=e^{i\varphi}$, the point on the unit circle at angle $\varphi$. So <b>$\varphi$ is a free choice you make with the slider</b>, not something derived; $\varphi=0$ (that is, $k=1$) is the board's choice.</p>
<p><b>What multiplying by $e^{i\varphi}$ does.</b> Each entry of $v$ is a complex number, and multiplying it by $e^{i\varphi}$ rotates it by $\varphi$ in the complex plane (Euler's formula, tab 0). With $e^{i\varphi}=\cos\varphi+i\sin\varphi$:</p>
$$e^{i\varphi}\cdot1=\cos\varphi+i\sin\varphi,\qquad e^{i\varphi}(1-i)=(\cos\varphi+\sin\varphi)+i(\sin\varphi-\cos\varphi).$$
<p>(The second one multiplied out: $(\cos\varphi+i\sin\varphi)(1-i)=\cos\varphi-i\cos\varphi+i\sin\varphi-i^2\sin\varphi$, and $-i^2=+1$.) So the new real and imaginary parts are $\ca{\mathbf a_\varphi}=(\cos\varphi,\ \cos\varphi+\sin\varphi)$ and $\cb{\mathbf b_\varphi}=(\sin\varphi,\ \sin\varphi-\cos\varphi)$. These are the numbers in the live panel.</p>
<p><b>Worked example, $\varphi=\pi/2$.</b> $e^{i\pi/2}=i$, so $i\,(1,\ 1-i)=(i,\ i-i^2)=(i,\ 1+i)$: real parts $\ca{\mathbf a}=(0,1)$, imaginary parts $\cb{\mathbf b}=(1,1)$. At $\varphi=0$ they were $\mathbf a=(1,1)$ and $\mathbf b=(0,-1)$. A quarter turn made the old $\mathbf a$ the new $\mathbf b$, and the new $\mathbf a$ is the old $-\mathbf b$. (Your screenshot value $\cos\varphi=-0.029$, $\sin\varphi=1.000$ is $\varphi\approx1.60$, just past $\pi/2\approx1.571$.)</p>
<p><b>Why the choice does not matter in the end.</b> Multiplying the eigenvector by $e^{i\varphi}$ multiplies the complex solution by the same number, and</p>
$$e^{i\varphi}\,e^{(-2+i)t}v=e^{2\varphi}\,e^{(-2+i)(t+\varphi)}v$$
<p>(check: the right side is $e^{2\varphi}\,e^{-2t}e^{-2\varphi}\,e^{it}e^{i\varphi}v$, and $e^{2\varphi}e^{-2\varphi}=1$). So the new real part is just the old real part $u_1$ evaluated at the <b>shifted time</b> $t+\varphi$ and scaled by the constant $e^{2\varphi}$: the same kind of curve, started at a different point. Once the free constants $c_1,c_2$ are attached (tab 5), exactly the same set of solutions comes out, whatever $\varphi$ is. That is why tab 2 never needs $\varphi$, and why the board could quietly use $\varphi=0$.</p>
<p><b>Why the app shows it anyway.</b> Moving the slider makes this concrete: $\ca{\mathbf a}$ and $\cb{\mathbf b}$ change, yet they always stay on the <i>same</i> ellipse (derived in tab 6), a quarter turn apart.</p>
<div class="clar"><b>Why a multiple is still an eigenvector.</b> For any number $k$ (real or complex): $A(kv)=k\,(Av)=k\,(\lambda v)=\lambda\,(kv)$. A number can be moved through the matrix, so $kv$ satisfies the same equation $A(\cdot)=\lambda(\cdot)$. Only $k=0$ is excluded, because an eigenvector must be nonzero.</div>`,

/* ---------- 4. Two real solutions ---------- */
STEPS.push({
  name: 'Two real solutions',
  fig: '<b>Left:</b> the two real solutions in the phase plane. <b>Right:</b> their components against time.',
  tmax: () => TAU,
  text: R`<h2>One complex solution, two real ones</h2>
<p>With $\lambda=-2+i$ and $v=(1,\,1-i)$ we already have a (complex) solution $\tilde X(t)=e^{(-2+i)t}\,v$. We want real ones.</p>
<h3>1. Split the exponential</h3>
$$e^{(-2+i)t}=e^{-2t}\,e^{it}=e^{-2t}(\cos t+i\sin t)\qquad\text{(Euler's formula)}$$
<h3>2. Multiply out each component</h3>
<p>Top: $(\cos t+i\sin t)\cdot1=\cos t+i\sin t$.</p>
<p>Bottom: $(\cos t+i\sin t)(1-i)=\cos t-i\cos t+i\sin t-i^2\sin t=(\cos t+\sin t)+i(\sin t-\cos t)$, using $i^2=-1$.</p>
<h3>3. Collect real and imaginary parts</h3>
$$\tilde X(t)=e^{-2t}\left[\begin{pmatrix}\cos t\\ \cos t+\sin t\end{pmatrix}+i\begin{pmatrix}\sin t\\ \sin t-\cos t\end{pmatrix}\right]$$
<p>Rewrite each piece as "vector × cos + vector × sin", which is the shape on the board:</p>
$$\ca{u_1(t)}=\operatorname{Re}\tilde X=e^{-2t}\left[\begin{pmatrix}1\\1\end{pmatrix}\cos t+\begin{pmatrix}0\\1\end{pmatrix}\sin t\right]$$
$$\cb{u_2(t)}=\operatorname{Im}\tilde X=e^{-2t}\left[\begin{pmatrix}0\\-1\end{pmatrix}\cos t+\begin{pmatrix}1\\1\end{pmatrix}\sin t\right]$$
<p>So on the board $\begin{pmatrix}a_1\\a_2\end{pmatrix}=\begin{pmatrix}1\\1\end{pmatrix}$ and $\begin{pmatrix}b_1\\b_2\end{pmatrix}=\begin{pmatrix}0\\1\end{pmatrix}$, and "$c_2$(similar)" is $\cb{u_2}$.</p>
<div class="key">General recipe. If $v=\mathbf a+i\mathbf b$ and $\lambda=\alpha+i\beta$:<br>
$\operatorname{Re}=e^{\alpha t}(\mathbf a\cos\beta t-\mathbf b\sin\beta t)$, $\operatorname{Im}=e^{\alpha t}(\mathbf a\sin\beta t+\mathbf b\cos\beta t)$.<br>
Here $\mathbf b=(0,-1)$, so $-\mathbf b=(0,1)$ is the board's $(b_1,b_2)$.</div>
<h3>4. Why the real and imaginary parts are each solutions</h3>
<p>Write $\tilde X=u_1+i\,u_2$. It solves the system, so $u_1'+i\,u_2'=A u_1+i\,A u_2$. Since $A$ has only real entries, $Au_1$ and $Au_2$ are real. Two complex numbers are equal only when their real parts match and their imaginary parts match:</p>
$$u_1'=Au_1,\qquad u_2'=Au_2 .$$
<p>One complex solution hands us two real solutions for free. (The conjugate eigenvalue would give $u_1-i\,u_2$, which contains nothing new.)</p>
<h3>5. A worked check at t = 0</h3>
<p>$u_1(0)=(1,1)$. Differentiating $u_1$ and setting $t=0$ gives $u_1'(0)=(-2,-1)$. And $Au_1(0)=(-1-1,\ 2-3)=(-2,-1)$. Equal. The live panel repeats this check at every $t$.</p>
<div class="clar"><b>The differentiation, step by step.</b> Product rule: $\frac{d}{dt}\big[e^{-2t}f(t)\big]=e^{-2t}\big(-2f(t)+f'(t)\big)$. Top entry: $f=\cos t$, $f'=-\sin t$; at $t=0$: $-2(1)+0=-2$. Bottom entry: $f=\cos t+\sin t$, $f'=-\sin t+\cos t$; at $t=0$: $-2(1)+1=-1$. So $u_1'(0)=(-2,-1)$. For $Au_1(0)$: row 1 of $A$ times $(1,1)$ is $(-1)(1)+(-1)(1)=-2$; row 2 is $(2)(1)+(-3)(1)=-1$.</div>
<h3>6. How the two are related</h3>
<p>$u_2(t)=e^{-\pi}\,u_1(t-\pi/2)$: the blue solution is the yellow one running a quarter period behind (and scaled). Exactly like $\sin t$ is $\cos t$ shifted by a quarter period. Keep this in mind for the next step.</p>
<div class="clar"><b>Checking that claim.</b> Replace $t$ by $t-\pi/2$ in $u_1$ and use $\cos(t-\pi/2)=\sin t$ and $\sin(t-\pi/2)=-\cos t$: $u_1(t-\pi/2)=e^{-2(t-\pi/2)}\big(\sin t,\ \sin t-\cos t\big)=e^{\pi}e^{-2t}\big(\sin t,\ \sin t-\cos t\big)$. Multiplying by $e^{-\pi}$ removes the $e^{\pi}$ and leaves $e^{-2t}(\sin t,\ \sin t-\cos t)$, which is exactly $u_2(t)$ ✓.</div>`,
  explain: R`<ul><li><span class="sw" style="background:#c49410"></span><b>Yellow</b> = $u_1(t)$, the real part. Starts at $(1,1)$.</li>

<p><b>Left</b>: both drawn as trajectories in the $xy$-plane, with dots at the current $t$.</p>
<p><b>Right</b>: time plots. Solid lines are $x$-components, dashed lines are $y$-components. The faint envelope is $\pm e^{-2t}\sqrt2$.</p>
<p>Untick "include $e^{-2t}$" to see just the bracket. Then the oscillation is visible for the whole period: $u_1$ and $u_2$ run around the same closed curve, a quarter turn apart. With $e^{-2t}$ on, everything is squeezed to almost nothing after $t\approx2$.</p>`,

/* ---------- 6. Ellipse ---------- */
function solve3(M, rhs){
  const det = m => m[0][0]*(m[1][1]*m[2][2] - m[1][2]*m[2][1]) - m[0][1]*(m[1][0]*m[2][2] - m[1][2]*m[2][0]) + m[0][2]*(m[1][0]*m[2][1] - m[1][1]*m[2][0]);
  const D = det(M); if (Math.abs(D) < 1e-6) return {D, x: null};
  const x = [0, 1, 2].map(j => det(M.map((row, i) => row.map((val, k) => k === j ? rhs[i] : val))) / D);
  return {D, x};
}
STEPS.push({
  name: 'The ellipse',
  fig: '<b>"What does this part look like?"</b> The bracket alone, without exp(−2t).',
  tmax: () => TAU,
  enter(){ if (!S.visited['v' + this.name]){ S.c1 = 1; S.c2 = 0; S.t = 0; } },
  text: R`<h2>The bracket is an ellipse</h2>
<p>Drop the factor $e^{-2t}$ and look only at the bracket. Start with the board's case $c_1=1,\ c_2=0$:</p>
$$x=\cos t,\qquad y=\cos t+\sin t .$$
<p>The board lists three facts. <b>Bounded</b>: sines and cosines stay between $-1$ and $1$, so $|x|\le1$ and $|y|\le2$. <b>Period $2\pi$</b>: after $t$ grows by $2\pi$ everything repeats, so the curve closes up. <b>Satisfies $Ax^2+By^2+Cxy=D$</b>: shown three ways below.</p>
<h3>Method 1: undetermined coefficients, matching for all t</h3>
<p>Compute the three products that appear:</p>
$$x^2=\cos^2 t,\qquad y^2=\cos^2t+2\sin t\cos t+\sin^2t=1+2\sin t\cos t,\qquad xy=\cos^2t+\sin t\cos t .$$
<p>Substitute into $Ax^2+By^2+Cxy=D$ and group by the functions that appear:</p>
$$(A+C)\cos^2t+(2B+C)\sin t\cos t+B=D .$$
<p>The left side must equal the constant $D$ for <b>every</b> $t$. The functions $\cos^2t$ and $\sin t\cos t$ keep changing and cannot cancel each other (at $t=0$ they are $1$ and $0$; at $t=\pi/4$ both are $\tfrac12$). So each of their coefficients must be zero, and the constants must match:</p>
<div class="clar"><b>Why each coefficient must be zero, concretely.</b> The equation $(A+C)\cos^2t+(2B+C)\sin t\cos t+B=D$ must hold at every $t$, so in particular at three easy ones. At $t=\pi/2$ ($\cos=0,\ \sin=1$): $B=D$. At $t=0$ ($\cos^2=1,\ \sin\cos=0$): $(A+C)+B=D$; with $B=D$ this forces $A+C=0$. At $t=\pi/4$ ($\cos^2=\sin\cos=\tfrac12$): $\tfrac12(A+C)+\tfrac12(2B+C)+B=D$; with the two results already found this becomes $\tfrac12(2B+C)=0$, so $2B+C=0$.</div>
$$A+C=0,\qquad 2B+C=0,\qquad B=D .$$
<p>Three equations, four unknowns. That is expected: multiplying an equation of a curve by any nonzero number gives the same curve, so we may choose $D=1$. Then $B=1$, $C=-2B=-2$, $A=-C=2$:</p>
<div class="key">$$2x^2+y^2-2xy=1$$</div>
<h3>Method 2: plug in times, solve simultaneous equations</h3>
<p>This is the professor's "system of simultaneous equations". Fix $D=1$ and use three convenient times:</p>
<ul>
<li>$t=0$: $(x,y)=(1,1)$, so $A+B+C=1$.</li>
<li>$t=\pi/2$: $(x,y)=(0,1)$, so $B=1$.</li>
<li>$t=\pi/4$: $(x,y)=(\tfrac{\sqrt2}{2},\sqrt2)$, with $x^2=\tfrac12$, $y^2=2$, $xy=1$, so $\tfrac12A+2B+C=1$.</li>
</ul>
<p>From the second, $B=1$. Then the first gives $A+C=0$ and the third gives $\tfrac12A+C=-1$. Subtract: $\tfrac12A=1$, so $A=2$ and $C=-2$. Same answer.</p>
<p>Two cautions. Three points only pin down the coefficients <i>if</i> the curve has this form; Method 1 is what proves it holds at every $t$. Also, times that differ by $\pi$ give the same equation (the curve is symmetric through the origin), so the system becomes singular. Try it with the three time sliders.</p>
<h3>Method 3: a two-line check with no guessing</h3>
<p>Notice $x=\cos t$ and $y-x=\sin t$. So</p>
$$x^2+(y-x)^2=\cos^2t+\sin^2t=1\ \Longrightarrow\ 2x^2-2xy+y^2=1 .$$
<h3>All values of c₁ and c₂</h3>
<p>In general $x=c_1\cos t+c_2\sin t$ and $y-x=c_1\sin t-c_2\cos t$, and the same trick gives</p>
$$2x^2-2xy+y^2=c_1^2+c_2^2 .$$
<p>Same $A,B,C$; only $D$ changes. Every bracket is a scaled copy of one ellipse, all sharing the same centre, shape and tilt.</p>
<h3>Why it is an ellipse (not a hyperbola or parabola)</h3>
<p>For $Ax^2+By^2+Cxy=D$ the test is the sign of $C^2-4AB$: here $(-2)^2-4\cdot2\cdot1=-4<0$, which means ellipse (for $D>0$). In matrix form $2x^2-2xy+y^2=\begin{pmatrix}x&y\end{pmatrix}\begin{pmatrix}2&-1\\-1&1\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}$, whose eigenvalues $\frac{3\pm\sqrt5}{2}\approx2.618,\ 0.382$ are both positive. The semi-axes for $D=1$ are $1/\sqrt{0.382}\approx1.618$ and $1/\sqrt{2.618}\approx0.618$ (the golden ratio and its reciprocal), and the long axis points along $(1,\ 1.618)$, tilted about $58.3^\circ$.</p>
<div class="clar"><b>The details behind this paragraph.</b> <br><b>Matrix form.</b> Multiply out: $\begin{pmatrix}x&y\end{pmatrix}\begin{pmatrix}2&-1\\-1&1\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}=\begin{pmatrix}x&y\end{pmatrix}\begin{pmatrix}2x-y\\-x+y\end{pmatrix}=2x^2-xy-xy+y^2$. The $-2xy$ is split equally between the two off-diagonal places.
<br><b>Why a negative $C^2-4AB$ means an ellipse.</b> Complete the square: $2x^2-2xy+y^2=x^2+(y-x)^2$. That is a sum of two squares, so it is positive everywhere except at the origin (where both squares are 0). Its level set $=D>0$ is therefore a closed curve around the origin: an ellipse. In general $Ax^2+Cxy+By^2=A\big(x+\tfrac{C}{2A}y\big)^2+\tfrac{4AB-C^2}{4A}\,y^2$, which is a sum of squares (for $A>0$) exactly when $C^2-4AB<0$.

});

$$X(t)=e^{-2t}\,E(t),\qquad E(t)=c_1(\dots)+c_2(\dots)\ \text{on the ellipse } 2x^2-2xy+y^2=c_1^2+c_2^2 .$$
<p>Two things happen at once. $E(t)$ keeps walking around its ellipse (the turning, from the $i$ in $\lambda$). The factor $e^{-2t}$ pulls the whole picture toward the origin (the shrinking, from the $-2$). Plug $X$ into the quadratic form; each term has two factors of $e^{-2t}$:</p>
$$2x^2-2xy+y^2=(c_1^2+c_2^2)\,e^{-4t}.$$
<p>So at time $t$ the point sits on the ellipse of level $D\,e^{-4t}$. It never returns to an ellipse it has left, and it crosses smaller and smaller ones: the path winds inward. <b>Spiral</b> because $\operatorname{Im}\lambda=1\neq0$; <b>sink</b> because $\operatorname{Re}\lambda=-2<0$.</p>

<p>Insert $x'=-x-y$ and $y'=2x-3y$ term by term:</p>

<p>Add: $x^2$ terms $-8x^2$, $xy$ terms $(-4+2+6+4)xy=8xy$, $y^2$ terms $-4y^2$. So</p>

<h3>The professor's test: one easy point</h3>
<p>Pick the simplest point on the positive $x$-axis, $(1,0)$, and compute the velocity:</p>
$$x'=-1-0=-1,\qquad y'=2(1)-3(0)=2 .$$
<p>The velocity $(-1,2)$ points <b>up</b> (and a little left). A point on the positive $x$-axis that moves upward is turning from the $x$-axis toward the positive $y$-axis, which is the counterclockwise sense. That is exactly the handwritten note: at $(1,0)$, $(x',y')=(-1,2)$, so the motion is counterclockwise.</p>
<p>Only the <i>sign</i> of $y'$ at $(1,0)$ matters, and that is the lower-left entry of $A$ (here $2$). For any system with complex eigenvalues: that entry positive means counterclockwise, negative means clockwise.</p>
<h3>Why one point is enough</h3>
<p>Could the particle turn counterclockwise at $(1,0)$ but clockwise somewhere else? Check the rate of change of the polar angle $\theta$. With $x=r\cos\theta$, $y=r\sin\theta$,</p>
$$\theta'=\frac{x\,y'-y\,x'}{x^2+y^2}.$$
<div class="clar"><b>Where this formula comes from.</b> The angle satisfies $\tan\theta=y/x$, so $\theta=\arctan(y/x)$ (away from the $y$-axis; the final formula holds everywhere). Differentiate with $\frac{d}{dt}\arctan u=\frac{u'}{1+u^2}$ and $u=y/x$, $u'=\frac{y'x-yx'}{x^2}$ (quotient rule): $\theta'=\dfrac{(xy'-yx')/x^2}{1+y^2/x^2}=\dfrac{xy'-yx'}{x^2+y^2}$. Worked example at $(1,0)$ with velocity $(-1,2)$: $\theta'=\frac{1\cdot2-0\cdot(-1)}{1}=2$.</div>
<p>(The numerator is the "cross product" of position and velocity; positive means the velocity points to the left of the position vector, i.e. turning counterclockwise.) Compute the numerator for our system:</p>

<p>It is the <b>same quadratic form</b> as the ellipse, which is positive at every point except the origin. So $\theta'>0$ everywhere: every trajectory turns counterclockwise at every moment.</p>
<div class="clar"><b>Why it is positive everywhere except the origin.</b> $2x^2-2xy+y^2=x^2+(x-y)^2$. Both squares are $\ge0$, and they are both zero only when $x=0$ and $x=y$, i.e. only at the origin. Example at $(0,1)$: $0+1=1>0$; at $(1,1)$: $1+0=1>0$.</div>

/* ================= DAMPED OSCILLATOR (companion system) ================= */
function oscP(){
  const k = S.k, b = S.bd, r = b/2, disc = b*b - 4*k, o = {k, b, r, disc};
  o.crit = Math.abs(disc) < 1e-6; o.under = !o.crit && disc < 0; o.over = !o.crit && disc > 0;
  o.w = o.under ? Math.sqrt(-disc)/2 : 0;
  if (o.over){ const q = Math.sqrt(disc); o.l1 = (-b + q)/2; o.l2 = (-b - q)/2; }
  return o;
}
function OU1(r, w, t){ const e = Math.exp(-r*t), c = Math.cos(w*t), s = Math.sin(w*t); return [e*c, e*(-r*c - w*s)]; }
function OU2(r, w, t){ const e = Math.exp(-r*t), c = Math.cos(w*t), s = Math.sin(w*t); return [e*s, e*(-r*s + w*c)]; }
// exact solution of x'=y, y'=-kx-by from (x0,y0), valid in every damping regime
function oscX(o, x0, y0, t){
  if (o.under){ const C1 = x0, C2 = (y0 + o.r*x0)/o.w, a = OU1(o.r, o.w, t), bb = OU2(o.r, o.w, t); return [C1*a[0] + C2*bb[0], C1*a[1] + C2*bb[1]]; }

  const be = (y0 - o.l1*x0)/(o.l2 - o.l1), al = x0 - be, e1 = Math.exp(o.l1*t), e2 = Math.exp(o.l2*t);
  return [al*e1 + be*e2, al*o.l1*e1 + be*o.l2*e2];
}

<h3>Where the system comes from</h3>
<p>A unit mass on a spring (constant $k$) with a damper (constant $b$) obeys $x''+bx'+kx=0$. Introduce the velocity as a second unknown, $y=x'$. Then</p>
$$x'=y,\qquad y'=x''=-kx-by,$$
$$\frac{d}{dt}\begin{pmatrix}x\\y\end{pmatrix}=\begin{pmatrix}0&1\\-k&-b\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}.$$
<p>This is called the <b>companion system</b> of the second-order equation. Its phase plane has position $x$ across and velocity $y=x'$ up.</p>
<h3>Eigenvalues (same method as step 2)</h3>
$$\det\begin{pmatrix}-\lambda&1\\-k&-b-\lambda\end{pmatrix}=(-\lambda)(-b-\lambda)-(1)(-k)=\lambda^2+b\lambda+k=0$$
$$\lambda=\frac{-b\pm\sqrt{b^2-4k}}{2}.$$
<p>The characteristic equation is the familiar $\lambda^2+b\lambda+k=0$: the companion matrix just "carries" the ODE's own polynomial. When $b^2-4k<0$ (<b>underdamped</b>) the square root is imaginary:</p>
$$\lambda=-r\pm i\omega,\qquad r=\frac b2,\qquad \omega=\frac{\sqrt{4k-b^2}}{2}.$$
<p>Both $r$ and $\omega$ are real and positive (for $b>0$). A useful fact visible in the figure: $|\lambda|^2=r^2+\omega^2=\frac{b^2}{4}+\frac{4k-b^2}{4}=k$. So as the damping $b$ grows from 0, the two roots slide along the circle of radius $\sqrt k$ until they meet on the real axis at $b=2\sqrt k$ (critical damping).</p>

<h3>1. The exponential solution</h3>
$$\mathbf v e^{\lambda t}=\begin{pmatrix}1\\-r+i\omega\end{pmatrix}e^{(-r+i\omega)t},\qquad r,\omega>0 .$$
<h3>2. Euler's formula</h3>
$$e^{(-r+i\omega)t}=e^{-rt}e^{i\omega t}=e^{-rt}\big[\cos(\omega t)+i\sin(\omega t)\big].$$
<h3>3. Multiply each entry</h3>
<p>Top: $1\cdot(\cos\omega t+i\sin\omega t)=\cos\omega t+i\sin\omega t$.</p>
<p>Bottom: $(-r+i\omega)(\cos\omega t+i\sin\omega t)=-r\cos\omega t-ir\sin\omega t+i\omega\cos\omega t+i^2\omega\sin\omega t$. With $i^2=-1$ and grouping:</p>
$$=\big(-r\cos\omega t-\omega\sin\omega t\big)+i\big(-r\sin\omega t+\omega\cos\omega t\big).$$
<h3>4. Collect</h3>
$$\mathbf v e^{\lambda t}=\left[\begin{pmatrix}\cos\omega t\\-r\cos\omega t-\omega\sin\omega t\end{pmatrix}+i\begin{pmatrix}\sin\omega t\\-r\sin\omega t+\omega\cos\omega t\end{pmatrix}\right]e^{-rt}.$$
<h3>5. The general real solution</h3>
$$\mathbf x(t)=C_1\operatorname{Re}(\mathbf ve^{\lambda t})+C_2\operatorname{Im}(\mathbf ve^{\lambda t})$$

<p>Why both $C_1$ and $C_2$: exactly the argument of step 5. At $t=0$ the two parts are $(1,-r)$ and $(0,\omega)$, not parallel, so together they reach any starting position and velocity:</p>

<p>In the recipe of step 4, $v=\mathbf a+i\mathbf b$ with $\mathbf a=(1,-r)$ and $\mathbf b=(0,\omega)$. Then $\operatorname{Re}=e^{-rt}(\mathbf a\cos\omega t-\mathbf b\sin\omega t)$, which is the yellow vector above. For the board problem the corresponding pieces were $\mathbf a=(1,1)$, $\mathbf b=(0,-1)$ with $\omega=1$.</p>

  text: R`<h2>Question 11.1: what do the trajectories look like?</h2>
<p>Take the special case $C_1=1,\ C_2=0$ (press the "C₁ = 1, C₂ = 0" button):</p>
$$\mathbf x(t)=\begin{pmatrix}\cos\omega t\\-r\cos\omega t-\omega\sin\omega t\end{pmatrix}e^{-rt}.$$
<h3>If r were zero: an ellipse</h3>
<p>Then $b=0$, the eigenvalues are $\pm i\omega$ with $\omega=\sqrt k$, and $x=\cos\omega t$, $y=-\omega\sin\omega t$. Since $\cos^2+\sin^2=1$:</p>
$$x^2+\frac{y^2}{\omega^2}=1\quad\Longleftrightarrow\quad kx^2+y^2=k .$$
<p>That is the undamped oscillator, and the ellipse has a physical meaning: $\tfrac12y^2+\tfrac12kx^2$ is kinetic plus spring energy, which stays constant.</p>
<h3>For r > 0: the ellipse shrinks, so a spiral</h3>
<p>The bracket still traces a closed ellipse; the factor $e^{-rt}$ decreases as $t$ increases, shrinking it. So the trajectory spirals toward the origin. This is exactly step 6 plus step 7 for the board problem.</p>
<h3>Making "the ellipse" precise (Method 3 of step 6)</h3>
<p>For the bracket with general $C_1,C_2$: $x=C_1\cos\omega t+C_2\sin\omega t$ and</p>
$$y+rx=\omega\,(C_2\cos\omega t-C_1\sin\omega t).$$
<p>Square and add: $x^2+\dfrac{(y+rx)^2}{\omega^2}=C_1^2+C_2^2$. Multiply by $\omega^2$ and use $\omega^2+r^2=k$, $2r=b$:</p>
$$kx^2+b\,xy+y^2=\omega^2\,(C_1^2+C_2^2).$$
<p>In the notation $Ax^2+By^2+Cxy=D$ this is $A=k$, $B=1$, $C=b$. The ellipse test $C^2-4AB<0$ reads $b^2-4k<0$: <b>the curve is an ellipse exactly when the oscillator is underdamped.</b></p>
<h3>How fast it shrinks (step 7's Lyapunov check)</h3>
<p>Let $Q=kx^2+bxy+y^2$. With $x'=y$, $y'=-kx-by$:</p>
$$\frac{dQ}{dt}=2kxy+b(y\cdot y+x(-kx-by))+2y(-kx-by)=-b\,(kx^2+bxy+y^2)=-bQ.$$
<div class="clar"><b>The algebra in the middle.</b> Chain rule: $\frac{dQ}{dt}=2kx\,x'+b\,(x'y+xy')+2y\,y'$. Substitute $x'=y$, $y'=-kx-by$: $2kxy+b\big(y^2+x(-kx-by)\big)+2y(-kx-by)=2kxy+by^2-bkx^2-b^2xy-2kxy-2by^2$. The $2kxy$ terms cancel, and $by^2-2by^2=-by^2$, leaving $-bkx^2-b^2xy-by^2=-b\,(kx^2+bxy+y^2)$.</div>
<p>So $Q(t)=Q(0)e^{-bt}=Q(0)e^{-2rt}$, and the size shrinks like $e^{-rt}$. For the board, $b=4$ gave $-4Q$.</p>
<h3>Which way does it turn?</h3>
<p>Step 8's test: at $(1,0)$ the velocity is $(x',y')=(0,-k)$, straight down. Moving down from the positive $x$-axis is <b>clockwise</b>, matching the arrow in the textbook figure. Everywhere: $xy'-yx'=x(-kx-by)-y\cdot y=-Q<0$. Physically, when the spring is stretched ($x>0$) it pulls back, so the velocity becomes negative. The board problem turned the other way because its lower-left entry was $+2$; step 12 explains why the two are still the same motion.</p>
<h3>The textbook example: k = 2, b = 1</h3>
<p>$r=0.5$, $\omega=\tfrac{\sqrt{8-1}}{2}=\tfrac{\sqrt7}{2}\approx1.323$. The start is $(1,-r)=(1,-0.5)$. Each turn shrinks the size by $e^{-2\pi r/\omega}\approx0.093$, so a couple of loops are visible. On the board problem the same factor was $e^{-2\pi\cdot2/1}=e^{-4\pi}\approx3.5\times10^{-6}$: what decides how many loops you see is the ratio $r/\omega$. The textbook curve also seems to include earlier times ($t<0$), where the spiral is larger; tick "show earlier times" to match it.</p>`,

<li><span class="sw" style="background:#b83e63"></span>Pink: the trajectory (bright up to the current time, faint afterwards). Orange arrow: velocity now.</li>
<li>Faint chalk ellipses: the level sets $kx^2+bxy+y^2=\text{const}$; bright one: the level the point is on now. They exist only when $b^2<4k$.</li>
<li><b>Second panel</b>: position $x(t)$ against time with envelope $\pm\sqrt{C_1^2+C_2^2}\,e^{-rt}$.</li></ul>
<p>Try: $b=0$ (closed ellipse, constant energy); small $b$ (many loops); $b$ past $2\sqrt k$ (no loops, no ellipses: overdamped).</p>`,

/* ---------- 13. Two views of one motion ---------- */
STEPS.push({
  name: 'Two views',
  fig: '<b>One motion, two coordinate systems:</b> the board system (left) and the damped spring k = 5, b = 4 (right).',
  tmax: () => 3.5,
  enter(){ if (!S.visited['v' + this.name]){ S.c1 = 1; S.c2 = 1; S.t = 0; } },
  text: R`<h2>The board problem is a damped spring</h2>
<h3>Eliminate y</h3>
<p>From the first equation, $x'=-x-y$, so $y=-x-x'$. Differentiate the first equation and use the second:</p>
$$x''=-x'-y'=-x'-(2x-3y)=-x'-2x+3y .$$
<p>Replace $y$ by $-x-x'$: $3y=-3x-3x'$, so</p>
$$x''=-x'-2x-3x-3x'=-4x'-5x\quad\Longrightarrow\quad x''+4x'+5x=0 .$$
<p>So the $x$-part of every board solution is the position of a unit mass with $k=5$, $b=4$: underdamped because $16-20<0$, with $r=2$, $\omega=1$. Indeed the board's first component is $x(t)=e^{-2t}(c_1\cos t+c_2\sin t)$, the damped oscillator formula with $C_1=c_1$, $C_2=c_2$.</p>
<h3>The change of coordinates</h3>
<p>The companion plane uses (position, velocity) $=(x,x')=(x,\,-x-y)$. As a matrix:</p>
$$\begin{pmatrix}x\\x'\end{pmatrix}=M\begin{pmatrix}x\\y\end{pmatrix},\qquad M=\begin{pmatrix}1&0\\-1&-1\end{pmatrix},\qquad M^{-1}=M .$$
<p>Converting the matrix: $MAM^{-1}=\begin{pmatrix}0&1\\-5&-4\end{pmatrix}$, the companion matrix with $k=5,\ b=4$. Similar matrices have the same eigenvalues, which is why both give $-2\pm i$. The eigenvectors correspond too: $M(1,\,1-i)=(1,\,-2+i)=(1,\lambda)$.</p>
<div class="clar"><b>The matrix arithmetic, and why the eigenvalues agree.</b> <br><b>$M^{-1}=M$:</b> $MM=\begin{pmatrix}1&0\\-1&-1\end{pmatrix}\begin{pmatrix}1&0\\-1&-1\end{pmatrix}=\begin{pmatrix}1&0\\(-1)(1)+(-1)(-1)&(-1)(0)+(-1)(-1)\end{pmatrix}=\begin{pmatrix}1&0\\0&1\end{pmatrix}$.
<br><b>$MAM^{-1}$:</b> first $AM=\begin{pmatrix}-1&-1\\2&-3\end{pmatrix}\begin{pmatrix}1&0\\-1&-1\end{pmatrix}=\begin{pmatrix}0&1\\5&3\end{pmatrix}$, then $M(AM)=\begin{pmatrix}1&0\\-1&-1\end{pmatrix}\begin{pmatrix}0&1\\5&3\end{pmatrix}=\begin{pmatrix}0&1\\-5&-4\end{pmatrix}$.
<br><b>Same eigenvalues:</b> $\det(MAM^{-1}-\lambda I)=\det\big(M(A-\lambda I)M^{-1}\big)=\det M\cdot\det(A-\lambda I)\cdot\det M^{-1}=\det(A-\lambda I)$, because $\det M\cdot\det M^{-1}=1$. Same characteristic polynomial, same eigenvalues.</div>
<h3>Everything else transfers</h3>
<ul>
<li><b>Ellipse.</b> Substituting $y=-x-x'$ into $2x^2-2xy+y^2$ gives $5x^2+4xx'+x'^2$, i.e. $kx^2+bxy+y^2$ from step 11 with $k=5,\ b=4$. Same level $c_1^2+c_2^2$ (and $\omega^2=1$).</li>
<li><b>Decay.</b> Both levels decay like $e^{-4t}$ ($=e^{-bt}=e^{2\,\mathrm{Re}\lambda\, t}$).</li>
<li><b>Direction.</b> $\det M=-1$: $M$ includes a reflection, and reflections reverse the sense of rotation. So counterclockwise in the board's plane (step 8) becomes clockwise in the spring's plane (step 11). Nothing about the motion changed; only the picture was mirrored.</li>
<li><div class="clar"><b>Why a negative determinant flips the rotation.</b> $\det M=(1)(-1)-(0)(-1)=-1$. The sign of a determinant says whether the map keeps or reverses orientation. $M$ sends $(1,0)\mapsto(1,-1)$ and $(0,1)\mapsto(0,-1)$. The originals go counterclockwise from the first to the second (a quarter turn left). For the images, the "cross product" $1\cdot(-1)-(-1)\cdot0=-1<0$: going from the first image to the second is a turn to the <i>right</i>. The order is reversed, like in a mirror, so every counterclockwise loop becomes clockwise.</div></li>
</ul>
<div class="key">Summary of the correspondence. Board: $\lambda=-2\pm i$, $v=(1,1-i)$, ellipse $2x^2-2xy+y^2$, counterclockwise. Spring ($k=5,b=4$): $\lambda=-r\pm i\omega=-2\pm i$, $v=(1,\lambda)$, ellipse $5x^2+4xx'+x'^2$, clockwise. Same $x(t)$.</div>`,
  explain: R`<ul><li><b>Top left</b>: the board's $(x,y)$ plane. Drag the white start point.</li>
<li><b>Top right</b>: the same solution plotted as $(x,\,x')=(x,\,-x-y)$, the damped-spring phase plane.</li>
<li><b>Bottom</b>: $x(t)$, which is literally the same curve for both, with envelope $\pm\sqrt{c_1^2+c_2^2}\,e^{-2t}$.</li></ul>
<p>The bright chalk curve in each plane is the current ellipse level; the green arcs mark the direction of turning. Press Play: the pink dots move in step, one counterclockwise and one clockwise.</p>`,

    h += L(R`(c_1^2+c_2^2)e^{-4t}=${nf((c1*c1 + c2*c2)*Math.exp(-4*t),5)}`);

/* ================= GENERAL s ± iω, DIRECTION, QUIZZES ================= */
function inv2(P){ const d = P[0][0]*P[1][1] - P[0][1]*P[1][0]; return [[P[1][1]/d, -P[0][1]/d], [-P[1][0]/d, P[0][0]/d]]; }
function mul2(A, B){ return [[A[0][0]*B[0][0] + A[0][1]*B[1][0], A[0][0]*B[0][1] + A[0][1]*B[1][1]], [A[1][0]*B[0][0] + A[1][1]*B[1][0], A[1][0]*B[0][1] + A[1][1]*B[1][1]]]; }
function mv2(A, x){ return [A[0][0]*x[0] + A[0][1]*x[1], A[1][0]*x[0] + A[1][1]*x[1]]; }
function texM(A, d = 2){ return R`\begin{pmatrix}${nf(A[0][0],d)}&${nf(A[0][1],d)}\\ ${nf(A[1][0],d)}&${nf(A[1][1],d)}\end{pmatrix}`; }
function ctrlHTML(st){ let h = st.controls ? st.controls() : ''; if (!h.includes('data-b="showCallout"')) h += '<div class="row">' + ck('showCallout', 'values on figure') + '<span class="hint">drag the box anywhere; double-click it to reset</span></div>'; return h; }
function rebuildControls(){ const st = STEPS[S.step]; ctrlEl.innerHTML = ctrlHTML(st); bindControls(); }
// arrowheads along a sampled path, only where visible
function pathArrows(v, pts, col, every = 110){
  for (let i = Math.floor(every/2); i < pts.length - 3; i += every){
    const p = pts[i], q = pts[i + 3];
    if (p[0] < v.xmin || p[0] > v.xmax || p[1] < v.ymin || p[1] > v.ymax) continue;
    if (Math.hypot((q[0] - p[0])*v.sx, (q[1] - p[1])*v.sy) < 2) continue;
    warrow(v, p, q, col, 1.6, 9);
  }
}

/* ---------- General s ± iω ---------- */
function gen13(){
  const s = S.gs, w = S.gw, a = [S.a1, S.a2], b = [S.b1, S.b2], P = [[a[0], b[0]], [a[1], b[1]]];
  const dP = P[0][0]*P[1][1] - P[0][1]*P[1][0], o = {s, w, a, b, P, dP, ok: Math.abs(dP) > 1e-3};
  if (o.ok){ o.Pi = inv2(P); o.A = mul2(mul2(P, [[s, w], [-w, s]]), o.Pi); }
  o.br = (C1, C2, t) => { const c = Math.cos(w*t), sn = Math.sin(w*t);
    return [C1*(a[0]*c - b[0]*sn) + C2*(a[0]*sn + b[0]*c), C1*(a[1]*c - b[1]*sn) + C2*(a[1]*sn + b[1]*c)]; };
  o.X = (C1, C2, t) => { const e = Math.exp(s*t), q = o.br(C1, C2, t); return [e*q[0], e*q[1]]; };
  let m = 0.3; for (let k = 0; k < 64; k++){ const q = o.br(1, 0, k*TAU/64/w); m = Math.max(m, Math.hypot(q[0], q[1])); } o.m = m;
  return o;
}
function tmax13(){ const o = gen13(), per = TAU/o.w;
  if (o.s < -1e-3) return Math.min(Math.log(100)/-o.s, 6*per);
  if (o.s > 1e-3) return Math.max(0.3, Math.min(Math.log(3.2/o.m*1.05)/o.s, 6*per));
  return per; }
STEPS.push({
  name: 'General s ± iω',
  fig: '<b>Any complex pair λ = s ± iω</b> with eigenvector v = a + i b. Arrows: a (yellow), b (blue).',
  tmax: tmax13,
  text: R`<h2>The general case: λ = s ± iω</h2>
<p>Everything so far fits one template. Suppose the eigenvalues are $\lambda=s+i\omega$ and $\bar\lambda=s-i\omega$, with both $s$ and $\omega$ nonzero real numbers, and write the eigenvector of $\lambda$ as real part plus $i$ times imaginary part:</p>
$$\mathbf v=\ca{\begin{pmatrix}a_1\\a_2\end{pmatrix}}+i\,\cb{\begin{pmatrix}b_1\\b_2\end{pmatrix}}=\ca{\mathbf a}+i\,\cb{\mathbf b}.$$
<p>($\bar{\mathbf v}=\mathbf a-i\mathbf b$ is then the eigenvector of $\bar\lambda$.)</p>
<h3>Derivation of the general real solution</h3>
<p>Use $e^{\lambda t}=e^{st}(\cos\omega t+i\sin\omega t)$ and multiply out, remembering $i\cdot i=-1$:</p>
$$\mathbf ve^{\lambda t}=(\mathbf a+i\mathbf b)(\cos\omega t+i\sin\omega t)\,e^{st}$$
$$=\big[\mathbf a\cos\omega t+i\,\mathbf a\sin\omega t+i\,\mathbf b\cos\omega t+i^2\,\mathbf b\sin\omega t\big]e^{st}$$
$$=\big[(\mathbf a\cos\omega t-\mathbf b\sin\omega t)+i\,(\mathbf a\sin\omega t+\mathbf b\cos\omega t)\big]e^{st}.$$
<p>So, exactly as in steps 4 and 5:</p>
$$\mathbf x(t)=C_1\,\mathrm{Re}(\mathbf ve^{\lambda t})+C_2\,\mathrm{Im}(\mathbf ve^{\lambda t})$$
$$=C_1\big[\mathbf a\cos\omega t-\mathbf b\sin\omega t\big]e^{st}+C_2\big[\mathbf a\sin\omega t+\mathbf b\cos\omega t\big]e^{st},$$
<p>with $s,\omega,a_1,a_2,b_1,b_2,C_1,C_2$ all real.</p>
<h3>What each number does</h3>
<ul>
<li>$s$ controls <b>repulsion or attraction</b>: the size factor $e^{st}$. $s>0$ means a <b>spiral source</b> (repelling spiral: every nonzero trajectory spirals outward). $s<0$ means a <b>spiral sink</b> (attracting spiral: every trajectory spirals inward). $s=0$ gives a <b>center</b>.</li>
<li>$\omega$ controls <b>rotation</b>: the bracket repeats every $2\pi/\omega$, so $\omega$ is the angular frequency.</li>
<li>$\mathbf a$ and $\mathbf b$ control the <b>shape and tilt</b> of the ellipse, and (below) the direction.</li>
</ul>
<h3>Why the bracket is always an ellipse</h3>
<p>Put $\mathbf a$ and $\mathbf b$ as the columns of $P=[\,\mathbf a\ \ \mathbf b\,]$. Then</p>
$$C_1(\mathbf a\cos\omega t-\mathbf b\sin\omega t)+C_2(\mathbf a\sin\omega t+\mathbf b\cos\omega t)=P\begin{pmatrix}C_1\cos\omega t+C_2\sin\omega t\\ C_2\cos\omega t-C_1\sin\omega t\end{pmatrix}.$$
<p>The vector on the right has constant length $\sqrt{C_1^2+C_2^2}$ (square and add), so it runs around a circle. A matrix turns a circle into an ellipse. This is the general reason behind step 6 and step 11.</p>
<div class="clar"><b>Why a matrix turns a circle into an ellipse.</b> Write the bracket as $\mathbf x=P\mathbf u$ with $|\mathbf u|=\rho$ constant. Then $\mathbf u=P^{-1}\mathbf x$, and $|P^{-1}\mathbf x|^2=\rho^2$ is a sum of two squares in $x$ and $y$ set equal to a positive constant: a closed quadratic curve around the origin, i.e. an ellipse (the same reasoning as the completed square in step 6).</div>
<h3>Which matrix has this eigen-data?</h3>
<p>Split $A\mathbf v=\lambda\mathbf v$ into real and imaginary parts: $A\mathbf a+iA\mathbf b=(s\mathbf a-\omega\mathbf b)+i(\omega\mathbf a+s\mathbf b)$. So $A\mathbf a=s\mathbf a-\omega\mathbf b$ and $A\mathbf b=\omega\mathbf a+s\mathbf b$, which in matrix form is</p>
$$AP=P\begin{pmatrix}s&\omega\\-\omega&s\end{pmatrix}\quad\Longrightarrow\quad A=P\begin{pmatrix}s&\omega\\-\omega&s\end{pmatrix}P^{-1}.$$
<p>The live panel builds $A$ from your sliders this way.</p>
<h3>The two textbook examples</h3>
<p><b>Spiral source.</b> $\mathbf x=\mathrm{Re}\Big[\begin{pmatrix}2\\-i\end{pmatrix}e^{(1+3i)t}\Big]$. Here $\mathbf a=(2,0)$, $\mathbf b=(0,-1)$, $s=1$, $\omega=3$. Top entry: $2e^{t}(\cos3t+i\sin3t)$, real part $2\cos3t\,e^t$. Bottom entry: $-i(\cos3t+i\sin3t)e^t=(\sin3t-i\cos3t)e^t$, real part $\sin3t\,e^t$. So</p>
$$\mathbf x=\begin{pmatrix}2\cos3t\\ \sin3t\end{pmatrix}e^{t},\qquad\text{the ellipse }\tfrac{x^2}{4}+y^2=1\text{ blown up by }e^t.$$
<p>The matrix is $A=\begin{pmatrix}1&-6\\1.5&1\end{pmatrix}$ (check: $A\begin{pmatrix}2\cos3t\\ \sin3t\end{pmatrix}e^t$ equals the derivative $\begin{pmatrix}2\cos3t-6\sin3t\\ \sin3t+3\cos3t\end{pmatrix}e^t$).</p>
<p><b>Spiral sink.</b> Same $\mathbf v$ with $\lambda=-1+3i$: $\mathbf x=\begin{pmatrix}2\cos3t\\ \sin3t\end{pmatrix}e^{-t}$, matrix $\begin{pmatrix}-1&-6\\1.5&-1\end{pmatrix}$. Same ellipse, shrinking instead of growing.</p>
<div class="clar"><b>Why is the "example solution" only the real part, when the pictures show many curves?</b>
<br><b>One example vs. the whole family.</b> The example is <i>one particular solution</i>: the general solution $C_1\,\mathrm{Re}+C_2\,\mathrm{Im}$ with $C_1=1,\ C_2=0$. The real part alone is already a genuine solution (tab 4), so it is a legitimate example. The pictures, on the other hand, show <i>many</i> trajectories, one per starting point; each of those curves is $C_1\,\mathrm{Re}+C_2\,\mathrm{Im}$ for its own pair $(C_1,C_2)$.
<br><b>The imaginary part is a solution too.</b> Here $\mathrm{Im}\Big[\binom{2}{-i}e^{(1+3i)t}\Big]=\binom{2\sin3t}{-\cos3t}e^{t}$: at $t=0$ it starts at $(0,-1)$ instead of $(2,0)$. For instance $C_1=C_2=1$ gives $\binom{2\cos3t+2\sin3t}{\sin3t-\cos3t}e^{t}$, another curve of the same picture.
<br><b>Why one example is enough.</b> Every combination is itself the real part of a multiple of the same exponential solution, because $\mathrm{Re}(-iz)=\mathrm{Im}(z)$:
$$C_1\,\mathrm{Re}(z)+C_2\,\mathrm{Im}(z)=\mathrm{Re}\big((C_1-iC_2)\,z\big).$$
Writing $C_1-iC_2$ as size × turn, $\rho\,e^{-i\delta}$, gives $\rho\,\mathrm{Re}\big(e^{-i\delta}z\big)$: the example solution scaled by $\rho$ and shifted in time by $\delta/\omega$ (the same argument as the angle $\varphi$ in tab 3). So every trajectory is the example solution, rescaled and started at a different moment. It shares the same growth or decay $e^{st}$ and the same turning rate $\omega$. That is why a single example is enough to tell "spiral source" from "spiral sink". The figure in this tab draws several of these curves (faint pink) together with the example itself (bright pink, $C_1=1,\ C_2=0$).</div>
<h3>Direction from a and b (a shortcut)</h3>
<p>Take $C_1=1,C_2=0$. At $\omega t=0$ the bracket is at $\mathbf a$; a quarter period later ($\omega t=\pi/2$) it is at $-\mathbf b$. Written as $P\binom{\cos\omega t}{-\sin\omega t}$, the inner vector turns clockwise, and $P$ keeps the turning sense if $\det P>0$ and reverses it if $\det P<0$. So, for $\omega>0$:</p>
<div class="clar"><b>Two facts used above.</b> <br>(1) $\binom{\cos\omega t}{-\sin\omega t}$ turns <b>clockwise</b>: at $\omega t=0$ it is $(1,0)$, a quarter period later $(0,-1)$, i.e. from the positive $x$-axis down to the negative $y$-axis.
<br>(2) The sign of $\det P$ says whether $P$ keeps ($>0$) or reverses ($<0$) the sense of rotation, exactly as for the matrix $M$ in step 12. So clockwise inner motion becomes counterclockwise on the plane when $\det P<0$.</div>
<div class="key">counterclockwise $\iff\det[\,\mathbf a\ \ \mathbf b\,]=a_1b_2-a_2b_1<0$.</div>
<p>Checks: board problem $\mathbf a=(1,1),\mathbf b=(0,-1)$: $\det=-1<0$, counterclockwise (step 8). Spring $\mathbf a=(1,-r),\mathbf b=(0,\omega)$: $\det=\omega>0$, clockwise (step 11). Textbook example $\mathbf a=(2,0),\mathbf b=(0,-1)$: $\det=-2$, counterclockwise. The next step gives the easier test the course recommends.</p>
<div class="key">This app's cases in this notation: board $s=-2,\ \omega=1$; spring $s=-r,\ \omega=\sqrt{4k-b^2}/2$; textbook examples $s=\pm1,\ \omega=3$.</div>`,
  explain: R`<ul><li>Faint arrows: the direction field of the matrix $A=P\begin{pmatrix}s&\omega\\-\omega&s\end{pmatrix}P^{-1}$ built from your sliders.</li>
<li>Faint pink curves with arrowheads: trajectories from several starting points (drawn for earlier and later times), like the textbook's spiral pictures.</li>
<li>Bright pink: the "Re" solution ($C_1=1,C_2=0$), starting at $\mathbf a$. Press Play to watch it move.</li>
<li><span class="sw" style="background:#c49410"></span>$\mathbf a$ and <span class="sw" style="background:#1f76a3"></span>$\mathbf b$: the real and imaginary parts of the eigenvector. The dashed chalk ellipse is the bracket (the path when $s=0$).</li></ul>
<p>Try: move $s$ through 0 (source, center, sink); change $\omega$ (tighter or looser winding); swap the sign of $b_2$ (the direction flips because $\det[\mathbf a\ \mathbf b]$ changes sign).</p>`,
  controls: () => sl('gs', 's (real part)', -1.5, 1.5, 0.01, 'ro') + sl('gw', 'ω (imag part)', 0.3, 4, 0.01, 'r2') +
    '<div class="row">' + '<span class="lbl">a = (a₁, a₂)</span><input type="range" class="r1" data-k="a1" min="-3" max="3" step="0.1" style="flex:1 1 80px"><output data-o="a1"></output><input type="range" class="r1" data-k="a2" min="-3" max="3" step="0.1" style="flex:1 1 80px"><output data-o="a2"></output></div>' +
    '<div class="row">' + '<span class="lbl">b = (b₁, b₂)</span><input type="range" class="r2" data-k="b1" min="-3" max="3" step="0.1" style="flex:1 1 80px"><output data-o="b1"></output><input type="range" class="r2" data-k="b2" min="-3" max="3" step="0.1" style="flex:1 1 80px"><output data-o="b2"></output></div>' +

  draw(){

const MC_OPTS = ['Clockwise center', 'Counterclockwise center', 'Clockwise spiral sink', 'Counterclockwise spiral sink', 'Clockwise spiral source', 'Counterclockwise spiral source'];
function mcInfo(){

<p>which comes from eigenvalues $\lambda=s\pm i\omega$. (Compare: $\boldsymbol\alpha=\mathbf a$ and $\boldsymbol\beta=-\mathbf b$ in the $C_1=1$ solution $\mathbf a\cos\omega t-\mathbf b\sin\omega t$.) So you can read the answer straight off:</p>

<li>The exponent's coefficient is the real part $s$ of the eigenvalue: $s<0$ spiral sink, $s>0$ spiral source, no exponential ($s=0$) center.</li>
<li>The number inside cos and sin is $\omega$; it controls how fast the point turns, not the type.</li>

function analyse(a, b, c, d){
  const T = a + d, De = a*d - b*c, disc = T*T - 4*De, eps = 1e-9, o = {T, De, disc};
  if (disc < -eps){
    o.complex = true; o.al = T/2; o.be = Math.sqrt(-disc)/2;
    const p21 = (o.al - a)/b, p22 = o.be/b; o.av = [1, p21]; o.bv = [0, p22];
    const m = -p21/p22, n = 1/p22; o.Q = [1 + m*m, n*n, 2*m*n];
    o.kind = Math.abs(T) < 1e-6 ? 'center' : T < 0 ? 'spiral sink' : 'spiral source';
    o.cw = c > 0 ? 'counterclockwise' : 'clockwise';
  } else {
    o.complex = false; const sq = Math.sqrt(Math.max(0, disc)); o.l1 = (T + sq)/2; o.l2 = (T - sq)/2;
    const ev = l => Math.abs(b) > eps ? [b, l - a] : Math.abs(c) > eps ? [l - d, c] : null;
    o.e1 = ev(o.l1); o.e2 = ev(o.l2);
    if (De < -eps) o.kind = 'saddle';
    else if (Math.abs(De) <= eps) o.kind = 'degenerate (a zero eigenvalue: a line of equilibria)';
    else if (Math.abs(disc) <= eps) o.kind = T < 0 ? 'repeated eigenvalue, sink' : 'repeated eigenvalue, source';
    else o.kind = T < 0 ? 'node sink' : 'node source';
  }
  return o;
}
function traj(f, x0, y0, dt, n, h){
  const pts = [[x0, y0]]; let x = x0, y = y0;
  for (let i = 0; i < n; i++){
    const k1 = f(x, y), k2 = f(x + dt/2*k1[0], y + dt/2*k1[1]), k3 = f(x + dt/2*k2[0], y + dt/2*k2[1]), k4 = f(x + dt*k3[0], y + dt*k3[1]);
    x += dt/6*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0]); y += dt/6*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1]);
    if (!isFinite(x) || Math.abs(x) > h*1.6 || Math.abs(y) > h*1.6) break;
    pts.push([x, y]); if (x*x + y*y < 1e-6) break;
  }
  return pts;
}

/* ---------- 0. Basics (beginner's toolkit) ---------- */
function tmax0(){ return Math.min(4*TAU, Math.max(TAU, 2*TAU/Math.max(0.25, S.eb))); }
const BASICS_STEP = {
  name: 'Basics first',
  sub: '0',
  popCtrlRight: true,   // in the companion tab, controls sit in the right column under the live calculation
  fig: '<b>Euler’s formula, live:</b> the point exp((a + ib)t) in the complex plane.',
  tmax: tmax0,
  text: R`<h2>Basics first: the toolkit for everything that follows</h2>
<p>This tab collects every piece of background the later tabs use. If a later step says "multiply the matrix by the vector" or "take the real part", the how-to is here, with small worked numbers. Skip any part you already know.</p>
<h3>1. Vectors and multiplying a matrix by a vector</h3>
<p>A point of the plane is a vector $\begin{pmatrix}x\\y\end{pmatrix}$. A $2\times2$ matrix acts on it <b>row by column</b>: each row of the matrix is paired with the vector, entries multiplied and added.</p>
$$\begin{pmatrix}a&b\\c&d\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}=\begin{pmatrix}ax+by\\cx+dy\end{pmatrix}.$$
<p>Worked example with the matrix of this whole app, $A=\begin{pmatrix}-1&-1\\2&-3\end{pmatrix}$, and the point $(1,0)$: row 1 gives $(-1)(1)+(-1)(0)=-1$, row 2 gives $(2)(1)+(-3)(0)=2$. So $A\begin{pmatrix}1\\0\end{pmatrix}=\begin{pmatrix}-1\\2\end{pmatrix}$. Notice this is just the first column of $A$.</p>
<p>That is all "$X'=AX$" means: the velocity $(x',y')$ is the matrix times the position $(x,y)$, i.e. $x'=-x-y$ and $y'=2x-3y$.</p>
<h3>2. The identity matrix and "A − λI"</h3>
<p>$I=\begin{pmatrix}1&0\\0&1\end{pmatrix}$ leaves every vector unchanged: $Iv=v$. So $\lambda I=\begin{pmatrix}\lambda&0\\0&\lambda\end{pmatrix}$, and $A-\lambda I$ simply means: <b>subtract $\lambda$ from the two diagonal entries</b> of $A$: $\begin{pmatrix}-1-\lambda&-1\\2&-3-\lambda\end{pmatrix}$.</p>
<h3>3. The determinant</h3>
<p>For $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ the determinant is $ad-bc$ (down-diagonal product minus up-diagonal product). For our $A$: $(-1)(-3)-(-1)(2)=3+2=5$.</p>
<p><b>What it means.</b> The determinant is the factor by which the matrix scales areas (with a sign that says whether it mirrors). The key case: <b>determinant 0</b> means the matrix squashes the whole plane onto a line. Then its two rows are multiples of each other, for example $\begin{pmatrix}1&2\\3&6\end{pmatrix}$ has $1\cdot6-2\cdot3=0$ and row 2 $=3\times$ row 1. Such a matrix sends some nonzero vector to $0$ (here $(2,-1)$: $1\cdot2+2\cdot(-1)=0$ and $3\cdot2+6\cdot(-1)=0$). That is exactly what eigenvectors need (tabs 2 and 3).</p>
<h3>4. Complex numbers in five rules</h3>
<ol>
<li>$i$ is a number with $i^2=-1$. A complex number is $p+qi$ with real part $p$ and imaginary part $q$.</li>
<li><b>Add</b> part by part: $(1+2i)+(3-i)=4+i$.</li>
<li><b>Multiply</b> like brackets, then replace $i^2$ by $-1$: $(1-i)(1+i)=1+i-i-i^2=1-(-1)=2$.</li>
<li><b>Conjugate</b>: flip the sign of the imaginary part, $\overline{p+qi}=p-qi$. A number times its conjugate is real: $(p+qi)(p-qi)=p^2+q^2$.</li>
<li><b>Divide</b> by multiplying top and bottom by the conjugate of the bottom: $\dfrac{2}{1-i}=\dfrac{2(1+i)}{(1-i)(1+i)}=\dfrac{2+2i}{2}=1+i$.</li>
</ol>
<p>Picture $p+qi$ as the point $(p,q)$ of the <b>complex plane</b>: real part across, imaginary part up. Its distance from 0 is $\sqrt{p^2+q^2}$. Also: $\sqrt{-4}=\sqrt4\,\sqrt{-1}=2i$, which is how negative discriminants turn into complex eigenvalues.</p>
<h3>5. Euler’s formula: the heart of every spiral</h3>
$$e^{i\theta}=\cos\theta+i\sin\theta .$$
<p>It says: $e^{i\theta}$ is the point of the <b>unit circle</b> at angle $\theta$. So $e^{it}$ runs around the circle as $t$ grows, one full turn every $2\pi$. Worked values: $e^{0}=1$ (angle 0), $e^{i\pi/2}=\cos\frac\pi2+i\sin\frac\pi2=i$ (straight up), $e^{i\pi}=-1$ (half turn).</p>
<p>Now combine with an ordinary exponential. Exponents add, so</p>
$$e^{(a+ib)t}=e^{at}\,e^{ibt}=e^{at}\big(\cos bt+i\sin bt\big).$$
<p>The factor $e^{at}$ is a <b>size</b> (it shrinks if $a<0$, grows if $a>0$, stays 1 if $a=0$), and $e^{ibt}$ is a <b>turn</b> by angle $bt$. Size times turn: a point that circles <i>and</i> shrinks traces a spiral. The figure shows exactly this; set $a=-0.2$ and $b=1$ and press Play. With $a=-2,\ b=1$ this is the $e^{(-2+i)t}$ of the main problem.</p>
<h3>6. The derivative rules used</h3>
<ul>
<li>$\frac{d}{dt}e^{ct}=c\,e^{ct}$ for any constant $c$ (even complex).</li>
<li>$\frac{d}{dt}\cos t=-\sin t$ and $\frac{d}{dt}\sin t=\cos t$.</li>
<li><b>Product rule</b>: $(fg)'=f'g+fg'$. Example: $\frac{d}{dt}\big(e^{-2t}\cos t\big)=-2e^{-2t}\cos t-e^{-2t}\sin t$.</li>
<li><b>Chain rule</b>: $\frac{d}{dt}f(g(t))=f'(g(t))\,g'(t)$. Example: $\frac{d}{dt}(x^2)=2x\,x'$ when $x$ depends on $t$.</li>
</ul>
<h3>7. What "solving" the system means</h3>
<p>A solution is a <b>pair of functions</b> $x(t),\ y(t)$ whose derivatives obey the two equations at every time. Two ways to picture it: as two curves against time ($x$ vs $t$, $y$ vs $t$), or as one curve in the $xy$-plane (the <b>phase plane</b>), where time is how fast you move along the curve.</p>
<h3>8. Mini glossary</h3>
<ul>
<li><b>Eigenvalue $\lambda$ / eigenvector $v$</b>: a number and a nonzero vector with $Av=\lambda v$ (the matrix only stretches $v$).</li>
<li><b>Trajectory</b>: the path of one solution in the phase plane. <b>Equilibrium</b>: a point where the velocity is zero (here only the origin).</li>
<li><b>Sink / source / center</b>: trajectories go into / out of / around the equilibrium. <b>Spiral</b>: they also turn. <b>Node</b>: they come in along straight-ish lines. <b>Saddle</b>: some in, some out.</li>
<li><b>Trace</b>: sum of the diagonal entries of a matrix. <b>Determinant</b>: $ad-bc$.</li>
<li><b>Quadratic form</b>: an expression like $Ax^2+Bxy+Cy^2$. <b>Level set</b>: all points where it equals one fixed number (here: ellipses).</li>
</ul>`,

<li>White line: from 0 to $z$; its length is the size $e^{at}$. Green arc: the angle $bt$.</li>
