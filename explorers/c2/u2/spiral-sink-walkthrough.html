  '0': R`Two tools do almost all the work in this app: <b>multiplying a matrix by a vector</b> (row by column) and <b>Euler’s formula</b> $e^{i\theta}=\cos\theta+i\sin\theta$, which turns "complex exponential" into "size × turn".`,
  '1': R`The two equations are a <b>velocity rule</b>: at every point they say which way and how fast the point moves. Solving the system means finding the paths that always follow this rule.`,
  '1b': R`A point moves by <b>velocity × a small time step</b>, then reads the velocity again at its new place. The exact solution is what you get as the step shrinks to zero.`,
  '2': R`Eigenvalues are the special numbers $\lambda$ for which $A-\lambda I$ has determinant 0. For this $A$ they are $-2\pm i$: the $-2$ makes things <b>shrink</b>, the $\pm i$ makes them <b>turn</b>.`,
  '3': R`The eigenvector solves $(A-\lambda I)v=0$; one row is enough because the rows are proportional. Its real and imaginary parts $\mathbf a,\mathbf b$ are two real arrows that build the motion. The eigenvector is only fixed up to a multiple; the slider angle $\varphi$ shows that choice, and it does not change the final solutions.`,
  '4': R`One complex solution gives <b>two real solutions for free</b>: its real part and its imaginary part.`,
  '5': R`A starting point has two coordinates, so the general solution needs <b>two free constants</b> $c_1,c_2$, one per independent real solution.`,
  '6': R`Without the $e^{-2t}$ factor, every solution runs around the <b>same-shaped ellipse</b> $2x^2-2xy+y^2=c_1^2+c_2^2$.`,
  '7': R`Put $e^{-2t}$ back: the point keeps going around while its ellipse <b>shrinks</b>. Turning + shrinking = <b>spiral sink</b>.`,
  '8': R`Compute the velocity at one easy point, $(1,0)$. It points <b>up</b>, so the motion is <b>counterclockwise</b>, and it is the same everywhere.`,
  '9': R`A damped spring $x''+bx'+kx=0$ becomes a $2\times2$ system with $y=x'$. When $b^2<4k$ (underdamped) its eigenvalues are complex: $-r\pm i\omega$.`,
  '10': R`The same recipe as tab 4, now with letters: real and imaginary parts of $(1,\lambda)\,e^{\lambda t}$ give the two real solutions.`,
  '11': R`Underdamped motion is a <b>shrinking ellipse</b>: a spiral into the origin, turning <b>clockwise</b> in the (position, velocity) plane.`,
  '12': R`The board problem <b>is</b> a damped spring ($k=5$, $b=4$), just drawn in mirrored coordinates. That is why it turns the other way.`,

  '14': R`Direction test: compute $A\binom{1}{0}$ (the first column). If its second entry is positive the motion is <b>counterclockwise</b>, if negative <b>clockwise</b>.`,
  '15': R`Read the type straight off the formula: an $e^{st}$ factor with $s<0$ is a sink, $s>0$ a source, no exponential a center.`,
  '16': R`Everything in one place: the <b>trace</b> and <b>determinant</b> of the matrix decide which picture you get.`

function composeText(st){
  let t = st.text; const k = KEY_IDEA[st.dnum];
  if (k){ const i = t.indexOf('</h2>'); const box = '<div class="keyidea"><b>Key idea.</b> ' + k + '</div>'; t = i >= 0 ? t.slice(0, i + 5) + box + t.slice(i + 5) : box + t; }
  const q = CHECKS[st.dnum];
  if (q) t += '<h3>Check your understanding</h3><p class="hint3">Try each one first, then click it to reveal the answer.</p>' + q.map(([a, b], n) => '<details class="qa"><summary><b>Q' + (n + 1) + '.</b> ' + a + '</summary><div>' + b + '</div></details>').join('');
  return md(t);
}

<p>A direction field is not a continuous picture. It is a <b>sample</b>: we pick a regular grid of points and draw one small arrow at each. Between the dots nothing is drawn; your eye fills in the flow.</p>
<h3>How this app places the grid</h3>
<p>The drawing area is measured in <b>screen pixels</b>. Starting half a spacing in from the left and top edge of the plotting area, a dot is placed every $h$ pixels (the <i>spacing</i>, 30 px in the main app). Starting at $h/2$ keeps the outermost arrows from sticking out of the frame.</p>

<p>Each dot's pixel position must be turned into a point $(x,y)$ of the plane before we can plug it into the equations. With $s$ = pixels per unit (the same horizontally and vertically, so circles look like circles):</p>

   text: R`<h2>Step 3. Why not draw the raw vectors everywhere?</h2>
<p>Do step 2 at every dot with one common scale $\kappa$. The picture is honest but hard to read. The speed of a linear system grows in proportion to the distance from the origin: at $(2,2)$ the board system gives $\mathbf v=(-4,-2)$, length $\approx4.47$, while at $(0.1,0)$ it is $(-0.1,0.2)$, length $\approx0.22$.</p>
<p>Move the $\kappa$ slider. Large $\kappa$: outer arrows overlap and cover each other. Small $\kappa$: inner arrows shrink to dots and their directions vanish. No single $\kappa$ works everywhere.</p>
<div class="key">The fix: separate the two pieces of information. Draw the <b>direction</b> with arrows that all have the same length, and show the <b>speed</b> another way (brightness, step 6).</div>`},
  {name: 'Normalize', fig: '<b>Step 4.</b> Faint: raw vectors. Bright: the same directions, all rescaled to one length.',
   text: R`<h2>Step 4. Keep only the direction: normalize</h2>
<p>Divide each velocity by its own length. This produces a <b>unit vector</b>, pointing the same way but with length 1:</p>
$$\hat{\mathbf u}=\frac{\mathbf v}{|\mathbf v|}=\frac{(x',\,y')}{\sqrt{x'^2+y'^2}}.$$
<p>At $(1,0)$: $\hat{\mathbf u}=\frac{(-1,\,2)}{2.236}=(-0.447,\ 0.894)$. Check: $0.447^2+0.894^2=1$.</p>
<p>At the origin $\mathbf v=(0,0)$ has no direction (you cannot divide by 0). That point is the equilibrium, and no arrow is drawn there.</p>
<h3>A screen detail</h3>
<p>The app normalizes in <b>screen units</b>: it converts the velocity to pixels first, $(x'\,s,\ -y'\,s)$, and then divides by the length. The minus sign is the flipped $y$-axis from step 1. Because horizontal and vertical scales are equal, this gives exactly the same direction as the math version; the flip just makes "up" on paper become "up" on the screen.</p>`},
  {name: 'One arrow', fig: '<b>Step 5.</b> Each arrow has the same length and is centred on its grid point.',
   text: R`<h2>Step 5. Draw one fixed-length arrow, centred on the point</h2>
<p>Choose a half-length $\ell$ in pixels. The app uses a total length of $0.68\,h$, so $\ell=0.34\,h$ (about 10 px for $h=30$), shorter than the spacing so that neighbours never touch. The arrow is <b>centred</b> on the grid point $P$:</p>
$$\text{tail }T=P-\ell\,\hat{\mathbf u},\qquad \text{head }H=P+\ell\,\hat{\mathbf u}\qquad(\text{in pixels}).$$
<p>Centring makes the arrow clearly "belong" to its dot: the dot sits in the middle of it. (Some books start the arrow at the point instead; the direction is the same.)</p>
<p><b>Arrowhead.</b> At $H$ a small filled triangle is drawn: from the head go back $5$ px along $-\hat{\mathbf u}$, and $\pm2.25$ px sideways (perpendicular to $\hat{\mathbf u}$), and fill the three points. The shaft stops just short of the tip so it does not poke through.</p>
<p>The figure shows $T$, $P$ and $H$ for the selected point; the live panel gives their pixel coordinates. Try the length slider.</p>`},
  {name: 'Brightness', fig: '<b>Step 6.</b> Brighter arrow = faster motion there.',
   text: R`<h2>Step 6. Show speed with brightness</h2>
<p>Normalizing threw away the speed, so it comes back as <b>opacity</b>. First find the largest speed among all the grid points on screen, $m_{\max}$. Then each arrow with speed $m$ gets opacity</p>
$$\alpha=0.16+0.42\sqrt{m/m_{\max}} .$$
<ul><li>The fastest arrow gets $\alpha=0.58$; an arrow at rest would get $0.16$, so even the slowest arrows stay visible.</li>
<li>The square root lifts small values: a point moving at a quarter of the top speed gets $\sqrt{0.25}=0.5$ of the extra brightness, not just $0.25$.</li></ul>
<p>For the board problem the arrows near the origin are faint (slow) and those near the corners bright (fast). Untick "brightness by speed" to see the uniform version.</p>`},
  {name: 'Build it all', fig: '<b>Step 7.</b> The same recipe repeated at every grid point, one arrow at a time.',
   text: R`<h2>Step 7. Repeat at every grid point</h2>
<p>The whole field is steps 1 to 6 in a loop. Press <b>Play</b> to watch it happen arrow by arrow, in the order the app uses: column by column from the left, top to bottom inside each column. The ringed dot is the arrow being drawn; the live panel shows its numbers.</p>
<pre style="font-size:12.5px;background:var(--acc-soft);padding:8px 10px;border-radius:8px;overflow-x:auto">first pass: for every grid point
    (x, y)  = pixel to math          (step 1)
    (u, w)  = velocity rule at (x, y) (step 2)
    remember speed m = |(u, w)|, track the largest
second pass: for every grid point
    unit    = (u*s, -w*s) / its length   (step 4)
    tail, head = P -/+ half_length*unit  (step 5)
    opacity = 0.16 + 0.42*sqrt(m / largest) (step 6)
    draw shaft and arrowhead
</pre>
<p>Two passes are needed because the brightness of each arrow depends on the fastest speed anywhere, which is only known after every point has been evaluated.</p>`},
  {name: 'Check it', fig: '<b>Step 8.</b> Nullclines (green) and trajectories (pink) confirm the field. Tap to drop a trajectory.',
   text: R`<h2>Step 8. Check the picture against the equations</h2>
<h3>Nullclines</h3>
<p>Where $x'=0$ the arrows must be <b>vertical</b> (no horizontal motion); where $y'=0$ they must be <b>horizontal</b>. For the board problem:</p>
$$x'=-x-y=0\iff y=-x,\qquad y'=2x-3y=0\iff y=\tfrac23x .$$
<p>These two lines (green, dashed) cross only at the origin, the equilibrium. Look along them: the arrows really are vertical on one and horizontal on the other.</p>
<h3>Trajectories follow the arrows</h3>
<p>A trajectory is a curve whose velocity at each point is $\mathbf v(x,y)$, so it is <b>tangent</b> to the arrow at every point it passes. Tap anywhere to drop a trajectory; it threads through the arrows without ever crossing one at an angle. This is why the field alone already shows the spiral, before solving anything.</p>
<h3>What the field does not show</h3>
<p>Time. Arrows give direction (and, through brightness, relative speed), but not where a particle will be at $t=1$. For that you need the solution formula, which is what the main app derives.</p>
<p>Direction check: the arrow at $(1,0)$ points up and to the left, the "velocity test" of step 8 in the main app, so the rotation is counterclockwise.</p>`}
];

  h += L(R`\kappa\mathbf v=${nf(LB.kappa,2)}\,(${nf(P.u,3)},\ ${nf(P.w,3)})=(${nf(LB.kappa*P.u,3)},\ ${nf(LB.kappa*P.w,3)})`) + '</div>';
  h += '<div' + cur(2) + '><h4>3. Raw lengths on screen</h4>';
  const mins = Math.min(...G.pts.map(p => p.m)); h += L(R`\text{slowest }${nf(mins,3)},\ \ \text{fastest }m_{\max}=${nf(G.mx,3)}`);
  h += L(R`\text{raw arrow lengths: }${nf(LB.kappa*mins*v.sx,1)}\text{ to }${nf(LB.kappa*G.mx*v.sx,1)}\text{ px (spacing }${LB.sp})`) + '</div>';
  const g = labArrowGeom(P, v);
  h += '<div' + cur(3) + '><h4>4. Unit direction</h4>';
  if (P.m < 1e-9) h += Y('Speed zero: equilibrium, no direction, no arrow.');
  else { h += L(R`\hat{\mathbf u}=\frac{(${nf(P.u,3)},\ ${nf(P.w,3)})}{${nf(P.m,3)}}=(${nf(P.u/P.m,3)},\ ${nf(P.w/P.m,3)})`);
    if (g) h += L(R`\text{screen: }(\hat u_X,\hat u_Y)=(${nf(g.ux,3)},\ ${nf(g.uy,3)})`); h += Y('Screen $Y$ component has the opposite sign (screen $Y$ points down).'); }
  h += '</div>';
  if (g){ h += '<div' + cur(4) + '><h4>5. Tail and head</h4>';
    h += L(R`\ell=\tfrac12\cdot${nf(LB.lenFrac,2)}\cdot${LB.sp}=${nf(g.Ln,2)}\text{ px}`);
    h += L(R`T=P-\ell\hat{\mathbf u}=(${nf(g.T[0],1)},\ ${nf(g.T[1],1)})`) + L(R`H=P+\ell\hat{\mathbf u}=(${nf(g.Hd[0],1)},\ ${nf(g.Hd[1],1)})`) + '</div>';
    const al = 0.16 + 0.42*Math.sqrt(P.m/G.mx);
    h += '<div' + cur(5) + '><h4>6. Opacity</h4>';
    h += L(R`\alpha=0.16+0.42\sqrt{\tfrac{${nf(P.m,3)}}{${nf(G.mx,3)}}}=${nf(al,3)}`) + '</div>'; }
  if (st === 6) h += '<div' + cur(6) + '><h4>7. Progress</h4>' + L(R`\text{arrow }${Math.min(G.pts.length, Math.floor(LB.k))}\text{ of }${G.pts.length}`) + '</div>';
  if (st === 7){ h += '<div' + cur(7) + '><h4>8. Nullclines</h4>';
    h += L(R`x'=0:\ ${nf(A[0][0],1)}x ${sgn(A[0][1],1)}y=0`) + L(R`y'=0:\ ${nf(A[1][0],1)}x ${sgn(A[1][1],1)}y=0`);
    h += Y('On the first line the arrow has no horizontal part, on the second no vertical part.') + '</div>'; }
  labCalc.innerHTML = h;
}
LSTAGES.forEach((s, i) => { const b = document.createElement('button'); b.innerHTML = '<span class="num">' + (i + 1) + '</span>' + s.name; b.onclick = () => labGo(i); labNav.appendChild(b); });
document.getElementById('labprev').onclick = () => labGo(LB.stage - 1);
document.getElementById('labnext').onclick = () => labGo(LB.stage + 1);
function openLab(){ LB.open = true; labEl.hidden = false; S.playing = false; labResize(); labGo(LB.stage); try { history.replaceState(null, '', '#fieldlab'); } catch(e){} updateExplainWin(); }
function closeLab(){ LB.open = false; labEl.hidden = true; LB.playing = false; dirty = true; try { history.replaceState(null, '', '#step' + (S.step + 1)); } catch(e){} updateExplainWin(); }
document.getElementById('labclose').onclick = closeLab;
document.getElementById('labtab').onclick = () => { window.open(location.href.split('#')[0] + '#fieldlab', '_blank'); };
document.getElementById('openLabBtn').onclick = openLab;
new ResizeObserver(labResize).observe(lwrap);
function labPointerXY(X, Yv, type){
  if (!LB.v) return; const v = LB.v;
  if (type === 'move' && LB.stage === 7) return;
  if (LB.stage === 7 && type === 'down'){ LB.trajs.push([v.ix(X), v.iy(Yv)]); if (LB.trajs.length > 10) LB.trajs.shift(); }
  if (LB.stage === 6) return;
  if (LB.snap && LB.stage <= 5){ const sc = ctx; ctx = lctx; const G = labGrid(v); ctx = sc; let best = null, bd = 1e9;
    G.pts.forEach(p => { const d = Math.hypot(p.X - X, p.Y - Yv); if (d < bd){ bd = d; best = p; } }); if (best) LB.probe = [best.x, best.y]; }
  else LB.probe = [v.ix(X), v.iy(Yv)];
  labChanged();
}
wirePointer(lcv, 'lab');
function labTick(dt){
  if (!LB.open) return; let anim = false;
  if (LB.playing && LB.stage === 6){ LB.k += dt*LB.rate; anim = true; if (LB.k >= (LB.nPts || 0)){ LB.k = LB.nPts; LB.playing = false; const pb = labCtrl.querySelector('[data-lact=play]'); if (pb) pb.textContent = 'Play'; } }
  if (anim || LB.dirty){ const wd = LB.dirty; labDraw(); if (wd) labRenderCalc(); }
  if (anim){ labTick.acc = (labTick.acc || 0) + dt; if (labTick.acc > 0.15){ labTick.acc = 0; labRenderCalc(); } }
}

/* loop */
let lastT = performance.now(), calcTimer = 0;
function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  const st = STEPS[S.step]; let anim = false;
  if (S.playing && st.tmax){ const tm = st.tmax(); S.t += dt*Math.max(0.7, tm/12); if (S.t > tm) S.t = 0; anim = true; syncControls(); }
  labTick(dt);
  pushExplainLive(now);
  if (st.tick && st.tick(dt)) anim = true;
  if (anim || dirty) draw();
  if (anim){ calcTimer += dt; if (calcTimer > 0.15){ calcTimer = 0; renderCalc(); } }
  dirty = false; requestAnimationFrame(loop);
}
new ResizeObserver(resize).observe(cvwrap);
if (document.fonts && document.fonts.load){ Promise.all(['italic 16px KaTeX_Math', '16px KaTeX_Main'].map(f => document.fonts.load(f).catch(() => null))).then(() => { dirty = true; if (typeof LB !== 'undefined') LB.dirty = true; }); document.fonts.ready.then(() => { dirty = true; if (typeof LB !== 'undefined') LB.dirty = true; }); }
resize();
const m = /#step(\d+)/.exec(location.hash);
go(m ? parseInt(m[1], 10) - 1 : 0);
if (location.hash === '#fieldlab') openLab();
requestAnimationFrame(loop);
</script>

<script>
/* Phone-width safety net, inlined into every explorer by build.py.
   On narrow screens, anything wider than the page (a long equation, a table,
   a fixed-width figure) is shrunk to fit or given its own sideways scroll, so
   the page itself never scrolls horizontally. Does nothing on wide screens. */
(function () {
  var LIMIT = 820, MEDIA = { CANVAS: 1, IMG: 1, VIDEO: 1, svg: 1, IFRAME: 1 };

  function scrollsItself(el) {
    for (var p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      var o = getComputedStyle(p).overflowX;
      if (o === 'auto' || o === 'scroll') return true;
    }
    return false;
  }

  function fix(el, vw, depth) {
    var cs = getComputedStyle(el);
    if (cs.position === 'fixed' || depth > 14) return;
    if (MEDIA[el.tagName]) {
      el.style.maxWidth = '100%';
      if (el.tagName !== 'IFRAME' && !el.style.height) el.style.height = 'auto';
      return;
    }
    if (el.tagName === 'TABLE' || cs.display === 'table') {
      el.style.display = 'block'; el.style.maxWidth = '100%'; el.style.overflowX = 'auto';
      return;
    }
    if (cs.display === 'inline') el.style.display = 'inline-block';
    el.style.minWidth = '0'; el.style.maxWidth = '100%'; el.style.boxSizing = 'border-box';
    var edge = Math.min(el.getBoundingClientRect().right, vw) + 1;
    function tooWide() {
      return [].filter.call(el.children, function (c) {
        var r = c.getBoundingClientRect();
        return r.width && r.right > edge && !c.ownerSVGElement;
      });
    }
    var wide = tooWide();
    if (wide.length && cs.display.indexOf('flex') >= 0 && cs.flexDirection.indexOf('row') === 0 && cs.flexWrap === 'nowrap') {
      el.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
      wide = tooWide();
    }
    if (wide.length && cs.whiteSpace !== 'nowrap') {
      wide.forEach(function (c) { fix(c, vw, depth + 1); });
    }
    if (el.scrollWidth > el.clientWidth + 1) {
      el.style.overflowX = 'auto';
      if (el.style.display === 'inline-block') el.style.verticalAlign = 'bottom';
    }
  }

  function run() {
    var root = document.documentElement, vw = root.clientWidth;
    if (vw > LIMIT || !document.body) return;
    for (var pass = 0; pass < 4 && root.scrollWidth > vw + 1; pass++) {
      var all = document.body.getElementsByTagName('*');
      for (var i = 0; i < all.length; i++) {
        var el = all[i], r = el.getBoundingClientRect();
        if (!r.width || r.right <= vw + 1 || el.ownerSVGElement) continue;
        var p = el.parentElement;
        if (p !== document.body && p.getBoundingClientRect().right > vw + 1) continue; // start at the outermost offender
        if (scrollsItself(el)) continue;
        var ps = getComputedStyle(p);
        if (ps.display.indexOf('flex') >= 0 && ps.flexDirection.indexOf('row') === 0 && ps.flexWrap === 'nowrap') {
          p.style.flexWrap = 'wrap';   // a row of controls too long for the screen: let it wrap
          if (el.getBoundingClientRect().right <= vw + 1) continue;
        }
        fix(el, vw, 0);
      }
    }
  }

  var timer;
  function soon() { clearTimeout(timer); run(); timer = setTimeout(function () { run(); timer = setTimeout(run, 700); }, 300); }
  window.addEventListener('load', soon);
  window.addEventListener('resize', soon);
  ['click', 'change', 'toggle'].forEach(function (ev) {
    document.addEventListener(ev, function () { setTimeout(soon, 30); }, true);
  });
  if (document.readyState !== 'loading') soon(); else document.addEventListener('DOMContentLoaded', soon);
})();
</script>
