<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Differential Equations — Interactive Notebook</title>
<meta name="description" content="Interactive explorers built while working through the MIT differential equations sequence.">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5f5b'/%3E%3Cpath d='M8 32c6-22 12-22 18 0s12 22 18 0 8-14 12-10' fill='none' stroke='%23f6f3ec' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f3ec;
  --surface: #fffdf8;
  --ink: #1d2126;
  --muted: #646b73;
  --line: #e1dbcd;
  --accent: #1f5f5b;
  --accent-soft: #dcebe7;
  --done: #2f6b3c;
  --done-soft: #dfeedd;
  --live: #a8520c;
  --live-soft: #fbe6cf;
  --idle: #6a6f78;
  --idle-soft: #e9e6de;
  --shadow: 0 1px 2px rgba(40, 32, 12, .06), 0 6px 18px rgba(40, 32, 12, .05);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bar: 52px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c;
    --surface: #1c2027;
    --ink: #e9e6df;
    --muted: #9aa1ab;
    --line: #2d333d;
    --accent: #6fc3b8;
    --accent-soft: #1d3936;
    --done: #86c98f;
    --done-soft: #1e3523;
    --live: #f0a35a;
    --live-soft: #3d2a15;
    --idle: #9aa1ab;
    --idle-soft: #272c35;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
a { color: inherit; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- catalogue ---------- */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 80px; }
header.hero { padding: 44px 0 24px; }
.eyebrow { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 6vw, 46px); line-height: 1.1; margin: 8px 0 12px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
.resume { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 10px 16px; border-radius: 999px; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 14.5px; max-width: 100%; }
.resume span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.courses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 22px; }
.ccard { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; min-width: 0; }
.ccard:hover { border-color: var(--accent); }
.ccard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ccard .num { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ccard h2 { font-family: var(--serif); font-size: 18.5px; line-height: 1.25; margin: 0; font-weight: 600; flex: 1; }
.ccard .meta { font-size: 13.5px; color: var(--muted); }
.track { height: 5px; border-radius: 3px; background: var(--idle-soft); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.completed { background: var(--done-soft); color: var(--done); }
.pill.ongoing { background: var(--live-soft); color: var(--live); }
.pill.upcoming { background: var(--idle-soft); color: var(--idle); }
.pill.upcoming::before { background: none; border: 1.5px solid currentColor; }

.search { position: sticky; top: 0; z-index: 5; padding: 10px 0; background: linear-gradient(var(--bg) 78%, transparent); }
.search input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

section.course { margin-top: 34px; scroll-margin-top: 70px; }
.chead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.chead .num { font-family: var(--serif); font-size: 15px; color: var(--muted); }
.chead h2 { font-family: var(--serif); font-size: clamp(22px, 4vw, 28px); margin: 0; font-weight: 600; line-height: 1.2; }
.chead .pill { align-self: center; }

details.unit { border-bottom: 1px solid var(--line); }
details.unit > summary { display: flex; align-items: center; gap: 10px; padding: 14px 2px; cursor: pointer; list-style: none; }
details.unit > summary::-webkit-details-marker { display: none; }
details.unit > summary::before { content: "›"; font-size: 20px; line-height: 1; color: var(--muted); transition: transform .15s; width: 12px; }
details.unit[open] > summary::before { transform: rotate(90deg); }
.unit .uname { font-weight: 600; flex: 1; min-width: 0; }
.unit .uname small { display: block; font-weight: 500; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.unit .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.unit.empty > summary { cursor: default; }
.unit.empty > summary::before { content: "·"; transform: none; }
.unit.empty .uname { font-weight: 500; color: var(--muted); }

.lesson { font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 6px 2px 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 0 0 18px; }
.item { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 14px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; min-width: 0; transition: transform .12s, border-color .12s; }
.item:hover { border-color: var(--accent); transform: translateY(-1px); }
.item::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--line); }
.item.seen::before { background: var(--accent); }
.item h3 { margin: 0; font-size: 15.5px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.item p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.item .foot { margin-top: auto; padding-top: 4px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.item.seen .foot::after { content: " · opened"; color: var(--muted); font-weight: 500; }
.soon { padding: 18px 2px; color: var(--muted); font-size: 14.5px; }
.nohits { padding: 40px 0; text-align: center; color: var(--muted); }
footer { margin-top: 56px; font-size: 13px; color: var(--muted); }

/* ---------- viewer ---------- */
#viewer { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.vbar { flex: none; height: calc(var(--bar) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0; display: flex; align-items: center; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--line); }
.vbar a, .vbar button { flex: none; display: grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; border: 0; border-radius: 10px; background: none; text-decoration: none; cursor: pointer; font-size: 19px; }
.vbar a:hover, .vbar button:hover { background: var(--accent-soft); }
.vbar .off { opacity: .28; pointer-events: none; }
.vtitle { flex: 1; min-width: 0; padding: 0 6px; line-height: 1.2; }
.vtitle small { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vtitle b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vpos { font-size: 12.5px; color: var(--muted); padding: 0 4px; white-space: nowrap; }
#frame { flex: 1; width: 100%; border: 0; background: #fff; }

@media (max-width: 900px) { .courses { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) {
  .courses { grid-template-columns: 1fr; }
  header.hero { padding-top: 28px; }
  .grid { grid-template-columns: 1fr; }
  .vpos { display: none; }
}
</style>
</head>
<body>

<div id="home" class="wrap">
  <header class="hero">
    <div class="eyebrow">MIT Differential Equations · study notebook</div>
    <h1>Differential equations, one interactive at a time</h1>
    <p class="lede" id="lede"></p>
    <a class="resume" id="resume" hidden></a>
  </header>
  <nav class="courses" id="courses" aria-label="Courses"></nav>
  <div class="search"><input id="q" type="search" placeholder="Search concepts…" aria-label="Search concepts"></div>
  <main id="list"></main>
  <footer>Explorers built alongside the MIT OpenCourseWare / MITx 18.03 differential equations sequence. Each page is self-contained and works offline once loaded.</footer>
</div>

<div id="viewer" hidden>
  <div class="vbar">
    <a href="#/" id="vback" title="All concepts" aria-label="Back to all concepts">☰</a>
    <div class="vtitle"><small id="vcrumb"></small><b id="vname"></b></div>
    <span class="vpos" id="vpos"></span>
    <a id="vprev" title="Previous" aria-label="Previous concept">‹</a>
    <a id="vnext" title="Next" aria-label="Next concept">›</a>
    <a id="vopen" target="_blank" rel="noopener" title="Open on its own" aria-label="Open on its own page">⤢</a>
  </div>
  <iframe id="frame" title="Interactive" allow="fullscreen"></iframe>
</div>

<script src="data.js"></script>
<script>
(function () {
  var COURSES = window.COURSES || [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var STATUS = { completed: 'Completed', ongoing: 'In progress', upcoming: 'Upcoming' };

  // Which explorers have been opened on this device (a convenience only).
  var store = {
    get: function (k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var seen = store.get('de-seen', {});

  var flat = [];
  COURSES.forEach(function (c) {
    c.units.forEach(function (u) {
      u.items.forEach(function (it) {
        it.course = c; it.unit = u; it.route = '#/' + it.id;
        flat.push(it);
      });
    });
  });
  var byId = {};
  flat.forEach(function (it, i) { it.index = i; byId[it.id] = it; });
  var courseItems = function (c) { return flat.filter(function (it) { return it.course === c; }); };

  function renderHome() {
    var withItems = COURSES.filter(function (c) { return courseItems(c).length; }).length;
    $('lede').textContent = flat.length + ' hands-on explorers across ' + withItems +
      ' of ' + COURSES.length + ' courses. Pick a concept, drag the sliders, and watch the mathematics move.';

    $('courses').innerHTML = COURSES.map(function (c) {
      var items = courseItems(c), done = items.filter(function (it) { return seen[it.id]; }).length;
      var meta = items.length ? items.length + ' interactives · ' + done + ' opened'
        : (c.status === 'upcoming' ? 'Not started yet' : 'No interactives yet');
      return '<a class="ccard" href="#course-' + c.n + '" data-jump="course-' + c.n + '">' +
        '<div class="top"><span class="num">Course ' + c.n + '</span><span class="pill ' + c.status + '">' + STATUS[c.status] + '</span></div>' +
        '<h2>' + esc(c.title) + '</h2>' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="track"><i style="width:' + (items.length ? Math.round(100 * done / items.length) : 0) + '%"></i></div></a>';
    }).join('');

    $('list').innerHTML = COURSES.map(function (c) {
      var body = c.units.map(function (u) {
        if (!u.items.length) {
          return '<details class="unit empty" data-empty><summary onclick="return false"><span class="uname"><small>Unit ' + u.n + '</small>' + esc(u.name) + '</span>' +
            '<span class="count">' + (c.status === 'upcoming' ? 'upcoming' : 'no interactives') + '</span></summary></details>';
        }
        var out = '', lesson = null, open = false;
        u.items.forEach(function (it) {
          if (it.lesson !== lesson) {
            if (open) out += '</div>';
            if (it.lesson) out += '<div class="lesson">' + esc(it.lesson) + '</div>';
            out += '<div class="grid">'; open = true; lesson = it.lesson;
          }
          out += '<a class="item' + (seen[it.id] ? ' seen' : '') + '" href="' + it.route + '" data-id="' + it.id + '" data-text="' +
            esc((it.title + ' ' + it.desc + ' ' + u.name + ' ' + it.lesson).toLowerCase()) + '">' +
            '<h3>' + esc(it.title) + '</h3>' + (it.desc ? '<p>' + esc(it.desc) + '</p>' : '') +
            '<div class="foot">Open interactive →</div></a>';
        });
        if (open) out += '</div>';
        return '<details class="unit" open><summary><span class="uname"><small>Unit ' + u.n + '</small>' + esc(u.name) + '</span>' +
          '<span class="count">' + u.items.length + (u.items.length === 1 ? ' interactive' : ' interactives') + '</span></summary>' + out + '</details>';
      }).join('');
      if (!c.units.length) body = '<div class="soon">Units will appear here once this course begins.</div>';
      return '<section class="course" id="course-' + c.n + '"><div class="chead"><span class="num">Course ' + c.n + '</span>' +
        '<h2>' + esc(c.title) + '</h2><span class="pill ' + c.status + '">' + STATUS[c.status] + '</span></div>' + body + '</section>';
    }).join('') + '<div class="nohits" id="nohits" hidden>No concept matches that search.</div>';

    var last = byId[store.get('de-last', '')];
    $('resume').hidden = !last;
    if (last) { $('resume').href = last.route; $('resume').innerHTML = '<span>Continue: ' + esc(last.title) + '</span> →'; }
    filter();
  }

  function filter() {
    var words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean), hits = 0;
    document.querySelectorAll('.item').forEach(function (a) {
      var ok = words.every(function (w) { return a.dataset.text.indexOf(w) >= 0; });
      a.hidden = !ok; if (ok) hits++;
    });
    document.querySelectorAll('.grid').forEach(function (g) {
      g.hidden = !g.querySelector('.item:not([hidden])');
      var l = g.previousElementSibling;
      if (l && l.classList.contains('lesson')) l.hidden = g.hidden;
    });
    document.querySelectorAll('details.unit').forEach(function (d) {
      d.hidden = words.length ? !d.querySelector('.item:not([hidden])') : false;
    });
    document.querySelectorAll('section.course').forEach(function (s) {
      s.hidden = words.length ? !s.querySelector('.item:not([hidden])') : false;
    });
    $('nohits').hidden = !words.length || hits > 0;
  }

  var homeScroll = 0, showing = null;

  function route() {
    var it = byId[decodeURIComponent(location.hash.replace(/^#\/?/, ''))];
    if (!it) {
      if (showing) {
        showing = null;
        $('viewer').hidden = true; $('home').hidden = false;
        $('frame').removeAttribute('src');
        document.title = 'Differential Equations — Interactive Notebook';
        renderHome();
        window.scrollTo(0, homeScroll);
      }
      return;
    }
    if (!showing) homeScroll = window.scrollY;
    showing = it;
    seen[it.id] = 1; store.set('de-seen', seen); store.set('de-last', it.id);
    $('home').hidden = true; $('viewer').hidden = false;
    $('vcrumb').textContent = 'Course ' + it.course.n + ' · Unit ' + it.unit.n + ' · ' + it.unit.name;
    $('vname').textContent = it.title;
    $('vpos').textContent = (it.index + 1) + ' / ' + flat.length;
    var prev = flat[it.index - 1], next = flat[it.index + 1];
    $('vprev').className = prev ? '' : 'off'; $('vprev').href = prev ? prev.route : '#/';
    $('vnext').className = next ? '' : 'off'; $('vnext').href = next ? next.route : '#/';
    $('vopen').href = it.src;
    // replace() keeps the frame's own page loads out of the back-button history
    var f = $('frame');
    try { f.contentWindow.location.replace(new URL(it.src, location.href).href); } catch (e) { f.src = it.src; }
    document.title = it.title + ' — Differential Equations';
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-jump]');
    if (!a) return;
    e.preventDefault();   // course cards scroll; the hash is reserved for routing
    document.getElementById(a.dataset.jump).scrollIntoView();
  });
  $('q').addEventListener('input', filter);
  window.addEventListener('hashchange', route);
  renderHome();
  route();
})();
</script>
</body>
</html>
